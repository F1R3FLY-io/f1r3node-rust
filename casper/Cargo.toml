[package]
name = "casper"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
comm = { path = "../comm" }
crypto = { path = "../crypto" }
graphz = { path = "../graphz" }
models = { path = "../models" }
rholang = { path = "../rholang" }
rspace_plus_plus = { path = "../rspace++" }
block-storage = { path = "../block-storage" }
shared = { path = "../shared" }
tokio = { workspace = true }
prost = { workspace = true }
lz4_flex = { workspace = true }
lazy_static = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
imbl = { workspace = true }
indexmap = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
byteorder = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
itertools = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# LFS Block Requester dependencies
num_cpus = "1.0"
async-stream = "0.3"
tokio-stream = { workspace = true }
humantime = { workspace = true }
tonic = { workspace = true }
eyre = { workspace = true }
metrics = { workspace = true }
parking_lot = "0.12"
tempfile = { workspace = true, optional = true }

[dev-dependencies]
casper = { path = ".", features = ["test-utils"] }
# P2-16: enable block-storage's test-only RMW bypass helpers for
# detector-totality / record-lifecycle integration tests. Production
# builds of casper do NOT enable this feature.
block-storage = { path = "../block-storage", features = ["test-internals"] }
metrics-util = { workspace = true }
proptest = { workspace = true }
k256 = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
# Exhaustive thread-interleaving model checker for the slashing
# atomic-RMW property (T-9.2). See
# docs/theory/slashing/design/14-test-plan.md §14.5.
loom = "=0.7.2"
# JSON parsing for the TLA+ trace-replay harness. See
# casper/tests/slashing/tla_trace_replay.rs (Item 4 / Track 7).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Phase 4.17 — statistical benchmarking for multi-sig hot paths.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "multi_sig_fanout_bench"
harness = false



[features]
default = []
# Exposes test utilities (TestNode, mocks, genesis helpers) to other workspace members.
# Guarded with #[cfg(feature = "test-utils")] so it is never compiled in production.
#
# Phase 11 (visibility hardening): the casper `test_utils` module constructs
# `BlockDagKeyValueStorage` directly from in-memory stores and grabs raw write
# guards on the metadata / deploy indices. Those entry points now live behind
# block-storage's `test-internals` feature, so enabling casper's `test-utils`
# transitively enables it. Production builds keep both features off.
test-utils = ["tempfile", "block-storage/test-internals"]
schnorr_secp256k1_experimental = [
    "crypto/schnorr_secp256k1_experimental",
    "models/schnorr_secp256k1_experimental",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[build-dependencies]
