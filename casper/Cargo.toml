[package]
name = "casper"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
comm = { path = "../comm" }
crypto = { path = "../crypto" }
graphz = { path = "../graphz" }
models = { path = "../models" }
rholang = { path = "../rholang" }
rspace_plus_plus = { path = "../rspace++" }
block-storage = { path = "../block-storage" }
shared = { path = "../shared" }
tokio = { workspace = true }
prost = { workspace = true }
lz4_flex = { workspace = true }
lazy_static = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
imbl = { workspace = true }
indexmap = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
byteorder = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
itertools = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# LFS Block Requester dependencies
async-stream = "0.3"
tokio-stream = { workspace = true }
humantime = { workspace = true }
tonic = { workspace = true }
eyre = { workspace = true }
metrics = { workspace = true }
parking_lot = "0.12"

[dev-dependencies]
casper = { path = ".", features = ["test-utils"] }
# P2-16: enable block-storage's test-only RMW bypass helpers for
# detector-totality / record-lifecycle integration tests. Production
# builds of casper do NOT enable this feature.
block-storage = { path = "../block-storage", features = ["test-internals"] }
metrics-util = { workspace = true }
proptest = { workspace = true }
k256 = { workspace = true }
serial_test = { workspace = true }
env_logger = "0.11.8"
tempfile = { workspace = true }
# Exhaustive thread-interleaving model checker for the slashing
# atomic-RMW property (T-9.2). See
# docs/casper/theory/slashing/design/14-test-plan.md §14.5.
loom = "=0.7.2"
# JSON parsing for the TLA+ trace-replay harness. See
# casper/tests/slashing/tla_trace_replay.rs (Item 4 / Track 7).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Phase 4.17 — statistical benchmarking for multi-sig hot paths.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "multi_sig_fanout_bench"
harness = false



[features]
default = []
# Exposes test-only items gated in production-adjacent modules to integration
# tests and other workspace members' tests: the well-known DEFAULT_SEC/PUB
# deploy keys and the default-key fallback in util/construct_deploy.rs.
# Production builds keep it off, so those keys are never compiled in.
test-utils = []
schnorr_secp256k1_experimental = [
    "crypto/schnorr_secp256k1_experimental",
    "models/schnorr_secp256k1_experimental",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[build-dependencies]
