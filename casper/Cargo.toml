[package]
name = "casper"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
comm = { path = "../comm" }
crypto = { path = "../crypto" }
graphz = { path = "../graphz" }
models = { path = "../models" }
rholang = { path = "../rholang" }
rspace_plus_plus = { path = "../rspace++" }
block-storage = { path = "../block-storage" }
shared = { path = "../shared" }
tokio = { workspace = true }
prost = { workspace = true }
lz4_flex = { workspace = true }
lazy_static = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
imbl = { workspace = true }
indexmap = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
byteorder = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
itertools = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# LFS Block Requester dependencies
async-stream = "0.3"
tokio-stream = { workspace = true }
humantime = { workspace = true }
tonic = { workspace = true }
eyre = { workspace = true }
metrics = { workspace = true }
parking_lot = "0.12"
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# ⚠ A SELF dev-dependency, and it is load-bearing rather than decorative.
#
# `casper/src/rust/test_utils` is gated behind the `test-utils` feature, and
# casper's own integration tests link the casper LIB as an external crate — so
# without this line they see the module "configured out" and fail to compile the
# moment any of them names it.
#
# It compiled before only by accident of feature unification: `node/Cargo.toml`
# enables `casper = { features = ["test-utils"] }`, so a workspace-wide build
# turned the feature on for everyone, while `cargo test -p casper` on its own did
# not. Depending on a sibling crate's feature list to make your own tests build
# is a trap that springs the first time someone builds the package alone.
casper = { path = ".", features = ["test-utils"] }
node = { path = "../node" }
# P2-16: enable block-storage's test-only RMW bypass helpers for
# detector-totality / record-lifecycle integration tests. Production
# builds of casper do NOT enable this feature.
block-storage = { path = "../block-storage", features = ["test-internals"] }
metrics-util = { workspace = true }
proptest = { workspace = true }
k256 = { workspace = true }
serial_test = { workspace = true }
env_logger = "0.11.8"
tempfile = { workspace = true }
# Exhaustive thread-interleaving model checker for the slashing
# atomic-RMW property (T-9.2). See
# docs/casper/theory/slashing/design/14-test-plan.md §14.5.
loom = "=0.7.2"
# JSON parsing for the TLA+ trace-replay harness. See
# casper/tests/slashing/tla_trace_replay.rs (Item 4 / Track 7).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Phase 4.17 — statistical benchmarking for multi-sig hot paths.
criterion = { version = "0.5", features = ["html_reports"] }
typed-arena = "2.0.2"

[[bench]]
name = "multi_sig_fanout_bench"
harness = false



[features]
default = []
# Exposes test-only items gated in production-adjacent modules to integration
# tests and other workspace members' tests: the well-known DEFAULT_SEC/PUB
# deploy keys and the default-key fallback in util/construct_deploy.rs.
# Production builds keep it off, so those keys are never compiled in.
# The compatibility helpers need tempfile in the library target and expose
# block-storage's test-only constructors to integration tests.
test-utils = ["tempfile", "block-storage/test-internals"]
schnorr_secp256k1_experimental = [
    "crypto/schnorr_secp256k1_experimental",
    "models/schnorr_secp256k1_experimental",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[build-dependencies]
