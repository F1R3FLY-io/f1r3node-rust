# Negative control of scripts/check-reified-rspaces-patch-gate.sh: a workspace manifest that
# holds the local parser [patch] of the Reified RSpaces campaign. The gate must report it.
[workspace]
resolver = "2"
members = []

[workspace.dependencies]
rholang-parser = { version = "0.1.0", git = "https://github.com/F1R3FLY-io/rholang-rs", rev = "02cef80d32214ecdac3ee7d3b91c3786a34174d5" }

[patch."https://github.com/F1R3FLY-io/rholang-rs"]
rholang-parser = { path = "../rholang-rs-reified-rspaces/rholang-parser" }
