[package]
name = "node-observation-check"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.24"
