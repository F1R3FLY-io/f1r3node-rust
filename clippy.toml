# Clippy configuration for the workspace.
#
# ─────────────────────────────────────────────────────────────────────────────
# `ignore-interior-mutability` — why `EPathMap` is listed
# ─────────────────────────────────────────────────────────────────────────────
#
# `clippy::mutable_key_type` fires on `HashMap<Par, _>` / `HashSet<Par>` — 37
# sites across `models` and `rholang`, and `models` is early enough in the
# dependency order that under `-D warnings` it aborts the build before clippy
# reaches any other crate.
#
# The lint's reasoning is a reachability walk, and it is correct as far as it
# goes:
#
#     Par -> Vec<Expr> -> Expr -> Option<ExprInstance> -> ExprInstance
#         -> EPathMap -> EntryTrie -> Arc<OnceLock<Vec<u8> / EpmLayout>>
#
# What the walk cannot see is that both cells are DERIVED SERIALIZATION STATE,
# not part of the value. `EntryTrie::trie_snapshot` memoizes the canonical EPM1
# byte image and `EntryTrie::epm_layout` memoizes its value-independent framing.
# Clone families share the cells; trie mutation installs fresh empty cells.
#
# The hazard `mutable_key_type` exists to catch is a key whose hash or equality
# can change while it sits in a map, which silently corrupts the container.
# That hazard is absent here, and it is absent BY CONSTRUCTION rather than by
# convention — the generated stack-safe `PartialEq` and `Hash` machines walk
# `EPathMap::representation()` plus semantic metadata; neither cache is exposed
# by that representation or admitted to either trait program.
#
# So filling either cache moves neither the hash nor the equivalence class, and
# a `Par` key is stable in a map for its whole lifetime.
#
# This is stated ONCE, here, at the root cause. The alternative — 37
# `#[allow(clippy::mutable_key_type)]` attributes at the use sites — would put
# the suppression everywhere except where the reason lives, and each copy would
# have to be re-audited whenever `EPathMap` changed. A reader who breaks the
# invariant above by making either cache semantic must delete this entry;
# `models`'s `Hash`/`Eq` and EPM1 snapshot tests are what would catch it.
#
# ⚠ This setting REPLACES clippy's default rather than extending it, so
# `bytes::Bytes` — the default — is restated.
ignore-interior-mutability = ["bytes::Bytes", "models::rust::rhoapi_ext::EPathMap"]
