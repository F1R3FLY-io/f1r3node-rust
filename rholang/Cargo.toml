[package]
name = "rholang"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(verus_keep_ghost)"] }

[[bin]]
name = "rholang-cli"
path = "src/rholang_cli.rs"

[[bin]]
name = "bench_par_reducer"
path = "src/bin/bench_par_reducer.rs"

[[bin]]
name = "bench_par_propose"
path = "src/bin/bench_par_propose.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crypto = { path = "../crypto" }
models = { path = "../models" }
pathmap = { version = "0.2.2", features = ["arena_compact"] }
rho-pure-eval = { path = "../rho-pure-eval" }
shared = { path = "../shared" }
rspace_plus_plus = { path = "../rspace++" }
itertools = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
crossbeam-queue = "0.3"
dashmap = { workspace = true }
tree-sitter = "0.25.8"
tree-sitter-rust = "0.24"
hex = { workspace = true }
prost = { workspace = true }
zbase32 = "0.1.2"
lazy_static = { workspace = true }
futures = { workspace = true }
bincode = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
k256 = { workspace = true }
openai-api-rs = "6.0.3"
dotenv = "0.15.0"
paste = "1.0"
linkme = "0.3"
libc = "0.2"
indexmap = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
clap = { workspace = true }
rholang-parser = { workspace = true }
validated = { workspace = true }
smallvec = { version = "1.15.1", features = [
	"union",
	"const_generics",
	"const_new",
	"may_dangle",
] }
typed-arena = "2.0.2"
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
stacker = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
fastembed = { version = "6.0.0", optional = true, default-features = false, features = [
	"hf-hub-rustls-tls",
	"ort-download-binaries-rustls-tls",
] }
console = "0.16.0"
anyhow = "1.0.100"
chroma = { version = "0.10.0", optional = true }
async-trait = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.3.0"
proptest = { workspace = true }
rand = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
loom = "=0.7.2"

[features]
chromadb = ["dep:chroma", "dep:fastembed"]
# Compiles the TEST-ONLY fused-vs-fallback
# force-disable toggle and the shape-keyed fusion-hit counters into the library so the
# equivalence suite (tests/epathmap_fusion_equivalence_spec.rs) can drive both
# paths. NEVER enabled in production builds — without it no runtime-flippable fusion path
# exists (a runtime flag would be a node-divergence hazard under a latent parity bug).
epathmap-fusion-differential = []
# Pass the Phase 7 measurement-only hooks through to `models` while running the
# interpreter corpus. Disabled in every production/default build.
phase7-depth-histograms = ["models/phase7-depth-histograms"]
