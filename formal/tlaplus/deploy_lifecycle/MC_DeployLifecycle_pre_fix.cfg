\* Model-check config for the PRE-FIX DeployLifecycle (the regression demo).
\*
\* Selects the regression: PurgeRejectedBuf = FALSE, so finalization drops the
\* rejected_deploy_buffer purge (the casper_engine split that
\* finalization_runner.rs:234-241 documents). A deploy recovered into the buffer
\* via RecoverFromRecord then finalized is NEVER removed from the buffer, so it
\* stays re-proposable.
\*
\* This run is EXPECTED TO FAIL: TLC discovers a counterexample to
\* Inv_NoFinalizedReproposable (a d with d \in finalized AND d \in rejectedBuf).
\* It is the formal reproduction of the record-driven re-proposal /
\* double-apply -> IntegerAdd invariant violation, kept for regression/pedagogy
\* -- it is NOT part of the pass-gate (the post-fix MC_DeployLifecycle.cfg is).
SPECIFICATION Spec

\* QuarantineBothStores = TRUE isolates the FINALIZATION regression: the
\* proposer-side quarantine invariant holds, so the ONLY reachable violation is
\* Inv_NoFinalizedReproposable (the dropped rejected_deploy_buffer purge on
\* finalization). The quarantine regression is exercised separately by
\* MC_DeployLifecycle_quarantine_pre_fix.cfg.
CONSTANTS
    MaxDeploys = 3
    MaxBlocks = 3
    PurgeRejectedBuf = FALSE
    QuarantineBothStores = TRUE

INVARIANT TypeOK
INVARIANT Inv_NoFinalizedReproposable
INVARIANT Inv_NoLossBeforeFinal

CHECK_DEADLOCK FALSE
