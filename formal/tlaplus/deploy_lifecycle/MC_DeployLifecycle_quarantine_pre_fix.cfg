\* Model-check config for the PRE-FIX proposer-side quarantine (the regression demo).
\*
\* Selects the regression: QuarantineBothStores = FALSE, so QuarantineRefundFailure
\* clears the toxic deploy from `pending` but NOT from the rejected_deploy_buffer.
\* A deploy recovered into the buffer (RecoverFromRecord) and then quarantined is
\* therefore left LINGERING in rejectedBuf, so it stays re-proposable.
\*
\* AdmissionFiltersFinalized = TRUE keeps the admission fix in place, so the ONLY
\* reachable violation is the quarantine one: TLC discovers a counterexample to
\* Inv_NoToxicReproposable (a d with d \in toxic AND d \in rejectedBuf). It is the
\* formal reproduction of the toxic re-proposal / refund re-failure, kept for
\* regression/pedagogy -- it is NOT part of the pass-gate (the post-fix
\* MC_DeployLifecycle.cfg is).
SPECIFICATION Spec

CONSTANTS
    MaxDeploys = 3
    MaxBlocks = 3
    AdmissionFiltersFinalized = TRUE
    QuarantineBothStores = FALSE

INVARIANT TypeOK
INVARIANT Inv_NoToxicReproposable

CHECK_DEADLOCK FALSE
