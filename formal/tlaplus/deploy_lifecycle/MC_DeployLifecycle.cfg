\* Model-check config for the POST-FIX DeployLifecycle.
\*
\* Selects the fix: PurgeRejectedBuf = TRUE, so finalization purges both the
\* finalized deploy sigs and that block's rejected_deploys sigs from the
\* rejected_deploy_buffer. This config MUST PASS with no violation:
\*   * Inv_NoFinalizedReproposable -- a finalized deploy is never in any
\*                                    proposable buffer (pending or rejectedBuf).
\*   * Inv_NoLossBeforeFinal       -- an accepted, not-yet-finalized deploy is
\*                                    retained (never lost before finalization).
\*
\* The companion MC_DeployLifecycle_pre_fix.cfg selects the finalization
\* regression (PurgeRejectedBuf = FALSE); MC_DeployLifecycle_quarantine_pre_fix.cfg
\* selects the proposer-side quarantine regression (QuarantineBothStores = FALSE).
\* Both DISCOVER the counterexamples that motivated the respective purges.
SPECIFICATION Spec

CONSTANTS
    MaxDeploys = 3
    MaxBlocks = 3
    PurgeRejectedBuf = TRUE
    QuarantineBothStores = TRUE

INVARIANT TypeOK
INVARIANT Inv_NoFinalizedReproposable
INVARIANT Inv_NoLossBeforeFinal
INVARIANT Inv_NoToxicReproposable

CHECK_DEADLOCK FALSE
