\* Model-check config for the POST-FIX DeployLifecycle.
\*
\* Selects the fix: AdmissionFiltersFinalized = TRUE, so retained rejection
\* records cannot re-propose a canonically finalized deploy. This config MUST
\* PASS with no violation:
\*   * Inv_NoFinalizedReproposable -- a finalized deploy is never in any
\*                                    proposable buffer (pending or rejectedBuf).
\*   * Inv_NoLossBeforeFinal       -- an accepted, not-yet-finalized deploy is
\*                                    retained (never lost before finalization).
\*
\* The companion MC_DeployLifecycle_pre_fix.cfg selects the admission
\* regression (AdmissionFiltersFinalized = FALSE); MC_DeployLifecycle_quarantine_pre_fix.cfg
\* selects the proposer-side quarantine regression (QuarantineBothStores = FALSE).
\* Both discover the counterexamples that motivate their respective guards.
SPECIFICATION Spec

CONSTANTS
    MaxDeploys = 3
    MaxBlocks = 3
    AdmissionFiltersFinalized = TRUE
    QuarantineBothStores = TRUE

INVARIANT TypeOK
INVARIANT Inv_NoFinalizedReproposable
INVARIANT Inv_NoLossBeforeFinal
INVARIANT Inv_NoToxicReproposable

CHECK_DEADLOCK FALSE
