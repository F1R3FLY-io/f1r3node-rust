\* G3 (DR-135): the installer share 2 * 2 = 4 exceeds the installer purse (4
\* minus the scaffold cost 1), so the activation is refused with no charge,
\* and the refusal is recorded. EventuallyRefused shows the refusal is reached.
CONSTANTS
    installerPurse = installerPurse
    sponsorPurse = sponsorPurse
    outerPurse = outerPurse
    slotPurse = slotPurse
    Purses <- PursesDef
    Installer = installerPurse
    Sponsor = sponsorPurse
    Outer = outerPurse
    Slot = slotPurse
    InitialBalance <- InitialBalanceDef
    InstallScaffoldCost = 1
    OuterInstallBound = 1
    SlotInstallBound = 1
    OuterFundingAmount = 3
    SlotFundingAmount = 3
    OuterActivationBound = 2
    SlotActivationBound = 2
    OuterRealizedCost = 1
    SlotRealizedCost = 1
    Defect = "None"
    InstallerActivationUsage = 2
    InstallerPrice = 2
    \* Added by G3 step S11 (DR-135 item 13): a caller whose purse holds only
    \* its hold, 2 * 1. Its client part 1 + 1 fits its limit 2, and its whole
    \* run 1 + 1 + 2 + 2 = 6 does not.
    callerPurse = callerPurse
    Caller = callerPurse
    CallerUsage = 1
    CallerPrice = 1
    CallerLimit = 2
    ZeroPricedOwnerUsage = 1
    BodyOwnerUsage = 2

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    CustodyConserved
    InstallWorkflowIsAdmissible
    RejectedInstallIsEffectFree
    InstallPublishesOnlyTheScaffold
    CandidateCreatedSupplyNeverFundsItsCreator
    LocatedContinuationRequiresPriorFunding
    FundingCommitCoversEveryLocatedPurse
    RejectedFundingIsEffectFree
    ActivationRequiresAuthenticatedLocalSufficiency
    SettlementUsesDistinctLocatedPurses
    ActivationChargesTheInstallerShare
    InstallerShareWithinBudget
    RefusedActivationIsEffectFree
    \* Added by G3 step S11 (DR-135 item 13).
    SponsoredActivationNeedsOnlyCallerWork
    CallerPaysOnlyItsOwnWork

PROPERTY EventuallyRefused
