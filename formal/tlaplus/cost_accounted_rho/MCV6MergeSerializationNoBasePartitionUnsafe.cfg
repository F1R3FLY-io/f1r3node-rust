    UseClaims = TRUE
    UseRecheck = TRUE
    UseMixingCheck = TRUE
    NormalizedOverfill = TRUE
    RawDuplicateCheck = TRUE
    SignSplitPrecheck = TRUE
    UserSystemSplit = TRUE
    UsePrecheck = TRUE
    AnyContributorFallback = TRUE
    MergeTypeCheck = TRUE
    UseRepair = TRUE
    UseBasePartition = FALSE
    StampFastPath = TRUE
    ChainLevelP5 = TRUE
    FullLedgerFastPath = TRUE
    PinnedFirst = TRUE
    LossesFirst = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
