\* DR-120 (gap G9), control: S3 runs no pre-check, so an overflowing branch aborts the merge.
\* It must violate NoMergeAbort.
CONSTANTS
    Scenarios <- MCScenarios
    UseKOrder = TRUE
    UseClaims = TRUE
    UseRecheck = TRUE
    UseMixingCheck = TRUE
    NormalizedOverfill = TRUE
    RawDuplicateCheck = TRUE
    SignSplitPrecheck = TRUE
    UserSystemSplit = TRUE
    UsePrecheck = FALSE
    AnyContributorFallback = TRUE
    MergeTypeCheck = TRUE
    UseRepair = TRUE
    UseBasePartition = TRUE
    StampFastPath = TRUE
    ChainLevelP5 = TRUE
    FullLedgerFastPath = TRUE
    PinnedFirst = TRUE
    LossesFirst = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoMergeAbort
