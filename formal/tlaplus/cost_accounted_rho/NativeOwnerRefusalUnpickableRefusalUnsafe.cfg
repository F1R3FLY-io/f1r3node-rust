\* G3 (DR-135) negative control "UnpickableRefusal": replay does not item-test the items of a refused tuple (finding F1-a), so a producer refuses an item-failing tuple and hides a fundable tuple of the same continuation.
\* Expected violation: StoredClaimIsHonest.
CONSTANTS
  Defect = "UnpickableRefusal"
  MaxBalance = 2
  Adversary = TRUE
  Rooms = {1, 2}
  Growths = {0, 1}
  MaxDeviations = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT StoredClaimIsHonest
