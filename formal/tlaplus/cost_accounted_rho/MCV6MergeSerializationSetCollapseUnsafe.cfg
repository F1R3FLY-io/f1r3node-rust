\* DR-120 (gap G9), control: F5 looks for repeated deploy ids in the collapsed chain set, which hides equal-cost copies (C2).
\* It must violate ExactlyOncePerDeployId.
CONSTANTS
    Scenarios <- MCScenarios
    UseKOrder = TRUE
    UseClaims = TRUE
    UseRecheck = TRUE
    UseMixingCheck = TRUE
    NormalizedOverfill = TRUE
    RawDuplicateCheck = FALSE
    SignSplitPrecheck = TRUE
    UserSystemSplit = TRUE
    UsePrecheck = TRUE
    AnyContributorFallback = TRUE
    MergeTypeCheck = TRUE
    UseRepair = TRUE
    UseBasePartition = TRUE
    StampFastPath = TRUE
    ChainLevelP5 = TRUE
    FullLedgerFastPath = TRUE
    PinnedFirst = TRUE
    LossesFirst = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT ExactlyOncePerDeployId
