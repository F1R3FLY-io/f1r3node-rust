  Events <- EventsDef
  Schedules <- SchedulesDef
  EventCost <- EventCostDef
  InitialSupply = 4
  Fee = 1
  StructuralReservation = 1
  UseStructuralProof = FALSE
  AllowExecutionDrift = FALSE
  AllowExhaustedAdmission = FALSE
  ReplaySubstitutesEvidence = FALSE
  PersistBeforePhysicalSettlement = FALSE

INVARIANTS
  TypeOK
  AdmittedProofCompleted
  AdmissionRequiresCompletedProof
  AdmittedCostIsFunded
  PreflightCommitReplayAgree
  EvidenceMatchesCommit
  CommitMatchesReplay
  SettlementIsExact
  DependentAdmissionExecutesOnce
  RejectedExecutionIsNotPublished
  PhysicalRejectionCreatesNoCheckpoint
  PublishedCandidateHasCheckpoint
  CommittedExecutionIsFinite
  ReplayUsesFiniteCertificate
  ScheduleIndependentCost
  ScheduleIndependentSemanticPost

PROPERTY EventuallyDoneOrRejected
