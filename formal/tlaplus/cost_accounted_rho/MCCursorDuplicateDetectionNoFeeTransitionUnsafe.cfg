\* Control: settlements without a fee transition move no cursor, so a scope
\* copy passes the fast path. P2 excludes them.
CONSTANTS
    Deploys = {d1, d2, d3}
    MaxSide = 3
    MergeableRevision = FALSE
    FeeTransitions = FALSE
    RepeatRule = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT DuplicateNeverFastPath
