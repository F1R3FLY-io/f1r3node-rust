\* Added by DR-119 (bug 11004): the lookup runs without a lock, so a creation
\* that trusts it and skips the check under the bucket lock duplicates the
\* cells of a scope that another worker created in between.
CONSTANTS
    Workers = {w1, w2}
    Scopes = {s1, s2}
    RecheckInitialization = FALSE
    CheckRevision = TRUE
    RestoreActual = TRUE
    PublishPosition = TRUE
    FastPath = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT ExactlyOnePairPerInitializedScope
