\* DR-120 (gap G9), control: the S3 pre-check bounds only the combined parts, so a user fold overflows (LOW-4).
\* It must violate NoMergeAbort.
CONSTANTS
    Scenarios <- MCScenarios
    UseKOrder = TRUE
    UseClaims = TRUE
    UseRecheck = TRUE
    UseMixingCheck = TRUE
    NormalizedOverfill = TRUE
    RawDuplicateCheck = TRUE
    SignSplitPrecheck = TRUE
    UserSystemSplit = FALSE
    UsePrecheck = TRUE
    AnyContributorFallback = TRUE
    MergeTypeCheck = TRUE
    UseRepair = TRUE
    UseBasePartition = TRUE
    StampFastPath = TRUE
    ChainLevelP5 = TRUE
    FullLedgerFastPath = TRUE
    PinnedFirst = TRUE
    LossesFirst = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoMergeAbort
