\* G3 (DR-135) negative control "UnverifiedRefusal": replay accepts a named refusal without its shortfall check, so a producer names a refusal for a tuple that fits.
\* Expected violation: RefusalNeedsShortfall.
CONSTANTS
  Defect = "UnverifiedRefusal"
  MaxBalance = 2
  Adversary = TRUE
  Rooms = {1, 2}
  Growths = {0, 1}
  MaxDeviations = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT RefusalNeedsShortfall
