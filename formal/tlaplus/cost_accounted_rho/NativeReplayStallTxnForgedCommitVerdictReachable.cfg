\* Added by decision 124 (L10): the witness of the scenario "txnforgedcommit".
\* A stall verdict needs the failed commit first, so a violation of
\* NoStallVerdict shows that TxnCheck takes the branch and that replay ends
\* in a verdict.
CONSTANTS
  Scenario = "txnforgedcommit"
  TaskMax = 1
  ParkAfterUnlock = FALSE
  SkipReset = FALSE
  ResetAfterUnlock = FALSE
  SkipVersion = FALSE
  CountInChild = FALSE
  NotifiedAfterCheck = FALSE
  RootUncounted = FALSE
  AdmitUncounted = FALSE
  BoundaryWhileArmed = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS NoStallVerdict
