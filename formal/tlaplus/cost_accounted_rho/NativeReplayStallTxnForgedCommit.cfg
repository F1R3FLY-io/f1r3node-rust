\* Added by decision 124 (L10): the safe run of the scenario "txnforgedcommit".
\* The commit of a ready transaction fails at its second row, and the
\* transaction leaves and fails with the epoch open (TxnCheck).
CONSTANTS
  Scenario = "txnforgedcommit"
  TaskMax = 1
  ParkAfterUnlock = FALSE
  SkipReset = FALSE
  ResetAfterUnlock = FALSE
  SkipVersion = FALSE
  CountInChild = FALSE
  NotifiedAfterCheck = FALSE
  RootUncounted = FALSE
  AdmitUncounted = FALSE
  BoundaryWhileArmed = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoFalseStall NoFreshLeave LiveExact CountExact CountedAreBlocked NoLostWakeup NoHang Verdict
