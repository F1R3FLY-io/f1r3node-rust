\* TLC Model Configuration for EvalScheduling
\*
\* Models 3 bodies sharing a channel, with asymmetric storage costs.
\* Verifies: internalized cost is deterministic (order-independent).

CONSTANTS
    b1 = b1
    b2 = b2
    b3 = b3
    Bodies          <- MC_Bodies
    CostPerToken    <- MC_CostPerToken
    StorageCostA    <- MC_StorageCostA
    StorageCostB    <- MC_StorageCostB
    MintAmount      <- MC_MintAmount
    FeeAmount       <- MC_FeeAmount
    CanonOrder      <- MC_CanonOrder
    Demand          <- MC_Demand
    PoolSupply      <- MC_PoolSupply
    CanonOrderB     <- MC_CanonOrderB
    DemandB         <- MC_DemandB
    PoolSupplyB     <- MC_PoolSupplyB

SPECIFICATION LiveSpec

CHECK_DEADLOCK FALSE

\* Invariants
INVARIANT TypeOK
INVARIANT InternalizedCostDeterministic
INVARIANT InternalizedCostBounded
\* Native SystemVault mint and direct-fee-transfer invariants
INVARIANT HaltedValidatorVaultEmpty
INVARIANT CanonicalVaultTotalBacked
INVARIANT NoFeeToHaltedValidator
\* Cost-Accounted Rho WD-D2 acceptance-gate invariants
INVARIANT NoDoubleSpendAtBlock
INVARIANT RejectBothOnOversubscription
INVARIANT GateBeforeExecute
INVARIANT SupplyConservation
\* #13b spec-strict reject-when-absent. At this instance PoolSupply = 5 (> 0) so
\* the implication is vacuously true here; the NON-vacuous PoolSupply = 0 case
\* (where the gate admits nothing, every Δ>0 deploy rejected) is exercised by
\* EvalStrictAbsent.cfg / MCEvalStrictAbsent.tla.
INVARIANT Inv_StrictRejectsAbsent
\* CA-P-171: the group-B disjoint pool is held to the SAME gate safety
\* discipline as group A (no-double-spend, reject-both, gate-before-execute,
\* conservation), and the two pools' accounting is provably disjoint.
INVARIANT NoDoubleSpendAtBlockB
INVARIANT RejectBothOnOversubscriptionB
INVARIANT GateBeforeExecuteB
INVARIANT SupplyConservationB
INVARIANT PoolGatesDisjoint

\* Temporal properties
PROPERTY AllEventuallyDone
\* Native custody and located-authority action-properties
PROPERTY VaultMutationIsProtocolAccounted
PROPERTY VaultTotalChangesOnlyByMint
PROPERTY HaltedVaultFrozenStep
PROPERTY VaultAndLocatedPoolWritersAreSeparated
\* CA-P-171 "concurrent non-locking admission" (cost-accounted-rho §2.3):
\* two deploys on DISJOINT signature pools are BOTH admitted/executed/settled
\* under INDEPENDENT per-pool fairness — neither blocked by the other, no
\* global execution lock. The headline liveness property plus its finer
\* "each pool admitted independently" companion.
PROPERTY DisjointPoolsAdmitConcurrentlyNoGlobalLock
PROPERTY EachPoolAdmittedIndependently
