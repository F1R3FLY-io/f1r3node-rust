\* G3 (DR-135) negative control "OwnerBlindSelection": the settlement selection keeps the full capacity of a purse that the member also draws as an owner (finding F6-a), so the client and owner debits exceed the balance.
\* Expected violation: NoOverdraft.
CONSTANTS
  Defect = "OwnerBlindSelection"
  NumMembers = 2
  MinHold = 0
  MaxHold = 1
  MaxSupply = 2
  MaxDrain = 1
  \* The rollback of a user failure charges the owner debits as a guard
  \* rollback does, so the owner configs leave user failures out to stay small.
  UserFailures = FALSE
  MaxOwnerUse = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT NoOverdraft
