\* G3 (DR-135) negative control "PessimisticUnlisted": replay gives an unlisted purse budget 0 also when the owner table is not full, so a producer omits a consulted purse and claims Stored.
\* Expected violation: StoredClaimIsHonest.
CONSTANTS
  Defect = "PessimisticUnlisted"
  MaxBalance = 2
  Adversary = TRUE
  Rooms = {1, 2}
  Growths = {0, 1}
  MaxDeviations = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT StoredClaimIsHonest
