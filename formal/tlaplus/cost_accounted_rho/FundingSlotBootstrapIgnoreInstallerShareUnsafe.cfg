\* G3 (DR-135) negative control: the activation neither gates nor charges the
\* installer's owner share, so the installer's stored receive runs free.
\* Expected violation: ActivationChargesTheInstallerShare.
CONSTANTS
    installerPurse = installerPurse
    sponsorPurse = sponsorPurse
    outerPurse = outerPurse
    slotPurse = slotPurse
    Purses <- PursesDef
    Installer = installerPurse
    Sponsor = sponsorPurse
    Outer = outerPurse
    Slot = slotPurse
    InitialBalance <- InitialBalanceDef
    InstallScaffoldCost = 1
    OuterInstallBound = 1
    SlotInstallBound = 1
    OuterFundingAmount = 3
    SlotFundingAmount = 3
    OuterActivationBound = 2
    SlotActivationBound = 2
    OuterRealizedCost = 1
    SlotRealizedCost = 1
    Defect = "IgnoreInstallerShare"
    InstallerActivationUsage = 1
    InstallerPrice = 1
    \* Added by G3 step S11 (DR-135 item 13): a caller whose purse holds only
    \* its hold, 2 * 1. Its client part 1 + 1 fits its limit 2, and its whole
    \* run 1 + 1 + 1 + 2 = 5 does not.
    callerPurse = callerPurse
    Caller = callerPurse
    CallerUsage = 1
    CallerPrice = 1
    CallerLimit = 2
    ZeroPricedOwnerUsage = 1
    BodyOwnerUsage = 2

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT ActivationChargesTheInstallerShare
