\* Control: without the repeat rule, a scope block settles a deploy of its own
\* history, and the composed outcome charges it twice.
CONSTANTS
    Deploys = {d1, d2, d3}
    MaxSide = 3
    MergeableRevision = FALSE
    FeeTransitions = TRUE
    RepeatRule = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT ExactlyOnceCharge
