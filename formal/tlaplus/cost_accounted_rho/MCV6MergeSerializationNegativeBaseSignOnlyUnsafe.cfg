\* DR-120 (gap G9), control: S6.4 drops only negative contributors, so a negative base with a zero contributor stalls the repair (HIGH-1).
\* It must violate NoMergeAbort.
CONSTANTS
    Scenarios <- MCScenarios
    UseKOrder = TRUE
    UseClaims = TRUE
    UseRecheck = TRUE
    UseMixingCheck = TRUE
    NormalizedOverfill = TRUE
    RawDuplicateCheck = TRUE
    SignSplitPrecheck = TRUE
    UserSystemSplit = TRUE
    UsePrecheck = TRUE
    AnyContributorFallback = FALSE
    MergeTypeCheck = TRUE
    UseRepair = TRUE
    UseBasePartition = TRUE
    StampFastPath = TRUE
    ChainLevelP5 = TRUE
    FullLedgerFastPath = TRUE
    PinnedFirst = TRUE
    LossesFirst = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoMergeAbort
