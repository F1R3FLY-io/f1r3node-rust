\* Control: a mergeable revision counter consumes no datum, so a scope copy
\* passes the fast path.
CONSTANTS
    Deploys = {d1, d2, d3}
    MaxSide = 3
    MergeableRevision = TRUE
    FeeTransitions = TRUE
    RepeatRule = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT DuplicateNeverFastPath
