\* G3 (DR-135) negative control "LateBudgetStart": replay does not bound budget_start by the first attempt of the row, so a producer records a start after a racing deduction and claims Stored.
\* Expected violation: StoredClaimIsHonest.
CONSTANTS
  Defect = "LateBudgetStart"
  MaxBalance = 2
  Adversary = TRUE
  Rooms = {1, 2}
  Growths = {0, 1}
  MaxDeviations = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT StoredClaimIsHonest
