\* DR-129 negative control: replay follows only the recorded source hash, not
\* the whole recorded payload. Two candidates with one source hash and other
\* extra fields then let replay retire another payload than play recorded.
\* Expected violation: PlayReplayAgree.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Sources = {1, 2}
  Extras = {0, 1}
  MaxCandidates = 3
  MaxConsumes = 2
  Mutation = "replaysourcematch"

INVARIANT PlayReplayAgree
