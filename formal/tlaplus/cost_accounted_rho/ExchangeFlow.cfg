\* TLC Model Configuration for ExchangeFlow (Cost-Accounted Rho Stage D).
\*
\* Models the blessed 1:1 Exchange swap over two ordinary carriers seeded with
\* count data and ordered resource stacks. Verifies per-channel + total
\* conservation, exact stack identity/order, and the DR-4 requires-both-inputs
\* property over all interleavings, including one-sided drains.

CONSTANTS
    InitC = 7
    InitV = 11
    RequireBoth = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

\* Invariants
INVARIANT TypeOK
INVARIANT Inv_PerChannelConservation
INVARIANT Inv_RequiresBothInputs
INVARIANT Inv_SwapExchangesValues
INVARIANT Inv_StackIdentityAndOrder
INVARIANT Inv_StackCellConservation
