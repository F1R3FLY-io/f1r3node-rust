\* G3 (DR-135) negative control "OwnerStraddleIgnored": the truncation rule omits condition (c). A shipped member lists a purse in its owner table that a dropped member holds, and validators recompute its budget without that hold.
\* Expected violation: TruncationConsistency.
CONSTANTS
  Defect = "OwnerStraddleIgnored"
  NumMembers = 2
  MinHold = 0
  MaxHold = 1
  MaxSupply = 2
  MaxDrain = 1
  \* The rollback of a user failure charges the owner debits as a guard
  \* rollback does, so the owner configs leave user failures out to stay small.
  UserFailures = FALSE
  MaxOwnerUse = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT TruncationConsistency
