\* BOUNDS: Defect="None", Order="random", Op="consume", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=1152 (owners 4 x guards 4 x budgets 9 x TailOf 8)
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Safe configuration (plan v4, M4): random consume with the adversary, every edit kind and the racer.
\* The V3-15 case: c1 fails its items, and the racer makes the pick c2 refused.
\* Every invariant must hold over the full state space.
SPECIFICATION Spec

CONSTANTS
    Defect = "None"
    Order = "random"
    Op = "consume"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = TRUE
    MaxEdits = 1
    Edits = {"DropRefusal", "AddRefusal", "AddItemFailRefusal", "NameOutside", "ForgeStored", "AddRow", "DeniedComm", "CutNoStop"}
    Seq = FALSE
    Racer = TRUE
    \* Added by plan v4 errata (V4-18).
    Wide = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
