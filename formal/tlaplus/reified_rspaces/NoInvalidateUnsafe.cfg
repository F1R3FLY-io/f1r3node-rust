\* BOUNDS: Intents=1..5, RowIds=1..7, Chans={"a1","a2","b1","x","h"}, Stripes=1..3, NativeKey=FALSE, Forge=TRUE, NoSpaceKeyUnsafe=FALSE, WaitUnderLocksUnsafe=FALSE, NoInvalidateUnsafe=TRUE
\* Unsafe control: a space row that fails closed does not close the epoch. A
\* forged footprint that makes a later host row depend on the failed row then
\* leaves that host operation waiting forever (the hang of the forged-journal
\* probe of step 4). MUST refute exactly NoDeadlock.
SPECIFICATION ScheduleSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 1
    MaxBudget = 0
    Tamper = FALSE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = FALSE
    Forge = TRUE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = FALSE
    NoInvalidateUnsafe = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    ScheduleTypeOK
    NoBlockedReadiness
    NoDeadlock
