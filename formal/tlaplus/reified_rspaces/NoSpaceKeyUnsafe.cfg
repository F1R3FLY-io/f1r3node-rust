\* BOUNDS: Intents=1..5, RowIds=1..7, Chans={"a1","a2","b1","x","h"}, Stripes=1..3, NativeKey=TRUE, Forge=FALSE, NoSpaceKeyUnsafe=TRUE, WaitUnderLocksUnsafe=FALSE, NoInvalidateUnsafe=FALSE
\* Unsafe control: space intents lose [2]||sid and [2, 0], so two transactions
\* of one space run in two groups, and a later one can begin before an earlier
\* one ends. With an honest journal a space row then finds a predecessor that
\* is not complete. MUST refute exactly NoBlockedReadiness.
SPECIFICATION ScheduleSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 1
    MaxBudget = 0
    Tamper = FALSE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = TRUE
    Forge = FALSE
    NoSpaceKeyUnsafe = TRUE
    WaitUnderLocksUnsafe = FALSE
    NoInvalidateUnsafe = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    ScheduleTypeOK
    NoBlockedReadiness
    NoDeadlock
