\* BOUNDS: Chans={"x","y"}, SeqNames={"nx","ny"}, MaxDepth=2, MaxSteps=5, AtomicGuard=TRUE, ScanEnabled=TRUE, NativeOnlySeq=TRUE, UseRestores=TRUE, RecordInJob=TRUE
\* The coordination rules of P7 (design v3, W1 and W3): every run of five
\* splits, use blocks, uses of the channels x and y, sends and factory
\* calls, with the record of a seq space in its creation job (decision 83).
\* SeqExclusive, ClaimTracksLastUse, SeqNotSent, QualifierSupport,
\* UseBalance and ScanViewPerWindow must hold.
SPECIFICATION Spec

CONSTANTS
    AtomicGuard = TRUE
    ScanEnabled = TRUE
    NativeOnlySeq = TRUE
    UseRestores = TRUE
    RecordInJob = TRUE
    MaxDepth = 2
    MaxSteps = 5

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SeqExclusive
    ClaimTracksLastUse
    SeqNotSent
    QualifierSupport
    UseBalance
    ScanViewPerWindow
