\* BOUNDS: Vals={"a", "b"}, Pats={"a", "any"}, PrioLevels={0}, SendLevels=AllLevels, ReceiveLanes=AnyOnly, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, AnyOrder=FALSE, ReentryAtHead=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=FALSE
\* The priority queue with its settle in a narrow universe of six rounds. The
\* values are a and b, and the patterns are a and any. The levels are 0 and the
\* unprioritized level, and the only lane is the unrestricted queue. The narrow
\* universe reaches deep traces: settles before the plan that end at the cap,
\* re-issued sends and settle jobs. Every invariant must hold.
SPECIFICATION Spec

CONSTANTS
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    PrioLevels = {0}
    SendLevels <- AllLevels
    ReceiveLanes <- AnyOnly
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    AnyOrder = FALSE
    ReentryAtHead = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    PqLevelOrder
    PqOldestFirst
    PqNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
