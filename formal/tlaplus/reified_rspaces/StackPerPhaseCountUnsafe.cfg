\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, ReentryAtTop=FALSE, PerPhaseCount=TRUE, NoPlanOpenCheck=FALSE
\* Unsafe control: each phase of a round starts its own count of fires at
\* 0, as each settle call and each plan did before revision I-21. MUST
\* refute exactly TxnFiresBounded. The shortest trace has four rounds. A
\* persistent receive of any value parks, and a peek receive of a parks on
\* top of it. The send of b is stored, because the top waiter does not fit
\* it. The send of a then fires the peek waiter and the persistent waiter,
\* which is Cap = 2 fires. The settle after the plan starts its own count
\* at 0. It fires the record b with the persistent waiter, a third fire in
\* one round. Every phase still stops at Cap fires of its own, so the
\* other invariants hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    ReentryAtTop = FALSE
    PerPhaseCount = TRUE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LifoOrder
    StackNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
