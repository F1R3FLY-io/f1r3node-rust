    Discipline = "queue"
    Colls = {"c1"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    Guards = {"none"}
    Groups <- RepeatOnlyGroups
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = TRUE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    DistinctRecordsPerBind
    IncomingBoundOnce
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
