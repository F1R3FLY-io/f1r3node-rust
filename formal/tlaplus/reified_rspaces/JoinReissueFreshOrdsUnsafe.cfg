\* BOUNDS: Discipline="queue", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none"}, Groups=RepeatOnlyGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=TRUE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE
\* Unsafe control: a re-issued persistent receive carries no ords. MUST
\* refute exactly ReissueKeepsBindOrds. The shortest trace: persistent sends
\* fill c1, and a persistent join <c1,c1> fires on persistent records only,
\* a divergent pair. Its re-issue carries no ords.
SPECIFICATION Spec

