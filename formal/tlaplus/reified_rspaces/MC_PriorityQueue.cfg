\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any","notA"}, PrioLevels={0}, SendLevels=AllLevels (0 and Unp), ReceiveLanes=AllLanes (0 and Any), MaxOps=4, Cap=2, Reissues=TRUE, NoSettle=FALSE, AnyOrder=FALSE, ReentryAtHead=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=FALSE
\* The priority queue with its settle: every schedule of four rounds. Each round
\* takes every value, pattern, level, lane, persistence and peek. The schedules
\* include the re-entries of re-issued operations and the re-issued settle jobs.
\* Cap = 2, so the cap of a round is reachable. One count of fires runs through
\* the settle before the plan, the plan and the settle after it (revision I-21).
\* Every invariant must hold.
SPECIFICATION Spec

CONSTANTS
    Vals = {"a", "b"}
    Pats = {"a", "b", "any", "notA"}
    PrioLevels = {0}
    SendLevels <- AllLevels
    ReceiveLanes <- AllLanes
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    AnyOrder = FALSE
    ReentryAtHead = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    PqLevelOrder
    PqOldestFirst
    PqNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
