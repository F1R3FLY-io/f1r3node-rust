\* BOUNDS: Defect="ContinueAfterDeviation", Order="head", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=FALSE, Wide=FALSE, Init states=5184 (owners of c1 and c2 4 x owner of r 2 x guard and may-veto pairs 9 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. So each candidate has 3 guard and may-veto pairs.
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Unsafe control (plan v4, M4, base Head): the rows after a deviating row
\* commit in the shared commit loop of both roles, and the receipt collects
\* every deviation of the job. A later row then commits against a view that
\* its commit did not meet.
\* MUST refute exactly HostParity.
\* Changed by plan v4 errata (V4-14): the base is Head, so Order = "head" and
\* Racer = FALSE. Head order is deterministic, so replay stages and accepts
