\* BOUNDS: Defect="StagedRetires", Order="random", Op="consume", ClassMode=TRUE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=4608 (owners 4 x owners of the second members 4 x guards 4 x budgets 9 x TailOf 8)
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Changed by plan v4 errata (V4-15): Racer = TRUE. A class fire binds one
\* datum, so only the racer refuses a fire whose items pass (V4-11).
\* Without the racer, PartialClassFire refutes nothing. The BOUNDS line
\* before the errata: Racer=FALSE.
\* Unsafe control (plan v4, M4, base Class): the v2 rule. The rows after a deviating row d drop,
\* and the group of the actual fire is not readied. The second member of
\* the fired class stays stored.
\* MUST refute exactly SpentClassRetired.
SPECIFICATION Spec

