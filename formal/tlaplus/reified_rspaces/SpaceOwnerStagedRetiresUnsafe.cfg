    MaxEdits = 1
    Edits = {}
    Seq = FALSE
    \* Changed by plan v4 errata (V4-15): Racer = FALSE
    Racer = TRUE
    \* Added by plan v4 errata (V4-18).
    Wide = FALSE

CHECK_DEADLOCK FALSE

