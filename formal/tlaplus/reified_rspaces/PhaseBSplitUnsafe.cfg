\* BOUNDS: Procs={"t1","t2","h"}, Colls={"D1","D2","D3"}, Chans={"Cfg","D1","D2","D3","h1","h2"}, every stripe map [Chans -> 1..3] (729 maps), links at start {{"D1","D2"}}, Escalation="SplitPhaseB", ConfigInPhaseA=TRUE, CoverageByPhaseB=TRUE
\* Unsafe control: the begin takes both phases of the own keys, and a second
\* phase B call takes the scope keys. The second call skips the stripes that
\* the process holds. A process then waits for phase B while it holds phase
\* B, and a stripe collision closes a cycle with another process. MUST
\* refute exactly NoDeadlock.
SPECIFICATION Spec

CONSTANTS
    Escalation = "SplitPhaseB"
    ConfigInPhaseA = TRUE
    CoverageByPhaseB = TRUE
    NumStripes = 3

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoStaleScope
    NoFalseRefusal
    NoDeadlock
    CanStepIsEnabled
    MutualExclusion
