\* BOUNDS: Intents=1..5, RowIds=1..7, Chans={"a1","a2","b1","x","h"}, Stripes=1..3, NativeKey=FALSE, Forge=TRUE, NoSpaceKeyUnsafe=FALSE, WaitUnderLocksUnsafe=FALSE, NoInvalidateUnsafe=FALSE
\* The scheduling scenario of NativeReplay.tla without the native key [2, 0]:
\* the per-space key [2]||sid alone (I-11), every interleaving of the groups,
\* an honest journal and every footprint-consistent forgery of a space row.
\* NoBlockedReadiness and NoDeadlock must hold.
SPECIFICATION ScheduleSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 1
    MaxBudget = 0
    Tamper = FALSE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = FALSE
    Forge = TRUE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = FALSE
