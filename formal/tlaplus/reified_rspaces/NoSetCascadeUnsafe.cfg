\* BOUNDS: Discipline="set", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none", "onlyB"}, Groups=RepeatGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=TRUE, PersistentClaimed=FALSE, CascadeCanon=TRUE
\* Unsafe control: the set does not cascade (decision 50 reverted). MUST
\* refute exactly QuiescentNoPendingMatch. The shortest trace: sends of a
\* and b are stored on c1. A receive of any with the guard onlyB parks,
\* because its pick a fails the guard. A second receive consumes a. Only b
\* remains, so every pick of the guarded receive fires, but no cascade
\* tries the receive again.
\* Changed by decisions 102 and 103 (decision 118): the guards and four
\* rounds replace the trace of finding F-JF-1. In that trace, sends of a, b
\* and a persistent a are stored on c1, and the join <c1,c1> with the
\* patterns any and a parks. A receive of a then consumes the first member
\* of the class a, and the join matches b and the persistent a with no
\* fire. Now the first a claims its class at the first bind, and the
\* persistent a is never blocked, so that join binds both at once and
\* never parks.
