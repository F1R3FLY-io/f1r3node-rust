\* Retired by decision 90. DR-134 of feature/cost-accounted-rho deletes the legacy meter,
\* so CheckpointReplay.tla has no Legacy mode (Option P of decision 45).
\* MC_CheckpointReplay_Peek.cfg checks the same scenario in a token deploy.
\* Restore this configuration with git show 6bf10a721:formal/tlaplus/reified_rspaces/MC_CheckpointReplay_Legacy.cfg.
\* Restore the model with git show 6bf10a721:formal/tlaplus/reified_rspaces/CheckpointReplay.tla.
\*
\* \* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=12, Forge=TRUE, Peeks=TRUE, Legacy=TRUE
\* \* Decision 45 in a legacy deploy: peeks under Rule E (a peek fire removes
\* \* the record, and a re-store puts the same record back), and the legacy
\* \* storage charges of ChargingRSpace through the chain of before_observe
\* \* callbacks and the tail (Option P). With the phlo limit of 12, deploys
\* \* run out of phlo at every kind of charge: the pre-charge of a fire, a
\* \* carried post-charge, the callback of a re-store, and the tail, in play
\* \* and in replay. The proposer may omit the COMM of its last fire (Forge).
\* \* T1-T4, T6 and U13 must hold, and the inductive invariant IndInv of the
\* \* Apalache checks holds on every reachable state.
\* SPECIFICATION Spec
\* 
\* CONSTANTS
\*     Chans = {"d1", "v1"}
\*     Vol = {"v1"}
\*     Vals = {"a"}
\*     Konts = {"k"}
\*     MaxTxnOps = 2
\*     MaxTxns = 2
\*     Blocks = 1
\*     Budget = 12
\*     SpacesInBlockHash = TRUE
\*     Forge = TRUE
\*     UseUuid = FALSE
\*     RootIgnoresVolatile = FALSE
\*     DoublePair = FALSE
\*     JoinResidue = FALSE
\*     StagingDivergence = FALSE
\*     AcceptUnpaired = FALSE
\*     Peeks = TRUE
\*     Legacy = TRUE
\*     LegacyPreAfterObserve = FALSE
\*     LegacyTailDropped = FALSE
\*     RetainPeek = FALSE
\* 
\* CHECK_DEADLOCK FALSE
\* 
\* INVARIANTS
\*     TypeOK
\*     ReplayPrefixEqual
\*     SameRootIffSameState
\*     PairedOnce
\*     NoVolatileResidue
\*     ReplayOutcomeEqual
\*     LegacyChargesFollowHost
\*     IndInv
