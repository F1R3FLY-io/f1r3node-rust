\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=TRUE, ReentryAtTop=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=FALSE
\* Unsafe control: the stack without its settle hooks. MUST refute exactly
\* StackNoPendingMatch. The shortest trace has four rounds: the send of a is
\* stored, the send of b is stored on top of it, the receive of a parks (the
\* top record b does not fit it), and the receive of b fires the top record
\* b. The top record a and the top waiter a then match with no element in
\* flight. The fires of the plans still bind the tops and no record is
\* lifted, so the other invariants hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = TRUE
    ReentryAtTop = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LifoOrder
    StackNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
