\* BOUNDS: Discipline="bag", Vals={"a","b"}, Pats={"a","b","any"}, Guards={"none","onlyB"}, Ids=1..4, MaxOps=4, Cap=2, WildcardFire=FALSE, RetireClass=TRUE, RetireOnProduce=TRUE, CapacityCheck=TRUE, PeekRestore=TRUE, RestoreOwnAuthority=TRUE, RestoreReoffer=FALSE
\* Unsafe control: the re-store of a peeked bag record is a plain store, not
\* the host's second send. A guarded waiter that parked behind a refused
\* first match and admits the record does not fire. MUST refute exactly
\* PeekRestoresRecord.
SPECIFICATION Spec

CONSTANTS
    Discipline = "bag"
    MaxOps = 4
    Cap = 2
    WildcardFire = FALSE
    RetireClass = TRUE
    RetireOnProduce = TRUE
    CapacityCheck = TRUE
    PeekRestore = TRUE
    RestoreOwnAuthority = TRUE
    RestoreReoffer = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPendingMatch
    PatternEnforcement
    Conservation
    NoDoubleSpend
    AtomicReservation
    PeekRestoresRecord
