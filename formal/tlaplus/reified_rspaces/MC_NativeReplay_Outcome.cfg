\* BOUNDS: Comms={"m1","m2"}, MaxOps=3, MaxBudget=6, Tamper=TRUE
\* T8: native play of every transaction of up to three stores and fires,
\* at every phlo limit up to 6, an honest journal or one tampered
\* well-formed row, and native replay. NativeReplayOutcomeEqual must hold.
SPECIFICATION OutcomeSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 3
    MaxBudget = 6
    Tamper = TRUE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = FALSE
    Forge = FALSE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = FALSE
    NoInvalidateUnsafe = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    OutcomeTypeOK
    NativeReplayOutcomeEqual
