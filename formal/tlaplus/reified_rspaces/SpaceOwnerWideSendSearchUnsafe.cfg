\* BOUNDS: Defect="WideSendSearch", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=TRUE, Init states=3456 (owners 4 x guard and may-veto pairs 6 x guard of the other tuple of c1 2 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. The wide waiter c1 may veto, so it has 2 guard and may-veto pairs, and c2 has 3.
\* Added by plan v4 errata (V4-18).
\* Unsafe control (plan v4 errata V4-18, base ProduceWide): replay searches the wide waiter c1 on a
\* Stored row (no G2-a). Play picks the verdict of the other tuple of c1, the guard fails, and the
\* datum stores. The DR-75 tuple of c1 passes its guard, so replay stages a fire of c1 and its own
\* row deviates. Replay then fails CanContinue, the N lookup or CanStop.
\* MUST refute exactly TxnPlayReplayAgree.
SPECIFICATION Spec

CONSTANTS
    Defect = "WideSendSearch"
    Order = "random"
    Op = "produce"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = FALSE
    MaxEdits = 1
    Edits = {}
    Seq = FALSE
    Racer = TRUE
    Wide = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
