\* BOUNDS: Discipline="bag", Vals={"a","b"}, Pats={"a","b","any"}, Guards={"none","onlyB"}, Ids=1..5, MaxOps=5, Cap=2, WildcardFire=FALSE, RetireClass=TRUE, RetireOnProduce=TRUE, CapacityCheck=TRUE, PeekRestore=TRUE, RestoreOwnAuthority=TRUE, RestoreReoffer=TRUE
\* The scan driver of a bag (A.7): every schedule of five rounds with every
\* value, pattern, guard, persistence, peek and canonical order, with the
\* re-entries of re-issued elements. Every invariant of the bag must hold.
SPECIFICATION Spec

CONSTANTS
    Discipline = "bag"
    MaxOps = 5
    Cap = 2
    WildcardFire = FALSE
    RetireClass = TRUE
    RetireOnProduce = TRUE
    CapacityCheck = TRUE
    PeekRestore = TRUE
    RestoreOwnAuthority = TRUE
    RestoreReoffer = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPendingMatch
    PatternEnforcement
    Conservation
    NoDoubleSpend
    AtomicReservation
    PeekRestoresRecord
