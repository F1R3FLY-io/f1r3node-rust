    Vals = {"a", "b"}
    Pats = {"a", "b"}
    PrioLevels = {0}
    SendLevels <- PrioOnly
    ReceiveLanes <- AnyOnly
    MaxOps = 7
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    AnyOrder = FALSE
    ReentryAtHead = TRUE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

