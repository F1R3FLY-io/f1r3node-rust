\* BOUNDS: Chans={"d1","d2","v1"}, Vol={"v1"}, Vals={"a","b"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=3, Forge=TRUE
\* The faithful substrate in one block: content-hash identities, the volatile
\* sweep of data, continuations and joins, verify that pairs once per COMM,
\* and a root over every space channel. The deploy has a phlo limit of 3
\* charges, so many deploys run out of phlo inside a transaction (decision
\* 36), and the proposer may omit the COMM of its last fire (Forge). T1-T4
\* and T6 must hold, and the inductive invariant IndInv of the Apalache
\* checks holds on every reachable state.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "d2", "v1"}
    Vol = {"v1"}
    Vals = {"a", "b"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 3
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    IndInv
