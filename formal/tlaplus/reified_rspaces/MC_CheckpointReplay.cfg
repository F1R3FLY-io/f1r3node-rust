\* BOUNDS: Chans={"d1","d2","v1"}, Vol={"v1"}, Vals={"a","b"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1
\* The faithful substrate in one block: content-hash identities, the volatile
\* sweep of data, continuations and joins, verify that pairs once per COMM,
\* and a root over every space channel. All four invariants must hold, and
\* the inductive invariant IndInv of the Apalache checks holds on every
\* reachable state.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "d2", "v1"}
    Vol = {"v1"}
    Vals = {"a", "b"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    SpacesInBlockHash = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    IndInv
