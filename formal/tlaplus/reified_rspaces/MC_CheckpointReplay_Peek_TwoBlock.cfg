\* BOUNDS: Chans={"d1"}, Vol={}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2, Budget=4, Forge=TRUE, Peeks=TRUE
\* Decision 45, Rule E, over two blocks in a token deploy. Block 2 can peek a
\* record of block 1. The re-store is then the only produce event of the
\* record in the log of block 2, so rig binds the peek COMM under that
\* produce key, and replay removes the binding (design report C.5). The
\* deploy of each block starts with the full limit of 4 charges, so a deploy
\* can run out of phlo between a peek fire and its re-store. One channel and
\* no volatile channel keep the state space small. T1-T4 and T6 must hold,
\* and the inductive invariant IndInv of the Apalache checks holds on every
\* reachable state. Added by decision 90: the scenario of the retired
\* MC_CheckpointReplay_Legacy_TwoBlock.cfg in a token deploy.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1"}
    Vol = {}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    Budget = 4
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    IndInv
