\* BOUNDS: Defect="WideStopByGuard", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=TRUE, Init states=3456 (owners 4 x guard and may-veto pairs 6 x guard of the other tuple of c1 2 x budgets 9 x TailOf 8)
