\* BOUNDS: Chans={"a","b"} (stripes 1, 2), Groups={<<"a">>,<<"b">>,<<"a","b">>,<<"a","a">>,<<"b","b">>} (FR-1'), Txns={"t1","t2"}, MaxTxnOps=2, MaxHostOps=2
\* Negative control of the Apalache STEP check: a produce does not check the
\* phase-B stripes of its join channels. One step from a LockIndInv state
\* MUST break OpenInv (the stagedOne conjunct). Run with --length=1.
CONSTANTS
    Txns = {"t1", "t2"}
    NumTxns = 2
    MaxTxnOps = 2
    MaxHostOps = 2
    CheckCoverage = TRUE
    CheckJoinCoverage = FALSE

INIT IndInit
NEXT Next

INVARIANT LockIndInv
