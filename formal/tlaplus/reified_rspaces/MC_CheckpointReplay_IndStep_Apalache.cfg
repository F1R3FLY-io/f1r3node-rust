\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2
\* Apalache inductive check of T3 (PairedOnce) and T4 (NoVolatileResidue)
\* through IndInv. STEP: every successor of an IndInv state satisfies IndInv (run with --length=1).
CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    SpacesInBlockHash = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE

INIT IndInit
NEXT Next

INVARIANT IndInv
