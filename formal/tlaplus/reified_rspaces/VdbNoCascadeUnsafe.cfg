\* BOUNDS: Vals={"img", "doc"}, Modes={"single", "list"}, Queries={"all"}, SinglePats={"img"}, ListPats={"pair", "docpair"}, Ks={2}, Peeks=BOOLEAN, RecvPers={FALSE}, SendPers=BOOLEAN, MaxOps=5, MaxRounds=8, Cap=2, NoCascade=TRUE
\* Unsafe control: the tail runs no LIST-CASCADE. MUST refute exactly
