\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, ScanWaiters=TRUE
\* Unsafe control: the legacy waiter scan. A datum that finds no queued
\* record fires the first waiter that matches it, not the head. MUST
\* refute exactly HeadBlocks: the scan runs only when no record is queued,
\* so HeadOnlyNoPendingMatch and FifoOrder still hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    ScanWaiters = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    HeadOnlyNoPendingMatch
    HeadBlocks
    FifoOrder
