\* BOUNDS: Vals={"img", "doc"}, Modes={"single", "list"}, Queries={"all"}, SinglePats={"img"}, ListPats={"pair", "docpair"}, Ks={2}, Peeks=BOOLEAN, RecvPers={FALSE}, SendPers=BOOLEAN, MaxOps=5, MaxRounds=8, Cap=2, every Unsafe flag FALSE
\* Single and list waiters of the query all, with peeks and persistent sends:
\* every schedule of five operations in up to eight transactions. Five
\* operations reach CE-1 (a parked list waiter fires on the send that makes
\* its list) and CE-2 (a removal makes a parked list waiter fireable).
\* Every invariant must hold. Cap = 2, so a transaction can stop at the cap
\* and commit a settle job.
SPECIFICATION Spec

CONSTANTS
    Vals = {"img", "doc"}
    Modes = {"single", "list"}
    Queries = {"all"}
    SinglePats = {"img"}
    ListPats = {"pair", "docpair"}
    Ks = {2}
    Peeks = {FALSE, TRUE}
    RecvPers = {FALSE}
    SendPers = {FALSE, TRUE}
    MaxOps = 5
    MaxRounds = 8
    Cap = 2
    NoCascade = FALSE
    ParkOnlyWhileEmpty = FALSE
    NoRetire = FALSE
    DropOwed = FALSE
    UncountedCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    ListAtomic
    PeekConservation
    CascadeTerminates
