\* BOUNDS: Chans={"a","b"} (stripes 1, 2), Groups={<<"a">>,<<"b">>,<<"a","b">>,<<"a","a">>,<<"b","b">>} (FR-1'), Txns={"t1","t2"}, MaxTxnOps=2, MaxHostOps=2
\* Unsafe control: staging does not check lock coverage, so a transaction
\* may touch a channel without holding its stripe (review F-LOCK-1). A host
\* operation then changes the channel between staging and commit. MUST
\* refute exactly T5 (Serializable).
SPECIFICATION Spec

CONSTANTS
    Txns = {"t1", "t2"}
    NumTxns = 2
    MaxTxnOps = 2
    MaxHostOps = 2
    CheckCoverage = FALSE
    CheckJoinCoverage = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    Serializable
