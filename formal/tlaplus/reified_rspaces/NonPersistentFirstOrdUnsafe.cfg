\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=1, Reissues=TRUE, ScanWaiters=FALSE, ReissueFreshOrd=FALSE, ReentryAtHead=FALSE, NonPersistentFirstOrd=TRUE
\* Unsafe control (C1 of decision 43): a re-issued datum that is not
\* persistent keeps its first-round ord. It re-enters ahead of a younger
\* record, fires the waiter in front and is spent. MUST refute exactly
\* QuiescentNoPendingMatch: the younger record and the next waiter match
\* with no element in flight. The kept ord also breaks LeaveOrder (a
\* younger record can leave first), so this control does not check
\* LeaveOrder. At 10 rounds the mutation can also break
\* ShadowedNoPendingMatch (a second element in flight does not precede the
\* head of its side), so the bound of this control stays small.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 1
    Reissues = TRUE
    ScanWaiters = FALSE
    ReissueFreshOrd = FALSE
    ReentryAtHead = FALSE
    NonPersistentFirstOrd = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ShadowedNoPendingMatch
    QuiescentNoPendingMatch
    ReissueKeepsOrd
    IntroducedOnce
    FifoOrder
    HeadBlocks
