\* BOUNDS: Qs={"q1","q2"}, Vals={"x","y"}, pre-state queues {unopened, [x], [y]}, 1..2 ops per branch from {enq(q,v), deq(q), peek(q)}, WriteCounters=FALSE, ReadCounters=FALSE
\* Unsafe control: no operation uses a counter, and an enqueue takes the
\* greatest ord of its queue plus 1. Two enqueues of one queue in two
\* branches take one ord, and check #1 sees no race. MUST refute exactly
\* NoMergedOrderFabrication.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = FALSE
    ReadCounters = FALSE
    Allocations = FALSE
    EagerAllocator = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMergedOrderFabrication
