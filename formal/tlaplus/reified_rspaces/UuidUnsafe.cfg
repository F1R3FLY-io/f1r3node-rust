\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1
\* Unsafe control: identities carry a random per-run nonce. The validator
\* logs other identities than the proposer. MUST refute exactly T1
\* (ReplayPrefixEqual).
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    SpacesInBlockHash = TRUE
    UseUuid = TRUE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
