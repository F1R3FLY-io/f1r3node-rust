\* BOUNDS: Paths=TwoLevelPaths, Pats=ValuePats, Vals={"a","b"}, MaxOps=1, Forks=TRUE, SpaceWideIndex=TRUE, ExactPathOnly=FALSE, NoRetire=FALSE, MarkerNotRestored=FALSE
\* Unsafe: the markers of every datum live on the space-wide index I(eps), as the
\* node-local index of the legacy store kept them. A datum on [0, 1] and a waiter
\* on [0] share no channel, so check #2 misses their contact. Refutes exactly
\* MergeDetectsPrefixContact.
SPECIFICATION Spec

CONSTANTS
    Paths <- TwoLevelPaths
    Pats <- ValuePats
    Vals = {"a", "b"}
    MaxOps = 1
    Forks = TRUE
    SpaceWideIndex = TRUE
    ExactPathOnly = FALSE
    NoRetire = FALSE
    MarkerNotRestored = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMatchRemains
    MarkerCount
    MergeDetectsPrefixContact
