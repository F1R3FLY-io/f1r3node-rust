\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=8, Forge=FALSE
\* Unsafe control: the sweep removes data and continuations only (the
\* remove_all_continuations shape), so a volatile join entry reaches the
\* history trie. MUST refute exactly T4 (NoVolatileResidue).
\* The phlo limit of 8 charges is never reached, and no log is forged.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 8
    SpacesInBlockHash = TRUE
    Forge = FALSE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = TRUE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
