\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1
\* Unsafe control: the sweep removes data and continuations only (the
\* remove_all_continuations shape), so a volatile join entry reaches the
\* history trie. MUST refute exactly T4 (NoVolatileResidue).
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    SpacesInBlockHash = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
