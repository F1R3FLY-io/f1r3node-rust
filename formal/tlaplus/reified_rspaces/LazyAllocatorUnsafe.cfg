\* BOUNDS: Qs={"q1","q2"}, Vals={"x","y"}, pre-state queues {unopened, [x], [y]}, pre-state allocator A(sid) in {none,0,1}, 1..2 ops per branch from {enq(q,v), deq(q), peek(q), alloc(1), alloc(2)}, WriteCounters=TRUE, ReadCounters=TRUE, Allocations=TRUE, EagerAllocator=FALSE
\* Unsafe control: the creation stages no allocator, and the first
\* allocation of a space creates A(sid) at its next value without a consume
\* (the legacy in-memory next index, D8). Two branches that each make the
\* first allocation of the space hand out the index 0, and check #1 sees no
\* race. MUST refute exactly NoDuplicateIndex.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = TRUE
    ReadCounters = TRUE
    Allocations = TRUE
    EagerAllocator = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDuplicateIndex
