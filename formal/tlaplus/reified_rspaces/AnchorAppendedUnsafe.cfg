\* Unsafe control (the counterexample CE1): the anchor goes after a shared
\* first operation. In play one settle job re-offers R to the waiter "w1",
\* and the other job finds no waiter and commits its anchor alone. In replay
\* the second job can come first. Its re-offer then selects the row of the
\* first job. Changed by decision 102 (plan v4, M3): the anchor of the second
\* job has no successor row after that row, so the record end cuts the
\* staging after the re-offer. The re-offer row did not deviate, so CanStop
\* fails at commit. MUST refute exactly NoFailClosed.
