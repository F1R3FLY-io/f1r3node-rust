\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2
\* Negative control of the Apalache STEP check: the sweep keeps the join
\* entries (JoinResidue). One deploy-end step from an IndInv state MUST leave a
\* volatile join (SweptClean, the inductive form of T4). Run with --length=1.
CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    SpacesInBlockHash = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = TRUE

INIT IndInit
NEXT Next

INVARIANT IndInv
