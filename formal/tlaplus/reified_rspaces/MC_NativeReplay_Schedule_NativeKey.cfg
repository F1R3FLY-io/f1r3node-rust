\* BOUNDS: Intents=1..5, RowIds=1..7, Chans={"a1","a2","b1","x","h"}, Stripes=1..3, NativeKey=TRUE, Forge=TRUE, NoSpaceKeyUnsafe=FALSE, WaitUnderLocksUnsafe=FALSE, NoInvalidateUnsafe=FALSE
\* The scheduling scenario with the native key [2, 0] of native execution
\* (DR-78, DR-79): one frontier is one conflict group. NoBlockedReadiness and
\* NoDeadlock must hold, also with every forgery.
SPECIFICATION ScheduleSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 1
    MaxBudget = 0
    Tamper = FALSE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = TRUE
    Forge = TRUE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = FALSE
    NoInvalidateUnsafe = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    ScheduleTypeOK
    NoBlockedReadiness
    NoDeadlock
