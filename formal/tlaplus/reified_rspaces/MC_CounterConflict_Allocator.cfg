\* BOUNDS: Qs={"q1","q2"}, Vals={"x","y"}, pre-state queues {unopened, [x], [y]}, pre-state allocator A(sid) in {0,1,2}, 1..2 ops per branch from {enq(q,v), deq(q), peek(q), alloc(1), alloc(2)}, WriteCounters=TRUE, ReadCounters=TRUE, Allocations=TRUE, EagerAllocator=TRUE
\* P5d (F11): the creation of an Array or a Vector space stages the
\* allocator A(sid) = 0, and every allocation consumes A(sid) = n and
\* produces A(sid) = n + k. TLC checks every pair of branches over every
\* pre-state. NoDuplicateIndex must hold: a merge without a race never hands
\* one index name to both branches. NoMergedOrderFabrication covers the
\* allocator record and the allocated indices too.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = TRUE
    ReadCounters = TRUE
    Allocations = TRUE
    EagerAllocator = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMergedOrderFabrication
    SharedQueueRaces
    FirstOpsRace
    NoDuplicateIndex
    AllocationsRace
