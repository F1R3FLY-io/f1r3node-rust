\* BOUNDS: Scenario="errstop": Jobs={"te","tej"}, "tej" is the child of "te", the parent-first play order (1 order), one play choice for each job, FootprintKey=TRUE, AnchorRowless=TRUE, AnchorFirst=TRUE, UnknownSourceWaits=TRUE, FollowRecord=TRUE, StaleWaits=TRUE, RecordEnd=TRUE, ReissueAnchorFirst=TRUE, CanonicalRestage=TRUE, RestageAnchorFirst=TRUE, MarkFree=TRUE, ReofferAnchor=TRUE, SeqRestage=TRUE, FollowErrorEnds=TRUE, AnchorOnlyErrorPath=TRUE, AnchorOnlyMissDr75=TRUE, CascadeCanonWindows=TRUE
\* Changed by decision 124 (L2): line 1 drops the entries "CascadeLeastIndex=TRUE" and "CascadeMissStages=TRUE", because the model has neither constant.
\* Decision 122 (plan v4, M3, CR-32): "te" deviates at row 0. Its next step
\* is a store that fails with CapacityExceeded before its stage call, so its
