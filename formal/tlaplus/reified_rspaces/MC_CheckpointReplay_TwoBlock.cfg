\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2, Budget=3, Forge=TRUE
\* The faithful substrate over two blocks: the validator of block 2 resets to
\* the root of block 1. The deploy of each block has a phlo limit of 3
\* charges (decision 36), and the proposer may omit the COMM of its last
\* fire (Forge). T1-T4 and T6 must hold, and the inductive invariant IndInv
\* of the Apalache checks holds on every reachable state.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    Budget = 3
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    IndInv
