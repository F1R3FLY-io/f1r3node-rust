\* BOUNDS: Ids={1, 2}, MaxDeploys=3, MaxEvents=8, QCap=1, every Unsafe flag FALSE
SPECIFICATION Spec

CONSTANTS
    Ids = {1, 2}
    MaxDeploys = 3
    MaxEvents = 8
    QCap = 1
    MirrorWriteInTxn = FALSE
    UnrecordedAdvisory = FALSE
    ChecksOnlyInPlay = FALSE
    PublishFailed = FALSE
    KeepJournal = FALSE
    RuleEUpsert = FALSE
    BlockingPublish = FALSE
    KeepOrphans = FALSE
    WatermarkOnFailure = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ConsensusIndependentOfMirror
    AdvisoryRecorded
    EqualHostWork
    PublishOnlyOnSuccess
    NetWritesExact
    PublishNeverWaits
    ReconciledEqualsFinalizedView
    WatermarkHonest
