\* BOUNDS: Defect="ReplayBookOnMark", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=2592 (owners 4 x guard and may-veto pairs 9 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. So each candidate has 3 guard and may-veto pairs.
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Unsafe control (plan v4 errata V4-17, base ProduceRacer): replay books its refused pairs only on a
\* marked row, through the deviation of its receipt. The racer refuses the staged candidate, a later
\* candidate fires, and Tail is Return. Play books the refused pair, and replay has no mark, so it
\* books nothing.
\* Changed by plan v4 errata (V4-17): on this base only a later fire refutes the invariant. On a
\* Stored produce row with a refusal, replay stages c1 or c2 by DR-75, so its own row deviates and
\* it has a mark (arbiter-v4-17-18-B.md, 1.2). SpaceOwnerReplayBookOnMarkConsumeUnsafe.cfg reaches
\* the refused park.
\* MUST refute exactly TxnPlayReplayAgree.
SPECIFICATION Spec

CONSTANTS
    Defect = "ReplayBookOnMark"
    Order = "random"
    Op = "produce"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = FALSE
    MaxEdits = 1
    Edits = {}
    Seq = FALSE
    Racer = TRUE
    \* Added by plan v4 errata (V4-18).
    Wide = FALSE

CHECK_DEADLOCK FALSE

