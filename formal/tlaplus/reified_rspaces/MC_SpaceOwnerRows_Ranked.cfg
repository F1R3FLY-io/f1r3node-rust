\* BOUNDS: Defect="None", Order="ranked", Op="consume", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=FALSE, Wide=FALSE, Init states=2304 (owners 4 x guards 4 x budgets 9 x TailOf 8 x pattern verdict of c1 2)
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Safe configuration (plan v4, M4): ranked consume with the adversary, every edit kind and the
\* pattern verdict of c1.
\* Every invariant must hold over the full state space.
SPECIFICATION Spec

CONSTANTS
    Defect = "None"
