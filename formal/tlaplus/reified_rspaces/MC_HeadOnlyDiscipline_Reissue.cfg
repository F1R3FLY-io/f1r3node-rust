\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=1, Reissues=TRUE, ScanWaiters=FALSE, ReissueFreshOrd=FALSE, ReentryAtHead=FALSE, NonPersistentFirstOrd=FALSE
\* Decision 43: every schedule of six rounds with persistent sends and
\* receives, peek receives and re-entries. Cap = 1, so a fire that neither
\* spends the element nor keeps its partner re-issues the element at the
\* cap. Every invariant must hold, and so must the inductive invariant
\* HeadIndInv of the Apalache checks.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 1
    Reissues = TRUE
    ScanWaiters = FALSE
    ReissueFreshOrd = FALSE
    ReentryAtHead = FALSE
    NonPersistentFirstOrd = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ShadowedNoPendingMatch
    QuiescentNoPendingMatch
    ReissueKeepsOrd
    IntroducedOnce
    FifoOrder
    LeaveOrder
    HeadBlocks
    HeadIndInv
