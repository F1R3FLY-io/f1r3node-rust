\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, ReentryAtTop=TRUE, PerPhaseCount=FALSE, NoPlanOpenCheck=FALSE
\* Unsafe control: a re-entering element plans at the top whatever the
\* ords. MUST refute exactly LifoOrder. The shortest trace has four rounds:
\* the persistent send of a is stored, the persistent receive of a fires it
\* and re-issues with its first-round ord 1 (a divergent pair), the receive
\* of b parks with ord 2 (the top record a does not fit it), and the receive
\* of a re-enters and fires again although the younger waiter b is parked.
\* The settle after the plan still restores INV, and an element that does
\* not fire is stored or parked below the younger top, so the other
\* invariants hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    ReentryAtTop = TRUE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LifoOrder
    StackNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
