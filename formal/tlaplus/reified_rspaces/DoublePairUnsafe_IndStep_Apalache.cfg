\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2, Budget=3, Forge=TRUE, Peeks=FALSE, Legacy=FALSE
\* Negative control of the Apalache STEP check: verify pairs under every bound
\* key (DoublePair). One replay stage step from an IndInv state MUST break the
\* pairing bound of IndInv (StagedInv, the inductive form of T3). Run with --length=1.
CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    Budget = 3
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = TRUE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = FALSE
    Legacy = FALSE
    LegacyPreAfterObserve = FALSE
    LegacyTailDropped = FALSE
    RetainPeek = FALSE

INIT IndInit
NEXT Next

INVARIANT IndInv
