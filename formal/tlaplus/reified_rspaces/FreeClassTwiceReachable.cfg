\* BOUNDS: Discipline="set", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none"}, Groups=RepeatGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE, PersistentClaimed=FALSE, CascadeCanon=TRUE, PersistentTwice<-FreeClassTwice
\* Reachability witness (decision 103, decision 118, C6 arbitration): a
\* fire binds a non-persistent member and a persistent member of one set
\* class at two binds, so rule (a) does not hold vacuously on a class with
\* a persistent member. The configuration replaces PersistentTwice with
\* FreeClassTwice, so the ghost pOk records such a fire. It is safe and adds
\* the witness NoFreeClassTwice. MUST refute exactly NoFreeClassTwice. The
\* shortest trace: a send of a on c1 and a persistent send of a on c1 are
\* stored, and the join <c1,c1> binds the first record at the first bind
\* and the persistent record at the second bind. This configuration does
\* not check NoPersistentTwice, because that witness reads the same ghost
\* pOk. The bounds are the Set bounds of MC_JoinCascade_Set.cfg with four
\* rounds and the guard none.
SPECIFICATION Spec

CONSTANTS
    Discipline = "set"
    Colls = {"c1"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    Guards = {"none"}
    Groups <- RepeatGroups
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE
    \* Added by decision 103 (decision 118).
    PersistentClaimed = FALSE
    \* Added by decision 102 (plan v4, rule CR-30): the DR-75 windows of the cascade search.
    CascadeCanon = TRUE
    \* Added by decision 103 (decision 118, C6 arbitration): the ghost pOk records a fire that
    \* binds a non-persistent member and a persistent member of one set class.
    PersistentTwice <- FreeClassTwice

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    NonPersistentBoundOnce
    IncomingHeld
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
    \* Added by decision 103 (decision 118, C6 arbitration): the witness.
    NoFreeClassTwice
