\* BOUNDS: Discipline="bag", Vals={"a","b"}, Pats={"a","b","any"}, Guards={"none","onlyB"}, Ids=1..4, MaxOps=4, Cap=2, WildcardFire=TRUE, RetireClass=TRUE, RetireOnProduce=TRUE, CapacityCheck=TRUE, PeekRestore=TRUE, RestoreOwnAuthority=TRUE, RestoreReoffer=TRUE
\* Unsafe control: the legacy WildcardMatch (matches := true, D6). A pattern
\* for a receives b. MUST refute exactly PatternEnforcement: a wildcard fires
\* more, so it leaves no pending match, and every store still meets no
\* admitting waiter.
SPECIFICATION Spec

CONSTANTS
    Discipline = "bag"
    MaxOps = 4
    Cap = 2
    WildcardFire = TRUE
    RetireClass = TRUE
    RetireOnProduce = TRUE
    CapacityCheck = TRUE
    PeekRestore = TRUE
    RestoreOwnAuthority = TRUE
    RestoreReoffer = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPendingMatch
    PatternEnforcement
    Conservation
    NoDoubleSpend
    AtomicReservation
    PeekRestoresRecord
