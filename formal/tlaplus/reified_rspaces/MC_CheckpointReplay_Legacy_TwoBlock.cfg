\* BOUNDS: Chans={"d1"}, Vol={}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=2, Budget=12, Forge=TRUE, Peeks=TRUE, Legacy=TRUE
\* Decision 45 over two blocks in a legacy deploy. Block 2 can peek a
\* record of block 1. The re-store is then the only produce event of the
\* record in the log of block 2, so rig binds the peek COMM under that
\* produce key, and replay removes the binding (design report C.5). The
\* deploy of each block starts with the full limit of 12 and an empty
\* legacy log. One channel and no volatile channel keep the state space
\* small. T1-T4, T6 and U13 must hold, and the inductive invariant IndInv of
\* the Apalache checks holds on every reachable state.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1"}
    Vol = {}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 2
    Budget = 12
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = TRUE
    Legacy = TRUE
    LegacyPreAfterObserve = FALSE
    LegacyTailDropped = FALSE
    RetainPeek = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    LegacyChargesFollowHost
    IndInv
