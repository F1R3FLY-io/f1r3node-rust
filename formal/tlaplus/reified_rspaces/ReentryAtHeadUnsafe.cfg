\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=7, Cap=1, Reissues=TRUE, ScanWaiters=FALSE, ReissueFreshOrd=FALSE, ReentryAtHead=TRUE, NonPersistentFirstOrd=FALSE
\* Unsafe control: a re-entering element that carries an ord fires from the
\* head of its side regardless of the ords, when the other side holds at
\* most one entry. MUST refute exactly FifoOrder: the element fires while
\* an older entry of its side waits. The other entry leaves or stays, so no
\* pair of heads appears and the other invariants hold. Such a fire needs
\* six rounds, so MaxOps = 7 also checks one round after it.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 7
    Cap = 1
    Reissues = TRUE
    ScanWaiters = FALSE
    ReissueFreshOrd = FALSE
    ReentryAtHead = TRUE
    NonPersistentFirstOrd = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ShadowedNoPendingMatch
    QuiescentNoPendingMatch
    ReissueKeepsOrd
    IntroducedOnce
    FifoOrder
    LeaveOrder
    HeadBlocks
