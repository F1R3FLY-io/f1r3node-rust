\* BOUNDS: Scenario="cascade": Jobs={"cs","cs2c","cs2s"}, "cs2c" and "cs2s" are the children of "cs", the parent-first play orders (2 orders), cascadeCase in [capOne: BOOLEAN, persist2: BOOLEAN, waiterOrder: {<<1,2>>, <<2,1>>}] (Init chooses, and play and replay both use the DR-75 waiter order), play choices of "cs": the cap (capOne) or the ending all or stop (12 journals), FootprintKey=TRUE, AnchorRowless=TRUE, AnchorFirst=TRUE, UnknownSourceWaits=TRUE, FollowRecord=TRUE, StaleWaits=TRUE, RecordEnd=TRUE, ReissueAnchorFirst=TRUE, CanonicalRestage=TRUE, RestageAnchorFirst=TRUE, MarkFree=TRUE, ReofferAnchor=TRUE, SeqRestage=TRUE, FollowErrorEnds=TRUE, AnchorOnlyErrorPath=TRUE, AnchorOnlyMissDr75=TRUE, CascadeCanonWindows=TRUE
\* Changed by decision 124 (L2): line 1 drops the entries "CascadeLeastIndex=TRUE" and "CascadeMissStages=TRUE", because the model has neither constant.
\* Changed by decision 124 (L2): Init chooses the waiter order, and play and replay both use it (DR-75).
\* Changed by decision 124 (L2): play and replay fire the waiters in their
\* DR-75 order, which Init chooses, so replay pins no source and makes no
\* probe.
\* Added by decision 102 (plan v4, rule CR-30), changed by decision 124 (L2):
\* the cascade. "cs" fires the parked waiters w1 and w2 of the set collection
\* V in their DR-75 order. Init chooses that order (cascadeCase.waiterOrder),
\* and play and replay both use it. With the cap of one round, the cap job
\* "cs2c" fires the other waiter. Without the cap, "cs" fires both waiters, or
\* round 1 deviates with the Tail Stop and the stop re-issue "cs2s" fires the
\* other waiter. When v2 is persistent, its round re-offers v2 with no lift,
\* and the chain anchor goes first when that round starts a job. Replay fires
\* the first qualifying waiter through its own stage calls. After a followed
\* row, a stage call that finds no successor row answers RecordEnded. NoStall,
\* NoFailClosed, Agreement and ExactRows must hold.
SPECIFICATION Spec

