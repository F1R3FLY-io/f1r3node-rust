\* BOUNDS: Defect="ReplayBookOnMark", Order="random", Op="consume", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=1152 (owners 4 x guards 4 x budgets 9 x TailOf 8)
\* Added by plan v4 errata (V4-17).
\* Unsafe control (plan v4 errata V4-17, base Consume): the defect of
\* SpaceOwnerReplayBookOnMarkUnsafe.cfg on the Consume base (arbiter-v4-17-18-B.md, 1.2). Replay
\* books its refused pairs only on a marked row. The racer refuses the pick of K, K parks, and Tail
\* is Return. Replay parks by E3-a with no deviation, so it has no mark and books nothing. Play
\* books the refused pair.
\* MUST refute exactly TxnPlayReplayAgree.
SPECIFICATION Spec

CONSTANTS
    Defect = "ReplayBookOnMark"
    Order = "random"
    Op = "consume"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = TRUE
    MaxEdits = 1
    Edits = {"DropRefusal", "AddRefusal", "AddItemFailRefusal", "NameOutside", "ForgeStored", "AddRow", "DeniedComm", "CutNoStop"}
    Seq = FALSE
    Racer = TRUE
    Wide = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
