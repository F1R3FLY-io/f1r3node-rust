\* BOUNDS: Defect="UncheckedGuard", Order="ranked", Op="consume", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=FALSE, Wide=FALSE, Init states=2304 (owners 4 x guards 4 x budgets 9 x TailOf 8 x pattern verdict of c1 2)
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Unsafe control (plan v4, M4, base Ranked): replay does not read the guard verdict of the selected
\* candidate (V4-3). A forged match of c2 whose guard refuses is accepted.
\* MUST refute exactly AllowedChoice.
SPECIFICATION Spec

CONSTANTS
    Defect = "UncheckedGuard"
    Order = "ranked"
    Op = "consume"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = TRUE
    MaxEdits = 1
    Edits = {"DropRefusal", "AddRefusal", "AddItemFailRefusal", "NameOutside", "ForgeStored", "AddRow", "DeniedComm", "CutNoStop"}
    Seq = FALSE
    Racer = FALSE
    \* Added by plan v4 errata (V4-18).
    Wide = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
