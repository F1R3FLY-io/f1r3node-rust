\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, ScanWaiters=FALSE
\* Head-only matching of one queue: every schedule of six produces and
\* consumes with every value and pattern. HeadOnlyNoPendingMatch,
\* HeadBlocks and FifoOrder must hold, and so must the inductive invariant
\* HeadIndInv of the Apalache checks.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    ScanWaiters = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    HeadOnlyNoPendingMatch
    HeadBlocks
    FifoOrder
    HeadIndInv
