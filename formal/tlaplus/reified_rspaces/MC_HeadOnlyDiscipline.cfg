\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=1, Reissues=FALSE, ScanWaiters=FALSE, ReissueFreshOrd=FALSE, ReentryAtHead=FALSE, NonPersistentFirstOrd=FALSE
\* Head-only matching of one queue in the P4 fragment (no persistent entry
\* and no peek, so no round re-issues): every schedule of six produces and
\* consumes with every value and pattern. Every invariant must hold, and so
\* must the inductive invariant HeadIndInv of the Apalache checks.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 1
    Reissues = FALSE
    ScanWaiters = FALSE
    ReissueFreshOrd = FALSE
    ReentryAtHead = FALSE
    NonPersistentFirstOrd = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ShadowedNoPendingMatch
    QuiescentNoPendingMatch
    ReissueKeepsOrd
    IntroducedOnce
    FifoOrder
    LeaveOrder
    HeadBlocks
    HeadIndInv
