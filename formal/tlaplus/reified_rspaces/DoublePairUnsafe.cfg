\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=8, Forge=FALSE
\* Unsafe control: verify does not return after the first bound key, so one
\* COMM pairs under its consume key and under its produce key. MUST refute
\* exactly T3 (PairedOnce).
\* The phlo limit of 8 charges is never reached, and no log is forged.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 8
    SpacesInBlockHash = TRUE
    Forge = FALSE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = TRUE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
