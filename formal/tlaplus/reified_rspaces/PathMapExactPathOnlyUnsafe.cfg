\* BOUNDS: Paths=ChainPaths, Pats=AnyPats, Vals={"a","b"}, MaxOps=2, Forks=FALSE, SpaceWideIndex=FALSE, ExactPathOnly=TRUE, NoRetire=FALSE, MarkerNotRestored=FALSE
\* Unsafe: a send meets the waiters of its exact path only, so a waiter on a
\* shorter prefix that fits the datum stays parked next to it. Refutes exactly
\* NoMatchRemains.
SPECIFICATION Spec

CONSTANTS
    Paths <- ChainPaths
    Pats <- AnyPats
    Vals = {"a", "b"}
    MaxOps = 2
    Forks = FALSE
    SpaceWideIndex = FALSE
    ExactPathOnly = TRUE
    NoRetire = FALSE
    MarkerNotRestored = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMatchRemains
    MarkerCount
    MergeDetectsPrefixContact
