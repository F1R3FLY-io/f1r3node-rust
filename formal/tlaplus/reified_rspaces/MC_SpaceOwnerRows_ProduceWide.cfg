\* BOUNDS: Defect="None", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=TRUE, Init states=3456 (owners 4 x guard and may-veto pairs 6 x guard of the other tuple of c1 2 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. The wide waiter c1 may veto, so it has 2 guard and may-veto pairs, and c2 has 3.
\* Added by plan v4 errata (V4-18).
\* Safe configuration (plan v4, M4): random produce with the racing host row H and the wide waiter
\* c1 (Wide). Play picks the guard verdict of c1 on the DR-75 tuple or on the other tuple. Replay
\* skips c1 on a Stored row (G2-a). Both finishes book the item-failed pairs of the row only on
\* Stop (G2-b). The stop path tests c1 by its pairs (S1).
\* Every invariant must hold over the full state space.
SPECIFICATION Spec

CONSTANTS
    Defect = "None"
    Order = "random"
    Op = "produce"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = FALSE
    MaxEdits = 1
    Edits = {}
    Seq = FALSE
    Racer = TRUE
    Wide = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
