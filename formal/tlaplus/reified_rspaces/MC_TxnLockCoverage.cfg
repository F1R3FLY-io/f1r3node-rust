\* BOUNDS: Chans={"a","b"} (stripes 1, 2), Groups={<<"a">>,<<"b">>,<<"a","b">>,<<"a","a">>,<<"b","b">>} (FR-1'), Txns={"t1","t2"}, MaxTxnOps=2, MaxHostOps=2
\* T5 with FR-4: two transactions and two host operations share one hot
\* store. Every staged operation checks lock coverage (CheckCoverage) with
\* the phase-B join channels of a produce (CheckJoinCoverage). TLC explores
\* every interleaving. T5 (Serializable) must hold, and so must the
\* inductive invariant LockIndInv of the Apalache checks and the
\* commit-order witness.
SPECIFICATION Spec

CONSTANTS
    Txns = {"t1", "t2"}
    NumTxns = 2
    MaxTxnOps = 2
    MaxHostOps = 2
    CheckCoverage = TRUE
    CheckJoinCoverage = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    Serializable
    LockIndInv
    CommitOrderWitness
