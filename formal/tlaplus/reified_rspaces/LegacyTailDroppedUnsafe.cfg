\* Retired by decision 90. DR-134 of feature/cost-accounted-rho deletes the legacy meter,
\* so CheckpointReplay.tla has no Legacy mode (Option P of decision 45).
\* Restore this configuration with git show 6bf10a721:formal/tlaplus/reified_rspaces/LegacyTailDroppedUnsafe.cfg.
\* Restore the model with git show 6bf10a721:formal/tlaplus/reified_rspaces/CheckpointReplay.tla.
\*
\* \* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=12, Forge=TRUE, Peeks=TRUE, Legacy=TRUE
\* \* Unsafe control: no tail after the commit (no LegacyChain::finish), so
\* \* the post-charges of the last operation of each transaction are never
\* \* made. Play and replay drop the same charges, so T1-T6 hold. MUST refute
\* \* exactly U13 (LegacyChargesFollowHost). The constants are those of
\* \* MC_CheckpointReplay_Legacy.cfg.
\* SPECIFICATION Spec
\* 
\* CONSTANTS
\*     Chans = {"d1", "v1"}
\*     Vol = {"v1"}
\*     Vals = {"a"}
\*     Konts = {"k"}
\*     MaxTxnOps = 2
\*     MaxTxns = 2
\*     Blocks = 1
\*     Budget = 12
\*     SpacesInBlockHash = TRUE
\*     Forge = TRUE
\*     UseUuid = FALSE
\*     RootIgnoresVolatile = FALSE
\*     DoublePair = FALSE
\*     JoinResidue = FALSE
\*     StagingDivergence = FALSE
\*     AcceptUnpaired = FALSE
\*     Peeks = TRUE
\*     Legacy = TRUE
\*     LegacyPreAfterObserve = FALSE
\*     LegacyTailDropped = TRUE
\*     RetainPeek = FALSE
\* 
\* CHECK_DEADLOCK FALSE
\* 
\* INVARIANTS
\*     TypeOK
\*     ReplayPrefixEqual
\*     SameRootIffSameState
\*     PairedOnce
\*     NoVolatileResidue
\*     ReplayOutcomeEqual
\*     LegacyChargesFollowHost
