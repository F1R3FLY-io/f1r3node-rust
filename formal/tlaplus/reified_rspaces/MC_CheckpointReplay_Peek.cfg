\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=4, Forge=TRUE, Peeks=TRUE
\* Decision 45, Rule E, in a token deploy: a peek fire removes the record,
\* and the re-store puts the same record back with its identity. The
\* re-store is a HostStep of its own, and it pays its introduction (the
\* charges of decision 36). With the phlo limit of 4 charges, a deploy can
\* run out of phlo between a peek fire and its re-store, in play and in
\* replay. The proposer may omit the COMM of its last fire (Forge). T1-T4
\* and T6 must hold, and the inductive invariant IndInv of the Apalache
\* checks holds on every reachable state.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 4
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = TRUE
    \* Changed by decision 90: CheckpointReplay.tla has no Legacy mode.
    \* Legacy = FALSE
    \* LegacyPreAfterObserve = FALSE
    \* LegacyTailDropped = FALSE
    \* RetainPeek = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    IndInv
