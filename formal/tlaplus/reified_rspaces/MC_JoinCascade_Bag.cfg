\* BOUNDS: Discipline="bag", Colls={"c1", "c2"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none", "onlyB"}, Groups=MixedGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE, PersistentClaimed=FALSE, CascadeCanon=TRUE
\* The bag with its join engine: every schedule of four rounds over the
\* groups <c2>, <c1,c2> and <c1,c1>, with the guards none and onlyB (a
\* guard refusal moves OFFER to the next candidate), every payload, pattern,
\* persistence and peek. The head conjuncts are vacuous for a bag.
\* Every invariant must hold. Each round is one space transaction: a fresh
\* send or receive, the re-entry of a re-issued operation, or a settle job.
\* Cap = 2, so a transaction can stop at the cap and commit a settle job.
SPECIFICATION Spec

CONSTANTS
    Discipline = "bag"
    Colls = {"c1", "c2"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    Guards = {"none", "onlyB"}
    Groups <- MixedGroups
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE
    \* Added by decision 103 (decision 118).
    PersistentClaimed = FALSE
    \* Added by decision 102 (plan v4, rule CR-30): the DR-75 windows of the cascade search.
    CascadeCanon = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    \* Changed by decision 103 (decision 118): restated as NonPersistentBoundOnce.
    \* DistinctRecordsPerBind
    NonPersistentBoundOnce
    \* Changed by decision 103 (decision 118): restated as IncomingHeld.
    \* IncomingBoundOnce
    IncomingHeld
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
