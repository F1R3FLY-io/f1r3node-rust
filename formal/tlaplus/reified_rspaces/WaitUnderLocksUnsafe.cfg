\* BOUNDS: Intents=1..5, RowIds=1..7, Chans={"a1","a2","b1","x","h"}, Stripes=1..3, NativeKey=FALSE, Forge=TRUE, NoSpaceKeyUnsafe=FALSE, WaitUnderLocksUnsafe=TRUE, NoInvalidateUnsafe=FALSE
\* Unsafe control: a space transaction waits for the readiness of its row while
\* it holds its stripes. A forged predecessor on a host row of another group
\* whose channel shares a stripe then forms a wait cycle. MUST refute exactly
\* NoDeadlock.
SPECIFICATION ScheduleSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 1
    MaxBudget = 0
    Tamper = FALSE
    TamperedOutcomeUnsafe = FALSE
    NativeKey = FALSE
    Forge = TRUE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = TRUE
    NoInvalidateUnsafe = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    ScheduleTypeOK
    NoBlockedReadiness
    NoDeadlock
