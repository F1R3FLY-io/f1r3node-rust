\* BOUNDS: Chans={"x","y"}, SeqNames={"nx","ny"}, MaxDepth=2, MaxSteps=5, AtomicGuard=FALSE, ScanEnabled=TRUE, NativeOnlySeq=TRUE, UseRestores=TRUE
\* Unsafe control: two jobs of one space check one claim before either
\* commits, so two concurrent uses of x are both admitted. MUST refute
\* exactly SeqExclusive.
SPECIFICATION Spec

CONSTANTS
    AtomicGuard = FALSE
    ScanEnabled = TRUE
    NativeOnlySeq = TRUE
    UseRestores = TRUE
    MaxDepth = 2
    MaxSteps = 5

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SeqExclusive
    ClaimTracksLastUse
    SeqNotSent
    QualifierSupport
    UseBalance
