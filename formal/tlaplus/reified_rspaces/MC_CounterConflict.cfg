\* BOUNDS: Qs={"q1","q2"}, Vals={"x","y"}, pre-state queues {unopened, [x], [y]}, 1..2 ops per branch from {enq(q,v), deq(q), peek(q)}, WriteCounters=TRUE, ReadCounters=TRUE
\* M-1 with A2: every queue operation bumps a counter. TLC checks every
\* pair of branches over every pre-state. NoMergedOrderFabrication must
\* hold, and so must the race facts SharedQueueRaces and FirstOpsRace.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = TRUE
    ReadCounters = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMergedOrderFabrication
    SharedQueueRaces
    FirstOpsRace
