\* BOUNDS: Vals={"img", "doc"}, Modes={"single", "list"}, Queries={"all"}, SinglePats={"any"}, ListPats={"pair"}, Ks={2}, Peeks=BOOLEAN, RecvPers=BOOLEAN, SendPers=BOOLEAN, MaxOps=4, MaxRounds=8, Cap=1, every Unsafe flag FALSE
\* Persistent receives and sends at Cap = 1: divergent pairs, re-issued
\* operations, and settle jobs that carry a resume operation and a stack of
\* pending second sends. Every invariant must hold. (A reachability check of
\* step 8c reaches each of these states within four steps.)
SPECIFICATION Spec

CONSTANTS
    Vals = {"img", "doc"}
    Modes = {"single", "list"}
    Queries = {"all"}
    SinglePats = {"any"}
    ListPats = {"pair"}
    Ks = {2}
    Peeks = {FALSE, TRUE}
    RecvPers = {FALSE, TRUE}
    SendPers = {FALSE, TRUE}
    MaxOps = 4
    MaxRounds = 8
    Cap = 1
    NoCascade = FALSE
    ParkOnlyWhileEmpty = FALSE
    NoRetire = FALSE
    DropOwed = FALSE
    UncountedCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    ListAtomic
    PeekConservation
    CascadeTerminates
