\* BOUNDS: Discipline="queue", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none"}, Groups=RepeatGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=TRUE, NoSetCascade=FALSE
\* Unsafe control: a receive can peek and persist. MUST refute exactly
\* CascadeMeasureDecreases. The shortest trace: a persistent peek receive
\* parks on c1, and a send on c1 fires it. The drain sends the record again,
\* the same receive fires again and sends it once more, so mu does not
\* decrease.
SPECIFICATION Spec

CONSTANTS
    Discipline = "queue"
    Colls = {"c1"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    Guards = {"none"}
    Groups <- RepeatGroups
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = TRUE
    NoSetCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    DistinctRecordsPerBind
    IncomingBoundOnce
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
