\* BOUNDS: Discipline="stack", Colls={"c1", "c2"}, Vals={"a", "b"}, Pats={"any"}, Guards={"none", "onlyB"}, Groups=AllGroups, MaxOps=4, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE
\* The stack with its join engine: every schedule of four rounds over the
\* four groups, with the guards none and onlyB (a guard refusal at the head
\* blocks the head), every payload, persistence and peek.
\* Every invariant must hold. Each round is one space transaction: a fresh
\* send or receive, the re-entry of a re-issued operation, or a settle job.
\* Cap = 2, so a transaction can stop at the cap and commit a settle job.
SPECIFICATION Spec

CONSTANTS
    Discipline = "stack"
    Colls = {"c1", "c2"}
    Vals = {"a", "b"}
    Pats = {"any"}
    Guards = {"none", "onlyB"}
    Groups <- AllGroups
    MaxOps = 4
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    DistinctRecordsPerBind
    IncomingBoundOnce
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
