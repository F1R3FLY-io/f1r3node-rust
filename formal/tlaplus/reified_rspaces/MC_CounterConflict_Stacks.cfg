\* BOUNDS: Qs={"q1","q2"} as stacks (Lifo <- LifoOn), Vals={"x","y"}, pre-state stacks {unopened, [x], [y]}, 1..2 ops per branch from {push(q,v), pop(q), peek(q)}, WriteCounters=TRUE, ReadCounters=TRUE, RemovalCounters=WriteCounters (TRUE), Allocations=FALSE, EagerAllocator=TRUE
\* P5b (the crossed stacks of the M-1 arbitration): the collections are
\* stacks. A push appends, and a pop and a peek meet the youngest record.
\* Every operation bumps a counter, the pops included. TLC checks every pair
\* of branches over every pre-state. NoMergedOrderFabrication must hold, and
\* so must the race facts SharedQueueRaces and FirstOpsRace.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = TRUE
    ReadCounters = TRUE
    Allocations = FALSE
    EagerAllocator = TRUE
    Lifo <- LifoOn

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMergedOrderFabrication
    SharedQueueRaces
    FirstOpsRace
