\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=12, Forge=TRUE, Peeks=TRUE, Legacy=TRUE
\* Unsafe control: the pre-charge of a fire follows its observer calls
\* instead of the callback before_observe. Play makes the same charges in
\* the same order, so play and its host program agree (U13). In replay, a
\* fire that play left unpaired, because play ran out of phlo at its
\* pre-charge, reaches the pairing check before that pre-charge and stops
\* with ReplayDivergence, so the validator rejects an honest block. MUST
\* refute exactly T6 (ReplayOutcomeEqual). The constants are those of
\* MC_CheckpointReplay_Legacy.cfg.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 12
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = TRUE
    Legacy = TRUE
    LegacyPreAfterObserve = TRUE
    LegacyTailDropped = FALSE
    RetainPeek = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    LegacyChargesFollowHost
