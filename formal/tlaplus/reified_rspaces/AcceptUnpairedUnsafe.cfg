\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=8, Forge=TRUE
\* Unsafe control: an unpaired replay fire commits as if it paired. When the
\* proposer omits the COMM of its last fire, the validator commits and logs
\* that fire, so its log is no longer a prefix of the published log. MUST
\* refute exactly T1 (ReplayPrefixEqual).
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 8
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
