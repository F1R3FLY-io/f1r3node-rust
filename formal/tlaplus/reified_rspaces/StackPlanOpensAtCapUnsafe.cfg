\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, ReentryAtTop=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=TRUE
\* Unsafe control: open_plan has no cap check, so a plan opens after a
\* settle before the plan that ended at the cap (revision I-21). MUST
\* refute exactly TxnFiresBounded. The shortest trace has six rounds. A
\* persistent receive of any value parks, a receive of a parks on top of
\* it, and two sends of b are stored. A persistent send of a fires the
\* waiter a and then meets the persistent waiter, a divergent pair. So it
\* re-issues with no settle after the plan. The two records b now face the
\* persistent waiter. The settle before the plan of the next send of a
\* fires both of them and ends at the cap (Cap = 2 fires). The plan then
\* opens, and the send of a fires the persistent waiter: a third fire in
\* one round. The settles still stop at the cap, so the other invariants
\* hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    ReentryAtTop = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LifoOrder
    StackNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
