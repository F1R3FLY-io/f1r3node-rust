\* BOUNDS: Defect="None", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=FALSE, Wide=FALSE, Init states=2592 (owners 4 x guard and may-veto pairs 9 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. So each candidate has 3 guard and may-veto pairs.
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Safe configuration (plan v4, M4): random produce with the adversary and every edit kind.
\* Every invariant must hold over the full state space.
SPECIFICATION Spec

CONSTANTS
    Defect = "None"
    Order = "random"
    Op = "produce"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = TRUE
    MaxEdits = 1
    Edits = {"DropRefusal", "AddRefusal", "AddItemFailRefusal", "NameOutside", "ForgeStored", "AddRow", "DeniedComm", "CutNoStop"}
    Seq = FALSE
    Racer = FALSE
    \* Added by plan v4 errata (V4-18).
    Wide = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
