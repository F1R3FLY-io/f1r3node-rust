\* BOUNDS: Qs={"q1","q2"} as stacks (Lifo <- LifoOn), Vals={"x","y"}, pre-state stacks {unopened, [x], [y]}, 1..2 ops per branch from {push(q,v), pop(q), peek(q)}, WriteCounters=TRUE, ReadCounters=TRUE, RemovalCounters=FALSE (RemovalCounters <- RemovalCountersOff), Allocations=FALSE, EagerAllocator=TRUE
