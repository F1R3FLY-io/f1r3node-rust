\* BOUNDS: Vals={"a","b"}, Pats={"a","b","any"}, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, ReentryAtTop=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=FALSE
\* The stack with its settle: every schedule of six rounds with every
\* value, pattern, persistence and peek, with the re-entries of re-issued
\* operations and the re-issued settle jobs. Cap = 2, so the cap of a round
\* is reachable. One count of fires runs through the settle before the
\* plan, the plan and the settle after it (revision I-21). Every invariant
\* must hold.
SPECIFICATION Spec

CONSTANTS
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    ReentryAtTop = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LifoOrder
    StackNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
