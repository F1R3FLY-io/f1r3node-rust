\* BOUNDS: Vals={"img", "doc"}, Modes={"single", "list"}, Queries={"all"}, SinglePats={"img"}, ListPats={"pair", "docpair"}, Ks={2}, Peeks=BOOLEAN, RecvPers={FALSE}, SendPers=BOOLEAN, MaxOps=5, MaxRounds=8, Cap=2, ParkOnlyWhileEmpty=TRUE
\* Unsafe control: LM-a. A list waiter parks only while no record is
\* eligible, a refused non-empty list fails, and an offer fires a list
\* waiter only on the list of the offered element alone. MUST refute exactly
\* QuiescentNoPendingMatch (CE-1): a list waiter pair parks on an empty
\* collection, a first record is stored, and a second record makes a list
\* of two, which the offer cannot fire.
SPECIFICATION Spec

CONSTANTS
    Vals = {"img", "doc"}
    Modes = {"single", "list"}
    Queries = {"all"}
    SinglePats = {"img"}
    ListPats = {"pair", "docpair"}
    Ks = {2}
    Peeks = {FALSE, TRUE}
    RecvPers = {FALSE}
    SendPers = {FALSE, TRUE}
    MaxOps = 5
    MaxRounds = 8
    Cap = 2
    NoCascade = FALSE
    ParkOnlyWhileEmpty = TRUE
    NoRetire = FALSE
    DropOwed = FALSE
    UncountedCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    ListAtomic
    PeekConservation
    CascadeTerminates
