\* BOUNDS: Chans={"a","b"} (stripes 1, 2), Groups={<<"a">>,<<"b">>,<<"a","b">>,<<"a","a">>,<<"b","b">>} (FR-1'), Txns={"t1","t2"}, MaxTxnOps=2, MaxHostOps=2
\* Apalache inductive check of T5 through LockIndInv. STEP: every successor
\* of a LockIndInv state satisfies LockIndInv (run with --length=1).
CONSTANTS
    Txns = {"t1", "t2"}
    NumTxns = 2
    MaxTxnOps = 2
    MaxHostOps = 2
    CheckCoverage = TRUE
    CheckJoinCoverage = TRUE

INIT IndInit
NEXT Next

INVARIANT LockIndInv
