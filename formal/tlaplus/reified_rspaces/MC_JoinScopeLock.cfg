\* BOUNDS: Procs={"t1","t2","h"}, Colls={"D1","D2","D3"}, Chans={"Cfg","D1","D2","D3","h1","h2"}, every stripe map [Chans -> 1..3] (729 maps), links at start {{"D1","D2"}}, Escalation="TwoPhase", ConfigInPhaseA=TRUE, CoverageByPhaseB=TRUE
\* Decision 94: phase A on the own keys with C(sid), the scope read under
\* phase A, then phase B on the own keys and the scope keys in one sorted
\* call, with coverage by the exact phase B keys. NoStaleScope,
\* NoFalseRefusal, NoDeadlock, CanStepIsEnabled and MutualExclusion must
