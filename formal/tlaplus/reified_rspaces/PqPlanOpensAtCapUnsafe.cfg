\* BOUNDS: Vals={"a", "b"}, Pats={"a", "any"}, PrioLevels={0}, SendLevels=AllLevels, ReceiveLanes=AnyOnly, MaxOps=6, Cap=2, Reissues=TRUE, NoSettle=FALSE, AnyOrder=FALSE, ReentryAtHead=FALSE, PerPhaseCount=FALSE, NoPlanOpenCheck=TRUE
\* Unsafe control: open_plan has no cap check, so a plan opens after a settle
\* before the plan that ended at the cap (revision I-21). MUST refute exactly
\* TxnFiresBounded. The narrow universe allows the six rounds of the shortest
\* trace.
SPECIFICATION Spec

CONSTANTS
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    PrioLevels = {0}
    SendLevels <- AllLevels
    ReceiveLanes <- AnyOnly
    MaxOps = 6
    Cap = 2
    Reissues = TRUE
    NoSettle = FALSE
    AnyOrder = FALSE
    ReentryAtHead = FALSE
    PerPhaseCount = FALSE
    NoPlanOpenCheck = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    PqLevelOrder
    PqOldestFirst
    PqNoPendingMatch
    NoRecordLost
    ReissueKeepsOrd
    TxnFiresBounded
