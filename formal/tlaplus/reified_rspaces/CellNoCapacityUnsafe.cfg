\* BOUNDS: Discipline="cell", Vals={"a","b"}, Pats={"a","b","any"}, Guards={"none","onlyB"}, Ids=1..4, MaxOps=4, Cap=2, WildcardFire=FALSE, RetireClass=TRUE, RetireOnProduce=TRUE, CapacityCheck=FALSE, PeekRestore=TRUE, RestoreOwnAuthority=TRUE, RestoreReoffer=TRUE
\* Unsafe control: the cell without its capacity check (F15). MUST refute
\* exactly CellCapacity. Without the capacity, the head driver also leaves a
\* match behind the head (a second record that a parked waiter without a
\* guard matches, or that a parked guarded waiter admits when a peek stores
\* it again), so this configuration does not check NoPendingMatch and
\* PeekRestoresRecord, as NonPersistentFirstOrdUnsafe does not check
\* LeaveOrder.
SPECIFICATION Spec

CONSTANTS
    Discipline = "cell"
    MaxOps = 4
    Cap = 2
    WildcardFire = FALSE
    RetireClass = TRUE
    RetireOnProduce = TRUE
    CapacityCheck = FALSE
    PeekRestore = TRUE
    RestoreOwnAuthority = TRUE
    RestoreReoffer = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    PatternEnforcement
    Conservation
    NoDoubleSpend
    AtomicReservation
    CellCapacity
