    Vals = {"img", "doc"}
    Modes = {"single", "list"}
    Queries = {"all"}
    SinglePats = {"img"}
    ListPats = {"pair", "docpair"}
    Ks = {2}
    Peeks = {FALSE, TRUE}
    RecvPers = {FALSE}
    SendPers = {FALSE, TRUE}
    MaxOps = 5
    MaxRounds = 8
    Cap = 2
    NoCascade = FALSE
    ParkOnlyWhileEmpty = FALSE
    NoRetire = TRUE
    DropOwed = FALSE
    UncountedCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    ListAtomic
    PeekConservation
    CascadeTerminates
