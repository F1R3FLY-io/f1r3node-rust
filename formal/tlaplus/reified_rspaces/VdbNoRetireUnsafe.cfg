\* BOUNDS: Vals={"img", "doc"}, Modes={"single", "list"}, Queries={"all"}, SinglePats={"img"}, ListPats={"pair", "docpair"}, Ks={2}, Peeks=BOOLEAN, RecvPers={FALSE}, SendPers=BOOLEAN, MaxOps=5, MaxRounds=8, Cap=2, NoRetire=TRUE
\* Unsafe control: a list fire without a peek retires no other member.
\* Changed by decision 101: the flag also drops the K_retire of a list
\* receive. MUST refute exactly ListAtomic: a list fire leaves another
\* member of its list stored. The shortest trace sends img twice. A list
\* receive of pair without a peek then binds [img, img], spends the first
\* record and leaves the second record stored.
SPECIFICATION Spec

CONSTANTS
    Vals = {"img", "doc"}
    Modes = {"single", "list"}
    Queries = {"all"}
    SinglePats = {"img"}
    ListPats = {"pair", "docpair"}
    Ks = {2}
    Peeks = {FALSE, TRUE}
    RecvPers = {FALSE}
    SendPers = {FALSE, TRUE}
    MaxOps = 5
    MaxRounds = 8
    Cap = 2
    NoCascade = FALSE
    ParkOnlyWhileEmpty = FALSE
    NoRetire = TRUE
    DropOwed = FALSE
    UncountedCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    ListAtomic
    PeekConservation
    CascadeTerminates
