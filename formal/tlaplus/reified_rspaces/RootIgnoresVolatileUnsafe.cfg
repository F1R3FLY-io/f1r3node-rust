\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1
\* Unsafe control: no volatile sweep, and the root skips the volatile
\* channels. Two checkpoints share a root but differ in volatile state. MUST
\* refute exactly T2 (SameRootIffSameState).
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    SpacesInBlockHash = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = TRUE
    DoublePair = FALSE
    JoinResidue = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
