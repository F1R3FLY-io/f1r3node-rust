\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=8, Forge=FALSE, Peeks=FALSE
\* Unsafe control: no volatile sweep, and the root skips the volatile
\* channels. Two checkpoints share a root but differ in volatile state. MUST
\* refute exactly T2 (SameRootIffSameState).
\* The phlo limit of 8 charges is never reached, and no log is forged.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 8
    SpacesInBlockHash = TRUE
    Forge = FALSE
    UseUuid = FALSE
    RootIgnoresVolatile = TRUE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = FALSE
    \* Changed by decision 90: CheckpointReplay.tla has no Legacy mode.
    \* Legacy = FALSE
    \* LegacyPreAfterObserve = FALSE
    \* LegacyTailDropped = FALSE
    \* RetainPeek = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
