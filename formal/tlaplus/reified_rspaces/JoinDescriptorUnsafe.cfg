\* BOUNDS: Rands={"r1","r2"}, Sids={"s1","s2","s3"} (s3 fabricated), Colls={"k1","k2"}, MaxSteps=5, SingleChannelHandle=FALSE
\* Unsafe control: the handle continuation joins H(sid) with a descriptor
\* channel, so the pre-state join of H is [[H, Desc]]. Every produce on H
\* touches a join of length 2, and check #3 reports a conflict for two
\* calls on disjoint collections. MUST refute exactly
\* HandleCallsMergeLikeContracts.
SPECIFICATION Spec

CONSTANTS
    SingleChannelHandle = FALSE
    MaxSteps = 5

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    HandleUnique
    DanglingIsDeterministicError
    DurableSurvivesRestart
    HandleCallsMergeLikeContracts
