\* BOUNDS: Defect="MarkedFinish", Order="random", Op="produce", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=FALSE, MaxEdits=1, Edits={}, Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=2592 (owners 4 x guard and may-veto pairs 9 x budgets 9 x TailOf 8)
\* Changed by decision 124 (L3, X7): Init also chooses w.mayVeto, and a candidate whose commit cannot veto has guard TRUE. So each candidate has 3 guard and may-veto pairs.
\* Added by plan v4 errata (V4-18): Wide = FALSE, so no continuation has two binds. The
\* BOUNDS line before the errata had no Wide entry.
\* Unsafe control (plan v4, M4, base ProduceRacer): play and replay stop after every marked receipt.
\* Named first leaves the replay of a refused pick unmarked, so replay meets
\* a re-issue that its finish does not create.
\* MUST refute exactly TxnPlayReplayAgree.
SPECIFICATION Spec

