\* BOUNDS: Paths=ChainPaths, Pats=AnyPats, Vals={"a","b"}, MaxOps=4, Forks=FALSE, SpaceWideIndex=FALSE, ExactPathOnly=FALSE, NoRetire=FALSE, MarkerNotRestored=FALSE
\* The second send of a peek (decision 45): every base state of four sends and
\* receives on a chain of paths with every value, guard and peek. A guarded
\* waiter that parked on another datum takes the second send of a peeked datum,
\* so the second send spends the datum. Every invariant must hold.
SPECIFICATION Spec

CONSTANTS
    Paths <- ChainPaths
    Pats <- AnyPats
    Vals = {"a", "b"}
    MaxOps = 4
    Forks = FALSE
    SpaceWideIndex = FALSE
    ExactPathOnly = FALSE
    NoRetire = FALSE
    MarkerNotRestored = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMatchRemains
    MarkerCount
    MergeDetectsPrefixContact
