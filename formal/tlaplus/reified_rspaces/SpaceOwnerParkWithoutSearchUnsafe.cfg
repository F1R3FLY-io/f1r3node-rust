\* BOUNDS: Defect="ParkWithoutSearch", Order="random", Op="consume", ClassMode=FALSE, MaxBalance=2, MaxChain=3, Adversary=TRUE, MaxEdits=1, Edits=EditKinds (all 8 kinds), Seq=FALSE, Racer=TRUE, Wide=FALSE, Init states=1152 (owners 4 x guards 4 x budgets 9 x TailOf 8)
\* Added by plan v4 errata (V4-17).
\* Unsafe control (plan v4 errata V4-17 (iv), base Consume): a park that E3-a produced in replay has
\* no row search, so replay cannot verify a recorded refusal. The racer refuses the pick of K, and K
\* parks. Replay parks by E3-a and fails the refusal of the honest record.
\* MUST refute exactly TxnPlayReplayAgree.
SPECIFICATION Spec

CONSTANTS
    Defect = "ParkWithoutSearch"
    Order = "random"
    Op = "consume"
    ClassMode = FALSE
    MaxBalance = 2
    MaxChain = 3
    Adversary = TRUE
    MaxEdits = 1
    Edits = {"DropRefusal", "AddRefusal", "AddItemFailRefusal", "NameOutside", "ForgeStored", "AddRow", "DeniedComm", "CutNoStop"}
    Seq = FALSE
    Racer = TRUE
    Wide = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LedgerIsFold
    TxnPlayReplayAgree
    TxnStoredClaimIsHonest
    TxnRefusalNeedsShortfall
    AllowedChoice
    StopIsHonest
    ContinueIsHonest
    HostParity
    RefusedPairNotRefired
    ItemFailedPairNotRefired
    OneCounter
    NoLostRecord
    RefusedTupleKeepsMembers
    SpentClassRetired
    SeqClaimsAgree
