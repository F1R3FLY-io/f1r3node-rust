\* BOUNDS: Discipline="set", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none"}, Groups=RepeatGroups, MaxOps=5, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE
\* The set with its join engine and its cascade (decision 50): every
\* schedule of five rounds over the groups <c1> and <c1,c1>, with every
\* payload, pattern, persistence and peek. Five rounds reach the class move
\* of finding F-JF-1: three records, a parked join and a receive. The head
\* conjuncts are vacuous for a set.
\* Every invariant must hold. Each round is one space transaction: a fresh
\* send or receive, the re-entry of a re-issued operation, or a settle job.
\* Cap = 2, so a transaction can stop at the cap and commit a settle job.
SPECIFICATION Spec

CONSTANTS
    Discipline = "set"
    Colls = {"c1"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    Guards = {"none"}
    Groups <- RepeatGroups
    MaxOps = 5
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    DistinctRecordsPerBind
    IncomingBoundOnce
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
