\* BOUNDS: Discipline="set", Colls={"c1"}, Vals={"a", "b"}, Pats={"a", "any"}, Guards={"none", "onlyB"}, Groups=RepeatGroups, MaxOps=5, Cap=2, Reissues=TRUE, NoCascade=FALSE, PlainRestore=FALSE, IgnoreClaims=FALSE, IncomingTwice=FALSE, HeadOnIncomingOnly=FALSE, PerPhaseCount=FALSE, DropRestore=FALSE, FreshOrds=FALSE, LazyTouch=FALSE, PeekPersist=FALSE, NoSetCascade=FALSE, PersistentClaimed=FALSE, CascadeCanon=TRUE
\* The set with its join engine and its cascade (decision 50): every
\* schedule of five rounds over the groups <c1> and <c1,c1>, with every
\* payload, pattern, persistence and peek, and the guards none and onlyB
\* (changed by decision 102: a pick that its guard refuses parks the
\* receive, and the cascade tries the waiter again). Five rounds cover
\* three records, a parked join and a receive.
\* Changed by decision 103 (decision 118, C6 arbitration): rule (a) binds
\* the first member of the class and then its persistent member, so the
\* join binds two records.
\* Changed by decision 103 (decision 118): the join of finding F-JF-1 has
\* the patterns any and a over a1, b and the persistent a2. Now the first a
\* claims its class at the first bind, and the persistent a is never
\* blocked, so that join binds both at once and never parks. The old text
\* said that five rounds reach the class move of that finding.
\* The head conjuncts are vacuous for a set.
\* Every invariant must hold. Each round is one space transaction: a fresh
\* send or receive, the re-entry of a re-issued operation, or a settle job.
\* Cap = 2, so a transaction can stop at the cap and commit a settle job.
SPECIFICATION Spec

CONSTANTS
    Discipline = "set"
    Colls = {"c1"}
    Vals = {"a", "b"}
    Pats = {"a", "any"}
    \* Changed by decision 102: a guard refusal of a pick parks a receive.
    \* Guards = {"none"}
    Guards = {"none", "onlyB"}
    Groups <- RepeatGroups
    MaxOps = 5
    Cap = 2
    Reissues = TRUE
    NoCascade = FALSE
    PlainRestore = FALSE
    IgnoreClaims = FALSE
    IncomingTwice = FALSE
    HeadOnIncomingOnly = FALSE
    PerPhaseCount = FALSE
    DropRestore = FALSE
    FreshOrds = FALSE
    LazyTouch = FALSE
    PeekPersist = FALSE
    NoSetCascade = FALSE
    \* Added by decision 103 (decision 118).
    PersistentClaimed = FALSE
    \* Added by decision 102 (plan v4, rule CR-30): the DR-75 windows of the cascade search.
    CascadeCanon = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    QuiescentNoPendingMatch
    JoinFiresHeadsOnly
    \* Changed by decision 103 (decision 118): restated as NonPersistentBoundOnce.
    \* DistinctRecordsPerBind
    NonPersistentBoundOnce
    \* Changed by decision 103 (decision 118): restated as IncomingHeld.
    \* IncomingBoundOnce
    IncomingHeld
    CascadeMeasureDecreases
    TxnFiresBounded
    NoRecordLost
    ReissueKeepsBindOrds
    TouchedCountersBumped
