\* BOUNDS: Qs={"q1","q2"}, Vals={"x","y"}, pre-state queues {unopened, [x], [y]}, 1..2 ops per branch from {enq(q,v), deq(q), peek(q)}, WriteCounters=TRUE, ReadCounters=FALSE
\* Unsafe control: a peek does not bump the counter (the design before
\* A2). Branch A peeks q1 and dequeues q2, branch B peeks q2 and dequeues
\* q1: check #1 sees no race, and no serial order gives both peeks (the
\* write skew of P4 design D.2). MUST refute exactly
\* NoMergedOrderFabrication.
SPECIFICATION Spec

CONSTANTS
    WriteCounters = TRUE
    ReadCounters = FALSE
    Allocations = FALSE
    EagerAllocator = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMergedOrderFabrication
