\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=12, Forge=TRUE, Peeks=TRUE, Legacy=TRUE
\* Unsafe control: a peek fire keeps its record and has no re-store
\* (FR-10, the retention before decision 45). The receipt reports the
\* record as persistent, so its refund is a logged zero, and the
\* pre-charge and the event fee of the re-store are missing. Thus the
\* space charges E(1) less than the host program for each peek. Play and
\* replay retain alike, so T1-T6 hold. MUST refute exactly U13
\* (LegacyChargesFollowHost). The constants are those of
\* MC_CheckpointReplay_Legacy.cfg.
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 12
    SpacesInBlockHash = TRUE
    Forge = TRUE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = FALSE
    AcceptUnpaired = FALSE
    Peeks = TRUE
    Legacy = TRUE
    LegacyPreAfterObserve = FALSE
    LegacyTailDropped = FALSE
    RetainPeek = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
    LegacyChargesFollowHost
