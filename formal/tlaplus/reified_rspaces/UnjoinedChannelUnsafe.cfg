\* BOUNDS: Chans={"a","b"} (stripes 1, 2), Groups={<<"a">>,<<"b">>,<<"a","b">>,<<"a","a">>,<<"b","b">>} (FR-1'), Txns={"t1","t2"}, MaxTxnOps=2, MaxHostOps=2
\* Unsafe control: a produce checks the stripe of its own channel but not
\* the phase-B stripes of its join channels. Two transactions on disjoint
\* stripes then each store one half of a waiting join. MUST refute exactly
\* T5 (Serializable).
SPECIFICATION Spec

CONSTANTS
    Txns = {"t1", "t2"}
    NumTxns = 2
    MaxTxnOps = 2
    MaxHostOps = 2
    CheckCoverage = TRUE
    CheckJoinCoverage = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    Serializable
