\* BOUNDS: Rands={"r1","r2"}, Sids={"s1","s2","s3"} (s3 fabricated), Colls={"k1","k2"}, MaxSteps=5, SingleChannelHandle=TRUE
\* Native spaces and handle calls: every run of five creations, handle
\* calls and restarts. HandleUnique, DanglingIsDeterministicError,
\* DurableSurvivesRestart and HandleCallsMergeLikeContracts must hold, and
\* so must the inductive invariant HandleIndInv of the Apalache checks.
SPECIFICATION Spec

CONSTANTS
    SingleChannelHandle = TRUE
    MaxSteps = 5

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    HandleUnique
    DanglingIsDeterministicError
    DurableSurvivesRestart
    HandleCallsMergeLikeContracts
    HandleIndInv
