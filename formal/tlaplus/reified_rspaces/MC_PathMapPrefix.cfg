\* BOUNDS: Paths=TwoLevelPaths, Pats=AllPats, Vals={"a","b"}, MaxOps=3, Forks=FALSE, SpaceWideIndex=FALSE, ExactPathOnly=FALSE, NoRetire=FALSE, MarkerNotRestored=FALSE
\* The PathMap delivery of a bag: every base state of three sends and receives
\* on the root, a path of one element, its extension and a sibling, with every
\* value, pattern, guard and peek. Every invariant must hold.
SPECIFICATION Spec

