    Paths <- TwoLevelPaths
    Pats <- AllPats
    Vals = {"a", "b"}
    MaxOps = 3
    Forks = FALSE
    SpaceWideIndex = FALSE
    ExactPathOnly = FALSE
    NoRetire = FALSE
    MarkerNotRestored = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
