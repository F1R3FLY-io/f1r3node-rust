\* BOUNDS: Chans={"d1","v1"}, Vol={"v1"}, Vals={"a"}, Konts={"k"}, MaxTxnOps=2, MaxTxns=2, Blocks=1, Budget=3, Forge=FALSE, Peeks=FALSE
\* Unsafe control: an unpaired replay fire fails at staging (the rule of
\* decision 19). A deploy that runs out of phlo at a fire leaves that fire
\* out of the log, so the validator drops the transaction and rejects an
\* honest block. MUST refute exactly T6 (ReplayOutcomeEqual).
SPECIFICATION Spec

CONSTANTS
    Chans = {"d1", "v1"}
    Vol = {"v1"}
    Vals = {"a"}
    Konts = {"k"}
    MaxTxnOps = 2
    MaxTxns = 2
    Blocks = 1
    Budget = 3
    SpacesInBlockHash = TRUE
    Forge = FALSE
    UseUuid = FALSE
    RootIgnoresVolatile = FALSE
    DoublePair = FALSE
    JoinResidue = FALSE
    StagingDivergence = TRUE
    AcceptUnpaired = FALSE
    Peeks = FALSE
    \* Changed by decision 90: CheckpointReplay.tla has no Legacy mode.
    \* Legacy = FALSE
    \* LegacyPreAfterObserve = FALSE
    \* LegacyTailDropped = FALSE
    \* RetainPeek = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayPrefixEqual
    SameRootIffSameState
    PairedOnce
    NoVolatileResidue
    ReplayOutcomeEqual
