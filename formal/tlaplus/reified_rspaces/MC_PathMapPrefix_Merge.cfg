\* BOUNDS: Paths=TwoLevelPaths, Pats=ValuePats, Vals={"a","b"}, MaxOps=2, Forks=TRUE, SpaceWideIndex=FALSE, ExactPathOnly=FALSE, NoRetire=FALSE, MarkerNotRestored=FALSE
\* The merge of two branches: every base state of two operations, then every
\* send on branch A and every receive on branch B. Check #2 must see every
\* prefix contact. Every invariant must hold.
SPECIFICATION Spec

CONSTANTS
    Paths <- TwoLevelPaths
    Pats <- ValuePats
    Vals = {"a", "b"}
    MaxOps = 2
    Forks = TRUE
    SpaceWideIndex = FALSE
    ExactPathOnly = FALSE
    NoRetire = FALSE
    MarkerNotRestored = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoMatchRemains
    MarkerCount
    MergeDetectsPrefixContact
