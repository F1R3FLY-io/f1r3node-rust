\* BOUNDS: Comms={"m1","m2"}, MaxOps=3, MaxBudget=6, Tamper=TRUE, TamperedOutcomeUnsafe=TRUE
\* Unsafe control: native replay skips the outcome-fit and candidate
\* checks, so it accepts a tampered journal. MUST refute exactly
\* NativeReplayOutcomeEqual.
SPECIFICATION OutcomeSpec

CONSTANTS
    Comms = {"m1", "m2"}
    MaxOps = 3
    MaxBudget = 6
    Tamper = TRUE
    TamperedOutcomeUnsafe = TRUE
    NativeKey = FALSE
    Forge = FALSE
    NoSpaceKeyUnsafe = FALSE
    WaitUnderLocksUnsafe = FALSE
    NoInvalidateUnsafe = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    OutcomeTypeOK
    NativeReplayOutcomeEqual
