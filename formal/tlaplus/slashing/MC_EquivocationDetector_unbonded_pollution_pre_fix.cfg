\* FV audit #6 — unbonded-window record pollution fork: PRE-FIX run.
\*
\* EnableStampWitness = TRUE reproduces the pre-fix caller behaviour: the
\* EquivocationDetected arm stamped the currently-validated observer block hash
\* into an UNBONDED offender's record.  TLC MUST report an Inv_NoStampAgainstUnbonded
\* violation — a trace where an equivocation record exists for v, v unbonds, and
\* StampWitness lands a hash in recordWitness[<<v, base>>] while ~bonded[v].
\*
\* This is the formal demonstration of the fork's root cause; the post-fix run
\* (MC_EquivocationDetector_unbonded_pollution.cfg, EnableStampWitness = FALSE)
\* must PASS the same invariant.

CONSTANTS
    v1 = v1
    v2 = v2
    Validators       <- MC_Validators
    MaxSeqNum        <- MC_MaxSeqNum
    MaxBlocksPerSeq  <- MC_MaxBlocksPerSeq
    EnableBondDynamics = TRUE
    EnableStampWitness = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Inv_NoStampAgainstUnbonded
INVARIANT Inv_NeglectNotFromUnbondedPollution
