\* FV audit #6 — unbonded-window record pollution fork: POST-FIX run.
\*
\* EnableStampWitness = FALSE (the fix: the unbonded/stake-0 offender resolves
\* to Oblivious, so the caller never stamps).  recordWitness therefore stays
\* empty on every reachable state, and both FV-audit-#6 invariants MUST PASS:
\*   - Inv_NoStampAgainstUnbonded          (no witness against an unbonded offender)
\*   - Inv_NeglectNotFromUnbondedPollution (neglect only from bonded + detectable)
\*
\* EnableBondDynamics = TRUE so bond status genuinely toggles (Unbond/Rebond) —
\* the invariants are exercised over unbonded states, not vacuously.

CONSTANTS
    v1 = v1
    v2 = v2
    Validators       <- MC_Validators
    MaxSeqNum        <- MC_MaxSeqNum
    MaxBlocksPerSeq  <- MC_MaxBlocksPerSeq
    EnableBondDynamics = TRUE
    EnableStampWitness = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Inv_NoStampAgainstUnbonded
INVARIANT Inv_NeglectNotFromUnbondedPollution
