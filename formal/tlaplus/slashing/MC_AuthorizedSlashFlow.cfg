CONSTANTS
    v1 = v1
    v2 = v2
    h1 = h1
    h2 = h2
    e0 = e0
    e1 = e1
    Validators <- MC_Validators
    Hashes <- MC_Hashes
    HashRank <- MC_HashRank
    Epochs <- MC_Epochs
    InitialBonds <- MC_InitialBonds
    MaxGeneration <- MC_MaxGeneration
    ProposerUsesCanonicalPreState = TRUE
    ReceiverUsesCanonicalPreState = TRUE
    UseGenerationInAuthorization = TRUE
    UseActivationWindow = TRUE
    ReuseGenerationOnFreshBond = FALSE
    ChangeGenerationOnEpochAdvance = FALSE
    AllowGenerationChangeOutsideBond = FALSE
    ReplayUsesCommittedGeneration = TRUE
    CanonicalAuthorityAtomic = TRUE
    AllowDetachedCanonicalPreState = FALSE

SPECIFICATION Spec

SYMMETRY SymmetryV

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT Inv_GenerationEqualsSuccessfulBondCount
INVARIANT Inv_AtMostOneLiveGenerationPerKey
INVARIANT Inv_LivePhaseHasCurrentGeneration
INVARIANT Inv_EpochAdvancePreservesBondGeneration
INVARIANT Inv_GenerationChangesOnlyOnSuccessfulFreshBond
INVARIANT Inv_OnlyCurrentEpochCurrentGenerationSlashCanBePending
INVARIANT Inv_StaleGenerationCannotSlashRebondedKey
INVARIANT Inv_OldEpochEvidenceCannotAuthorizeCurrentWindow
INVARIANT Inv_SlashedIdentityIsGenerationScoped
INVARIANT Inv_SlashedGenerationNeverExceedsCurrent
INVARIANT Inv_RejectedSlashWithoutEvidenceNoPending
INVARIANT Inv_RejectedObservationMonitorBounded
INVARIANT Inv_InvalidAuthSlashNoPending
INVARIANT Inv_EvidenceHashUnique
INVARIANT Inv_MergeRejectedSlashCoveredByCanonicalScan
INVARIANT Inv_MergeRejectedSlashCannotAuthorizeZeroBond
INVARIANT Inv_MergeRejectedObservationMonitorBounded
INVARIANT Inv_CanonicalAuthorityMatchesLifecycleState
INVARIANT Inv_PendingSlashBoundToCurrentPreState
INVARIANT Inv_PendingSlashCompleteForCurrentPreState
INVARIANT Inv_ProposerAuthorizationMatchesCanonical
INVARIANT Inv_ReceiverAuthorizationMatchesCanonical
INVARIANT Inv_ProposerReceiverAuthorizationParity
INVARIANT Inv_PendingSlashHashUnique
INVARIANT Inv_PendingSlashTargetUnique
INVARIANT Inv_ReplayUsesCommittedSlashIdentity
INVARIANT Inv_RebondReachabilityWitnessSound
