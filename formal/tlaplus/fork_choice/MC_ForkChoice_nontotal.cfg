\* The FORK BUG: score-only tie-break, no secondary hash key. EXPECTED TO FAIL —
\* two tips sharing the max score leave >1 maximal element, so the chosen tip depends
\* on the HashSet/HashMap iteration order (Inv_Deterministic violated). Kept for
\* regression/pedagogy; NOT part of the pass-gate.
SPECIFICATION Spec

CONSTANTS
    MaxId = 3
    MaxScore = 2
    TotalTieBreak = FALSE

INVARIANT TypeOK
INVARIANT Inv_Deterministic
INVARIANT Inv_HeaviestSubtree
