CONSTANTS
  MaxTracked = 1
  TypedDependencies = TRUE
  ValidateResponses = TRUE
  RequireExpectedResponse = TRUE
  RetainFailedRequests = TRUE
  RebuildAfterRestart = TRUE
  DeduplicateQueue = TRUE

INIT Init
NEXT Next

INVARIANTS
  TypeOK
  RequestTrackerIsBounded
  TypedDependencyNamespaceIsDisjoint
  ResolvedOnlyAfterCertificatePersistence
  OnlyValidResponsesPersist
  UnsolicitedResponsesDoNotMutate
  FailedSendsRetainObligations
  RestartNeverStrandsPersistentObligations
  BufferedBlocksAreNotQueued
  EveryBlockIsQueuedAtMostOnce
  QueueSetMatchesCounts
