\* Model-check config for the POST-FIX FinalizedFloor (Phase 2).
\*
\* Selects SpecFixed: the H1 backstop is a deterministic park-guard (no lossy
\* single-parent fallback) and the scope-size gate is demoted. This config MUST
\* PASS with no violation:
\*   * Inv_NoLostParentWrite  -- every parent write survives every merge (S5).
\*   * Inv_DeltaWithinCap     -- the floor distance never exceeds the cap.
\*   * Liveness_Progress      -- the chain still reaches the bound (park always
\*                               resolved by Finalize; the ratchet is gone).
\*
\* The companion MC_FinalizedFloor_pre_fix.cfg selects the buggy Spec and
\* DISCOVERS the counterexample that motivated the fix.
SPECIFICATION SpecFixed

CONSTANTS
    MaxDelta = 2
    MaxScope = 4
    MaxTip = 6

INVARIANT TypeOK
INVARIANT Inv_FloorMonotone
INVARIANT Inv_NoLostParentWrite
INVARIANT Inv_DeltaWithinCap

PROPERTY Liveness_Progress

CHECK_DEADLOCK FALSE
