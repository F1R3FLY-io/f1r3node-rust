\* The NAIVE fix: byte-gated admission that sheds over-budget blocks
\* instead of deferring to the re-request loop. EXPECTED TO FAIL
\* Live_AllBroadcastProcessed — a dropped block is protocol data nothing
\* re-delivers, so the shard wedges quietly. This config is why the byte
\* bound must ship WITH retriever-backed deferral, never with load
\* shedding. Run manually; excluded from CI.
SPECIFICATION Spec
CONSTANTS
    Blocks = {b1, b2, b3}
    MaxBlockBytes = 2
    ByteCap = 3
    CountCap = 3
    MaxParallel = 2
    ByteBounded = TRUE
    DeferralRerequests = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    Live_AllBroadcastProcessed
