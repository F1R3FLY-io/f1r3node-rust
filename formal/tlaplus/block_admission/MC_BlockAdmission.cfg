\* The FIX, gated: byte-bounded admission with deferral wired to the
\* re-request loop. Byte bound holds, nothing is shed, every broadcast
\* block is eventually processed.
SPECIFICATION Spec
CONSTANTS
    Blocks = {b1, b2, b3}
    MaxBlockBytes = 2
    ByteCap = 3
    CountCap = 3
    MaxParallel = 2
    ByteBounded = TRUE
    DeferralRerequests = TRUE
INVARIANTS
    TypeOK
    Inv_RetainedBytesBounded
    Inv_NoBlocksShed
PROPERTIES
    Live_AllBroadcastProcessed
