\* The FIX, gated: byte-bounded admission (count cap still in force) with
\* deferral wired to the re-request loop. Byte bound and total-residency
\* bound hold, nothing is shed, and every finite broadcast work item is
\* eventually processed under the module's explicit per-block fairness.
SPECIFICATION Spec
CONSTANTS
    Blocks = {b1, b2, b3}
    MaxBlockBytes = 2
    ByteCap = 3
    CountCap = 3
    RequestCap = 2
    MaxParallel = 2
    MaxDeliveries = 2
    ByteBounded = TRUE
    DeferralRerequests = TRUE
INVARIANTS
    TypeOK
    Inv_RetainedBytesBounded
    Inv_TotalResidencyBounded
    Inv_RetrieverTrackingBounded
    Inv_NoBlocksShed
PROPERTIES
    Live_AllBroadcastProcessed
