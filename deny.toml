executables = "deny"
interpreted = "warn"
include-dependencies = true
include-archives = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/F1R3FLY-io/rholang-rs"]
