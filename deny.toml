[graph]
all-features = true
no-default-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
ignore = [
  { id = "RUSTSEC-2026-0098", reason = "Legacy reqwest uses rustls-webpki 0.101.7. URI constraints require certificate misissuance. Replace the legacy HTTP dependencies." },
  { id = "RUSTSEC-2026-0099", reason = "Legacy reqwest uses rustls-webpki 0.101.7. Wildcard constraints require certificate misissuance. Replace the legacy HTTP dependencies." },
  { id = "RUSTSEC-2026-0104", reason = "Legacy reqwest uses rustls-webpki 0.101.7. CRL parsing can panic before signature verification. CRL reachability requires review." },
  { id = "RUSTSEC-2026-0258", reason = "Legacy reqwest uses h2 0.3.27. Undrained streams can queue empty DATA frames. Replace the legacy HTTP dependencies." },
  { id = "RUSTSEC-2025-0134", reason = "comm directly uses rustls-pemfile 2.2.0. Legacy reqwest also uses 1.0.4. Migrate to rustls-pki-types." },
  { id = "RUSTSEC-2024-0387", reason = "The legacy OpenTelemetry stack uses opentelemetry_api. Upgrade the telemetry dependencies together." },
  { id = "RUSTSEC-2025-0141", reason = "The workspace uses bincode 1.3.3. Replacement requires storage and serialization compatibility tests." },
  { id = "RUSTSEC-2021-0141", reason = "rholang directly uses dotenv 0.15.0. Migrate the OpenAI configuration loader to a maintained implementation." },
  { id = "RUSTSEC-2021-0153", reason = "hocon uses encoding through java-properties. Replace HOCON under TASK-012-5." },
  { id = "RUSTSEC-2024-0436", reason = "comm discovery tests use the paste procedural macro. Replace the test macro." },
  { id = "RUSTSEC-2026-0247", reason = "imbl uses unmaintained bitmaps. This exception does not accept the separate memory-safety advisory RUSTSEC-2025-0167." },
  { id = "RUSTSEC-2024-0384", reason = "soak-charts uses instant through charton. This dependency is specific to WebAssembly targets." },
  { id = "RUSTSEC-2024-0437", reason = "The optional rust-bert feature uses protobuf 2.28.0 through rust_tokenizers. Untrusted model parsing requires review." },
  { id = "RUSTSEC-2025-0119", reason = "The optional rust-bert feature uses unmaintained number_prefix through cached-path." },
  { id = "RUSTSEC-2026-0173", reason = "The optional chroma feature uses unmaintained proc-macro-error2 through validator_derive." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "Zlib", "MPL-2.0", "BSL-1.0", "OpenSSL", "Unlicense",
]
exceptions = [
  { allow = ["LGPL-3.0-or-later"], crate = "zbase32@0.1.2" },
  { allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" },
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "rholang-parser"
expression = "Apache-2.0"
license-files = [{ path = "../README.md", hash = 0xcd11a2a7 }]

[[licenses.clarify]]
name = "rholang-tree-sitter"
expression = "Apache-2.0"
license-files = [{ path = "../README.md", hash = 0xcd11a2a7 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "bitmaps:>=3.2.0", reason = "RUSTSEC-2025-0167 affects byte conversions introduced in 3.2.0. Use 3.1.0 until a reviewed replacement is available." },
  { crate = "rustls-webpki:<0.101.7", reason = "Only the existing legacy exception can use an unpatched certificate verifier." },
  { crate = "rustls-webpki:>0.101.7,<0.103.13", reason = "Do not extend the legacy certificate-verifier exception to other versions." },
  { crate = "h2:<0.3.27", reason = "Only h2 0.3.27 has a legacy HTTP exception." },
  { crate = "h2:>0.3.27,<0.4.16", reason = "The maintained HTTP stack must include the empty DATA frame fix." },
]

