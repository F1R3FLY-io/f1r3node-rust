file = "factory_rejects_a_forged_params_tuple.rho"
# Changed by decision 112 (ruling 9): a quoted send holds its params in a field, so no program
# builds a params tuple from its quoted code. The text before:
# description = "A params tuple that a program builds with a marker from its own quoted code, in a form that the normalizer never writes, aborts with Malformed."
description = "A program quotes a send with params and finds no params tuple in the quoted send, because the params are a field of the send. A former marker tuple grants nothing."
test = "rholang/tests/reified_examples_execute.rs"

