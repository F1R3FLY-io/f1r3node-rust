# The example programs of Reified RSpaces.
#
# Each example is one or more deploys. The harness rholang/tests/reified_examples_execute.rs
# plays each deploy natively, certifies it by native replay, and checks the expected values or
# the expected error code, which it holds as Rust data (P10 design v2, deviation D-B).
#
# doc_lint.py reads this manifest (rule snippet-corpus): every rholang block of the campaign
# documents is the text of one example file or one row of the syntax corpus. doc_lint also
# checks that each .rho file of this directory is an example here, and that the test of each
# example names its files.

[[example]]
name = "queue-fifo"
file = "queue_fifo.rho"
description = "A queue space gives back its records in arrival order (FIFO)."
test = "rholang/tests/reified_examples_execute.rs"

