[package]
name = "rspace_plus_plus"
version = "0.1.0"
publish = false  # internal workspace crate; not published to crates.io
edition = "2021"

# [workspace]
# members = ["libs/rspace_rhotypes"]

[lib]
doctest = false

[features]
default = []
# Measurement-only access to the removed zipper-clone control and the exact
# production moving-cursor continuation arena. Ordinary builds compile neither the
# facade nor its legacy control.
candidate-continuation-experiment = []
# Measurement-only comparison between the typed legacy DATA checkpoint route
# and the production canonical-identity zipper/arena route.
canonical-egress-experiment = []
# Measurement-only comparison of operational continuation/join order
# projection against two secondary PathMap order-index representations.
record-order-index-experiment = []
# Measurement-only access to the accepted-match transaction and its frozen
# pre-transaction split-call control. Neither arm is compiled by default.
accepted-match-transition-experiment = []
# Adds counters around the measurement-only transition runner. Keep this
# separate so Criterion timing builds carry no instrumentation overhead.
accepted-match-transition-instrumentation = ["accepted-match-transition-experiment"]
# Measurement-only ACT admission/source-access accounting. The ordinary codec
# omits per-byte counters and counter storage from its production hot path.
act-codec-instrumentation = []
# Measurement-only generated flat-dispatch transition index of the retained
# set automaton, the treatment arm compared with its PathMap index. A matcher
# opts in per compilation; ordinary builds compile neither the opt-in nor the
# tables.
retained-flat-dispatch-experiment = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shared = { path = "../shared" }
bincode = { workspace = true }
heed = "0.22.1"
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
prost = { workspace = true }
bit-set = "0.5.3"
monadic = "0.5.5"
futures = { workspace = true }
state = "0.6.0"
itertools = { workspace = true }
blake2 = "0.10.6"
crc = "3.4.0"
tokio = { workspace = true }
rand = "0.8"
blake3 = "1.5.0"
async-trait = { workspace = true }
bytes = "1"
tracing = { workspace = true }
rayon = "1.8.1"
hex = { workspace = true }
proptest = "1.4.0"
lazy_static = "1.4.0"
chrono = "0.4.38"
once_cell = "1.19.0"
rstest = "0.19.0"
proptest-derive = "0.5.1"
counter = "0.5.7"
multiset = "0.0.5"
rholang-parser = { git = "https://github.com/F1R3FLY-io/rholang-rs", package = "rholang-parser", rev = "c163755" }
validated = "1.0.0"
metrics = "0.23"
tracing-subscriber = { workspace = true }
pathmap = { version = "=0.3.4", features = ["arena_compact"] }

# Durable storage opens every authority file relative to a pinned directory
# descriptor with O_NOFOLLOW and explicit 0600 creation permissions.  libc is
# used only for that small Unix openat boundary; all subsequent I/O remains in
# safe std APIs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Canonical ACTree03 validation must reproduce PathMap 0.3.4's deterministic
# line-reuse hash on every architecture where PathMap selects gxhash.
[target.'cfg(not(any(miri,target_arch="riscv64")))'.dependencies]
gxhash = "3.5"

[dependencies.uuid]
version = "1.4.0"
features = [
	"v4",                # Lets you generate random UUIDs
	"fast-rng",          # Use a faster (but still sufficiently random) RNG
	"macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
test-env-helpers = "0.2.2"
metrics-util = "0.17"

[[bench]]
name = "rspace_comm"
harness = false

[[bench]]
name = "bag"
harness = false

[[bench]]
name = "rspace_query_product"
harness = false

[[bench]]
name = "rspace_retained_bag_product"
harness = false

[[bench]]
name = "rspace_retained_automaton_build"
harness = false

[[bench]]
name = "rspace_candidate_continuation"
harness = false
required-features = ["candidate-continuation-experiment"]

[[bench]]
name = "rspace_channel_replacement"
harness = false

[[bench]]
name = "rspace_canonical_egress"
harness = false
required-features = ["canonical-egress-experiment"]

[[bench]]
name = "rspace_act_lmdb"
harness = false

[[bench]]
name = "rspace_act_codec_profile"
harness = false

[[bench]]
name = "rspace_identity_order_index"
harness = false
required-features = ["canonical-egress-experiment"]

[[bench]]
name = "rspace_record_order_index"
harness = false
required-features = ["record-order-index-experiment"]

[[bench]]
name = "rspace_accepted_match"
harness = false
required-features = ["accepted-match-transition-experiment"]

[[bench]]
name = "rspace_accepted_match_profile"
harness = false
required-features = ["accepted-match-transition-experiment"]

[[bench]]
name = "rspace_retained_automaton_space"
harness = false
required-features = ["retained-flat-dispatch-experiment"]
