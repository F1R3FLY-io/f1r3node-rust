# Validator 1 with its own RabbitMQ deploy queue.
# Used by docker/deploy-queue.yml, which mounts the shard's shared
# default.conf beside this file as shard-default.conf. Everything but the
# deploy-queue block comes from there.
include "shard-default.conf"

deploy-queue {
  enabled = true
  amqp-url = "amqp://f1r3:f1r3@rabbitmq-validator1:5672/%2f"
}
