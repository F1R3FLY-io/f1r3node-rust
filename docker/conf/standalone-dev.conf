# Standalone overrides — single-node mode for local development.
# The node loads its built-in defaults.conf first, then this file merges on top.
# No network peers required — node creates and approves its own genesis.

standalone = true
dev-mode = true

protocol-server {
  network-id = "standalone-dev"
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.0
  synchrony-constraint-threshold = 0.0
  casper-loop-interval = 5 seconds
  requested-blocks-timeout = 60 seconds
  fork-choice-stale-threshold = 30 seconds
  fork-choice-check-if-stale-interval = 1 minutes
  max-number-of-parents = 100
  enable-mergeable-channel-gc = true

  heartbeat {
    enabled = true
    check-interval = 5 seconds
    max-lfb-age = 10 seconds
  }

  genesis-ceremony {
    required-signatures = 0
    approve-interval = 1 seconds
    approve-duration = 1 seconds
    autogen-shard-size = 1
    ceremony-master-mode = true
  }

  genesis-block-data {
    number-of-active-validators = 1
    pos-multi-sig-quorum = 1
  }
}

metrics {
  prometheus = true
}

# f1r3drive-rust reads use exploratory_deploy; each 32 KB bytesAt →
# stream.chunk round-trip bumps against the 5M default phlo cap. Bump
# generously for the mount-experiment surface. Harmless when
# f1r3drive-rust isn't in play — the server just allows larger
# per-request budgets.
api-server {
  exploratory-deploy-phlo-limit = 500000000
  exploratory-deploy-execution-timeout = 2m
  # Finder's NFS readahead issues 16+ parallel read ops per large file,
  # each one a separate exploratory_deploy. Default (4) rejects most of
  # them with "capacity exhausted"; 64 covers the burst.
  exploratory-deploy-max-concurrent = 64
}
