image:
  #repository: ghcr.io/f1r3fly-io/rnode #local
  # repository: eu-frankfurt-1.ocir.io/frqbavregu95/random/rnode #remote
  repository: f1r3flyindustries/f1r3fly-rust:latest #remote
  #pullPolicy: Never # Use `IfNotPresent` at Cloud Provider
  pullPolicy: IfNotPresent # Use `IfNotPresent` at Cloud Provider
  #tag: "latest" #local
  #tag: "test" #remote
  tag: "latest"

containerArgs:
  - "run"
    

imagePullSecrets:
  - name: k8s-secret
nameOverride: ""
fullnameOverride: ""

# TODO: not needed now
# NOT TESTED YET
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsUser: 0 #root user
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  ports: 
  - containerPort: 40400
    nodePort: 30000
  - containerPort: 40401
    nodePort: 30001
  - containerPort: 40402
    nodePort: 30002
  - containerPort: 40403
    nodePort: 30003
  - containerPort: 40404
    nodePort: 30004
  - containerPort: 40405
    nodePort: 30005

# TODO: not needed now
# NOT TESTED YET
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    # for cluster with boot + 4 nodes
    # our cluster had 6 OCPU and 18 memory, 6-5=1additional OCPU and 18-16(3.2*5) = 2 additional memory
    # additional node resources kubernetes uses for internal resources (pods)
    #cpu: 1
    #memory: 3.2G

    # for cluster with boot + 8 nodes
    # our cluster had 10 OCPU and 34 memory, 10-9=1additional OCPU and 34-32(3.5*9) = 2 additional memory
    # additional node resources kubernetes uses for internal resources (pods)
    #cpu: 1
    #memory: 3.5G

    # for cluster with boot + 16 nodes
    # our cluster had 18 OCPU and 66 memory, 18-17=1additional OCPU and 66-64(3.76*17) = 2 additional memory
    # additional node resources kubernetes uses for internal resources (pods)
    cpu: 1
    memory: 3.7G

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# TODO: not needed now
# NOT TESTED YET
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  storageClassName: oci
