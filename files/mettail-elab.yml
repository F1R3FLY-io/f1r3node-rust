name: mettail-elab

# The elaborator is its own workspace (see mettail-elab/Cargo.toml) so that
# Embers can take it as a git dependency without pulling in the node
# workspace. That means it is NOT covered by the root workspace CI, and needs
# its own job.

on:
  push:
    paths:
      - "mettail-elab/**"
      - ".github/workflows/mettail-elab.yml"
  pull_request:
    paths:
      - "mettail-elab/**"
      - ".github/workflows/mettail-elab.yml"
  workflow_dispatch:

jobs:
  elaborator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mettail-elab
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mettail-elab

      # The crate is deliberately dependency-free. If this stops being true,
      # the Embers integration gets a transitive dependency graph it did not
      # ask for, so fail loudly rather than quietly.
      - name: assert the dependency surface is still empty
        run: |
          set -euo pipefail
          n=$(cargo metadata --format-version 1 --no-deps \
                | python3 -c 'import json,sys; m=json.load(sys.stdin); print(len(m["packages"][0]["dependencies"]))')
          if [ "$n" != "0" ]; then
            echo "mettail-elab has $n dependencies; it must have none." >&2
            exit 1
          fi

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: pre-flight check the module corpus
        run: python3 ../scripts/check-modules.py examples/modules/*.module
