[package]
name = "block-storage"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shared = { path = "../shared" }
rspace_plus_plus = { path = "../rspace++" }
models = { path = "../models" }
crypto = { path = "../crypto" }
lz4_flex = { workspace = true }
prost = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
imbl = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
once_cell = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

[features]
default = []
# P2-16: gates the three lock-free RMW bypass helpers on
# `BlockDagKeyValueStorage` (`equivocation_records`,
# `insert_equivocation_record`, `update_equivocation_record`).
# Production builds MUST NOT enable this feature. Test crates that
# need the helpers enable `test-internals` via their dev-dependency on
# `block-storage`. See
# `docs/theory/slashing/slashing-verification.md` §9.2 (Bug #2).
test-internals = []

[dev-dependencies]
proptest = { workspace = true }
# Exhaustive thread-interleaving model checker for the
# `access_equivocations_tracker` non-reentrancy contract (P2-13).
# See block-storage/tests/loom_equivocations_tracker.rs.
loom = "=0.7.2"

# P2-16: these targets used to carry `required-features = ["test-internals"]`
# because two equivocation tests called the gated lock-bypass helpers. A crate
# cannot dev-depend on itself, so that feature could only be reached by passing
# `--features` on the command line — and a target whose required features are
# unmet is SKIPPED, not failed, so CI (`cargo nextest run -p block-storage`,
# no `--features`) silently ran none of these tests. The two tests now go
# through `access_equivocations_tracker`, the same locked path production uses,
# so nothing here needs the feature and every test is visible by default.
[[test]]
name = "loom_equivocations_tracker"

# C10: exhaustive thread-interleaving model check that the finalized-floor
# floor_index/frontier_index memoization (a write-once, node-identical pure
# function) can never observe a torn or regressed cached value. Uses
# `loom::sync::*` types directly, so no `--cfg loom` flag is needed.
# See block-storage/tests/loom_frontier_floor_cache.rs.
[[test]]
name = "loom_frontier_floor_cache"

[build-dependencies]
