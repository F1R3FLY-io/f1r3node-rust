[package]
name = "block-storage"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shared = { path = "../shared" }
rspace_plus_plus = { path = "../rspace++" }
models = { path = "../models" }
crypto = { path = "../crypto" }
lz4_flex = { workspace = true }
prost = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
imbl = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
once_cell = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

[features]
default = []
# Gates the test-only constructor and index accessors on
# `BlockDagKeyValueStorage`. Production builds MUST NOT enable it.
test-internals = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dev-dependencies]
metrics-util = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Exhaustive thread-interleaving model checker.
# See block-storage/tests/loom_frontier_floor_cache.rs.
loom = "=0.7.2"

# C10: exhaustive thread-interleaving model check that the finalized-floor
# floor_index/frontier_index memoization (a write-once, node-identical pure
# function) can never observe a torn or regressed cached value. Uses
# `loom::sync::*` types directly, so no `--cfg loom` flag is needed.
# See block-storage/tests/loom_frontier_floor_cache.rs.
[[test]]
name = "loom_frontier_floor_cache"

[build-dependencies]
