edition = "2021"

max_width = 100

format_code_in_doc_comments = true
fn_single_line = true
merge_derives = false
overflow_delimited_expr = true
reorder_modules = false
use_field_init_shorthand = true
use_try_shorthand = true
where_single_line = true

imports_granularity = "Module"
group_imports = "StdExternalCrate"

# ── Files whose TEXT is a checkable citation, and must therefore not be rewritten ──
#
# `normalize_recursive.rs` is the recursive oracle the converted normalizer is
# differentially compared against. It is not merely "old code kept around": every
# one of its ~20 sections carries a marker of the form
#
#     // VERBATIM from `normalizer/processes/p_par_normalizer.rs`, lines 10-61, at commit 6ccf71f2.
#
# Those markers are CLAIMS A READER CAN CHECK — `git show 6ccf71f2:<path>`, take the
# cited range, diff. That checkability is the whole value of the oracle: without it,
# nothing stops an author from quietly "fixing" the reference until it agrees with the
# new driver, at which point the differential compares the new code against itself and
# proves nothing.
#
# Formatting the file would silently falsify every one of those citations. A reader who
# followed one and found a difference could not distinguish tampering from rustfmt.
#
# ★ Why this belongs HERE and not as `#[rustfmt::skip]` in the file: that attribute
# would require EDITING the file, which destroys the byte-identity the exemption exists
# to protect. A config-side exclusion is the only mechanism that preserves the property.
#
# This is not a blanket "oracles are exempt" carve-out. `sort_recursive.rs` and
# `substitute_oracle.rs` are oracles by ROLE but cite no commit and no line ranges, so
# formatting them falsifies nothing and they are formatted normally. The criterion is
# narrow and stated: a file is listed here only while its own text asserts provenance
# against an external source.
#
# ── `pretty_printer_oracle.rs` earns its listing the same way ──
#
# The printer's recursive twin used to sit inside `pretty_printer.rs` under a banner
# claiming it was "kept verbatim ... Nothing else is edited — not a format string, not an
# argument order, not a comment" — with NO commit, NO path and NO line range behind it.
# An exclusion could not be granted for that: excluding the file would have FROZEN AN
# UNVERIFIABLE CLAIM, protecting text nobody could check against drift nobody could
# detect, and it would have frozen 4,000 lines of driver that make no such claim, because
# `ignore` is file-level.
#
# Both objections are now answered, in this order:
#
#   1. the twin was EXTRACTED to its own file, so the exclusion covers exactly the text
#      that carries the claim and nothing else;
#   2. every one of its ten functions now cites its source —
#
#          // VERBATIM from rholang/src/rust/interpreter/pretty_printer.rs,
#          // lines 224-670, at commit 739368a4
#
#      and `rholang/tests/normalize_oracle_provenance.rs` re-derives all ten from git and
#      compares them byte for byte, with every intended difference declared as DATA in
#      `PP_DEVIATIONS`.
#
# ★ Writing that checker is what established the claim was FALSE, exactly as `779bf881`
# found for the normalizer: 4 of the 10 functions are byte-identical under the declared
# rename, and 6 carry deviations — including deleted comments in three of the four public
# wrappers, which is precisely the "not a comment" the banner promised. The file's
# documentation now states the measured numbers, and the test asserts them, so the listing
# below protects a claim that is true and checked rather than one that was neither.
#
# ⚠ These bytes are consensus-relevant: the printer's output reaches a block through
# `build_channel_string` -> `cap` -> `error_message` and is compared by replay at
# `casper/src/rust/rholang/replay_runtime.rs`.
ignore = [
    "rholang/src/rust/interpreter/compiler/normalize_recursive.rs",
    "rholang/src/rust/interpreter/pretty_printer_oracle.rs",
]
