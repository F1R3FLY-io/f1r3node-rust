pull_request_rules:
  - name: Run the heavy pipeline for an approved pull request
    conditions:
      - base~=^(dev|master|ca-canary|ca-release)$
      - head-repo-full-name=F1R3FLY-io/f1r3node-rust
      - -head~=^backmerge/ca-release-
      - -draft
      - -label=ci-heavy
      - "#approved-reviews-by>=1"
      - "#changes-requested-reviews-by=0"
    actions:
      label:
        add:
          - ci-heavy

  - name: Queue a pull request into dev
    conditions:
      - base=dev
    actions:
      queue:
        name: dev

  - name: Queue a pull request into master
    conditions:
      - base=master
    actions:
      queue:
        name: master

  - name: Queue a release train item
    conditions:
      - base=ca-canary
      - head~=^ca/
    actions:
      queue:
        name: ca-item

  - name: Queue the daily back-merge
    conditions:
      - base=ca-canary
      - head~=^backmerge/ca-release-[0-9a-f]{12}$
      - author=f1r3node-promotion[bot]
    actions:
      queue:
        name: ca-daily

  - name: Queue a release train promotion
    conditions:
      - base=ca-release
    actions:
      queue:
        name: ca-release
