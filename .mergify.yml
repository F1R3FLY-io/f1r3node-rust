pull_request_rules:
  - name: Add ci-heavy to every pull request
    conditions:
      - base~=^(dev|master|ca-canary|ca-release)$
      - head-repo-full-name=F1R3FLY-io/f1r3node-rust
      - -head~=^backmerge/ca-release-
      - -head~=^(dev|master|ca-canary|ca-release)$
      - or:
          - -base=ca-canary
          - head~=^ca/
      - -closed
      - -draft
      - -label=ci-heavy
      - or:
          - -label=ci-heavy-waived
          - base~=^(master|ca-release)$
    actions:
      label:
        add:
          - ci-heavy

  - name: Label a security fix
    conditions:
      - head~=(?i)(security|rustsec)
      - -closed
      - -label=security
    actions:
      label:
        add:
          - security

  - name: Queue a pull request into dev
    conditions:
      - base=dev
    actions:
      queue:
        name: dev

  - name: Queue a pull request into master
    conditions:
      - base=master
    actions:
      queue:
        name: master

  - name: Queue a release train item
    conditions:
      - base=ca-canary
      - head~=^ca/
    actions:
      queue:
        name: ca-item

  - name: Queue the daily back-merge
    conditions:
      - base=ca-canary
      - head~=^backmerge/ca-release-[0-9a-f]{12}$
      - author=f1r3node-promotion[bot]
    actions:
      queue:
        name: ca-daily

  - name: Queue a release train promotion
    conditions:
      - base=ca-release
    actions:
      queue:
        name: ca-release
