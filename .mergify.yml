# Mergify merges every pull request into dev, master, ca-canary, and
# ca-release (issue #764, issue #791, and the bypass merge of PR #794).
#
# The mergify-only ruleset restricts updates of dev and master to the Mergify
# app and the CI automation app, so no person merges into them, admins
# included. An org admin who must merge by hand changes that ruleset, and the
# audit log records the change. docs/ci.md describes the rulesets.
#
# Mergify adds ci-heavy to every open pull request of this repository into
# dev, master, ca-canary (ca/ heads only), and ca-release, so the heavy
# pipeline runs on its head. Protected heads get no label. A draft gets the
# label when it is ready for review. If the label is removed, Mergify adds it
# again. check-success does not accept a skipped check, so without a waiver a
# queue merges only after the Integration gates succeed. Each queue checks one
# pull request at a time on its own head, after Mergify merges the current
# base into it.
#
# Waiver. Only the dev and ca-item queues accept the ci-heavy-waived label in
# place of ci-heavy and the Integration gates, and only when the author is in
# the ci-maintainers team. A waiver on another pull request does not count, so
# that pull request cannot merge until ci-heavy is back. Mergify does not add
# ci-heavy again to a waived pull request into dev or ca-canary. When a waiver
# takes effect, ci-heavy-label.yml cancels the running CI run and reruns it
# with the current labels, so the gates report skipped. devProtect requires
# both gates, and GitHub counts a skipped gate job as passing, so a waived pull
# request can merge into dev. The master and ca-release queues have no waiver:
# every promotion and hotfix needs ci-heavy and both gates.
#
# The rulesets require a branch to be up to date before a merge. Mergify then
# accepts only in-place checks: a serial queue with one check at a time, a
# batch size of 1, no check retries, and merge_conditions identical to
# queue_conditions. Each queue therefore lists its checks in both. A pull
# request enters a queue only after its checks pass.
#
#   dev       a pull request into dev, including the master back-merge.
#   master    a promotion (promote/<stamp>) or a hotfix/ branch into master.
#   ca-item   a ca/<item> pull request into ca-canary. It also needs the
#             ca-soaked label. The ca-soak label starts its 22-hour soak. A
#             passed soak adds ca-soaked and posts Soak Gate (22h) on the
#             soaked commit. The label stays when Mergify merges the base into
#             the pull request, and a push by the author removes it. A commit
#             status cannot do this: Mergify dequeues a pull request whose
#             queue conditions stop matching, and a new head has no status.
#             The occasional dev sync (`just ca-sync`, head ca/sync-dev-<sha>)
#             is a ca/ item too, so it needs the same soak.
#   ca-daily  the daily back-merge (backmerge/ca-release-<sha> into
#             ca-canary) from ca-daily-sync.yml. It needs the light ci.yml
#             checks only and no review, so it accepts only pull requests
#             that the promotion app opened. CA Daily Provenance verifies the
#             release source and each clean base merge with trusted code. A
#             push to ca-canary runs the heavy pipeline after the merge.
#   ca-release  a promotion (promote/ca-release-<stamp>) into ca-release.
#
# Review. A pull request into dev or ca-canary needs one approval, or an
# author in the ci-maintainers team. Every requested reviewer or team must
# review first, and no review may request changes. The master and ca-release
# queues keep the required approval for promotions and hotfixes.
#
# A pull request from a fork gets no heavy run. A maintainer pushes its head
# unchanged to a branch of this repository and opens a pull request from that
# branch with the body line "Imports fork pull request #<N>." Commit Policy
# then exempts the contributor commits that the fork pull request lists
# (commit-policy-exemptions.sh).
#
# Every merge is a merge commit, so each branch keeps the history of the
# branches that it merges. The merge_conditions of the dev and master queues
# list the required checks of the devProtect and masterProtect rulesets.
# test-mergify-config.sh keeps the lists and these rules in step.

merge_queue:
  mode: serial
  max_parallel_checks: 1

# Priority. The priority rules apply across all queues, and the first rule
# that matches sets the priority. A pull request that no rule matches gets
# medium (2000), the lowest tier here.
#
#   6000  security: the security label, or a head that contains security or
#         rustsec. A rule below adds the label to such a head. Only this tier
#         interrupts the checks that run.
#   5000  fix/ into dev, hotfix/ into master
#   4000  release flow: promote/, backmerge/, and ca/ heads
#   3000  perf/
#   2500  ci/
#   2000  every other head, for example feat/, feature/, docs/, and chore/
priority_rules:
  - name: Security fix
    conditions:
      - or:
          - label=security
          - head~=(?i)(security|rustsec)
    priority: 6000
    allow_checks_interruption: true

  - name: Fix into dev or hotfix into master
    conditions:
      - or:
          - and:
              - base=dev
              - head~=^fix/
          - and:
              - base=master
              - head~=^hotfix/
    priority: 5000
    allow_checks_interruption: false

  - name: Release flow
    conditions:
      - head~=^(promote|backmerge|ca)/
    priority: 4000
    allow_checks_interruption: false

  - name: Performance
    conditions:
      - head~=^perf/
    priority: 3000
    allow_checks_interruption: false

  - name: CI
    conditions:
      - head~=^ci/
    priority: 2500
    allow_checks_interruption: false

