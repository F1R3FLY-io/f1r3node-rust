# Mergify merges every pull request into dev, master, ca-canary, and
# ca-release (issue #764, issue #791, and the bypass merge of PR #794).
#
# The mergify-only ruleset restricts updates of dev and master to the Mergify
# app and the CI automation app, so no person merges into them, admins
# included. An org admin who must merge by hand changes that ruleset, and the
# audit log records the change. docs/ci.md describes the rulesets.
#
# Mergify adds ci-heavy to an approved pull request of this repository, so the
# heavy pipeline runs on its head. A queue merges only after the Integration
# gates succeed. check-success does not accept a skipped check, so a pull
# request without a heavy run cannot merge. Each queue checks one pull request
# at a time on its own head, after Mergify merges the current base into it.
#
# The rulesets require a branch to be up to date before a merge. Mergify then
# accepts only in-place checks: a serial queue with one check at a time, a
# batch size of 1, no check retries, and merge_conditions identical to
# queue_conditions. Each queue therefore lists its checks in both. A pull
# request enters a queue only after its checks pass.
#
#   dev       a pull request into dev, including the master back-merge.
#   master    a promotion (promote/<stamp>) or a hotfix/ branch into master.
#   ca-item   a ca/<item> pull request into ca-canary. It also needs the
#             ca-soaked label. The ca-soak label starts its 22-hour soak. A
#             passed soak adds ca-soaked and posts Soak Gate (22h) on the
#             soaked commit. The label stays when Mergify merges the base into
#             the pull request, and a push by the author removes it. A commit
#             status cannot do this: Mergify dequeues a pull request whose
#             queue conditions stop matching, and a new head has no status.
#             The occasional dev sync (`just ca-sync`, head ca/sync-dev-<sha>)
#             is a ca/ item too, so it needs the same soak.
#   ca-daily  the daily back-merge (backmerge/ca-release-<sha> into
#             ca-canary) from ca-daily-sync.yml. It needs the light ci.yml
#             checks only and no review, so it accepts only pull requests
#             that the promotion app opened. CA Daily Provenance verifies the
#             release source and each clean base merge with trusted code. A
#             push to ca-canary runs the heavy pipeline after the merge.
#   ca-release  a promotion (promote/ca-release-<stamp>) into ca-release.
#
# A pull request from a fork gets no heavy run. A maintainer pushes its head
# unchanged to a branch of this repository and opens a pull request from that
# branch with the body line "Imports fork pull request #<N>." Commit Policy
# then exempts the contributor commits that the fork pull request lists
# (commit-policy-exemptions.sh).
#
# Every merge is a merge commit, so each branch keeps the history of the
# branches that it merges. The merge_conditions of the dev and master queues
# list the required checks of the devProtect and masterProtect rulesets.
# test-mergify-config.sh keeps the lists and these rules in step.

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: dev
    batch_size: 1
    max_checks_retries: 0
    merge_method: merge
    update_method: merge
    queue_conditions:
      - base=dev
      - head-repo-full-name=F1R3FLY-io/f1r3node-rust
      - -head~=^(dev|master|ca-canary|ca-release)$
      - -draft
      - label=ci-heavy
      - "#approved-reviews-by>=1"
      - "#changes-requested-reviews-by=0"
      - check-success=Static Checks
      - check-success=Script Tests
      - check-success=Soak Harness Tests
      - check-success=cargo-deny
