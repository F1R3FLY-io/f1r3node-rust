<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1R3FLY weekend soak benchmarks</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 1.5rem;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1); color: var(--text-primary);
    --surface-1: #fcfcfb; --surface-2: #f1f0ee;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a887f;
    --grid: #e4e2dd; --series-1: #2a78d6; --series-2: #008300; --series-3: #e87ba4;
    --good: #008300; --serious: #c81e1e;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) body {
      --surface-1: #1a1a19; --surface-2: #242423;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a887f;
      --grid: #33322f; --series-1: #3987e5; --series-2: #008300; --series-3: #d55181;
      --good: #33a133; --serious: #f05252;
    }
  }
  :root[data-theme="dark"] body {
    --surface-1: #1a1a19; --surface-2: #242423;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a887f;
    --grid: #33322f; --series-1: #3987e5; --series-2: #008300; --series-3: #d55181;
    --good: #33a133; --serious: #f05252;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: var(--text-secondary); margin: 0 0 1.25rem; }
  .verdict { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600;
             padding: .2rem .6rem; border-radius: 999px; background: var(--surface-2); }
  .verdict.pass { color: var(--good); } .verdict.regress { color: var(--serious); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.25rem; }
  figure { margin: 0; background: var(--surface-2); border-radius: 8px; padding: 1rem; }
  figcaption { font-weight: 600; margin-bottom: .25rem; }
  .unit { color: var(--text-muted); font-weight: 400; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: .35rem 0 .5rem; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  svg { display: block; width: 100%; height: auto; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .series-label { font-size: 11px; font-weight: 600; }
  .tooltip { position: fixed; pointer-events: none; background: var(--surface-1);
             border: 1px solid var(--grid); border-radius: 6px; padding: .4rem .6rem;
             font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 10; }
  .tooltip b { display: block; }
  table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--series-1); }
  .empty { color: var(--text-muted); padding: 2rem 0; }
</style>
</head>
<body>
<h1>Weekend soak benchmarks</h1>
<p class="sub">60-hour merge-recovery soak, weekly (concludes Monday mornings) —
  <span id="verdict-slot"></span>
  <a href="data/latest-report.md">latest report</a> ·
  <a href="data/history.json">raw data</a></p>
<div class="grid" id="charts"></div>
<div id="table-slot"></div>
<div class="tooltip" id="tooltip"></div>
<script>
(async function () {
  const RUNS_URL = "https://github.com/F1R3FLY-io/f1r3node-rust/actions/runs/";
  let history = [];
  try { history = await (await fetch("data/history.json")).json(); } catch (e) {}
  if (!Array.isArray(history)) history = [];
  try {
    const v = await (await fetch("data/latest-verdict.json")).json();
    const el = document.getElementById("verdict-slot");
    const pass = v.verdict === "pass";
    el.innerHTML = '<span class="verdict ' + (pass ? "pass" : "regress") + '">' +
      (pass ? "✓ pass" : "✕ regress") + "</span> ";
  } catch (e) {}
  if (history.length === 0) {
    document.getElementById("charts").innerHTML =
      '<p class="empty">No soak runs recorded yet — the first weekend run populates this page.</p>';
    return;
  }

  const S = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
  const dates = history.map(h => (h.run.date || "").slice(0, 10));
  const g = (h, path) => path.reduce((o, k) => (o == null ? null : o[k]), h);

  // Chart definitions: title, unit, series (fixed color by entity)
  const CHARTS = [
    { title: "Failure rate", unit: "failures / iteration", fmt: v => (v * 100).toFixed(1) + "%",
      series: [
        { name: "total", path: ["passive", "failure_rate"], c: 0 },
        { name: "docker", path: ["passive", "providers", "docker"], deriv: p => p && p.iterations > 0 ? p.failures / p.iterations : null, c: 1 },
        { name: "subprocess", path: ["passive", "providers", "subprocess"], deriv: p => p && p.iterations > 0 ? p.failures / p.iterations : null, c: 2 },
      ] },
    { title: "Throughput", unit: "iterations / hour", fmt: v => v.toFixed(2),
      series: [
        { name: "total", path: ["passive", "iterations_per_hour"], c: 0 },
      ] },
    { title: "Peak node RSS", unit: "MB", fmt: v => Math.round(v).toLocaleString(),
      series: [
        { name: "soak load", path: ["passive", "rss_peak_mb"], c: 0 },
        { name: "bench segments", path: ["active", "rss_peak_mb"], c: 2 },
      ] },
    { title: "Finalization latency p95", unit: "ms", fmt: v => Math.round(v).toLocaleString(),
      series: [
        { name: "soak load", path: ["passive", "finalization_p95_ms"], c: 0 },
        { name: "bench segments", path: ["active", "p95_ms"], c: 2 },
      ] },
  ];

  const W = 360, H = 180, PX = 44, PY = 18;
  const chartsEl = document.getElementById("charts");
  const tooltip = document.getElementById("tooltip");

  for (const def of CHARTS) {
    const seriesData = def.series.map(s => ({
      name: s.name, c: s.c,
      values: history.map(h => {
        const v = s.deriv ? s.deriv(g(h, s.path)) : g(h, s.path);
        return typeof v === "number" && isFinite(v) ? v : null;
      }),
    })).filter(s => s.values.some(v => v !== null));
    const all = seriesData.flatMap(s => s.values).filter(v => v !== null);
    if (all.length === 0) continue;
    const max = Math.max(...all) * 1.1 || 1;

    const x = i => history.length === 1 ? W / 2 : PX + (i * (W - PX - 8)) / (history.length - 1);
    const y = v => H - PY - (v / max) * (H - 2 * PY);

    let svg = "";
    for (let t = 0; t <= 2; t++) {
      const v = (max * t) / 2, yy = y(v);
      svg += `<line class="gridline" x1="${PX}" y1="${yy}" x2="${W - 8}" y2="${yy}"/>` +
             `<text class="axis-label" x="${PX - 5}" y="${yy + 3}" text-anchor="end">${def.fmt(v)}</text>`;
    }
    for (const s of seriesData) {
      const pts = s.values.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
      if (pts.length > 1) {
        svg += `<polyline fill="none" stroke="${S[s.c]}" stroke-width="2" stroke-linejoin="round" ` +
               `points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/>`;
      }
      for (const [px, py] of pts) {
        svg += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.5" fill="${S[s.c]}" ` +
               `stroke="var(--surface-2)" stroke-width="2"/>`;
      }
      const last = pts[pts.length - 1];
      if (last && seriesData.length > 1) {
        svg += `<text class="series-label" fill="${S[s.c]}" x="${Math.min(last[0] + 6, W - 4)}" ` +
               `y="${last[1] - 6}" text-anchor="end">${s.name}</text>`;
      }
    }
    dates.forEach((d, i) => {
      if (history.length <= 6 || i % Math.ceil(history.length / 6) === 0 || i === history.length - 1) {
        svg += `<text class="axis-label" x="${x(i)}" y="${H - 4}" text-anchor="middle">${d.slice(5)}</text>`;
      }
    });

    const fig = document.createElement("figure");
    const legend = seriesData.length > 1
      ? '<div class="legend">' + seriesData.map(s =>
          `<span><i class="swatch" style="background:${S[s.c]}"></i>${s.name}</span>`).join("") + "</div>"
      : "";
    fig.innerHTML = `<figcaption>${def.title} <span class="unit">${def.unit}</span></figcaption>` +
      legend + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${def.title} by week"></svg>`;
    fig.querySelector("svg").innerHTML = svg;

    const svgEl = fig.querySelector("svg");
    svgEl.addEventListener("mousemove", ev => {
      const rect = svgEl.getBoundingClientRect();
      const mx = ((ev.clientX - rect.left) / rect.width) * W;
      let best = 0, bestD = Infinity;
      for (let i = 0; i < history.length; i++) {
        const d = Math.abs(x(i) - mx);
        if (d < bestD) { bestD = d; best = i; }
      }
      const rows = seriesData.map(s => s.values[best] === null ? "" :
        `<span style="color:${S[s.c]}">●</span> ${s.name}: ${def.fmt(s.values[best])}<br>`).join("");
      tooltip.innerHTML = `<b>${dates[best]}</b>${rows}`;
      tooltip.style.display = "block";
      tooltip.style.left = (ev.clientX + 14) + "px";
      tooltip.style.top = (ev.clientY + 14) + "px";
    });
    svgEl.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
    chartsEl.appendChild(fig);
  }

  // Table view (accessibility relief + per-run artifact links)
  const rows = history.slice().reverse().map(h => {
    const p = h.passive || {}, a = h.active || {};
    const runLink = h.run.run_id && h.run.run_id !== "unknown"
      ? `<a href="${RUNS_URL}${h.run.run_id}">${h.run.run_id}</a>` : "-";
    const n = v => v == null ? "-" : (typeof v === "number" ? +v.toFixed(3) : v);
    return `<tr><td>${(h.run.date || "").slice(0, 10)}</td><td><code>${(h.run.target_sha || "").slice(0, 8)}</code></td>` +
      `<td class="num">${n(p.iterations)}</td><td class="num">${n(p.failure_rate)}</td>` +
      `<td class="num">${n(p.iterations_per_hour)}</td><td class="num">${n(p.rss_peak_mb)}</td>` +
      `<td class="num">${n(p.finalization_p95_ms)}</td><td class="num">${n(a.p95_ms)}</td>` +
      `<td>${runLink}</td></tr>`;
  }).join("");
  document.getElementById("table-slot").innerHTML =
    `<table><thead><tr><th>week</th><th>sha</th><th class="num">iters</th>` +
    `<th class="num">fail rate</th><th class="num">iters/h</th><th class="num">RSS MB</th>` +
    `<th class="num">final p95 ms</th><th class="num">bench p95 ms</th><th>run</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
})();
</script>
</body>
</html>
