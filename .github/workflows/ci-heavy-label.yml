name: CI Heavy Label

# Reruns CI when the ci-heavy label is added to a pull request, and when a
# ci-maintainers waiver takes effect: the pull request then has
# ci-heavy-waived and no ci-heavy. The rerun cancels the running CI run and
# its OCI jobs first. build_base reads the current labels, so a waived rerun
# skips the heavy pipeline, and both Integration Gate checks report skipped.
#
# ci.yml does not run on labeled events. A labeled run replaces the checks of
# the pull request head with pending checks. The merge queue adds the queued
# label when it queues a pull request, so the required checks became pending,
# the merge failed, and the dequeued label started another run (pull request
# #826, 2026-10-23). Only ci-heavy and ci-heavy-waived change what CI does, so
# only those labels rerun CI here. The rerun keeps the pull_request event of the run, and
# build_base reads the current labels to start the heavy pipeline.
#
# pull_request_target runs this file and the checked-out script from the base
# branch, never from the pull request, so the actions token never meets code
# that the pull request changed. A pull request from a fork gets no heavy run.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: ci-heavy-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    name: Rerun CI for ci-heavy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && github.event.label.name == 'ci-heavy') ||
        (contains(github.event.pull_request.labels.*.name, 'ci-heavy-waived') &&
          !contains(github.event.pull_request.labels.*.name, 'ci-heavy') &&
          ((github.event.action == 'labeled' && github.event.label.name == 'ci-heavy-waived') ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'ci-heavy'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      # No ref: under pull_request_target, checkout fetches the base branch.
      - name: Checkout base branch scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Rerun the newest CI run of the pull request head
        shell: bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WANT_HEAVY: ${{ contains(github.event.pull_request.labels.*.name, 'ci-heavy') }}
        run: bash .github/scripts/rerun-ci-for-heavy-label.sh
