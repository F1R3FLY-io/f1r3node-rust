# Scheduled supply-chain audit.
#
# The main CI `deny` job only runs on push / pull_request, so a newly-published
# RustSec advisory against an existing dependency goes unnoticed during quiet
# periods. This weekly cron closes that gap by running cargo-deny against the
# long-lived branches even when no one has pushed.
#
# NOTE: GitHub only fires `schedule` events from the workflow file on the
# repository's default branch (master). This file must be present on master for
# the cron to run; the matrix then checks each branch independently.
name: Scheduled cargo-deny

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: [dev, master]
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      # Guarded on existence because this workflow checks out dev and master
      # by ref while running the default branch's workflow file — a branch
      # that does not carry the crate yet must not fail its scheduled check.
      - name: Detect soak-charts crate
        id: soak_charts
        shell: bash
        run: echo "present=$([ -f scripts/soak-charts/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Standalone crate (not a workspace member), so the workspace check
      # above never sees its tree — same policy, own pass.
      - name: cargo-deny check (soak-charts)
        if: steps.soak_charts.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # --config is a `check` option (not global), so it rides in the
          # command string; the path is cwd-relative — the repo's own policy.
          command: check --config deny.toml advisories bans licenses sources
          manifest-path: scripts/soak-charts/Cargo.toml
          arguments: --all-features
