name: CI
run-name: ${{ inputs.target_sha != '' && format('CI [exact merge {0}]', inputs.target_sha) || github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

# Exact-merge dispatch metadata names the trusted default branch. The ci-target artifact names the candidate merge that the trusted workflow tests.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact synthetic merge SHA for a Deployment Train
        required: false
        default: ""
        type: string
      top_pull_request:
        description: Top pull request for target_sha
        required: false
        default: ""
        type: string
  push:
    branches:
      - dev
      - master
      - staging
      - trying
    tags:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# GitHub keeps one running item and one pending item in each concurrency group.
# Issue #267 showed that one shared push group can discard a pending test run.
# A push key includes its ref and SHA. Thus, a branch and tag at one SHA stay
# separate.
# A newer PR head cancels only the obsolete run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && format('exact-{0}', inputs.target_sha) || (github.event_name == 'push' && format('{0}-{1}', github.ref, github.sha) || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target_sha != '') }}

env:
  CARGO_TERM_COLOR: always
  # AES/SSE2 CPU features for gxhash (required by PathMap crate)
  RUSTFLAGS: "-C target-feature=+aes,+sse2"
  DOCKER_IMAGE_NAME: "f1r3flyindustries/f1r3fly-rust"

permissions:
  contents: read

jobs:
  # Resolve version + branch env vars once for downstream jobs.
  # Skip release-bump commits on branch pushes — the tag push handles publish.
  build_base:
    name: Build Base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    outputs:
      VERSION: ${{ steps.env.outputs.VERSION }}
      BRANCH: ${{ steps.env.outputs.BRANCH }}
      SYSTEM_INTEGRATION_REF: ${{ steps.env.outputs.SYSTEM_INTEGRATION_REF }}
      TARGET_SHA: ${{ steps.target.outputs.target_sha }}
      TOP_PULL_REQUEST: ${{ steps.target.outputs.top_pull_request }}
      HEAD_SHA: ${{ steps.target.outputs.head_sha }}
      BASE_SHA: ${{ steps.target.outputs.base_sha }}
      MERGE_BASE_SHA: ${{ steps.target.outputs.merge_base_sha }}
      RUN_HEAVY: ${{ steps.target.outputs.run_heavy }}
    steps:
      - name: Resolve source target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          REQUESTED_TOP_PULL_REQUEST: ${{ inputs.top_pull_request }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash -euo pipefail {0}
        run: |
          target="$REQUESTED_TARGET_SHA"
          top="$REQUESTED_TOP_PULL_REQUEST"
          head=""
          base=""
          merge_base=""
          if [ -z "$target" ] && [ -z "$top" ]; then
            target="$GITHUB_SHA"
            top=0
          else
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full commit SHA"; exit 1; }
            [[ "$top" =~ ^[1-9][0-9]*$ ]] || { echo "::error::top_pull_request must be a positive integer"; exit 1; }
            pull="$RUNNER_TEMP/top-pull.json"
            commit="$RUNNER_TEMP/target-commit.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${top}" > "$pull"
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .head.repo.full_name == $repo' "$pull" >/dev/null || {
              echo "::error::top pull request must be open and its head must be in ${GITHUB_REPOSITORY}"
              exit 1
            }
            observed="$(jq -r '.merge_commit_sha // empty' "$pull")"
            [ "$observed" = "$target" ] || {
              echo "::error::pull request #${top} synthetic merge changed from ${target} to ${observed:-unavailable}"
              exit 1
            }
            head="$(jq -r '.head.sha' "$pull")"
            base="$(jq -r '.base.sha' "$pull")"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${target}" > "$commit"
            jq -e --arg merge "$target" --arg head "$head" '
              .sha == $merge and (.parents | length == 2)
              and (.parents[0].sha | type == "string" and test("^[0-9a-f]{40}$"))
              and .parents[1].sha == $head' "$commit" >/dev/null || {
              echo "::error::target_sha does not join the current top pull request head"
              exit 1
            }
            merge_base="$(jq -r '.parents[0].sha' "$commit")"
            relationship="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${merge_base}" --jq '.status')"
            [ "$relationship" = ahead ] || [ "$relationship" = identical ] || {
              echo "::error::current pull request base is not an ancestor of the synthetic merge base"
              exit 1
            }
          fi
          run_heavy=false
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$top" -gt 0 ]; then
            run_heavy=true
          elif [ "$EVENT_NAME" = push ] && {
            [ "$EVENT_REF" = refs/heads/dev ] ||
            [ "$EVENT_REF" = refs/heads/master ] ||
            [[ "$EVENT_REF" == refs/tags/v* ]];
          }; then
            run_heavy=true
          elif [ "$EVENT_NAME" = pull_request ] \
            && [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
            && { [ "$PR_BASE_REF" = dev ] || [ "$PR_BASE_REF" = master ]; } \
            && [ "$PR_HEAD_REF" != dev ] && [ "$PR_HEAD_REF" != master ]; then
            run_heavy=true
          fi
          {
            echo "target_sha=$target"
            echo "top_pull_request=$top"
            echo "head_sha=$head"
            echo "base_sha=$base"
            echo "merge_base_sha=$merge_base"
            echo "run_heavy=$run_heavy"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0

      - name: Initialize Environment
        id: env
        shell: bash -exu -o pipefail {0}
        run: |
          git fetch origin --tags --force

          # Version from latest matching tag (falls back to short SHA if no tag yet)
          VERSION="$(git describe --tags --always)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # Derive BRANCH for image tag suffix logic downstream
          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            # Tag push: treat as master release path
            BRANCH="master"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"

          source .github/oci-validation.env
          if [[ ! "$SYSTEM_INTEGRATION_REF" =~ ^[0-9a-f]{40}$ && ! "$SYSTEM_INTEGRATION_REF" =~ ^refs/tags/[A-Za-z0-9._/-]+$ ]]; then
            echo "SYSTEM_INTEGRATION_REF must be a 40-character commit SHA or refs/tags/<tag>."
            exit 1
          fi
          echo "SYSTEM_INTEGRATION_REF=$SYSTEM_INTEGRATION_REF" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION | Branch: $BRANCH"

      - name: Write exact target evidence
        if: inputs.target_sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          TOP_PULL_REQUEST: ${{ steps.target.outputs.top_pull_request }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          MERGE_BASE_SHA: ${{ steps.target.outputs.merge_base_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash -euo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-target"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg target "$TARGET_SHA" \
            --argjson top "$TOP_PULL_REQUEST" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            --arg merge_base "$MERGE_BASE_SHA" --argjson run "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" '{
              schema_version: 1,
              repository: $repo,
              workflow: ".github/workflows/ci.yml",
              event: "workflow_dispatch",
              target_sha: $target,
              top_pull_request: $top,
              head_sha: $head,
              base_sha: $base,
              merge_base_sha: $merge_base,
              run_id: $run,
              run_attempt: $attempt
            }' > "$RUNNER_TEMP/ci-target/ci-target.json"

      - name: Upload exact target evidence
        if: inputs.target_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-target-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-target/ci-target.json
          retention-days: 90
          if-no-files-found: error

      - name: Verify OCI/system-integration pin consistency
        shell: bash -euo pipefail {0}
        run: |
          # SYSTEM_INTEGRATION_REF and the OCI installer pins are duplicated
          # because the reusable workflow (_integration-pipeline.yml) cannot
          # source .github/oci-validation.env at env-resolution time. Fail closed
          # if any duplicated value drifts, so the secret-bearing launch paths can
          # never diverge. Keep the key list in sync with those env blocks.
          env_file=.github/oci-validation.env
          oci_yml=.github/workflows/oci-validation.yml
          pipe_yml=.github/workflows/_integration-pipeline.yml
          soak_yml=.github/workflows/merge-recovery-soak.yml

          # value of a `KEY=value` line in a dotenv file
          envval() { grep -E "^$1=" "$2" | head -1 | cut -d= -f2- | sed -E 's/[[:space:]]*$//'; }
          # value of a `KEY: "value"` line in a workflow env block (quotes stripped)
          yval() { grep -E "^[[:space:]]*$1:" "$2" | head -1 | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*(#.*)?$//; s/"//g'; }

          fail=0
          check() { # label expected actual
            if [ "$2" != "$3" ]; then
              echo "::error::pin drift for $1: '$2' != '$3'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }

          check "SYSTEM_INTEGRATION_REF (oci-validation.env vs _integration-pipeline.yml)" \
            "$(envval SYSTEM_INTEGRATION_REF "$env_file")" \
            "$(yval SYSTEM_INTEGRATION_REF "$pipe_yml")"
          check "SYSTEM_INTEGRATION_REF (oci-validation.env vs merge-recovery-soak.yml)" \
            "$(envval SYSTEM_INTEGRATION_REF "$env_file")" \
            "$(yval SYSTEM_INTEGRATION_REF "$soak_yml")"

          for key in OCI_CLI_INSTALLER_URL OCI_CLI_INSTALLER_SHA256 OCI_CLI_INSTALLER_PY_SHA256 OCI_CLI_VERSION; do
            check "$key (oci-validation.yml vs _integration-pipeline.yml)" \
              "$(yval "$key" "$oci_yml")" \
              "$(yval "$key" "$pipe_yml")"
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::OCI/system-integration pins are out of sync across .github files; bump them together."
            exit 1
          fi

  lint:
    name: Lint
    needs: build_base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}

      # Deliberately the first step and deliberately in this job. `Lint` is a
      # required status check on devProtect and masterProtect, so a violation
      # blocks the merge; a guard living in a job that is merely a `needs:`
      # ancestor can surface as `skipped`, which required-check evaluation may
      # treat as satisfied. Placed ahead of the toolchain install so a breach of
      # the credential model fails in seconds rather than after a Rust build.
      - name: Verify workflow security invariants
        shell: bash -euo pipefail {0}
        run: bash .github/scripts/check-workflow-invariants.sh

      - name: Verify pre-push hook
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-pre-push-hook.sh

      - name: Verify stack CI gate
        shell: bash -euo pipefail {0}
        run: bash .github/scripts/test-ci-stack-gate.sh

      - name: Verify soak schedule routing
        shell: bash -euo pipefail {0}
        run: bash .github/scripts/test-soak-schedule-routing.sh

      - name: Verify system-integration node capability contract
        shell: bash -euo pipefail {0}
        run: bash .github/scripts/test-system-integration-node-capabilities.sh

      - name: Verify system-integration repin helper
        shell: bash -euo pipefail {0}
        run: scripts/test-repin-system-integration.sh

      - name: Verify release evidence
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-release-evidence.sh

      - name: Verify release gates
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-release-gates.sh

      - name: Verify release promotion
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-promote-release.sh

      - name: Verify release gate evidence
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-release-gate-evidence.sh

      - name: Verify deployment train validator
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-release-train.sh

      - name: Verify deployment train manifests
        shell: bash -euo pipefail {0}
        run: |
          for m in .github/deployment-trains/*.yml; do
            .github/scripts/release-train.sh validate-manifest "$m" >/dev/null && echo "ok: $m"
          done

      - name: Verify release workflows
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-release-workflows.sh

      - name: Verify coverage summary aggregation
        shell: bash -euo pipefail {0}
        run: .github/scripts/test-coverage-summary.sh

      - name: Verify soak summary aggregation
        shell: bash -euo pipefail {0}
        run: scripts/bench/test-write-soak-summary.sh

      - name: Verify soak verdicts
        shell: bash -euo pipefail {0}
        run: scripts/bench/test-aggregate-perf-report.sh

      - name: Verify latency benchmark readiness and finalization
        shell: bash -euo pipefail {0}
        run: bash scripts/bench/test-latency-benchmark.sh

      - name: Verify integration preflight driver
        shell: bash -euo pipefail {0}
        run: scripts/bench/test-run-integration-preflight.sh

      - name: Verify soak fail-closed driver
        shell: bash -euo pipefail {0}
        run: scripts/bench/test-run-merge-recovery-soak.sh

      - name: Verify soak dashboard restoration
        shell: bash -euo pipefail {0}
        run: scripts/bench/test-restore-soak-dashboard-run.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2 -D warnings"
        run: cargo clippy --workspace --all-targets

  deny:
    name: cargo-deny
    needs: build_base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      # The soak-charts publisher crate is deliberately not a workspace member
      # (see scripts/soak-charts/Cargo.toml), so the workspace check above
      # never sees its tree — it gets its own pass against the same policy.
      - name: cargo-deny check (soak-charts)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: scripts/soak-charts/Cargo.toml
          arguments: --all-features

  markdown_link_check:
    name: Markdown Link Check
    needs: build_base
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON('["dev", "master", "staging", "trying"]'), github.base_ref)
      || startsWith(github.base_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          # Scope: local file links plus repository-hosting URLs only.
          # The broad exclude drops every http(s) URL; the includes add
          # back github.com, raw.githubusercontent.com, and gitlab.com
          # (lychee includes take precedence over excludes). Local file
          # links are not http and are always checked. General-web URLs
          # (DOIs, publisher portals, project sites) were removed from
          # the blocking gate 2026-08-19: several domains answer GitHub
          # runner IPs differently from developer machines, so results
          # were vantage-dependent and not reproducible locally. The
          # non-blocking external sweep runs with the 60h stability soak
          # preflight instead. Fragment checking stays off: the repo
          # carries pre-existing broken anchors in docs/theory/slashing;
          # enable it after that debt is cleared. The accept list keeps
          # 403/429 (rate limits, bot checks) and 503/504 (transient
          # gateway states) from failing hosting-domain checks.
          args: >-
            --no-progress
            --exclude '^https?://'
            --include '^https?://(www\.)?github\.com'
            --include '^https?://raw\.githubusercontent\.com'
            --include '^https?://(www\.)?gitlab\.com'
            --max-retries 2
            --retry-wait-time 5
            --timeout 45
            --accept 200..=299,403,429,503,504
            './**/*.md'
          fail: true

  test:
    name: Test (${{ matrix.crate }})
    needs: [build_base, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rspace_plus_plus
          - rholang
          - shared
          - node
          - models
          - crypto
          - block-storage
          - comm
          - graphz
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.crate }}

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2 -D warnings"
          RUST_BACKTRACE: "1"
          RUST_MIN_STACK: "8388608"
        run: |
          ulimit -n 65536
          mkdir -p /tmp/test-logs
          # nextest runs all of the crate's unit + integration tests in one global
          # parallel pool (vs `cargo test`, which runs each test binary sequentially),
          # which is what keeps the ~930-test casper crate under the job timeout.
          # `--no-tests=pass` tolerates a crate whose only tests are doctests.
          cargo nextest run --release -p ${{ matrix.crate }} --no-tests=pass 2>&1 \
            | tee /tmp/test-logs/${{ matrix.crate }}.txt
          nt=${PIPESTATUS[0]}
          # nextest does NOT run doctests; run them explicitly to preserve the
          # coverage that plain `cargo test` provided.
          cargo test --release -p ${{ matrix.crate }} --doc 2>&1 \
            | tee /tmp/test-logs/${{ matrix.crate }}-doc.txt
          dt=${PIPESTATUS[0]}
          echo "nextest exit=$nt doctest exit=$dt"
          [ "$nt" -eq 0 ] && [ "$dt" -eq 0 ]

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.crate }}
          path: /tmp/test-logs/
          retention-days: 7

  # casper is the one crate whose suite does not reliably fit the shared
  # 30-minute test-job ceiling: ~23 minutes on a nominal runner (7m build +
  # 15m tests), which a degraded runner overran on 2026-08-27 with every
  # completed test passing. It runs here as two nextest count-partition
  # shards so each leg carries roughly half the test wall-clock. Larger
  # GitHub-hosted runners are not an option: the org's plan does not support
  # them, and OCI ephemeral runners are reserved for the approval-gated
  # heavy pipeline (shared daily instance quota).
  test_casper:
    name: Test (casper ${{ matrix.partition }}/2)
    needs: [build_base, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-casper

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests (shard ${{ matrix.partition }}/2)
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2 -D warnings"
          RUST_BACKTRACE: "1"
          RUST_MIN_STACK: "8388608"
        # Explicit pipefail: cargo's exit status survives the `tee` pipe, and
        # `|| var=$?` captures it without tripping `-e`. This avoids the
        # PIPESTATUS idiom, which silently depends on pipefail staying off.
        shell: bash -euo pipefail {0}
        run: |
          ulimit -n 65536
          mkdir -p /tmp/test-logs
          # `count:m/2` deals tests round-robin across the two shards, so the
          # slow convergence/recursion specs spread over both legs instead of
          # landing together. `--no-tests=pass` tolerates an empty shard.
          nt=0
          cargo nextest run --release -p casper --no-tests=pass \
            --partition count:${{ matrix.partition }}/2 2>&1 \
            | tee /tmp/test-logs/casper-${{ matrix.partition }}.txt || nt=$?
          # nextest does NOT run doctests, and doctests cannot be partitioned;
          # shard 1 runs them once for the whole crate.
          dt=0
          if [ "${{ matrix.partition }}" = "1" ]; then
            cargo test --release -p casper --doc 2>&1 \
              | tee /tmp/test-logs/casper-doc.txt || dt=$?
          fi
          echo "nextest exit=$nt doctest exit=$dt"
          [ "$nt" -eq 0 ] && [ "$dt" -eq 0 ]

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-casper-${{ matrix.partition }}
          path: /tmp/test-logs/
          retention-days: 7

  # Line coverage is report-only: it never gates a merge or release. It runs
  # on pull-request heads so reviewers see per-crate percentages before merge.
  # Codecov upload stays off until a maintainer sets the ENABLE_CODECOV
  # variable and the CODECOV_TOKEN secret.
  coverage:
    name: Coverage (${{ matrix.crate }})
    needs: [build_base, lint]
    if: >-
      github.event_name == 'pull_request'
      && needs.build_base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.crate == 'casper' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rspace_plus_plus
          - rholang
          - shared
          - node
          - models
          - crypto
          - block-storage
          - comm
          - graphz
          - casper
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-02-09
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage-${{ matrix.crate }}

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Install llvm-cov and nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-llvm-cov,nextest

      # nextest, not `cargo test`: same runner as the test matrix. `clean`
      # drops only the profraw so instrumented builds stay cached. Outputs go
      # to target/coverage because `clean` empties llvm-cov's own report dir.
      - name: Measure coverage
        env:
          RUST_BACKTRACE: "1"
          RUST_MIN_STACK: "8388608"
        shell: bash -euo pipefail {0}
        run: |
          ulimit -n 65536
          mkdir -p target/coverage
          cargo llvm-cov clean
          cargo llvm-cov nextest --release -p ${{ matrix.crate }} --no-tests=pass
          # Src-shipped test scaffolding is compiled for cross-crate test
          # consumers, so it can never be exercised by its own crate's run;
          # keep it out of the denominator. Must stay identical to the regex
          # in scripts/coverage.sh.
          ignore_regex='(/test_utils/|block-storage/src/rust/test/)'
          cargo llvm-cov report --release -p ${{ matrix.crate }} \
            --ignore-filename-regex "$ignore_regex" \
            --json --summary-only --output-path target/coverage/coverage-${{ matrix.crate }}.json
          cargo llvm-cov report --release -p ${{ matrix.crate }} \
            --ignore-filename-regex "$ignore_regex" \
            --lcov --output-path target/coverage/coverage-${{ matrix.crate }}.lcov

      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.crate }}
          path: |
            target/coverage/coverage-${{ matrix.crate }}.json
            target/coverage/coverage-${{ matrix.crate }}.lcov
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Codecov
        if: >-
          vars.ENABLE_CODECOV == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/coverage-${{ matrix.crate }}.lcov
          flags: ${{ matrix.crate }}
          fail_ci_if_error: false

  coverage_summary:
    name: Coverage Summary
    needs: [build_base, coverage]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.coverage.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build_base.outputs.TARGET_SHA }}
          persist-credentials: false

      - name: Prepare coverage directory
        shell: bash -euo pipefail {0}
        run: mkdir -p /tmp/coverage

      - name: Download coverage data
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: /tmp/coverage
          merge-multiple: true

      - name: Aggregate and publish summary
        shell: bash -euo pipefail {0}
        run: |
          .github/scripts/coverage-summary.sh /tmp/coverage > target-coverage-summary.md
          cat target-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: target-coverage-summary.md
          retention-days: 30

  # Ruleset gate. The branch ruleset requires a status check named exactly
  # `Test (casper)` (formerly the matrix leg's name). This collapses the two
  # shard jobs into that one required context, in the same style as the
  # per-arch integration aggregators below. `needs` on a matrix job resolves
  # to success only when every shard succeeds.
  test_casper_gate:
    name: Test (casper)
    needs: test_casper
    # Skip (rather than fail) when the shards never ran — e.g. lint failed —
    # matching how the former single `Test (casper)` leg reported.
    if: always() && needs.test_casper.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check casper shards
        shell: bash -e {0}
        run: |
          result="${{ needs.test_casper.result }}"
          if [ "$result" != "success" ]; then
            echo "casper shard matrix concluded: $result"
            exit 1
          fi
          echo "Both casper shards succeeded"

  # Heavy pipeline (native Docker build -> ephemeral OCI runner launch ->
  # integration matrix -> smoke) lives in the reusable _integration-pipeline.yml.
  pipeline:
    name: Heavy Pipeline
    needs: [build_base, lint]
    # A newer branch or PR head replaces obsolete heavy work. Version tags use
    # separate groups and run to completion. OCI launch remains globally locked.
    concurrency:
      group: ci-heavy-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && format('exact-{0}', inputs.target_sha) || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    if: needs.build_base.outputs.RUN_HEAVY == 'true'
    # `secrets: inherit` is required here, not incidental. A called workflow's
    # jobs do not receive `secrets.*` merely by naming an environment — the
    # caller must pass secrets down. Removing this line made the launch job's
    # OCI_* expressions resolve to empty strings, and the OCI CLI rejected the
    # resulting config as malformed (runs 30495007422 and 30498890544); the same
    # commit with the line restored passed (run 30495738655). Do not "tighten"
    # the credential scoping by deleting it.
    uses: ./.github/workflows/_integration-pipeline.yml
    with:
      gated: false
      checkout_ref: ${{ needs.build_base.outputs.TARGET_SHA }}
    secrets: inherit

  # Per-arch aggregators. The branch ruleset requires status checks named
  # exactly `Integration Tests (amd64)` / `(arm64)`. These collapse the reusable
  # pipeline's per-arch matrix jobs into one ruleset gate per arch. They use
  # `contains(...)` (not `startswith`) because reusable-workflow job names are
  # prefixed with the caller job id ("Heavy Pipeline / Integration Tests (...)").
  # Each gate checks only its two architecture slots. A failure in another
  # architecture does not change this gate's result.
  integration_tests_amd64:
    name: Integration Tests (amd64)
    needs: pipeline
    if: always() && needs.pipeline.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check amd64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          slots=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (amd64-")) | "\(.conclusion // "pending")\t\(.name)"')
          slot_count=$(printf '%s\n' "$slots" | grep -c . || true)
          if [ "$slot_count" -ne 4 ]; then
            echo "Expected 4 amd64 integration test slots (docker, subprocess, plus the two ucc legs), but found $slot_count:"
            printf '%s\n' "$slots"
            exit 1
          fi
          failures=$(printf '%s\n' "$slots" | awk -F '\t' '$1 != "success"')
          if [ -n "$failures" ]; then
            echo "amd64 integration test failures:"
            printf '%s\n' "$failures"
            exit 1
          fi
          echo "All amd64 integration test slots succeeded"

  integration_tests_arm64:
    name: Integration Tests (arm64)
    needs: pipeline
    if: always() && needs.pipeline.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check arm64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          slots=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (arm64-")) | "\(.conclusion // "pending")\t\(.name)"')
          slot_count=$(printf '%s\n' "$slots" | grep -c . || true)
          if [ "$slot_count" -ne 2 ]; then
            echo "Expected 2 arm64 integration test slots, but found $slot_count:"
            printf '%s\n' "$slots"
            exit 1
          fi
          failures=$(printf '%s\n' "$slots" | awk -F '\t' '$1 != "success"')
          if [ -n "$failures" ]; then
            echo "arm64 integration test failures:"
            printf '%s\n' "$failures"
            exit 1
          fi
          echo "All arm64 integration test slots succeeded"

  # Publish Docker image to Docker Hub + OCIR.
  # Runs on release tag pushes and on push to dev/master (with suffix).
  release_docker_image:
    name: Release Docker Image
    timeout-minutes: 15
    concurrency:
      group: ci-image-publish-${{ github.ref }}
      cancel-in-progress: false
    needs:
      - build_base
      - lint
      - deny
      - markdown_link_check
      - test
      - pipeline
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/dev'
      )
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && 'protected-branch-image-publish' || 'ephemeral-launch' }}
    steps:
      - name: Check branch publish tip
        id: publish_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -euo pipefail {0}
        run: |
          cat > "$RUNNER_TEMP/branch-tip-guard.sh" <<'GUARD'
          branch_tip_status() {
            if [[ "$GITHUB_REF" != refs/heads/* ]]; then
              echo current
              return 0
            fi

            local branch tip attempt
            branch="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              if tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"; then
                if [[ "$tip" == "$GITHUB_SHA" ]]; then
                  echo current
                else
                  echo stale
                fi
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 2))
              fi
            done
            echo "Unable to read the tip of $GITHUB_REF after 3 attempts." >&2
            return 1
          }

          publish_mutable() {
            local status
            status="$(branch_tip_status)" || return 1
            if [[ "$status" == stale ]]; then
              echo "Skip mutable publication because $GITHUB_SHA is not the tip of $GITHUB_REF."
              return 0
            fi
            "$@"
          }
          GUARD

          source "$RUNNER_TEMP/branch-tip-guard.sh"
          status="$(branch_tip_status)"
          if [[ "$status" == stale ]]; then
            echo "Skip image publication because $GITHUB_SHA is not the tip of $GITHUB_REF."
            publish=false
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Checkout (for version)
        if: steps.publish_gate.outputs.publish == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load AMD64 Docker Image
        if: steps.publish_gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp/amd64

      - name: Import AMD64 Docker Image
        if: steps.publish_gate.outputs.publish == 'true'
        shell: bash -euxo pipefail {0}
        run: zcat /tmp/amd64/rust-node-docker.tar.gz | docker image load

      - name: Load ARM64 Docker Image
        if: steps.publish_gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-arm64
          path: /tmp/arm64

      - name: Import ARM64 Docker Image
        if: steps.publish_gate.outputs.publish == 'true'
        shell: bash -euxo pipefail {0}
        run: zcat /tmp/arm64/rust-node-docker.tar.gz | docker image load

      - name: Log in to Docker Hub
        if: steps.publish_gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker Image
        if: steps.publish_gate.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build_base.outputs.VERSION }}
          BRANCH: ${{ needs.build_base.outputs.BRANCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -exu -o pipefail {0}
        run: |
          source "$RUNNER_TEMP/branch-tip-guard.sh"
          SOURCE_AMD64="${DOCKER_IMAGE_NAME}:amd64"
          SOURCE_ARM64="${DOCKER_IMAGE_NAME}:arm64"

          SUFFIX=""
          CI_RUN=""
          TAG_PREFIX=""
          IS_TAG_PUSH="false"

          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            IS_TAG_PUSH="true"
          fi

          # Branch-based tagging:
          #   trying  → separate image stream `${IMAGE}-trying`, per-CI-run tags
          #   dev     → version tag prefixed `dev-${VERSION}`, channel pointer :dev
          #   staging → version tag prefixed `staging-${VERSION}`, channel pointer :staging
          #   master  → plain :${VERSION}, channel pointer :latest only on tag push
          if [[ "$BRANCH" == "trying" ]]; then
            SUFFIX="-trying"
            CI_RUN="-ci-${GITHUB_RUN_NUMBER}"
          elif [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            TAG_PREFIX="dev-"
          elif [[ "$BRANCH" == "staging" ]]; then
            TAG_PREFIX="staging-"
          fi

          IMAGE_NAME="${DOCKER_IMAGE_NAME}${SUFFIX}"
          IMG_VERSION_RAW="${IMAGE_NAME}:${TAG_PREFIX}${VERSION}${CI_RUN}"
          IMG_VERSION="${IMG_VERSION_RAW//[+]/__}"

          # Channel pointer ("latest of this channel")
          if [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            IMG_LATEST="${IMAGE_NAME}:dev"
          elif [[ "$BRANCH" == "staging" ]]; then
            IMG_LATEST="${IMAGE_NAME}:staging"
          else
            IMG_LATEST="${IMAGE_NAME}:latest"
          fi

          # Tag and push arch-specific images
          docker tag "$SOURCE_AMD64" "${IMG_VERSION}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_VERSION}-arm64"
          docker push "${IMG_VERSION}-amd64"
          docker push "${IMG_VERSION}-arm64"

          # Multi-arch version manifest
          docker manifest create "${IMG_VERSION}" --amend "${IMG_VERSION}-amd64" "${IMG_VERSION}-arm64"
          docker manifest push "${IMG_VERSION}"

          # Mutable channel pointers
          docker tag "$SOURCE_AMD64" "${IMG_LATEST}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_LATEST}-arm64"
          publish_mutable docker push "${IMG_LATEST}-amd64"
          publish_mutable docker push "${IMG_LATEST}-arm64"
          docker manifest create "${IMG_LATEST}" --amend "${IMG_LATEST}-amd64" "${IMG_LATEST}-arm64"
          publish_mutable docker manifest push "${IMG_LATEST}"

      - name: Log in to OCIR
        if: steps.publish_gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Publish to OCIR
        if: steps.publish_gate.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build_base.outputs.VERSION }}
          BRANCH: ${{ needs.build_base.outputs.BRANCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -exu -o pipefail {0}
        run: |
          source "$RUNNER_TEMP/branch-tip-guard.sh"
          OCIR_BASE="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPO }}"
          SOURCE_AMD64="${DOCKER_IMAGE_NAME}:amd64"
          SOURCE_ARM64="${DOCKER_IMAGE_NAME}:arm64"

          SUFFIX=""
          CI_RUN=""
          TAG_PREFIX=""
          IS_TAG_PUSH="false"

          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            IS_TAG_PUSH="true"
          fi

          if [[ "$BRANCH" == "trying" ]]; then
            SUFFIX="-trying"
            CI_RUN="-ci-${GITHUB_RUN_NUMBER}"
          elif [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            TAG_PREFIX="dev-"
          elif [[ "$BRANCH" == "staging" ]]; then
            TAG_PREFIX="staging-"
          fi

          OCIR_IMAGE="${OCIR_BASE}${SUFFIX}"
          IMG_VERSION_RAW="${OCIR_IMAGE}:${TAG_PREFIX}${VERSION}${CI_RUN}"
          IMG_VERSION="${IMG_VERSION_RAW//[+]/__}"

          if [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            IMG_LATEST="${OCIR_IMAGE}:dev"
          elif [[ "$BRANCH" == "staging" ]]; then
            IMG_LATEST="${OCIR_IMAGE}:staging"
          else
            IMG_LATEST="${OCIR_IMAGE}:latest"
          fi

          docker tag "$SOURCE_AMD64" "${IMG_VERSION}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_VERSION}-arm64"
          docker push "${IMG_VERSION}-amd64"
          docker push "${IMG_VERSION}-arm64"

          docker manifest create "${IMG_VERSION}" --amend "${IMG_VERSION}-amd64" "${IMG_VERSION}-arm64"
          docker manifest push "${IMG_VERSION}"

          docker tag "$SOURCE_AMD64" "${IMG_LATEST}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_LATEST}-arm64"
          publish_mutable docker push "${IMG_LATEST}-amd64"
          publish_mutable docker push "${IMG_LATEST}-arm64"
          docker manifest create "${IMG_LATEST}" --amend "${IMG_LATEST}-amd64" "${IMG_LATEST}-arm64"
          publish_mutable docker manifest push "${IMG_LATEST}"

      - name: Report image publication result
        if: always()
        env:
          PUBLISH_ALLOWED: ${{ steps.publish_gate.outputs.publish }}
          PUBLICATION_STATUS: ${{ job.status }}
        shell: bash -euo pipefail {0}
        run: |
          if [[ "$PUBLICATION_STATUS" != success ]]; then
            result=failed
          elif [[ "$PUBLISH_ALLOWED" != true ]]; then
            result=skipped-stale-sha
          else
            result=published
          fi
          {
            echo "### Image publication"
            printf -- '- Result: `%s`\n' "$result"
            printf -- '- Ref: `%s`\n' "$GITHUB_REF"
            printf -- '- SHA: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub release with multi-arch binaries attached (tag pushes only).
  release_packages:
    name: Release Packages
    concurrency:
      group: ci-package-publish-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - lint
      - deny
      - markdown_link_check
      - test
      - pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v5

      - name: Load Docker artifact (amd64)
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp/amd64

      - name: Load Docker artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-arm64
          path: /tmp/arm64

      - name: Extract amd64 binary from Docker image
        shell: bash -ex {0}
        run: |
          mkdir -p /tmp/artifacts
          zcat /tmp/amd64/rust-node-docker.tar.gz | docker image load
          CONTAINER_ID=$(docker create ${{ env.DOCKER_IMAGE_NAME }}:amd64)
          docker cp "$CONTAINER_ID:/opt/docker/bin/node" /tmp/artifacts/f1r3node-linux-amd64
          docker rm "$CONTAINER_ID"
          test -f /tmp/artifacts/f1r3node-linux-amd64 || { echo 'amd64 binary extraction failed'; exit 1; }

      - name: Extract arm64 binary from Docker image
        shell: bash -ex {0}
        run: |
          zcat /tmp/arm64/rust-node-docker.tar.gz | docker image load
          CONTAINER_ID=$(docker create --platform linux/arm64 ${{ env.DOCKER_IMAGE_NAME }}:arm64)
          docker cp "$CONTAINER_ID:/opt/docker/bin/node" /tmp/artifacts/f1r3node-linux-arm64
          docker rm "$CONTAINER_ID"
          test -f /tmp/artifacts/f1r3node-linux-arm64 || { echo 'arm64 binary extraction failed'; exit 1; }

      - name: Determine release type
        id: release_type
        shell: bash -ex {0}
        run: |
          # Tag format: refs/tags/v{MAJOR}.{MINOR}.{PATCH}[-prerelease]
          # A bare vX.Y.0 (no pre-release suffix) is a stable release; any
          # pre-release suffix or non-zero PATCH is a GitHub prerelease.
          # Unrecognized tag shapes fail the job rather than defaulting.
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            PATCH="${BASH_REMATCH[3]}"
            PRE="${BASH_REMATCH[4]}"
            if [ -z "$PRE" ] && [ "$PATCH" = "0" ]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Unexpected release tag '$TAG'; expected vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Extract release notes for this version
        shell: bash -ex {0}
        run: |
          # Extract the latest version section from CHANGELOG.md
          awk '/^## \[/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md

      - name: Update release and release artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/artifacts/f1r3node-linux-amd64,/tmp/artifacts/f1r3node-linux-arm64
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          draft: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
