name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - staging
      - trying
    tags:
      - "**"
  pull_request:
    branches:
      - dev
      - master
      - staging
      - trying
      - "feature/**"

# Concurrency: PRs run in parallel (one group per ref) for fast feedback; pushes
# (dev/master/staging/trying/tags) share a single group so merge and release runs
# serialize rather than piling up independent 4-VM OCI matrices. Nothing is
# cancelled mid-flight — a re-push queues behind its own in-flight run, so release
# jobs and long integration runs always reach completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'push' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # AES/SSE2 CPU features for gxhash (required by PathMap crate)
  RUSTFLAGS: "-C target-feature=+aes,+sse2"
  DOCKER_IMAGE_NAME: "f1r3flyindustries/f1r3fly-rust"

permissions:
  contents: read

jobs:
  # Resolve version + branch env vars once for downstream jobs.
  # Skip release-bump commits on branch pushes — the tag push handles publish.
  build_base:
    name: Build Base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    outputs:
      VERSION: ${{ steps.env.outputs.VERSION }}
      BRANCH: ${{ steps.env.outputs.BRANCH }}
      SYSTEM_INTEGRATION_REF: ${{ steps.env.outputs.SYSTEM_INTEGRATION_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Environment
        id: env
        shell: bash -exu -o pipefail {0}
        run: |
          git fetch origin --tags --force

          # Version from latest matching tag (falls back to short SHA if no tag yet)
          VERSION="$(git describe --tags --always)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # Derive BRANCH for image tag suffix logic downstream
          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            # Tag push: treat as master release path
            BRANCH="master"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"

          source .github/oci-validation.env
          if [[ ! "$SYSTEM_INTEGRATION_REF" =~ ^[0-9a-f]{40}$ && ! "$SYSTEM_INTEGRATION_REF" =~ ^refs/tags/[A-Za-z0-9._/-]+$ ]]; then
            echo "SYSTEM_INTEGRATION_REF must be a 40-character commit SHA or refs/tags/<tag>."
            exit 1
          fi
          echo "SYSTEM_INTEGRATION_REF=$SYSTEM_INTEGRATION_REF" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION | Branch: $BRANCH"

      - name: Verify OCI/system-integration pin consistency
        shell: bash -euo pipefail {0}
        run: |
          # SYSTEM_INTEGRATION_REF and the OCI installer pins are duplicated
          # because the reusable workflow (_integration-pipeline.yml) cannot
          # source .github/oci-validation.env at env-resolution time. Fail closed
          # if any duplicated value drifts, so the secret-bearing launch paths can
          # never diverge. Keep the key list in sync with those env blocks.
          env_file=.github/oci-validation.env
          oci_yml=.github/workflows/oci-validation.yml
          pipe_yml=.github/workflows/_integration-pipeline.yml

          # value of a `KEY=value` line in a dotenv file
          envval() { grep -E "^$1=" "$2" | head -1 | cut -d= -f2- | sed -E 's/[[:space:]]*$//'; }
          # value of a `KEY: "value"` line in a workflow env block (quotes stripped)
          yval() { grep -E "^[[:space:]]*$1:" "$2" | head -1 | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*(#.*)?$//; s/"//g'; }

          fail=0
          check() { # label expected actual
            if [ "$2" != "$3" ]; then
              echo "::error::pin drift for $1: '$2' != '$3'"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }

          check "SYSTEM_INTEGRATION_REF (oci-validation.env vs _integration-pipeline.yml)" \
            "$(envval SYSTEM_INTEGRATION_REF "$env_file")" \
            "$(yval SYSTEM_INTEGRATION_REF "$pipe_yml")"

          for key in OCI_CLI_INSTALLER_URL OCI_CLI_INSTALLER_SHA256 OCI_CLI_INSTALLER_PY_SHA256 OCI_CLI_VERSION; do
            check "$key (oci-validation.yml vs _integration-pipeline.yml)" \
              "$(yval "$key" "$oci_yml")" \
              "$(yval "$key" "$pipe_yml")"
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::OCI/system-integration pins are out of sync across .github files; bump them together."
            exit 1
          fi

  lint:
    name: Lint
    needs: build_base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2 -D warnings"
        run: cargo clippy --workspace --all-targets

  deny:
    name: cargo-deny
    needs: build_base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  markdown_link_check:
    name: Markdown Link Check
    needs: build_base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 is accepted alongside 200..=299 and 429 because many
          # citations in `docs/theory/slashing/methodology/references.md`
          # are DOIs that redirect to publisher portals (ACM DL, Oxford
          # Academic, IEEE Xplore, IACR ePrint, Medium) which 403 on
          # unauthenticated/bot requests. A 403 response from these
          # endpoints still proves the URL is well-formed and the
          # resource exists; a real broken link would 404. The 429
          # allowance for rate-limited fetches is unchanged. 503 is
          # accepted because it is transient by definition (seen from
          # rust-fuzz.github.io during a GitHub Pages blip); a genuinely
          # dead link returns 404/410, not 503.
          args: >-
            --no-progress
            --exclude-loopback
            --exclude 'https://www\.gutenberg\.org/ebooks/132'
            --max-retries 2
            --retry-wait-time 5
            --accept 200..=299,403,429,503
            './**/*.md'
          fail: true

  test:
    name: Test (${{ matrix.crate }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - casper
          - rspace_plus_plus
          - rholang
          - shared
          - node
          - models
          - crypto
          - block-storage
          - comm
          - graphz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.crate }}

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Run tests
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2 -D warnings"
          RUST_BACKTRACE: "1"
          RUST_MIN_STACK: "8388608"
        run: |
          ulimit -n 65536
          mkdir -p /tmp/test-logs
          cargo test --release -p ${{ matrix.crate }} 2>&1 | tee /tmp/test-logs/${{ matrix.crate }}.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.crate }}
          path: /tmp/test-logs/
          retention-days: 7

  # Heavy pipeline (native Docker build -> ephemeral OCI runner launch ->
  # integration matrix -> smoke) lives in the reusable _integration-pipeline.yml.
  # This call runs it for INTERNAL events only (pushes + same-repo PRs), which
  # receive secrets normally and need no approval gate (gated: false). Fork PRs
  # cannot get secrets on a `pull_request` event, so they skip this job and are
  # served by ci-fork-pr.yml (pull_request_target, maintainer-gated) instead.
  #
  # Promotion PRs (head is a push-covered branch: dev/staging/master/trying)
  # also skip: the push run on the identical commit already runs the identical
  # pipeline, so the PR-event copy would only double OCI VM creations against
  # the tenancy's daily limit. Required checks are commit-scoped — the push
  # run's aggregator results land on the same SHA and gate the PR; the
  # PR-side aggregators skip alongside (skipped = passing, same semantics the
  # fork path relies on) and finish long before the push run's real results,
  # so the real results are the latest and win.
  pipeline:
    name: Heavy Pipeline
    needs: lint
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.fork == false
      && !contains(fromJSON('["dev", "staging", "master", "trying"]'), github.event.pull_request.head.ref))
    uses: ./.github/workflows/_integration-pipeline.yml
    with:
      gated: false
    secrets: inherit

  # Per-arch aggregators. The branch ruleset requires status checks named
  # exactly `Integration Tests (amd64)` / `(arm64)`. These collapse the reusable
  # pipeline's per-arch matrix jobs into one ruleset gate per arch. They use
  # `contains(...)` (not `startswith`) because reusable-workflow job names are
  # prefixed with the caller job id ("Heavy Pipeline / Integration Tests (...)").
  # Internal-only: fork PRs get this check from ci-fork-pr.yml instead, so this
  # one skips for them (a skipped required check is treated as passing).
  # Promotion PRs skip too, mirroring the pipeline job's dedupe condition.
  integration_tests_amd64:
    name: Integration Tests (amd64)
    needs: pipeline
    if: >-
      always()
      && (github.event_name == 'push'
      || (github.event.pull_request.head.repo.fork == false
      && !contains(fromJSON('["dev", "staging", "master", "trying"]'), github.event.pull_request.head.ref)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check amd64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          if [ "${{ needs.pipeline.result }}" = "failure" ] || [ "${{ needs.pipeline.result }}" = "cancelled" ]; then
            echo "Heavy Pipeline did not succeed (result: ${{ needs.pipeline.result }}); failing gate."
            exit 1
          fi
          failures=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (amd64-")) | select(.conclusion != "success") | "\(.conclusion)\t\(.name)"')
          if [ -n "$failures" ]; then
            echo "amd64 integration test failures:"
            echo "$failures"
            exit 1
          fi
          echo "All amd64 integration test slots succeeded"

  integration_tests_arm64:
    name: Integration Tests (arm64)
    needs: pipeline
    if: >-
      always()
      && (github.event_name == 'push'
      || (github.event.pull_request.head.repo.fork == false
      && !contains(fromJSON('["dev", "staging", "master", "trying"]'), github.event.pull_request.head.ref)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check arm64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          if [ "${{ needs.pipeline.result }}" = "failure" ] || [ "${{ needs.pipeline.result }}" = "cancelled" ]; then
            echo "Heavy Pipeline did not succeed (result: ${{ needs.pipeline.result }}); failing gate."
            exit 1
          fi
          failures=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (arm64-")) | select(.conclusion != "success") | "\(.conclusion)\t\(.name)"')
          if [ -n "$failures" ]; then
            echo "arm64 integration test failures:"
            echo "$failures"
            exit 1
          fi
          echo "All arm64 integration test slots succeeded"

  # Publish Docker image to Docker Hub + OCIR.
  # Runs on tag pushes and on push to dev/master/staging/trying (with suffix).
  release_docker_image:
    name: Release Docker Image
    timeout-minutes: 15
    needs:
      - build_base
      - lint
      - deny
      - markdown_link_check
      - test
      - pipeline
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/') ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/trying'
      )
    runs-on: ubuntu-latest
    environment: ephemeral-launch
    steps:
      - name: Checkout (for version)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load AMD64 Docker Image
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp/amd64

      - name: Import AMD64 Docker Image
        shell: bash -ex {0}
        run: zcat /tmp/amd64/rust-node-docker.tar.gz | docker image load

      - name: Load ARM64 Docker Image
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-arm64
          path: /tmp/arm64

      - name: Import ARM64 Docker Image
        shell: bash -ex {0}
        run: zcat /tmp/arm64/rust-node-docker.tar.gz | docker image load

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker Image
        env:
          VERSION: ${{ needs.build_base.outputs.VERSION }}
          BRANCH: ${{ needs.build_base.outputs.BRANCH }}
        shell: bash -exu -o pipefail {0}
        run: |
          SOURCE_AMD64="${DOCKER_IMAGE_NAME}:amd64"
          SOURCE_ARM64="${DOCKER_IMAGE_NAME}:arm64"

          SUFFIX=""
          CI_RUN=""
          TAG_PREFIX=""
          IS_TAG_PUSH="false"

          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            IS_TAG_PUSH="true"
          fi

          # Branch-based tagging:
          #   trying  → separate image stream `${IMAGE}-trying`, per-CI-run tags
          #   dev     → version tag prefixed `dev-${VERSION}`, channel pointer :dev
          #   staging → version tag prefixed `staging-${VERSION}`, channel pointer :staging
          #   master  → plain :${VERSION}, channel pointer :latest only on tag push
          if [[ "$BRANCH" == "trying" ]]; then
            SUFFIX="-trying"
            CI_RUN="-ci-${GITHUB_RUN_NUMBER}"
          elif [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            TAG_PREFIX="dev-"
          elif [[ "$BRANCH" == "staging" ]]; then
            TAG_PREFIX="staging-"
          fi

          IMAGE_NAME="${DOCKER_IMAGE_NAME}${SUFFIX}"
          IMG_VERSION_RAW="${IMAGE_NAME}:${TAG_PREFIX}${VERSION}${CI_RUN}"
          IMG_VERSION="${IMG_VERSION_RAW//[+]/__}"

          # Channel pointer ("latest of this channel")
          if [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            IMG_LATEST="${IMAGE_NAME}:dev"
          elif [[ "$BRANCH" == "staging" ]]; then
            IMG_LATEST="${IMAGE_NAME}:staging"
          else
            IMG_LATEST="${IMAGE_NAME}:latest"
          fi

          # Tag and push arch-specific images
          docker tag "$SOURCE_AMD64" "${IMG_VERSION}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_VERSION}-arm64"
          docker push "${IMG_VERSION}-amd64"
          docker push "${IMG_VERSION}-arm64"

          docker tag "$SOURCE_AMD64" "${IMG_LATEST}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_LATEST}-arm64"
          docker push "${IMG_LATEST}-amd64"
          docker push "${IMG_LATEST}-arm64"

          # Multi-arch manifests
          docker manifest create "${IMG_VERSION}" --amend "${IMG_VERSION}-amd64" "${IMG_VERSION}-arm64"
          docker manifest push "${IMG_VERSION}"
          docker manifest create "${IMG_LATEST}" --amend "${IMG_LATEST}-amd64" "${IMG_LATEST}-arm64"
          docker manifest push "${IMG_LATEST}"

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Publish to OCIR
        env:
          VERSION: ${{ needs.build_base.outputs.VERSION }}
          BRANCH: ${{ needs.build_base.outputs.BRANCH }}
        shell: bash -exu -o pipefail {0}
        run: |
          OCIR_BASE="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPO }}"
          SOURCE_AMD64="${DOCKER_IMAGE_NAME}:amd64"
          SOURCE_ARM64="${DOCKER_IMAGE_NAME}:arm64"

          SUFFIX=""
          CI_RUN=""
          TAG_PREFIX=""
          IS_TAG_PUSH="false"

          if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            IS_TAG_PUSH="true"
          fi

          if [[ "$BRANCH" == "trying" ]]; then
            SUFFIX="-trying"
            CI_RUN="-ci-${GITHUB_RUN_NUMBER}"
          elif [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            TAG_PREFIX="dev-"
          elif [[ "$BRANCH" == "staging" ]]; then
            TAG_PREFIX="staging-"
          fi

          OCIR_IMAGE="${OCIR_BASE}${SUFFIX}"
          IMG_VERSION_RAW="${OCIR_IMAGE}:${TAG_PREFIX}${VERSION}${CI_RUN}"
          IMG_VERSION="${IMG_VERSION_RAW//[+]/__}"

          if [[ "$BRANCH" == "dev" && "$IS_TAG_PUSH" == "false" ]]; then
            IMG_LATEST="${OCIR_IMAGE}:dev"
          elif [[ "$BRANCH" == "staging" ]]; then
            IMG_LATEST="${OCIR_IMAGE}:staging"
          else
            IMG_LATEST="${OCIR_IMAGE}:latest"
          fi

          docker tag "$SOURCE_AMD64" "${IMG_VERSION}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_VERSION}-arm64"
          docker push "${IMG_VERSION}-amd64"
          docker push "${IMG_VERSION}-arm64"

          docker tag "$SOURCE_AMD64" "${IMG_LATEST}-amd64"
          docker tag "$SOURCE_ARM64" "${IMG_LATEST}-arm64"
          docker push "${IMG_LATEST}-amd64"
          docker push "${IMG_LATEST}-arm64"

          docker manifest create "${IMG_VERSION}" --amend "${IMG_VERSION}-amd64" "${IMG_VERSION}-arm64"
          docker manifest push "${IMG_VERSION}"
          docker manifest create "${IMG_LATEST}" --amend "${IMG_LATEST}-amd64" "${IMG_LATEST}-arm64"
          docker manifest push "${IMG_LATEST}"

  # GitHub release with multi-arch binaries attached (tag pushes only).
  release_packages:
    name: Release Packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - lint
      - deny
      - markdown_link_check
      - test
      - pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Load Docker artifact (amd64)
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp/amd64

      - name: Load Docker artifact (arm64)
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-arm64
          path: /tmp/arm64

      - name: Extract amd64 binary from Docker image
        shell: bash -ex {0}
        run: |
          mkdir -p /tmp/artifacts
          zcat /tmp/amd64/rust-node-docker.tar.gz | docker image load
          CONTAINER_ID=$(docker create ${{ env.DOCKER_IMAGE_NAME }}:amd64)
          docker cp "$CONTAINER_ID:/opt/docker/bin/node" /tmp/artifacts/f1r3node-linux-amd64
          docker rm "$CONTAINER_ID"
          test -f /tmp/artifacts/f1r3node-linux-amd64 || { echo 'amd64 binary extraction failed'; exit 1; }

      - name: Extract arm64 binary from Docker image
        shell: bash -ex {0}
        run: |
          zcat /tmp/arm64/rust-node-docker.tar.gz | docker image load
          CONTAINER_ID=$(docker create --platform linux/arm64 ${{ env.DOCKER_IMAGE_NAME }}:arm64)
          docker cp "$CONTAINER_ID:/opt/docker/bin/node" /tmp/artifacts/f1r3node-linux-arm64
          docker rm "$CONTAINER_ID"
          test -f /tmp/artifacts/f1r3node-linux-arm64 || { echo 'arm64 binary extraction failed'; exit 1; }

      - name: Determine release type
        id: release_type
        shell: bash -ex {0}
        run: |
          # Tag format: refs/tags/v{MAJOR}.{MINOR}.{PATCH}[-prerelease]
          # A bare vX.Y.0 (no pre-release suffix) is a stable release; any
          # pre-release suffix or non-zero PATCH is a GitHub prerelease.
          # Unrecognized tag shapes fail the job rather than defaulting.
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            PATCH="${BASH_REMATCH[3]}"
            PRE="${BASH_REMATCH[4]}"
            if [ -z "$PRE" ] && [ "$PATCH" = "0" ]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Unexpected release tag '$TAG'; expected vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - name: Extract release notes for this version
        shell: bash -ex {0}
        run: |
          # Extract the latest version section from CHANGELOG.md
          awk '/^## \[/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md

      - name: Update release and release artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/artifacts/f1r3node-linux-amd64,/tmp/artifacts/f1r3node-linux-arm64
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          draft: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
