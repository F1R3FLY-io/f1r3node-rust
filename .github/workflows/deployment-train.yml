name: Deployment Train

# Train setup (docs/release-process.md section 13.2). Validates a reviewed
# manifest, verifies the member chain of a stack through the GitHub API,
# verifies the source version, and secures a successful full CI run for the
# exact head SHA. The train record it produces is the reviewed intent plus
# every member head observed at setup; later re-validation and promotion
# compare against it.
#
# Scope of this workflow today: steps 1 to 9 of section 13.2 for both
# single-train and stack manifests, and the non-publishing rehearsal.
# Publishing trains stop after step 9 with a held summary: the train canary
# (section 4.2 tag format through canary-publish.yml) is the next increment.
#
# Every step here is read-only except the optional ci.yml dispatch, which
# needs actions: write. No tag, release, image, or branch is created.

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Manifest path under .github/deployment-trains/ (for example .github/deployment-trains/key-contention.yml)
        required: true
        type: string
      wait_for_ci:
        description: When no successful ci.yml run exists for head_sha, dispatch one and wait for it (up to the job timeout)
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: deployment-train-${{ inputs.manifest_path }}
  cancel-in-progress: false

jobs:
  setup:
    name: Train Setup
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      train_id: ${{ steps.manifest.outputs.train_id }}
      head_sha: ${{ steps.manifest.outputs.head_sha }}
      publishing: ${{ steps.manifest.outputs.publishing }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci-control
          persist-credentials: false

      - name: Validate manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        shell: bash -euo pipefail {0}
        run: |
          # Manifests are control-plane records that live under one
          # directory on the default branch; a path outside it is refused.
          case "$MANIFEST_PATH" in
            .github/deployment-trains/*.yml) ;;
            *) echo "::error::manifest_path must be a .yml file under .github/deployment-trains/"; exit 1 ;;
          esac
          [[ "$MANIFEST_PATH" != *".."* ]] || { echo "::error::manifest_path must not contain .."; exit 1; }
          manifest="ci-control/$MANIFEST_PATH"
          [ -f "$manifest" ] || { echo "::error::manifest ${MANIFEST_PATH} does not exist on the default branch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/train"
          ci-control/.github/scripts/release-train.sh validate-manifest "$manifest" > "$RUNNER_TEMP/train/manifest.json"
          {
            echo "train_id=$(jq -r '.id' "$RUNNER_TEMP/train/manifest.json")"
            echo "head_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/train/manifest.json")"
            echo "publishing=$(jq -r '.publishing' "$RUNNER_TEMP/train/manifest.json")"
            echo "is_stack=$(jq -r 'has("stack")' "$RUNNER_TEMP/train/manifest.json")"
          } >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/train/manifest.json"

      - name: Fetch pull requests and commit relationships
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_STACK: ${{ steps.manifest.outputs.is_stack }}
        shell: bash -euo pipefail {0}
        run: |
          manifest="$RUNNER_TEMP/train/manifest.json"
          inputs="$RUNNER_TEMP/train/inputs"
          mkdir -p "$inputs"
          if [ "$IS_STACK" = true ]; then
            members="$(jq -r '.stack.members[].pull_request' "$manifest")"
          else
            members="$(jq -r '.pull_request' "$manifest")"
          fi
          integration="$(jq -r '.stack.integration_branch // empty' "$manifest")"
          lower=""
          while IFS= read -r n; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" > "$inputs/pull-$n.json"
            # Every member head must live in this repository: the validator
            # and the ci.yml dispatch below both name branches of this repository.
            head_repo="$(jq -r '.head.repo.full_name // empty' "$inputs/pull-$n.json")"
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || {
              echo "::error::pull request #${n} head lives in ${head_repo:-an unknown repository}, not ${GITHUB_REPOSITORY}"
              exit 1
            }
            upper="$(jq -r '.head.sha' "$inputs/pull-$n.json")"
            if [ -n "$lower" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/compare/${lower}...${upper}" \
                --jq '{status: .status, ahead_by: .ahead_by, behind_by: .behind_by}' > "$inputs/compare-$lower-$upper.json"
            fi
            if [ "$(jq -r '.merged // false' "$inputs/pull-$n.json")" = true ]; then
              merge_sha="$(jq -r '.merge_commit_sha' "$inputs/pull-$n.json")"
              gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}" \
                --jq '{sha: .sha, parents: [.parents[] | {sha: .sha}]}' > "$inputs/merge-$n.json"
              if [ -n "$integration" ]; then
                # ahead|identical: the merge commit is an ancestor of the
                # integration branch tip.
                gh api "repos/${GITHUB_REPOSITORY}/compare/${merge_sha}...${integration}" \
                  --jq '{status: .status, ahead_by: .ahead_by, behind_by: .behind_by}' > "$inputs/reach-$n.json"
              fi
            fi
            lower="$upper"
          done <<<"$members"
          ls -1 "$inputs"

      - name: Verify the stack chain
        if: steps.manifest.outputs.is_stack == 'true'
        shell: bash -euo pipefail {0}
        run: |
          ci-control/.github/scripts/release-train.sh validate-stack \
            "$RUNNER_TEMP/train/manifest.json" "$RUNNER_TEMP/train/inputs" "$RUNNER_TEMP/train/train-record.json"

      - name: Verify the single-train head
        if: steps.manifest.outputs.is_stack != 'true'
        shell: bash -euo pipefail {0}
        run: |
          manifest="$RUNNER_TEMP/train/manifest.json"
          n="$(jq -r '.pull_request' "$manifest")"
          head="$(jq -r '.head.sha' "$RUNNER_TEMP/train/inputs/pull-$n.json")"
          [ "$head" = "$(jq -r '.head_sha' "$manifest")" ] || {
            echo "::error::pull request #${n} head ${head} differs from manifest head_sha"
            exit 1
          }
          jq -e '.state == "open" or .merged == true' "$RUNNER_TEMP/train/inputs/pull-$n.json" >/dev/null || {
            echo "::error::pull request #${n} is neither open nor merged"
            exit 1
          }
          jq --arg head "$head" --arg base "$(jq -r '.base.ref' "$RUNNER_TEMP/train/inputs/pull-$n.json")" \
            --argjson merged "$(jq -r '.merged' "$RUNNER_TEMP/train/inputs/pull-$n.json")" '
            {schema_version: 1, train_id: .id, state: .state, target_version: .target_version,
             publishing: .publishing, base_branch: .base_branch, integration_branch: null,
             head_sha: .head_sha, head_pull_request: .pull_request,
             members: [{pull_request: .pull_request, head_sha: $head, base: $base, merged: $merged}],
             required_gates: .required_gates}' "$manifest" > "$RUNNER_TEMP/train/train-record.json"

      - name: Checkout exact head source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.manifest.outputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source version and reservation
        shell: bash -euo pipefail {0}
        run: |
          git -C head fetch --quiet --tags origin
          ci-control/.github/scripts/release-train.sh validate-version \
            "$RUNNER_TEMP/train/manifest.json" head ci-control/.github/deployment-trains

      - name: Secure a successful CI run for the head
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.manifest.outputs.head_sha }}
          WAIT_FOR_CI: ${{ inputs.wait_for_ci }}
        shell: bash -euo pipefail {0}
        run: |
          list_runs() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&per_page=50" \
              > "$RUNNER_TEMP/train/ci-runs.json"
          }
          list_runs
          run_id="$(ci-control/.github/scripts/release-train.sh plan-ci "$RUNNER_TEMP/train/ci-runs.json" "$HEAD_SHA" "$GITHUB_REPOSITORY")"
          if [ "$run_id" = dispatch ]; then
            [ "$WAIT_FOR_CI" = true ] || { echo "::error::no successful ci.yml run exists for ${HEAD_SHA} and wait_for_ci is false"; exit 1; }
            # workflow_dispatch needs a ref. The top member's branch is the
            # ref; the run's head_sha is then checked against the manifest so
            # a branch that moved after setup cannot substitute its tip.
            top="$(jq -r '.head_pull_request' "$RUNNER_TEMP/train/train-record.json")"
            ref="$(jq -r '.head.ref' "$RUNNER_TEMP/train/inputs/pull-$top.json")"
            before="$(date -u +%s)"
            gh workflow run ci.yml --ref "$ref"
            echo "Dispatched ci.yml on ${ref}; waiting for a run at ${HEAD_SHA}."
            for _ in $(seq 1 30); do
              sleep 20
              list_runs
              run_id="$(jq -r --arg sha "$HEAD_SHA" --argjson before "$before" '
                [.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch"
                  and ((.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) >= $before))]
                | sort_by(.run_number) | last | .id // empty' "$RUNNER_TEMP/train/ci-runs.json")"
              [ -n "$run_id" ] && break
            done
            [ -n "$run_id" ] || { echo "::error::ci.yml did not start at ${HEAD_SHA} on ${ref}; the branch may have moved"; exit 1; }
            gh run watch "$run_id" --exit-status
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$RUNNER_TEMP/train/ci-run.json"
          jq -e --arg sha "$HEAD_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/ci.yml"' \
            "$RUNNER_TEMP/train/ci-run.json" >/dev/null || { echo "::error::run ${run_id} is not a successful ci.yml run at ${HEAD_SHA}"; exit 1; }
          jq --argjson run "$(jq '{run_id: .id, run_number: .run_number, run_attempt: .run_attempt, event: .event}' "$RUNNER_TEMP/train/ci-run.json")" \
            '. + {ci: $run}' "$RUNNER_TEMP/train/train-record.json" > "$RUNNER_TEMP/train/train-record.with-ci.json"
          mv "$RUNNER_TEMP/train/train-record.with-ci.json" "$RUNNER_TEMP/train/train-record.json"
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload train record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: train-record
          path: |
            ${{ runner.temp }}/train/manifest.json
            ${{ runner.temp }}/train/train-record.json
            ${{ runner.temp }}/train/inputs
          retention-days: 90
          if-no-files-found: error

      - name: Report
        env:
          PUBLISHING: ${{ steps.manifest.outputs.publishing }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
        shell: bash -euo pipefail {0}
        run: |
          {
            ci-control/.github/scripts/release-train.sh summarize "$RUNNER_TEMP/train/train-record.json"
            echo
            printf -- '- CI evidence: run `%s`\n' "$CI_RUN_ID"
            echo
            if [ "$PUBLISHING" = true ]; then
              echo "**Held.** Section 13.2 steps 1 to 9 passed. Train canary creation (steps 10 to 13) is the next increment of TASK-013-6; no tag, release, or image was created."
            else
              echo "**Rehearsal complete.** Section 13.2 steps 1 to 9 passed for a non-publishing train. No version was reserved and nothing was published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
