name: Merge Recovery Soak

on:
  schedule:
    # Both slots target Pacific 19:30; one matches PDT (UTC-7), the other PST
    # (UTC-8), and the schedule gate no-ops whichever is currently wrong.
    # 19:30 Pacific is chosen so the Friday weekend-60h soak finishes at
    # exactly 07:30 Pacific on Monday (19:30 + 60h), in both DST regimes.
    # Pacific 19:30 falls on the *next* UTC day, hence 02:30/03:30 UTC.
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to validate
        required: true
        default: dev
        type: string
      duration:
        description: Requested soak duration
        required: true
        default: daily-24h
        type: choice
        options:
          - daily-24h
          - weekend-60h

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: f1r3flyindustries/f1r3fly-rust
  SYSTEM_INTEGRATION_REF: a50eeb198c6e542504af8db92389de5c02500422
  # Pinned OCI CLI installer (release tag + sha256). The checksum fails closed
  # if the tag is ever moved. Bump both together when upgrading.
  OCI_CLI_INSTALLER_URL: "https://raw.githubusercontent.com/oracle/oci-cli/v3.89.1/scripts/install/install.sh"
  OCI_CLI_INSTALLER_SHA256: "079dcc9a3e2a61ec692400e30169c9996b2998ac8c4e205198ed5863283fcb76"

jobs:
  schedule_gate:
    name: Resolve Pacific Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      duration_seconds: ${{ steps.resolve.outputs.duration_seconds }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      run_benchmarks: ${{ steps.resolve.outputs.run_benchmarks }}
      # weekend | daily. Selects which published series this run appends to;
      # the two are kept in separate files so the week-over-week regression
      # gate never compares a 22h daily against a 60h weekend baseline.
      kind: ${{ steps.resolve.outputs.kind }}
    steps:
      - name: Resolve schedule
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          # Read-only, for the "did anything land since the last window?" check.
          GH_TOKEN: ${{ github.token }}
        shell: bash -euo pipefail {0}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_DURATION" = "weekend-60h" ]; then
              duration_seconds=216000
            else
              duration_seconds=79200
            fi
            target_ref="$INPUT_TARGET_REF"
            should_run=true
          else
            # GitHub delivers cron triggers minutes-to-hours late, so gate on
            # the cron's intended slot (most recent occurrence at or before
            # now), not the wall clock at execution time.
            # The window is on a half hour, so the minute field matters as
            # much as the hour — compare %H%M, not %H.
            cron_min="$(awk '{print $1}' <<<"$EVENT_SCHEDULE")"
            cron_hour="$(awk '{print $2}' <<<"$EVENT_SCHEDULE")"
            now_epoch="$(date -u +%s)"
            slot_epoch="$(date -u -d "$(date -u +%F) ${cron_hour}:${cron_min}:00" +%s)"
            if [ "$slot_epoch" -gt "$now_epoch" ]; then
              slot_epoch=$((slot_epoch - 86400))
            fi
            pacific_hm="$(TZ=America/Los_Angeles date -d "@${slot_epoch}" +%H%M)"
            pacific_weekday="$(TZ=America/Los_Angeles date -d "@${slot_epoch}" +%u)"
            echo "cron=$EVENT_SCHEDULE slot=$(date -u -d "@${slot_epoch}" +%FT%TZ) pacific_hm=$pacific_hm pacific_weekday=$pacific_weekday"
            target_ref=dev
            should_run=false
            idle_skip=false
            duration_seconds=79200
            if [ "$pacific_hm" = "1930" ] && [ "$pacific_weekday" -ge 1 ] && [ "$pacific_weekday" -le 4 ]; then
              # 22h, not 24h. The soak job shares a concurrency group with
              # cancel-in-progress, so a 24h soak on a 24h cadence is cancelled
              # by the next night's launch ~10min before it finishes — losing
              # its final iteration and its entire artifact upload. 22h leaves
              # the run time to report before the next one starts.
              should_run=true
              duration_seconds=79200
              # Don't re-soak code that has already been soaked. If nothing
              # landed on the branch since the previous window there is nothing
              # new to learn, and an OCI runner is not worth spending on it.
              #
              # Fails OPEN: any API error, empty response or unparseable count
              # runs the soak. A silently skipped soak is the exact failure this
              # workflow exists to avoid, so "unsure" must mean "soak".
              #
              # The window is anchored to the previous eligible slot, not to a
              # fixed 24h, because daily windows are not 24h apart: dailies run
              # Mon-Thu, so Monday's window is four days after Thursday's. A 24h
              # lookback on a Monday cannot see anything that landed over the
              # weekend, and would skip the soak on code that has never been
              # soaked at all — `dev` gets no weekend coverage either, since the
              # 60h weekend soak targets `master`.
              if [ "$pacific_weekday" -eq 1 ]; then
                prev_slot_epoch=$((slot_epoch - 4 * 86400))
              else
                prev_slot_epoch=$((slot_epoch - 86400))
              fi
              # Two hours of overlap, for two reasons. Slot-aligned windows tile
              # exactly, so a commit landing on a boundary could fall between
              # two of them and never be seen. And the arithmetic above is in
              # epoch seconds, so a window spanning a Pacific DST change lands
              # an hour off — on the November change, Monday's window would
              # otherwise start at Thursday 20:30 PT and miss the hour before
              # it. The margin absorbs both without needing DST-aware date
              # maths. Erring wide costs at most one redundant soak; erring
              # narrow is the bug this whole check is meant to avoid.
              since="$(date -u -d "@$((prev_slot_epoch - 7200))" +%Y-%m-%dT%H:%M:%SZ)"
              new_commits="$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits?sha=${target_ref}&since=${since}" \
                --jq 'length' 2>/dev/null || echo "")"
              if [ "$new_commits" = "0" ]; then
                should_run=false
                idle_skip=true
                echo "no commits on $target_ref since $since; skipping tonight's soak"
              else
                echo "commits on $target_ref since $since: ${new_commits:-unknown (check failed; soaking anyway)}"
              fi
            elif [ "$pacific_hm" = "1930" ] && [ "$pacific_weekday" -eq 5 ]; then
              # Friday 19:30 + 60h = Monday 07:30 Pacific.
              should_run=true
              duration_seconds=216000
            fi
          fi
          run_benchmarks=false
          kind=daily
          if [ "$duration_seconds" = "216000" ]; then
            run_benchmarks=true
            kind=weekend
          fi
          if [ "$should_run" != "true" ] && [ "${idle_skip:-false}" = "true" ]; then
            echo "::notice::Schedule gate skip: nothing landed on $target_ref since the previous window, so tonight's soak would re-test already-soaked code. No soak was attempted; this run's success is not a soak result."
            {
              echo "## Schedule gate: skipped (no new commits)"
              echo ""
              echo "Nothing landed on \`$target_ref\` since the previous window, so this"
              echo "soak would have re-tested code that was already soaked."
              echo "**No soak was attempted** — a green check on this run is not a soak result."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$should_run" != "true" ]; then
            echo "::notice::Schedule gate no-op: cron slot resolved outside the Pacific 19:30 launch window. No soak was attempted; this run's success is not a soak result."
            {
              echo "## Schedule gate: no-op"
              echo ""
              echo "This scheduled trigger resolved outside the Pacific 19:30 launch window."
              echo "**No soak was attempted** — a green check on this run is not a soak result."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "should_run=$should_run"
            echo "duration_seconds=$duration_seconds"
            echo "target_ref=$target_ref"
            echo "run_benchmarks=$run_benchmarks"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"

  launch_runner:
    name: Launch Oracle Cloud Soak Runner
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: ephemeral-launch-internal
    timeout-minutes: 10
    concurrency:
      group: merge-recovery-soak-${{ needs.schedule_gate.outputs.duration_seconds }}
      cancel-in-progress: true
    steps:
      - name: Clone trusted runner launcher
        uses: actions/checkout@v4
        with:
          repository: F1R3FLY-io/system-integration
          ref: ${{ env.SYSTEM_INTEGRATION_REF }}
          path: system-integration
          persist-credentials: false

      - name: Install OCI CLI (pinned, checksum-verified)
        shell: bash -e {0}
        run: |
          # This runner later holds OCI_* secrets, so the installer must not be
          # fetched from a movable ref. Fails closed on any checksum mismatch.
          curl -fsSL "$OCI_CLI_INSTALLER_URL" -o /tmp/oci-install.sh
          echo "$OCI_CLI_INSTALLER_SHA256  /tmp/oci-install.sh" | sha256sum -c -
          bash /tmp/oci-install.sh \
            --accept-all-defaults --install-dir /opt/oci-cli --exec-dir /usr/local/bin
          oci --version

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash -e {0}
        run: |
          install -d -m 700 ~/.oci
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          oci iam region list >/dev/null

      - name: Launch runner
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          SUPPRESS_LABEL_WARNING: "True"
        shell: bash -e {0}
        run: system-integration/ci/oci-runners/launch-runner.sh amd64

      - name: Remove OCI credentials
        if: always()
        shell: bash -e {0}
        run: |
          shred -fu ~/.oci/oci_api_key.pem 2>/dev/null || true
          rm -rf ~/.oci

  soak:
    name: Merge Recovery Soak
    needs: [schedule_gate, launch_runner]
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, x64, f1r3fly-rust-ci-ephemeral, oracle-cloud]
    # Backstop only — the soak script stops itself at SOAK_DURATION_SECONDS.
    # Scaled to the kind of run so a stuck daily cannot burn a 64h runner:
    # daily 79200s (22h) + 2h, weekend 216000s (60h) + 4h. The margin is not
    # slack: this budget also covers the image build, poetry install and the
    # post-soak aggregate/alert/upload steps, so a ceiling equal to the soak
    # duration would kill the job while it uploads its own results. With the
    # daily soak at 22h the ceiling is a true 24h.
    timeout-minutes: ${{ needs.schedule_gate.outputs.duration_seconds == '216000' && 3840 || 1440 }}
    concurrency:
      group: merge-recovery-soak-${{ needs.schedule_gate.outputs.duration_seconds }}
      cancel-in-progress: true
    steps:
      - name: Checkout CI control files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          persist-credentials: false

      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.schedule_gate.outputs.target_ref }}
          path: node-under-test
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target revision
        id: target
        working-directory: node-under-test
        shell: bash -euo pipefail {0}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clone trusted integration harness
        uses: actions/checkout@v4
        with:
          repository: F1R3FLY-io/system-integration
          ref: ${{ env.SYSTEM_INTEGRATION_REF }}
          path: system-integration
          persist-credentials: false

      - name: Build node image
        working-directory: node-under-test
        shell: bash -euo pipefail {0}
        run: |
          docker context use default
          docker buildx build \
            --platform linux/amd64 \
            --file node/Dockerfile \
            --build-arg VERSION="$(git describe --tags --always)" \
            --tag "$DOCKER_IMAGE_NAME:latest" \
            --load \
            .

      - name: Extract subprocess binary
        shell: bash -euo pipefail {0}
        run: |
          container_id="$(docker create "$DOCKER_IMAGE_NAME:latest")"
          docker cp "$container_id:/opt/docker/bin/node" /tmp/rnode
          docker rm "$container_id"
          chmod +x /tmp/rnode
          ldd /tmp/rnode

      - name: Install integration dependencies
        working-directory: system-integration
        shell: bash -euo pipefail {0}
        run: |
          poetry lock --no-update
          poetry install --with integration

      - name: Run soak
        env:
          F1R3FLY_NODE_IMAGE: ${{ env.DOCKER_IMAGE_NAME }}:latest
          F1R3FLY_NODE_BINARY: /tmp/rnode
          F1R3FLY_NODE_DEFAULTS_CONF: ${{ github.workspace }}/node-under-test/node/src/main/resources/defaults.conf
          SOAK_DURATION_SECONDS: ${{ needs.schedule_gate.outputs.duration_seconds }}
          SOAK_OUTPUT_DIR: /tmp/merge-recovery-soak
          SOAK_TARGET_REF: ${{ needs.schedule_gate.outputs.target_ref }}
          SOAK_TARGET_SHA: ${{ steps.target.outputs.sha }}
          SOAK_RUN_BENCHMARKS: ${{ needs.schedule_gate.outputs.run_benchmarks }}
          # Daily: after 8h, stop once the branch under test advances — the run
          # is pinned to one image, so past that point it is testing history.
          # The 8h floor keeps an early merge from reducing a night to a token
          # soak. Weekend: 0 (disabled) — a 60h benchmark baseline must run to
          # completion for its numbers to be comparable week over week.
          SOAK_MERGE_EXIT_MIN_SECONDS: ${{ needs.schedule_gate.outputs.duration_seconds == '216000' && '0' || '28800' }}
          SOAK_NODE_REPO_DIR: ${{ github.workspace }}/node-under-test
          SYSTEM_INTEGRATION_DIR: ${{ github.workspace }}/system-integration
        shell: bash -e {0}
        run: ci-control/scripts/run-merge-recovery-soak.sh

      # Runs for dailies too. The aggregator needs no benchmark segments — it
      # emits the passive rollup with a null `active` block — and without this
      # a daily soak produces no summary at all, so there is nothing to publish
      # and its numbers die with the 14-day artifact.
      - name: Aggregate soak report + verdict
        if: always() && needs.schedule_gate.outputs.should_run == 'true'
        shell: bash -euo pipefail {0}
        env:
          SOAK_DIR: /tmp/merge-recovery-soak
          OUT_DIR: /tmp/merge-recovery-soak/report
          RUN_ID: ${{ github.run_id }}
          DURATION_SECONDS: ${{ needs.schedule_gate.outputs.duration_seconds }}
          DASHBOARD_URL: https://f1r3fly-io.github.io/f1r3node-rust/
          # Non-empty value must be the truthy branch: GitHub treats '' as
          # false, so `kind == 'weekend' && '' || '-daily'` would yield
          # '-daily' for BOTH series.
          SERIES_SUFFIX: ${{ needs.schedule_gate.outputs.kind == 'daily' && '-daily' || '' }}
        run: |
          # Cache-busted so the week-over-week deltas are not computed against
          # a stale CDN copy. Unlike the history fetch this stays soft: a 60h
          # soak's report is worth more than its baseline comparison, so a
          # miss degrades to "no baseline" rather than discarding the run —
          # but a non-404 miss is warned about, since a silently absent
          # baseline makes the verdict look clean.
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Compared against the same series only. A daily measured against a
          # 60h weekend baseline would flag a regression purely because the
          # spans differ.
          base_code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -w '%{http_code}' \
            -o /tmp/soak-baseline.json \
            "${DASHBOARD_URL}data/latest-summary${SERIES_SUFFIX}.json?cb=${cb}")" || base_code=000
          case "$base_code" in
            200) export BASELINE_JSON=/tmp/soak-baseline.json ;;
            404) echo "no published baseline yet (bootstrap run)" ;;
            *)   echo "::warning::baseline fetch failed (HTTP ${base_code}); verdict computed without week-over-week comparison" ;;
          esac
          ci-control/scripts/bench/aggregate-perf-report.sh
          cat "$OUT_DIR/perf-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish ONS alert email
        if: always() && needs.schedule_gate.outputs.run_benchmarks == 'true'
        shell: bash -e {0}
        env:
          REPORT_DIR: /tmp/merge-recovery-soak/report
          ONS_TOPIC_OCID: ${{ vars.SOAK_ONS_TOPIC_OCID }}
          DASHBOARD_URL: https://f1r3fly-io.github.io/f1r3node-rust/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Instance-principal auth: works only on the OCI runner, no secrets.
          # Notification failure must never mask the soak result.
          #
          # This overlaps with the notify_failure job by design — do not
          # "deduplicate" them. This step sends the weekly verdict with its
          # metrics and week-over-week deltas, but only ever runs ON the soak
          # runner and only once a report exists, so it cannot report a runner
          # that never launched or a soak that died before writing one.
          # notify_failure covers exactly those cases from a GitHub-hosted
          # runner. A weekend soak that completes and then fails its verdict
          # gate therefore sends two mails: the verdict (with numbers) and the
          # job-level alert. That is the accepted cost of never going silent.
          ci-control/scripts/oci/publish-soak-alert.sh || \
            echo "::warning::ONS alert publish failed (non-fatal)"

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-recovery-soak-${{ needs.schedule_gate.outputs.duration_seconds }}s-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/merge-recovery-soak
          retention-days: 14

  perf_report:
    name: Publish Soak Dashboard
    needs: [schedule_gate, soak]
    # Both series publish. Gating this on run_benchmarks made it weekend-only,
    # so the dashboard's Daily tab had no producer and nightly results expired
    # with the artifact.
    if: needs.schedule_gate.outputs.should_run == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: soak-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout CI control files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          persist-credentials: false

      - name: Download soak results
        uses: actions/download-artifact@v4
        with:
          name: merge-recovery-soak-${{ needs.schedule_gate.outputs.duration_seconds }}s-${{ github.run_id }}-${{ github.run_attempt }}
          path: soak-results

      - name: Assemble dashboard site
        shell: bash -euo pipefail {0}
        env:
          DASHBOARD_URL: https://f1r3fly-io.github.io/f1r3node-rust/
          # See the note on the aggregate step: the non-empty value has to be
          # the truthy branch, because GitHub treats '' as false.
          SERIES_SUFFIX: ${{ needs.schedule_gate.outputs.kind == 'daily' && '-daily' || '' }}
          # Weekend runs once a week, so its series stays small on its own.
          # Dailies land up to four a week and would grow without bound, so the
          # series is trimmed to roughly half a year of runs.
          MAX_HISTORY: ${{ needs.schedule_gate.outputs.kind == 'daily' && '120' || '0' }}
        run: |
          test -s soak-results/report/weekly-summary.json || {
            echo "::error::soak artifact has no weekly-summary.json"; exit 1; }
          mkdir -p site/data
          cp -r ci-control/.github/dashboard/. site/
          # Pages is the only durable store for these series — soak artifacts
          # expire after 14 days — and a Pages deploy replaces the whole site.
          # So this job must republish BOTH series, not just its own: a daily
          # run that uploaded only daily files would delete the weekend series
          # outright. Every published file is therefore fetched and carried
          # forward, and only this run's own series is overwritten below.
          #
          # Treating a transient fetch failure as "nothing published" would
          # permanently reset a series, so only a 404 may yield an absent file
          # and anything else aborts. The cache-busting query string stops the
          # CDN serving a copy older than the last publish, which would drop
          # intervening runs.
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for f in history.json latest-summary.json latest-verdict.json latest-report.md \
                   history-daily.json latest-summary-daily.json latest-verdict-daily.json \
                   latest-report-daily.md; do
            code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -w '%{http_code}' \
              -o "site/data/${f}" "${DASHBOARD_URL}data/${f}?cb=${cb}")" || code=000
            case "$code" in
              200) ;;
              404) rm -f "site/data/${f}" ;;
              *)
                echo "::error::could not read published ${f} (HTTP ${code}); aborting so no published series is lost"
                exit 1
                ;;
            esac
          done
          # HTTP 200 is not proof of valid content — a CDN or proxy error page
          # is served with 200 too, and republishing one would corrupt the
          # series just as thoroughly as dropping it. Every carried-forward
          # JSON file is checked, not just the histories: a summary or verdict
          # replaced by an error page breaks the dashboard tab that reads it
          # and, for a summary, becomes the baseline the next run compares
          # against.
          for f in history.json history-daily.json; do
            [ -e "site/data/${f}" ] || continue
            jq -e 'type == "array"' "site/data/${f}" >/dev/null 2>&1 || {
              echo "::error::published ${f} is not a JSON array; refusing to replace it"
              exit 1
            }
          done
          for f in latest-summary.json latest-verdict.json \
                   latest-summary-daily.json latest-verdict-daily.json; do
            [ -e "site/data/${f}" ] || continue
            jq -e 'type == "object"' "site/data/${f}" >/dev/null 2>&1 || {
              echo "::error::published ${f} is not a JSON object; refusing to republish it"
              exit 1
            }
          done

          # A 404 is only trustworthy when a series has genuinely never
          # published. Once its history has entries, every run wrote a summary
          # and a verdict alongside, so a 404 on those means the fetch lied
          # rather than that they are absent — and accepting it would publish a
          # site with that series' tab silently emptied. An empty history is
          # the legitimate bootstrap case and stays permitted.
          for s in "" "-daily"; do
            h="site/data/history${s}.json"
            [ -e "$h" ] && [ "$(jq 'length' "$h" 2>/dev/null || echo 0)" -gt 0 ] || continue
            for f in "latest-summary${s}.json" "latest-verdict${s}.json"; do
              [ -e "site/data/${f}" ] || {
                echo "::error::history${s}.json has entries but ${f} came back 404; refusing to publish a site missing it"
                exit 1
              }
            done
          done

          # Append this run to its own series, leaving the other untouched.
          # Replace rather than append when an entry for this run already
          # exists: a re-run reuses github.run_id, so a plain append would add
          # a second entry for the same night, double-counting it on the chart
          # and burning a slot of the daily retention cap. Runs whose id is
          # missing or "unknown" are always appended — they cannot be told
          # apart, so collapsing them would merge genuinely distinct runs.
          hist="site/data/history${SERIES_SUFFIX}.json"
          [ -e "$hist" ] || echo '[]' > "$hist"
          jq -s --argjson max "$MAX_HISTORY" \
            '.[0] as $hist | .[1] as $new
             | ($new.run.run_id // "") as $rid
             | (if $rid == "" or $rid == "unknown" then $hist
                else ($hist | map(select((.run.run_id // "") != $rid))) end) as $kept
             | ($kept + [$new] | sort_by(.run.date)) as $all
             | if $max > 0 and ($all | length) > $max then $all[-$max:] else $all end' \
            "$hist" soak-results/report/weekly-summary.json > /tmp/history-merged.json
          mv /tmp/history-merged.json "$hist"
          cp soak-results/report/weekly-summary.json "site/data/latest-summary${SERIES_SUFFIX}.json"
          cp soak-results/report/verdict.json "site/data/latest-verdict${SERIES_SUFFIX}.json"
          cp soak-results/report/perf-report.md "site/data/latest-report${SERIES_SUFFIX}.md"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Gate on regression verdict
        shell: bash -euo pipefail {0}
        env:
          KIND: ${{ needs.schedule_gate.outputs.kind }}
        run: |
          verdict="$(jq -r '.verdict' soak-results/report/verdict.json)"
          echo "${KIND} soak verdict: $verdict"
          [ "$verdict" = "pass" ] && exit 0
          jq -r '.failures[] | "FAIL: " + .' soak-results/report/verdict.json
          # Only the weekend series gates. Dailies vary in span — they stop
          # early when dev advances — so a run-over-run delta can reflect a
          # shorter run rather than a real regression. Failing on that would
          # train people to ignore a red soak, which costs more than the
          # signal is worth. The verdict is still published, and the dashboard
          # shows it on the Daily tab.
          if [ "$KIND" != "weekend" ]; then
            echo "::warning::Daily soak regressed against the previous daily run — see the dashboard's Daily tab. Not failing the run: only the weekend series gates releases."
            exit 0
          fi
          exit 1

  notify_failure:
    name: Email Soak Failure Alert
    needs: [schedule_gate, launch_runner, soak, perf_report]
    # Runs on a GitHub-hosted runner with user-principal OCI auth so the
    # alert still goes out when the OCI runner itself failed to launch —
    # the in-soak ONS step (instance-principal) cannot cover that case.
    # `cancelled` counts too: a 60h soak that hits its timeout, is cancelled
    # by hand, or loses its runner to preemption produced no result either,
    # and silence there is indistinguishable from success.
    if: >-
      always() &&
      needs.schedule_gate.outputs.should_run == 'true' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    environment: ephemeral-launch-internal
    timeout-minutes: 10
    # Alerting needs OCI credentials, never the GitHub API — this job has no
    # checkout and no reason to hold a token scope.
    permissions: {}
    steps:
      - name: Install OCI CLI (pinned, checksum-verified)
        shell: bash -e {0}
        run: |
          curl -fsSL "$OCI_CLI_INSTALLER_URL" -o /tmp/oci-install.sh
          echo "$OCI_CLI_INSTALLER_SHA256  /tmp/oci-install.sh" | sha256sum -c -
          bash /tmp/oci-install.sh \
            --accept-all-defaults --install-dir /opt/oci-cli --exec-dir /usr/local/bin
          oci --version

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash -e {0}
        run: |
          install -d -m 700 ~/.oci
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          oci iam region list >/dev/null

      - name: Publish soak alert
        env:
          ONS_TOPIC_OCID: ${{ vars.SOAK_ONS_TOPIC_OCID }}
          LAUNCH_RESULT: ${{ needs.launch_runner.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
          DASHBOARD_RESULT: ${{ needs.perf_report.result }}
          TARGET_REF: ${{ needs.schedule_gate.outputs.target_ref }}
          DURATION_SECONDS: ${{ needs.schedule_gate.outputs.duration_seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASHBOARD_URL: https://f1r3fly-io.github.io/f1r3node-rust/
        shell: bash -euo pipefail {0}
        run: |
          if [ -z "$ONS_TOPIC_OCID" ]; then
            echo "::error::SOAK_ONS_TOPIC_OCID is not configured; failure alert NOT sent"
            exit 1
          fi
          if [ "$DURATION_SECONDS" = "216000" ]; then kind="weekend-60h"; else kind="daily-24h"; fi
          # Name what actually broke. A soak that never ran and a report stage
          # that failed after a clean soak are different pages. perf_report
          # covers both the Pages deploy and the regression verdict gate, so
          # its failure is named for the stage rather than the deploy alone.
          case "$LAUNCH_RESULT/$SOAK_RESULT" in
            failure/*|cancelled/*) what="runner launch $LAUNCH_RESULT" ;;
            */failure|*/cancelled) what="soak $SOAK_RESULT" ;;
            *)                     what="report/verdict stage $DASHBOARD_RESULT" ;;
          esac
          title="F1R3FLY soak alert ($kind): $what — $(date -u +%F)"
          body="Merge Recovery Soak did not complete cleanly: $what.

          Target:    $TARGET_REF
          Duration:  $kind
          Job results:
            launch runner:  $LAUNCH_RESULT
            soak:           $SOAK_RESULT
            dashboard:      $DASHBOARD_RESULT

          Run: $RUN_URL
          Dashboard: $DASHBOARD_URL

          Manage this subscription via the unsubscribe link in this email."
          oci ons message publish \
            --topic-id "$ONS_TOPIC_OCID" \
            --title "$title" \
            --body "$body"
          echo "published ONS failure alert: $title"

      - name: Remove OCI credentials
        if: always()
        shell: bash -e {0}
        run: |
          shred -fu ~/.oci/oci_api_key.pem 2>/dev/null || true
          rm -rf ~/.oci
