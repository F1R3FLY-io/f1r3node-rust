name: Release Promotion

on:
  workflow_dispatch:

permissions: {}

jobs:
  held:
    name: Stable Publication Disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report migration state
        shell: bash -euo pipefail {0}
        run: |
          {
            echo "### Stable publication is disabled"
            echo
            echo "The release process is in its evidence-only migration phase."
            echo "This workflow did not create a commit, tag, release, package, or image."
          } >> "$GITHUB_STEP_SUMMARY"
