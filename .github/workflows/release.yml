# Auto-bump patch version on merge to master.
#
# - master: bumps patch (0.4.0 → 0.4.1)
#
# Minor and major bumps are NOT automated. To cut a minor/major release,
# manually create and push a tag:
#
#     git tag -a v0.5.0 origin/master -m "Release v0.5.0"
#     git push origin v0.5.0
#
# The tag push triggers ci.yml's release_docker_image + release_packages jobs.
# node/Cargo.toml + node/Dockerfile LABEL will stay at the previous patch-bumped
# value (e.g. 0.4.17) until the next master merge auto-patch-bumps from the
# new tag (which would then compute 0.5.1 from latest tag v0.5.0).
#
# Determines the next version from the latest `v*` tag, bumps
# node/Cargo.toml + node/Dockerfile LABEL, regenerates Cargo.lock, generates
# CHANGELOG.md via git-cliff, commits, pushes the commit, then creates an
# annotated tag via the GitHub API.
#
# Commit push and tag creation use a short-lived GitHub App token so their
# events trigger downstream workflows and the App can bypass release rulesets.

name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak_gate:
    name: Weekend Soak Verdict Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
    permissions:
      checks: write
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Read latest weekend soak verdict
        id: gate
        shell: bash -euo pipefail {0}
        env:
          OVERRIDE: ${{ contains(github.event.head_commit.message, '[soak-override]') }}
        run: |
          # Releases must not promote past a regressing weekend soak
          # (EPOCH-010 TASK-010-3). Maintainer override: include
          # [soak-override] in the release commit message.
          #
          # A regress HOLDS the release (the release job skips on
          # proceed=false) without failing this job: soak state belongs to
          # the README badges and the dashboard, not to the commit's build
          # status, which must reflect build/test checks only. The hold is
          # surfaced on the commit as a neutral `release-held` check run
          # (next step) instead of a red X.
          if [ "$OVERRIDE" = "true" ]; then
            echo "::warning::Soak gate overridden via [soak-override] in commit message"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Randomized heredoc delimiter: the summary embeds strings from
          # the fetched JSON, so a static delimiter would let a crafted
          # line terminate the block early and inject further outputs.
          delim="HELD_EOF_${RANDOM}${RANDOM}_$$"
          hold() {
            {
              echo "held_summary<<$delim"
              cat
              echo ""
              echo "The release job was skipped; the build itself is unaffected. Fix the regression or include \`[soak-override]\` in the release commit message. Soak state and history: https://f1r3fly-io.github.io/f1r3node-rust/"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          }
          body="$RUNNER_TEMP/latest-verdict.json"
          http_code="$(curl -sS --max-time 30 --retry 3 --retry-delay 5 \
            -o "$body" -w '%{http_code}' \
            "https://f1r3fly-io.github.io/f1r3node-rust/data/latest-verdict.json" \
            2>/dev/null)" || http_code=000
          if [ "$http_code" = "404" ]; then
            echo "::warning::No published soak verdict yet (dashboard bootstrap); allowing release"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            # Fail closed on an unverifiable verdict (network error, 5xx):
            # holding a release on a transient fetch failure is recoverable;
            # releasing past an unseen regress is not. Only a true 404
            # (pre-bootstrap dashboard) allows the release through.
            echo "::warning::Could not fetch soak verdict (HTTP $http_code) — release held rather than promoting past an unverifiable verdict. Re-run the workflow to retry."
            hold <<EOF
          Could not fetch the weekend soak verdict (HTTP $http_code); the release is held rather than promoted past an unverifiable verdict. Re-run the workflow to retry.
          EOF
            exit 0
          fi
          verdict_json="$(cat "$body")"
          verdict="$(printf '%s' "$verdict_json" | jq -r '.verdict // "unknown"' 2>/dev/null || echo unknown)"
          date="$(printf '%s' "$verdict_json" | jq -r '.run.date // "unknown"' 2>/dev/null || echo unknown)"
          echo "Latest weekend soak verdict: $verdict ($date)"
          if [ "$verdict" != "pass" ]; then
            printf '%s' "$verdict_json" | jq -r '.failures[]? | "FAIL: " + .' 2>/dev/null || true
            echo "::warning::Latest weekend soak verdict is '$verdict' ($date) — release held. Fix the regression or use [soak-override] in the release commit message."
            {
              echo "Latest weekend soak verdict: \`$verdict\` ($date)."
              echo ""
              printf '%s' "$verdict_json" | jq -r '.failures[]? | "- " + .' 2>/dev/null || true
            } | hold
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Publish neutral release-held check
        if: steps.gate.outputs.proceed == 'false'
        uses: actions/github-script@v7
        env:
          HELD_SUMMARY: ${{ steps.gate.outputs.held_summary }}
        with:
          script: |
            // Publication is best-effort: a failed check-run API call must
            // not fail this job, or the gate re-creates the red commit
            // status the hold mechanism exists to avoid. The held state is
            // still visible in the job log and the ::warning annotation.
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'release-held',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Release held by the weekend soak verdict gate',
                  summary: process.env.HELD_SUMMARY,
                },
              });
            } catch (error) {
              core.warning(`Could not publish the release-held check run: ${error.message}`);
            }

  release:
    name: Bump Version & Tag
    needs: soak_gate
    runs-on: ubuntu-latest
    environment: release-credentials
    timeout-minutes: 10
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      needs.soak_gate.outputs.proceed == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Force-refresh tags
        run: git fetch origin --tags --force

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-09

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: bash .github/scripts/install-system-dependencies.sh

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --version

      - name: Determine next version
        id: version
        shell: bash -exu -o pipefail {0}
        run: |
          source scripts/version.sh
          bump_version patch
          {
            echo "NEXT_VERSION=$NEXT_VERSION"
            echo "TAG_NAME=$TAG_NAME"
            echo "BRANCH=master"
          } >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION (tag: $TAG_NAME)"

      - name: Update node/Cargo.toml version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.version.outputs.NEXT_VERSION }}\"/" node/Cargo.toml

      - name: Update Dockerfile LABEL
        run: |
          sed -i 's/^LABEL version=".*"/LABEL version="${{ steps.version.outputs.NEXT_VERSION }}"/' node/Dockerfile

      - name: Update Cargo.lock
        run: cargo generate-lockfile

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.TAG_NAME }} -o CHANGELOG.md

      - name: Commit release
        run: |
          git add node/Cargo.toml node/Dockerfile Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.TAG_NAME }}"

      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push commit
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.version.outputs.BRANCH }}
        run: |
          # master's rulesets require a pull request for normal actors. The
          # repository-scoped GitHub App is an explicit ruleset bypass actor.
          # The chore(release) commit message trips ci.yml's build_base skip-guard,
          # so this push does not kick off a redundant pipeline.
          askpass="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$RELEASE_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" "$RELEASE_BRANCH"

      - name: Create tag via API
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tagName = process.env.TAG_NAME;

            // Get the SHA of the release commit (HEAD after our commits)
            const { execSync } = require('child_process');
            const commitSha = execSync('git rev-parse HEAD').toString().trim();

            // Create annotated tag object
            const tagObject = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
              message: `Release ${tagName}`,
              object: commitSha,
              type: 'commit'
            });

            // Create tag reference
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: tagObject.data.sha
            });

            console.log(`Created tag ${tagName} -> ${commitSha}`);
