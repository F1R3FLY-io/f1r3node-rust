name: Casper campaign controls
on:
  pull_request:
    paths:
      - scripts/casper-soak/**
      - formal/tlaplus/casper_soak/campaign/**
      - docs/claims/casper-campaign-*.md
      - docs/claims/casper-soak-campaign.md
      - .github/workflows/casper-campaign-control.yml
      - .github/workflows/merge-recovery-soak.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: casper-campaign-control-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-02-09
      - name: Install the verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre jq
          mkdir -p "$RUNNER_TEMP/campaign-tools"
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/campaign-tools/tla2tools.jar"
          printf '%s  %s\n' 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 "$RUNNER_TEMP/campaign-tools/tla2tools.jar" | sha256sum --check -
      - name: Check campaign controls
        env:
          TLA_TOOLS_JAR: ${{ runner.temp }}/campaign-tools/tla2tools.jar
        run: bash scripts/casper-soak/check-campaign-control.sh target/casper-campaign-control-ci
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: casper-campaign-control
          path: target/casper-campaign-control-ci
          if-no-files-found: error
          retention-days: 30
