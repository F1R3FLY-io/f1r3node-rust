# Fork PR entrypoint. Fork pull_request workflows get NO secrets, so the
# secret-bearing heavy pipeline (ephemeral OCI runner launch + integration
# matrix) cannot run under the normal `pull_request` ci.yml for forks.
#
# pull_request_target runs in the BASE-repo context (secrets available) and,
# critically, executes the workflow file FROM THE BASE BRANCH — a fork cannot
# alter what this privileged workflow does. The ephemeral-launch environment's
# required-reviewer approval is what releases the secrets, after a maintainer
# has reviewed the PR diff.
#
# Cheap checks (lint/test/etc.) still run for forks via ci.yml's normal
# `pull_request` trigger, unprivileged. This workflow only adds the heavy path.
name: CI (fork PRs)

# `labeled` is required for the ci-heavy opt-in below: without it, adding the
# label to an existing fork pull request starts nothing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - dev
      - master

# Minimal token. The privileged launch job mints a short-lived GitHub App token;
# the aggregators need actions:read to query sibling job conclusions.
permissions:
  contents: read
  actions: read

# Per-PR groups, never a shared one. GitHub keeps only ONE pending run per
# concurrency group, so any group spanning multiple PRs silently cancels queued
# runs: each new arrival evicts the previously pending one, and the evicted PR
# shows no failed check — its heavy pipeline simply never happened.
#
# This bit repeatedly on 2026-07-29. A fork run parked awaiting environment
# approval since 04:21 held the single shared lane all day; internal PRs (which
# also fire pull_request_target and then skip via the `fork == true` guards
# below) kept joining that same lane and evicting whatever was queued. PR #143
# lost its integration tests to an internal push at 14:02 with nothing on the
# PR to show for it.
#
# Serializing real OCI VM creation — the reason a shared group existed — is now
# enforced where it belongs: a job-level `oci-ephemeral-launch` group on
# _integration-pipeline.yml's launch job, held only for the ~1 minute of actual
# launching rather than across an unbounded approval wait. See that file for the
# residual-contention note and its manual-re-run recovery.
#
# cancel-in-progress: true, matching ci.yml's PR path. Without it, a re-push
# leaves the previous run parked in await_approval, and a maintainer clicking
# Approve then spends real OCI VMs validating a commit that is no longer the PR
# head — while the current head still needs its own approval and run. Approving
# stale work is worse than losing it, because the resulting green checks are
# commit-scoped and cannot satisfy the new head anyway.
#
# BEHAVIOUR TO EXPECT: superseding a run that is already waiting also withdraws
# its pending environment approval request. A maintainer part-way through
# reviewing a fork diff will see the approval prompt disappear when the
# contributor pushes again. That is correct — the diff they were approving is no
# longer what would run — but it is surprising the first time. The replacement
# run raises a fresh approval request for the new head.
concurrency:
  group: ci-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Run the shared heavy pipeline against the FORK's head commit, gated behind
  # the ephemeral-launch environment so the OCI runner launch only proceeds after
  # a maintainer (one of the environment's reviewers) approves. Reviewers may
  # approve their own PRs. Only fires for genuine fork PRs — internal PRs also
  # trigger pull_request_target but are handled by ci.yml's pull_request path, so
  # this job (and the aggregators below) skip for them.
  # Fork pull requests get heavy coverage from the merge queue, which runs in
  # base-repo context. Per-push here spent six VMs a push; the ci-heavy label is
  # the opt-in, and applying it needs write access.
  pipeline:
    name: Integration Pipeline
    if: >-
      github.event.pull_request.head.repo.fork == true
      && contains(github.event.pull_request.labels.*.name, 'ci-heavy')
    uses: ./.github/workflows/_integration-pipeline.yml
    with:
      checkout_repository: ${{ github.event.pull_request.head.repo.full_name }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      gated: true
    # Required — see the note on the same line in ci.yml. Fork safety does not
    # come from withholding secrets here; without this line the callee cannot see
    # them at all, including the ones the launch job legitimately needs. It comes
    # from _integration-pipeline.yml referencing credentials in exactly one job,
    # which checks out only the pinned system-integration SHA and never fork code.
    secrets: inherit

  # Per-arch aggregators. Until step 2 of TASK-023-4 the branch ruleset requires
  # the names `Integration Tests (amd64)` / `(arm64)`, which the temporary jobs
  # below carry. These collapse the reusable
  # pipeline's per-arch matrix jobs into one ruleset gate per arch. They use
  # `contains(...)` (not `startswith`) because reusable-workflow job names are
  # prefixed with the caller job name ("Integration Pipeline / Integration Tests (...)").
  integration_tests_amd64:
    name: Integration Gate (amd64)
    needs: pipeline
    if: always() && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check amd64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          if [ "${{ needs.pipeline.result }}" = "failure" ] || [ "${{ needs.pipeline.result }}" = "cancelled" ]; then
            echo "Integration Pipeline did not succeed (result: ${{ needs.pipeline.result }}); failing gate."
            exit 1
          fi
          if [ "${{ needs.pipeline.result }}" = "skipped" ]; then
            echo "Heavy integration coverage is deferred to the merge queue."
            echo "Add the ci-heavy label to run it on this pull request now."
            exit 0
          fi
          failures=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (amd64-")) | select(.conclusion != "success") | "\(.conclusion)\t\(.name)"')
          if [ -n "$failures" ]; then
            echo "amd64 integration test failures:"
            echo "$failures"
            exit 1
          fi
          echo "All amd64 integration test slots succeeded"

  integration_tests_arm64:
    name: Integration Gate (arm64)
    needs: pipeline
    if: always() && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check arm64 matrix slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -e {0}
        run: |
          if [ "${{ needs.pipeline.result }}" = "failure" ] || [ "${{ needs.pipeline.result }}" = "cancelled" ]; then
            echo "Integration Pipeline did not succeed (result: ${{ needs.pipeline.result }}); failing gate."
            exit 1
          fi
          if [ "${{ needs.pipeline.result }}" = "skipped" ]; then
            echo "Heavy integration coverage is deferred to the merge queue."
            echo "Add the ci-heavy label to run it on this pull request now."
            exit 0
          fi
          failures=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.name | contains("Integration Tests (arm64-")) | select(.conclusion != "success") | "\(.conclusion)\t\(.name)"')
          if [ -n "$failures" ]; then
            echo "arm64 integration test failures:"
            echo "$failures"
            exit 1
          fi
          echo "All arm64 integration test slots succeeded"

  # Temporary: the rulesets require the names below. Each job reports the result
  # of the renamed gate it needs and runs no check of its own. Step 2 of
  # TASK-023-4 points the rulesets at the new names and removes them.
  integration_tests_amd64_legacy_name:
    name: Integration Tests (amd64)
    needs: integration_tests_amd64
    if: always() && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Integration Gate (amd64)
        env:
          GATE: ${{ needs.integration_tests_amd64.result }}
        run: |
          echo "Integration Gate (amd64): $GATE"
          [ "$GATE" = success ]

  integration_tests_arm64_legacy_name:
    name: Integration Tests (arm64)
    needs: integration_tests_arm64
    if: always() && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Integration Gate (arm64)
        env:
          GATE: ${{ needs.integration_tests_arm64.result }}
        run: |
          echo "Integration Gate (arm64): $GATE"
          [ "$GATE" = success ]
