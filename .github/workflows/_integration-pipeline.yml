# Reusable heavy CI pipeline: native Docker build (self-hosted) -> ephemeral
# OCI runner launch (secret-bearing) -> dual-provider integration matrix
# (self-hosted ephemeral) -> smoke tests. Invoked via `workflow_call` by:
#   - ci.yml          for internal pushes / same-repo PRs (gated: false)
#   - ci-fork-pr.yml  for fork PRs via pull_request_target (gated: true)
# The leading underscore marks this as call-only: do not trigger it directly.
#
# Security model (matters for the fork path):
#   - Every checkout sets persist-credentials: false, so the base-context
#     GITHUB_TOKEN is never written to .git/config where fork code could read it.
#   - The ONLY secret-bearing job (launch_ephemeral_runners) checks out solely
#     F1R3FLY-io/system-integration (trusted) and runs only its scripts. Fork
#     code never executes in a job that has OCI or GitHub App credentials in scope.
#   - Fork code runs only in build_docker_image / integration_tests / smoke_*,
#     none of which reference secrets.
name: Integration Pipeline (reusable)

on:
  workflow_call:
    inputs:
      checkout_repository:
        description: "Repo to check out for the code-under-test. Empty = this repo."
        type: string
        required: false
        default: ""
      checkout_ref:
        description: "Ref/SHA to check out for the code-under-test. Empty = default (github.sha)."
        type: string
        required: false
        default: ""
      gated:
        description: "When true, launch_ephemeral_runners uses the ephemeral-launch environment (required-reviewer approval)."
        type: boolean
        required: false
        default: false
env:
  CARGO_TERM_COLOR: always
  # AES/SSE2 CPU features for gxhash (required by PathMap crate)
  RUSTFLAGS: "-C target-feature=+aes,+sse2"
  DOCKER_IMAGE_NAME: "f1r3flyindustries/f1r3fly-rust"
  # Pinned F1R3FLY-io/system-integration commit (main). The full SHA is the
  # supply-chain guarantee for the secret-bearing launch job: immutable, so a
  # repo takeover cannot move it. Bump ONLY via a reviewed PR after diffing
  # the old..new range in system-integration; never replace with a tag/branch.
  # MUST be kept identical to .github/oci-validation.env (the Full OCI
  # Validation workflow sources that file) — bump both in the same commit,
  # via `just repin-system-integration <sha>`.
  SYSTEM_INTEGRATION_REF: 22121713d8874ac84f94f4b3ddb30dda78fa7f88
  # Pinned OCI CLI installer (release tag + sha256) and CLI version. The
  # install.sh checksum fails closed if the tag is ever moved; OCI_CLI_VERSION
  # pins what the installer pulls from PyPI (without it the installer floats to
  # latest) and makes install.sh fetch the version-pinned install.py from the
  # v${OCI_CLI_VERSION} tag; OCI_CLI_INSTALLER_PY_SHA256 is passed to install.sh
  # --verify-checksum so a moved/compromised install.py fails closed too.
  # Keep identical to oci-validation.yml; bump all four together.
  OCI_CLI_INSTALLER_URL: "https://raw.githubusercontent.com/oracle/oci-cli/v3.89.1/scripts/install/install.sh"
  OCI_CLI_INSTALLER_SHA256: "079dcc9a3e2a61ec692400e30169c9996b2998ac8c4e205198ed5863283fcb76"
  OCI_CLI_INSTALLER_PY_SHA256: "f66dc9e2b69cbbd269374db638ffa9c0b08a5a4ea0b836b81336d6581aab9eed"
  OCI_CLI_VERSION: "3.89.1"

jobs:
  # Build Docker image natively on each arch using Oracle Cloud self-hosted runners.
  #
  # Gated on await_approval so that NOTHING in this pipeline runs for an
  # unapproved fork PR. This job compiles fork-authored code on the permanent
  # self-hosted runners, and the smoke_* jobs that depend on it burn
  # GitHub-hosted minutes; without the gate an untrusted contributor could spend
  # both simply by pushing, which is the abuse the ephemeral-launch approval
  # exists to prevent. Approval — not the concurrency group — is what holds
  # untrusted work back, so this must stay even if the grouping changes again.
  #
  # Internal runs are unaffected in substance: ephemeral-launch-internal has no
  # protection rules, so the gate resolves in seconds. The build still overlaps
  # the ~1-minute runner launch, since build and launch gate on the same node
  # rather than on each other.
  build_docker_image:
    name: Build Docker Image (${{ matrix.arch }})
    needs: await_approval
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # Queue instead of cancel for self-hosted runners (one runner per arch).
    concurrency:
      group: docker-build-${{ matrix.arch }}-${{ inputs.checkout_ref || github.ref }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: [self-hosted, Linux, X64, f1r3fly-rust-ci]
            arch: amd64
          - platform: linux/arm64
            runner: [self-hosted, Linux, ARM64, f1r3fly-rust-ci]
            arch: arm64
    steps:
      - name: Clean self-hosted runner state
        shell: bash {0}
        run: |
          sudo rm -rf system-integration/integration-tests/data
          rm -rf ../artifacts /tmp/rust-node-docker.tar.gz

      - name: Clone Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
          # Fork PRs reach this pipeline through ci-fork-pr.yml's
          # pull_request_target, and recent actions/checkout releases refuse to
          # check out fork code from that trigger without this opt-in. Nothing
          # changed here — the pin is the moving `@v4` tag, so the fork lane
          # broke upstream and every fork PR has died at Clone Repository since.
          #
          # The opt-in is sound only because its premises are machine-enforced,
          # not merely conventional. check-workflow-invariants.sh asserts that
          # this job gates on await_approval (fork code is fetched only after a
          # maintainer reviews the diff), that credentials are confined to
          # launch_ephemeral_runners (which never checks out the code under
          # test), and that `persist-credentials: false` is set right here. The
          # workflow file itself executes from the base branch, so fork code
          # cannot alter what runs. Do not add secrets to this job.
          allow-unsafe-pr-checkout: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable Containerd Image Store
        shell: bash -ex {0}
        run: |
          sudo mkdir -p /etc/docker
          DESIRED='{"features": {"containerd-snapshotter": true}}'
          CURRENT=$(cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          if [ "$CURRENT" != "$DESIRED" ]; then
            echo "$DESIRED" | sudo tee /etc/docker/daemon.json | jq
            sudo systemctl restart docker
            echo "Docker daemon restarted (config changed)"
          else
            echo "Docker daemon config already up to date, skipping restart"
          fi

      - name: Build Docker Image
        shell: bash -ex {0}
        run: |
          docker context use default
          VERSION="$(git describe --tags --always)"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file node/Dockerfile \
            --build-arg VERSION="${VERSION}" \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.arch }} \
            --load \
            .

      - name: Export Docker Image
        shell: bash -ex {0}
        run: |
          docker image save ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.arch }} \
              | gzip > /tmp/rust-node-docker.tar.gz

      - name: Save Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-docker-${{ matrix.arch }}
          path: /tmp/rust-node-docker.tar.gz

  # Approval gate, deliberately separated from the launch job below.
  #
  # This job exists solely to hold the environment's required-reviewer wait. It
  # runs no steps, touches no secrets, and carries NO concurrency group — so a
  # fork run parked here awaiting a maintainer costs nothing but a queue slot.
  #
  # Why the split: a job sitting in `waiting` holds any concurrency group it
  # names, for as long as the approval takes (GitHub expires pending approvals
  # after 30 days). When the OCI serialization group lived on the same job as
  # the environment, one unapproved fork PR blocked every other heavy run
  # indefinitely — observed 2026-07-29, where a run waiting since 04:21 held the
  # lane for twelve hours. Keeping the wait outside the serialized section
  # bounds the lock to actual VM creation.
  #
  # gated=true (fork path) uses ephemeral-launch, whose required_reviewers rule
  # is what a maintainer clears after reviewing the fork diff. gated=false
  # (internal path) uses ephemeral-launch-internal, which has NO protection
  # rules, so internal events pass straight through unattended. Both branches
  # must name a real environment: an empty-string environment name fails
  # workflow startup (the value is validated when the run graph is built), so
  # the ungated path cannot fall back to ''.
  await_approval:
    name: Await Launch Approval
    runs-on: ubuntu-latest
    environment: ${{ inputs.gated && 'ephemeral-launch' || 'ephemeral-launch-internal' }}
    permissions: {}
    # No timeout-minutes. This job's entire purpose is to wait, and the wait is
    # human-paced: GitHub lets a pending environment approval sit for up to 30
    # days. A tight timeout here would cancel the whole pipeline whenever a
    # maintainer did not click Approve promptly — a worse failure than the lane
    # blockage this split was introduced to fix, and one that would only surface
    # the first time someone stepped away. The single step below is an echo, so
    # there is no runaway-execution risk to bound; do not add one.
    steps:
      - name: Approval recorded
        shell: bash -e {0}
        run: echo "Ephemeral launch approved for this run; proceeding to OCI launch."

  # Launch ephemeral OCI VMs that will pick up the integration-tests matrix
  # jobs. Runs in parallel with build_docker_image so the ~1-minute launch
  # overhead overlaps with the ~7-minute Docker build. Each VM boots from a
  # baked image, registers as a GitHub Actions runner with
  # f1r3fly-rust-ci-ephemeral labels, picks up exactly one matrix job, then
  # self-terminates. Lifecycle: see F1R3FLY-io/system-integration ci/oci-runners/.
  #
  # This is the only job that handles secrets. It checks out ONLY the trusted
  # system-integration repo and runs only its scripts — never the code-under-test.
  #
  # `needs: await_approval` is the gate: this job cannot start until the
  # environment's reviewers have cleared the run, exactly as before. The
  # difference is that the waiting happens in a job that holds no lock.
  # SECURITY: do not remove that `needs:` — it is the only thing sequencing the
  # OCI credentials behind maintainer approval now that the environment is
  # declared one job upstream.
  launch_ephemeral_runners:
    name: Launch Ephemeral Runners
    needs: await_approval
    runs-on: ubuntu-latest
    environment: oci-credentials
    # Serializes real OCI VM creation across every heavy run in the repository:
    # the tenancy's daily instance-creation quota is shared, so two pipelines
    # launching at once both risk LimitExceeded. cancel-in-progress: false makes
    # a second launcher queue rather than cancel the in-flight one. The lock is
    # now held only for the ~1 minute of actual launching, not across an
    # unbounded approval wait.
    #
    # Residual risk, accepted: GitHub keeps only ONE pending entry per group, so
    # if three launchers contend within that ~1-minute window, the middle one is
    # cancelled. Recovery is a manual re-run of the affected job — there is no
    # silent data loss, but the PR shows a cancelled Heavy Pipeline rather than
    # a failure, so check for cancelled runs before assuming a pipeline was
    # never triggered.
    concurrency:
      group: oci-ephemeral-launch
      cancel-in-progress: false
    # Runner registration uses a short-lived GitHub App token; the default
    # GITHUB_TOKEN cannot mint repository runner registration tokens.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Clone system-integration
        uses: actions/checkout@v5
        with:
          repository: F1R3FLY-io/system-integration
          ref: ${{ env.SYSTEM_INTEGRATION_REF }}
          path: system-integration
          persist-credentials: false

      - name: Install OCI CLI (pinned, checksum-verified)
        shell: bash -ex {0}
        run: |
          # This runner later holds OCI_* secrets, so the installer must not be
          # fetched from a movable ref. Fails closed on any checksum mismatch.
          # Retries cover transient raw.githubusercontent.com 429s, which curl
          # treats as retryable; the pinned checksum still gates what runs.
          # --verify-checksum gates the install.py that install.sh downloads
          # from the v${OCI_CLI_VERSION} tag; if it fails, install.py is not run
          # and the `oci --version` guard below fails the step.
          curl -fsSL --retry 5 --retry-delay 10 "$OCI_CLI_INSTALLER_URL" -o /tmp/oci-install.sh
          echo "$OCI_CLI_INSTALLER_SHA256  /tmp/oci-install.sh" | sha256sum -c -
          bash /tmp/oci-install.sh \
            --accept-all-defaults --install-dir /opt/oci-cli --exec-dir /usr/local/bin \
            --oci-cli-version "$OCI_CLI_VERSION" \
            --verify-checksum "$OCI_CLI_INSTALLER_PY_SHA256"
          oci --version

      # Records WHICH credential store actually supplied this run, because the
      # answer is not observable any other way and got this pipeline wrong twice
      # on 2026-07-29. An empty secret and a malformed one produce the identical
      # OCI CLI error ("tenancy | malformed | this must be an OCID"), so a failure
      # here is ambiguous between "the environment is misconfigured" and "the
      # values never arrived" — a distinction that took three CI runs to settle
      # without this step.
      #
      # Discloses nothing. Only a byte length and a truncated SHA-256 are printed;
      # GitHub masks secret values in logs but not digests, which is exactly the
      # property that makes this useful: `len=0` means delivery failed, and a
      # digest mismatch against the value stored in the oci-credentials
      # environment means a different store won.
      #
      # Deliberately ahead of the config step below, so it still reports when that
      # step is the thing that fails.
      - name: Report credential delivery
        shell: bash -e {0} # no -x: never trace the multi-line private key
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_REGION OCI_FINGERPRINT OCI_PRIVATE_KEY; do
            value="${!name}"
            printf '%-18s len=%-5s sha256=%s\n' "$name" "${#value}" \
              "$(printf '%s' "$value" | sha256sum | cut -c1-16)"
          done

      - name: Configure OCI auth from secrets
        shell: bash -e {0} # no -x: never trace the multi-line private key
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config
          oci iam region list >/dev/null && echo "OCI auth OK"

      - name: Create runner-management token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Launch 2 amd64 + 2 arm64 ephemeral runners
        shell: bash -ex {0}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Register ephemeral runners on the base repo (where the run executes).
          GH_REPO: ${{ github.repository }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          cd system-integration/ci/oci-runners
          # Launch in parallel; each script exits as soon as the OCI launch
          # API call returns (the VM continues booting in the background and
          # registers itself via cloud-init). 2 amd64 + 2 arm64 feeds the
          # 4-job dual-provider matrix ({docker,subprocess} × {amd64,arm64}).
          # Kept to one VM per matrix job: OCI daily instance-creation quota
          # is shared tenancy-wide, and the previous 20-VM layout (5 identical
          # slots per arch×provider) exhausted it under normal PR traffic.
          pids=()
          for _ in $(seq 1 2); do ./launch-runner.sh amd64 & pids+=($!); done
          for _ in $(seq 1 2); do ./launch-runner.sh arm64 & pids+=($!); done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "At least one OCI runner launch failed."
            exit 1
          fi
          echo "All 4 ephemeral runner VMs submitted."

      - name: Remove OCI credentials
        if: always()
        shell: bash -e {0}
        run: |
          shred -fu ~/.oci/oci_api_key.pem 2>/dev/null || true
          rm -rf ~/.oci

  # Integration tests run on ephemeral OCI runners — one fresh VM per matrix
  # job, self-terminating after the job completes. The matrix runs the same
  # test suite against TWO node-spawn backends (docker provider, subprocess
  # provider) on each arch — 4 jobs total, one ephemeral runner each
  # (provider is a pytest flag, not a runner concern). The former layout ran
  # 5 identical slots per arch×provider (20 VMs) — pure repetition carried
  # over from legacy rust/staging, dropped to conserve OCI daily quota.
  # Job names must keep the "arch-provider" form: the per-arch aggregators
  # in ci.yml / ci-fork-pr.yml match on contains("Integration Tests (amd64-").
  integration_tests:
    name: Integration Tests (${{ matrix.arch }}-${{ matrix.provider }})
    needs: [build_docker_image, launch_ephemeral_runners]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              arch: amd64,
              provider: docker,
              runner:
                [
                  self-hosted,
                  linux,
                  x64,
                  f1r3fly-rust-ci-ephemeral,
                  oracle-cloud,
                ],
            }
          - {
              arch: amd64,
              provider: subprocess,
              runner:
                [
                  self-hosted,
                  linux,
                  x64,
                  f1r3fly-rust-ci-ephemeral,
                  oracle-cloud,
                ],
            }
          - {
              arch: arm64,
              provider: docker,
              runner:
                [
                  self-hosted,
                  linux,
                  arm64,
                  f1r3fly-rust-ci-ephemeral,
                  oracle-cloud,
                ],
            }
          - {
              arch: arm64,
              provider: subprocess,
              runner:
                [
                  self-hosted,
                  linux,
                  arm64,
                  f1r3fly-rust-ci-ephemeral,
                  oracle-cloud,
                ],
            }
    steps:
      - name: Clone Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
          # Fork PRs reach this pipeline through ci-fork-pr.yml's
          # pull_request_target, and recent actions/checkout releases refuse to
          # check out fork code from that trigger without this opt-in. Nothing
          # changed here — the pin is the moving `@v4` tag, so the fork lane
          # broke upstream and every fork PR has died at Clone Repository since.
          #
          # The opt-in is sound only because its premises are machine-enforced,
          # not merely conventional. check-workflow-invariants.sh asserts that
          # this job gates on await_approval (fork code is fetched only after a
          # maintainer reviews the diff), that credentials are confined to
          # launch_ephemeral_runners (which never checks out the code under
          # test), and that `persist-credentials: false` is set right here. The
          # workflow file itself executes from the base branch, so fork code
          # cannot alter what runs. Do not add secrets to this job.
          allow-unsafe-pr-checkout: true

      - name: Clone system-integration
        uses: actions/checkout@v5
        with:
          repository: F1R3FLY-io/system-integration
          ref: ${{ env.SYSTEM_INTEGRATION_REF }}
          path: system-integration
          persist-credentials: false

      - name: Load Docker Image (from build_docker_image artifact)
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-${{ matrix.arch }}
          path: /tmp

      - name: Import Docker Image
        shell: bash -ex {0}
        run: |
          zcat /tmp/rust-node-docker.tar.gz | docker image load
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.arch }} ${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Extract rnode binary from image (subprocess provider only)
        if: matrix.provider == 'subprocess'
        shell: bash -ex {0}
        run: |
          docker create --name extract-rnode ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker cp extract-rnode:/opt/docker/bin/node /tmp/rnode
          chmod +x /tmp/rnode
          docker rm extract-rnode
          /tmp/rnode --version 2>/dev/null || true
          ldd /tmp/rnode

      - name: Install system-integration dependencies
        shell: bash -ex {0}
        run: |
          cd system-integration
          poetry lock --no-update
          poetry install --with integration

      - name: Run Integration Tests (${{ matrix.provider }} provider)
        shell: bash -ex {0}
        env:
          # Both env vars are set unconditionally — the framework's resolver
          # honors whichever matches `--provider`. Setting the other is harmless.
          F1R3FLY_NODE_IMAGE: ${{ env.DOCKER_IMAGE_NAME }}:latest
          F1R3FLY_NODE_BINARY: /tmp/rnode
          F1R3FLY_NODE_DEFAULTS_CONF: ${{ github.workspace }}/node/src/main/resources/defaults.conf
        run: |
          cd system-integration
          SCALE_FLAG=""
          PYTEST_WORKERS=16
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            SCALE_FLAG="--timeout-scale=1.5"
          fi
          if [ "${{ matrix.arch }}-${{ matrix.provider }}" = "arm64-docker" ]; then
            PYTEST_WORKERS=8
          fi
          NODE_CAPABILITIES=$(bash "$GITHUB_WORKSPACE/.github/scripts/read-system-integration-node-capabilities.sh" "$GITHUB_WORKSPACE/.github/system-integration-node-capabilities.txt")
          NODE_CAPABILITY_ARGS=()
          while IFS= read -r capability; do
            [ -z "$capability" ] || NODE_CAPABILITY_ARGS+=("--node-capability=$capability")
          done <<< "$NODE_CAPABILITIES"
          # Issue https://github.com/F1R3FLY-io/f1r3node-rust/issues/282 tracks this temporary ceiling.
          # Keep the slow-deploy convergence test active until the 10 GB fix has exact-commit evidence.
          poetry run pytest \
            integration-tests/test/tests/shared/ \
            integration-tests/test/tests/custom/ \
            integration-tests/test/tests/standalone/ \
            --deselect integration-tests/test/tests/custom/test_load.py \
            --deselect integration-tests/test/tests/custom/test_asymmetric_bonds.py::test_finalization_asymmetric_bonds \
            --deselect integration-tests/test/tests/custom/test_joiner_self_proposes_at_epoch_boundary.py \
            --deselect integration-tests/test/tests/shared/test_observer_lfs_sync.py \
            --deselect integration-tests/test/tests/custom/test_shard_degradation.py \
            --deselect integration-tests/test/tests/shared/test_contract_lifecycle.py \
            --deselect integration-tests/test/tests/custom/test_consensus_safety.py::test_epoch_transition_under_heartbeat \
            --deselect integration-tests/test/tests/custom/test_validator_lifecycle.py \
            --deselect integration-tests/test/tests/custom/test_user_contract_concurrency.py \
            --deselect integration-tests/test/tests/custom/test_active_validator_cap.py \
            --deselect integration-tests/test/tests/custom/test_cold_start_readiness.py \
            --deselect integration-tests/test/tests/custom/test_concurrent_bridge_locks.py \
            --deselect integration-tests/test/tests/custom/test_finality_stall_recovery.py \
            --deselect integration-tests/test/tests/custom/test_slow_peer_notification.py \
            --provider=${{ matrix.provider }} \
            --rss-ceiling-mb 22000 \
            "${NODE_CAPABILITY_ARGS[@]}" \
            -v --tb=short --instafail --maxfail=10 \
            -n "$PYTEST_WORKERS" --dist=loadgroup --timeout=1200 $SCALE_FLAG

      - name: Upload Integration Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.arch }}-${{ matrix.provider }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: system-integration/integration-tests/
          retention-days: 7

  # Smoke test: single-node docker-compose standalone deployment.
  smoke_docker_standalone:
    name: Smoke Test (Docker Standalone)
    needs: build_docker_image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
          # Fork PRs reach this pipeline through ci-fork-pr.yml's
          # pull_request_target, and recent actions/checkout releases refuse to
          # check out fork code from that trigger without this opt-in. Nothing
          # changed here — the pin is the moving `@v4` tag, so the fork lane
          # broke upstream and every fork PR has died at Clone Repository since.
          #
          # The opt-in is sound only because its premises are machine-enforced,
          # not merely conventional. check-workflow-invariants.sh asserts that
          # this job gates on await_approval (fork code is fetched only after a
          # maintainer reviews the diff), that credentials are confined to
          # launch_ephemeral_runners (which never checks out the code under
          # test), and that `persist-credentials: false` is set right here. The
          # workflow file itself executes from the base branch, so fork code
          # cannot alter what runs. Do not add secrets to this job.
          allow-unsafe-pr-checkout: true

      - name: Load Docker Image
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp

      - name: Import Docker Image
        shell: bash -ex {0}
        run: |
          zcat /tmp/rust-node-docker.tar.gz | docker image load
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:amd64 ${{ env.DOCKER_IMAGE_NAME }}

      - name: Check node host ports
        shell: bash -e {0}
        # Extracted to .github/scripts/check-node-ports.sh: this ran
        # verbatim in all three smoke jobs, so a fix had to be applied
        # three times or the copies silently diverged.
        run: .github/scripts/check-node-ports.sh 14400 14455

      - name: Start standalone node
        shell: bash -ex {0}
        run: docker compose -f docker/standalone.yml -f docker/ci-ports.standalone.yml up -d

      - name: Wait for Running state
        shell: bash -ex {0}
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker/standalone.yml -f docker/ci-ports.standalone.yml logs 2>&1 | grep -q "Making a transition to Running state"; then
              echo "Node reached Running state"
              break
            fi
            echo "  [${i}] Waiting for Running state..."
            sleep 5
          done
          docker compose -f docker/standalone.yml -f docker/ci-ports.standalone.yml logs 2>&1 | grep "Making a transition to Running state" || (echo "FAIL: Node did not reach Running state" && exit 1)

      - name: Verify HTTP API
        shell: bash -ex {0}
        run: curl -sf http://localhost:14403/api/status

      - name: Wait for 10 finalized blocks
        shell: bash -ex {0}
        run: |
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:14403/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge 10 ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge 10 ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)

      - name: Collect logs
        if: always()
        shell: bash {0}
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-docker-standalone
          path: /tmp/logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash {0}
        run: docker compose -f docker/standalone.yml -f docker/ci-ports.standalone.yml down -v

