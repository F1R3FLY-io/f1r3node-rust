  # Smoke test: extract binary from docker image, run locally without docker.
  smoke_local_standalone:
    name: Smoke Test (Local Standalone)
    needs: build_docker_image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.sha }}
          persist-credentials: false
          # Fork PRs reach this pipeline through ci-fork-pr.yml's
          # pull_request_target, and recent actions/checkout releases refuse to
          # check out fork code from that trigger without this opt-in. Nothing
          # changed here — the pin is the moving `@v4` tag, so the fork lane
          # broke upstream and every fork PR has died at Clone Repository since.
          #
          # The opt-in is sound only because its premises are machine-enforced,
          # not merely conventional. check-workflow-invariants.sh asserts that
          # this job gates on await_approval (fork code is fetched only after a
          # maintainer reviews the diff), that credentials are confined to
          # launch_ephemeral_runners (which never checks out the code under
          # test), and that `persist-credentials: false` is set right here. The
          # workflow file itself executes from the base branch, so fork code
          # cannot alter what runs. Do not add secrets to this job.
          allow-unsafe-pr-checkout: true

      - name: Install just
        shell: bash -ex {0}
        env:
          JUST_VERSION: 1.57.0
          JUST_SHA256: 45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155
        run: |
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -sSfL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          printf '%s  %s\n' "$JUST_SHA256" "/tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Load Docker Image
        uses: actions/download-artifact@v4
        with:
          name: artifacts-docker-amd64
          path: /tmp

      - name: Extract node binary from Docker image
        shell: bash -ex {0}
        run: |
          zcat /tmp/rust-node-docker.tar.gz | docker image load
          CONTAINER_ID=$(docker create ${{ env.DOCKER_IMAGE_NAME }}:amd64)
          mkdir -p target/release
          docker cp "$CONTAINER_ID:/opt/docker/bin/node" ./target/release/node
          docker rm "$CONTAINER_ID"
          chmod +x ./target/release/node

      - name: Setup standalone data
        shell: bash -ex {0}
        run: just setup-standalone

      - name: Check node host ports
        shell: bash -e {0}
        # Extracted to .github/scripts/check-node-ports.sh: this ran
        # verbatim in all three smoke jobs, so a fix had to be applied
        # three times or the copies silently diverged.
        run: .github/scripts/check-node-ports.sh 14400 14455

      - name: Start standalone node
        shell: bash -ex {0}
        run: |
          # Same reason as docker/ci-ports.*.yml: the defaults (40400-40405) sit
          # inside the ephemeral range the Actions agent draws from. This job
          # binds on the host directly, so the ports move via CLI flags rather
          # than a compose mapping.
          ./target/release/node run -s \
            --config-file=run-local/conf/standalone.conf \
            --validator-private-key=5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657 \
            --host=localhost \
            --protocol-port=14400 \
            --api-port-grpc-external=14401 \
            --api-port-grpc-internal=14402 \
            --api-port-http=14403 \
            --discovery-port=14404 \
            --api-port-admin-http=14405 \
            --no-upnp \
            > /tmp/node-stdout.log 2>&1 &
          echo $! > /tmp/node.pid
          echo "Node started with PID $(cat /tmp/node.pid)"

      - name: Wait for Running state
        shell: bash -ex {0}
        run: |
          for i in $(seq 1 60); do
            if grep -q "Making a transition to Running state" /tmp/node-stdout.log 2>/dev/null; then
              echo "Node reached Running state"
              break
            fi
            echo "  [${i}] Waiting for Running state..."
            sleep 5
          done
          grep -q "Making a transition to Running state" /tmp/node-stdout.log || (echo "FAIL: Node did not reach Running state" && cat /tmp/node-stdout.log && exit 1)

      - name: Verify HTTP API
        shell: bash -ex {0}
        run: curl -sf http://localhost:14403/api/status

      - name: Wait for 10 finalized blocks
        shell: bash -ex {0}
        run: |
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:14403/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge 10 ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge 10 ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)

      - name: Collect logs
        if: always()
        shell: bash {0}
        run: |
          mkdir -p /tmp/logs
          cp /tmp/node-stdout.log /tmp/logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-local-standalone
          path: /tmp/logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash {0}
        run: |
          PID=$(cat /tmp/node.pid 2>/dev/null || echo "")
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
