name: Full OCI Validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate (pull-request mode)
        required: false
        default: ""
      head_sha:
        description: Expected pull request head SHA reviewed by the maintainer (pull-request mode)
        required: false
        default: ""
      approval_comment_id:
        description: Pull request comment ID containing /full-oci-validate <pr_number> <head_sha> (pull-request mode)
        required: false
        default: ""
      candidate_tag:
        description: Candidate tag (vMAJOR.MINOR.PATCH-canary.RUN) for exact-candidate mode; leave empty for pull-request mode
        required: false
        default: ""

# Pull-request mode builds an unpublished image from the reviewed PR head.
# Exact-candidate mode (docs/release-process.md section 9) validates the
# published candidate image by digest from OCIR and publishes the section
# 8.1 gate document on the candidate prerelease.
concurrency:
  group: full-oci-validation-${{ github.event.inputs.candidate_tag || github.event.inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned OCI CLI installer (release tag + sha256) and CLI version. The
  # install.sh checksum fails closed if the tag is ever moved; OCI_CLI_VERSION
  # pins what the installer pulls from PyPI (without it the installer floats to
  # latest) and makes install.sh fetch the version-pinned install.py from the
  # v${OCI_CLI_VERSION} tag; OCI_CLI_INSTALLER_PY_SHA256 is passed to install.sh
  # --verify-checksum so a moved/compromised install.py fails closed too.
  # Keep identical to _integration-pipeline.yml — this job holds OCI and
  # GitHub App credentials, so it must not use a weaker install path than the main
  # pipeline. Bump all four together in both files.
  OCI_CLI_INSTALLER_URL: "https://raw.githubusercontent.com/oracle/oci-cli/v3.89.1/scripts/install/install.sh"
  OCI_CLI_INSTALLER_SHA256: "079dcc9a3e2a61ec692400e30169c9996b2998ac8c4e205198ed5863283fcb76"
  OCI_CLI_INSTALLER_PY_SHA256: "f66dc9e2b69cbbd269374db638ffa9c0b08a5a4ea0b836b81336d6581aab9eed"
  OCI_CLI_VERSION: "3.89.1"

jobs:
  validate_pr:
    name: Validate Input
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_repo: ${{ steps.pr.outputs.head_repo || steps.candidate.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha || steps.candidate.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref || steps.candidate.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref || steps.candidate.outputs.base_ref }}
      system_integration_ref: ${{ steps.pr.outputs.system_integration_ref || steps.candidate.outputs.system_integration_ref }}
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_amd64_digest: ${{ steps.candidate.outputs.candidate_amd64_digest }}
      candidate_arm64_digest: ${{ steps.candidate.outputs.candidate_arm64_digest }}
    steps:
      - name: Checkout workflow configuration
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate candidate
        id: candidate
        if: github.event.inputs.candidate_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ github.event.inputs.candidate_tag }}
          ACTOR: ${{ github.actor }}
        shell: bash -euo pipefail {0}
        run: |
          if ! [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-canary\.[1-9][0-9]*$ ]]; then
            echo "candidate_tag must be a standard canary tag."
            exit 1
          fi
          actor_permission=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || true)
          if [ "$actor_permission" != "admin" ] && [ "$actor_permission" != "maintain" ]; then
            echo "${ACTOR} has ${actor_permission:-no} permission; exact-candidate validation requires maintain or admin permission."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/candidate"
          gh release download "$CANDIDATE_TAG" --repo "$GH_REPO" \
            --pattern release-evidence.json --pattern release-evidence.json.sha256 \
            --dir "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && awk '{print $1 "  release-evidence.json"}' release-evidence.json.sha256 | sha256sum -c -)
          evidence="$RUNNER_TEMP/candidate/release-evidence.json"
          .github/scripts/release-evidence.sh validate "$evidence"
          [ "$(jq -r '.publication_mode' "$evidence")" = canary ] || { echo "candidate has no published images"; exit 1; }
          [ "$(jq -r '.candidate_tag' "$evidence")" = "$CANDIDATE_TAG" ] || { echo "evidence candidate tag differs from the requested tag"; exit 1; }
          source_sha="$(jq -r '.source_sha' "$evidence")"
          ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${CANDIDATE_TAG}")"
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          if [ "$(jq -r '.object.type' <<<"$ref_json")" = tag ]; then
            tag_sha="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          [ "$tag_sha" = "$source_sha" ] || { echo "tag ${CANDIDATE_TAG} resolves to ${tag_sha}, not the evidence source ${source_sha}"; exit 1; }
          {
            echo "head_repo=${GH_REPO}"
            echo "head_sha=${source_sha}"
            echo "head_ref=refs/tags/${CANDIDATE_TAG}"
            echo "base_ref=master"
            echo "system_integration_ref=$(jq -r '.system_integration_sha' "$evidence")"
            echo "candidate_tag=${CANDIDATE_TAG}"
            echo "candidate_amd64_digest=$(jq -r '.images.linux_amd64_digest' "$evidence")"
            echo "candidate_arm64_digest=$(jq -r '.images.linux_arm64_digest' "$evidence")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate pull request
        id: pr
        if: github.event.inputs.candidate_tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          APPROVAL_COMMENT_ID: ${{ github.event.inputs.approval_comment_id }}
          ACTOR: ${{ github.actor }}
        shell: bash -euo pipefail {0}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be numeric."
            exit 1
          fi

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "head_sha must be a 40-character commit SHA."
            exit 1
          fi
          expected_head_sha=$(tr '[:upper:]' '[:lower:]' <<< "$EXPECTED_HEAD_SHA")

          if [[ ! "$APPROVAL_COMMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "approval_comment_id must be numeric."
            exit 1
          fi

          actor_permission=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || true)
          if [ "$actor_permission" != "admin" ] && [ "$actor_permission" != "maintain" ]; then
            echo "${ACTOR} has ${actor_permission:-no} permission; Full OCI Validation requires maintain or admin permission."
            exit 1
          fi

          pr_json=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          state=$(jq -r '.state' <<< "$pr_json")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr_json")
          head_sha=$(jq -r '.head.sha' <<< "$pr_json")
          head_ref=$(jq -r '.head.ref' <<< "$pr_json")
          base_ref=$(jq -r '.base.ref' <<< "$pr_json")
          if [ "$state" != "open" ]; then
            echo "PR ${PR_NUMBER} is ${state}; only open PRs can be validated."
            exit 1
          fi

          if [ "$expected_head_sha" != "$head_sha" ]; then
            echo "Expected head SHA ${expected_head_sha}, but PR ${PR_NUMBER} currently points to ${head_sha}."
            exit 1
          fi

          approval_json=$(gh api "repos/${GH_REPO}/issues/comments/${APPROVAL_COMMENT_ID}")
          approval_issue_url=$(jq -r '.issue_url' <<< "$approval_json")
          expected_issue_url="https://api.github.com/repos/${GH_REPO}/issues/${PR_NUMBER}"
          if [ "$approval_issue_url" != "$expected_issue_url" ]; then
            echo "Approval comment ${APPROVAL_COMMENT_ID} does not belong to PR ${PR_NUMBER}."
            exit 1
          fi

          approval_author=$(jq -r '.user.login' <<< "$approval_json")
          approval_author_permission=$(gh api "repos/${GH_REPO}/collaborators/${approval_author}/permission" --jq '.permission' 2>/dev/null || true)
          if [ "$approval_author_permission" != "admin" ] && [ "$approval_author_permission" != "maintain" ]; then
            echo "Approval comment author ${approval_author} has ${approval_author_permission:-no} permission; Full OCI Validation approval requires maintain or admin permission."
            exit 1
          fi

          approval_body=$(jq -r '.body // ""' <<< "$approval_json")
          approval_phrase="/full-oci-validate ${PR_NUMBER} ${head_sha}"
          if ! grep -Fxq "$approval_phrase" <<< "$approval_body"; then
            echo "Approval comment ${APPROVAL_COMMENT_ID} must contain this exact line: ${approval_phrase}"
            exit 1
          fi

          source .github/oci-validation.env
          if [[ ! "$SYSTEM_INTEGRATION_REF" =~ ^[0-9a-f]{40}$ && ! "$SYSTEM_INTEGRATION_REF" =~ ^refs/tags/[A-Za-z0-9._/-]+$ ]]; then
            echo "SYSTEM_INTEGRATION_REF must be a 40-character commit SHA or refs/tags/<tag>."
            exit 1
          fi

          {
            echo "head_repo=${head_repo}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
            echo "base_ref=${base_ref}"
            echo "system_integration_ref=${SYSTEM_INTEGRATION_REF}"
          } >> "$GITHUB_OUTPUT"

  await_approval:
    name: Await OCI Validation Approval
    needs: validate_pr
    runs-on: ubuntu-latest
    environment: ephemeral-launch
    permissions: {}
    steps:
      - name: Approval recorded
        shell: bash -e {0}
        run: echo "Full OCI validation approved; privileged launch may proceed."

  launch_ephemeral_runners:
    name: Launch Ephemeral OCI Runners
    needs: [validate_pr, await_approval]
    runs-on: ubuntu-latest
    environment: oci-credentials
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone trusted system-integration launcher
        uses: actions/checkout@v5
        with:
          repository: F1R3FLY-io/system-integration
          ref: ${{ needs.validate_pr.outputs.system_integration_ref }}
          path: system-integration
          persist-credentials: false

      - name: Install OCI CLI (pinned, checksum-verified)
        shell: bash -ex {0}
        run: |
          # This runner holds OCI_* secrets, so the installer must not be
          # fetched from a movable ref. Fails closed on any checksum mismatch.
          # Retries cover transient raw.githubusercontent.com 429s, which curl
          # treats as retryable; the pinned checksum still gates what runs.
          # --verify-checksum gates the install.py that install.sh downloads
          # from the v${OCI_CLI_VERSION} tag; if it fails, install.py is not run
          # and the `oci --version` guard below fails the step.
          curl -fsSL --retry 5 --retry-delay 10 "$OCI_CLI_INSTALLER_URL" -o /tmp/oci-install.sh
          echo "$OCI_CLI_INSTALLER_SHA256  /tmp/oci-install.sh" | sha256sum -c -
          bash /tmp/oci-install.sh \
            --accept-all-defaults --install-dir /opt/oci-cli --exec-dir /usr/local/bin \
            --oci-cli-version "$OCI_CLI_VERSION" \
            --verify-checksum "$OCI_CLI_INSTALLER_PY_SHA256"
          oci --version

      - name: Configure OCI auth from secrets
        shell: bash -e {0}
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          install -d -m 700 ~/.oci
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config
          oci iam region list >/dev/null && echo "OCI auth OK"

      - name: Create runner-management token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Launch 11 amd64 + 11 arm64 ephemeral runners
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          cd system-integration/ci/oci-runners
          pids=()
          for _ in $(seq 1 11); do ./launch-runner.sh amd64 & pids+=("$!"); done
          for _ in $(seq 1 11); do ./launch-runner.sh arm64 & pids+=("$!"); done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "At least one OCI runner launch failed."
            exit 1
          fi

          echo "All 22 ephemeral runner VMs submitted."

      - name: Remove OCI credentials
        if: always()
        shell: bash -e {0}
        run: |
          shred -fu ~/.oci/oci_api_key.pem 2>/dev/null || true
          rm -rf ~/.oci

  oci_validation:
    name: Run OCI Validation
    needs: [validate_pr, launch_ephemeral_runners]
    uses: ./.github/workflows/reusable-oci-validation.yml
    permissions:
      actions: read
      contents: read
    with:
      head_repo: ${{ needs.validate_pr.outputs.head_repo }}
      head_sha: ${{ needs.validate_pr.outputs.head_sha }}
      system_integration_ref: ${{ needs.validate_pr.outputs.system_integration_ref }}
      candidate_tag: ${{ needs.validate_pr.outputs.candidate_tag }}
      candidate_amd64_digest: ${{ needs.validate_pr.outputs.candidate_amd64_digest }}
      candidate_arm64_digest: ${{ needs.validate_pr.outputs.candidate_arm64_digest }}
    secrets:
      OCIR_REGISTRY: ${{ secrets.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
      OCIR_REPO: ${{ secrets.OCIR_REPO }}
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
      OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}

  publish_candidate_evidence:
    name: Publish Candidate Gate Evidence
    needs: [validate_pr, oci_validation]
    if: needs.validate_pr.outputs.candidate_tag != '' && needs.oci_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    environment: release-credentials
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci-control
          persist-credentials: false

      - name: Write and publish the OCI validation gate document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ needs.validate_pr.outputs.candidate_tag }}
        shell: bash -euo pipefail {0}
        run: |
          work="$RUNNER_TEMP/gate"
          mkdir -p "$work"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-evidence.json --pattern release-evidence.json.sha256 --dir "$work"
          (cd "$work" && awk '{print $1 "  release-evidence.json"}' release-evidence.json.sha256 | sha256sum -c -)
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$work/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --paginate --jq '.jobs[]' | jq -s '{jobs: .}' > "$work/jobs.json"
          ci-control/.github/scripts/release-gate-evidence.sh oci-validation \
            "$work/release-evidence.json" "$work/run.json" "$work/jobs.json" \
            "$work/oci-validation-evidence.json"
          ci-control/.github/scripts/release-gate-evidence.sh candidate-marker \
            "$work/release-evidence.json" "$work/release-candidate.json"
          # --clobber: a rerun of the same candidate replaces its own gate
          # document. The document binds to the exact source and image, so a
          # newer successful run supersedes an older one for the same candidate.
          gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$work/oci-validation-evidence.json"
          echo "Published oci-validation-evidence.json on ${CANDIDATE_TAG}."

      - name: Upload candidate marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: ${{ runner.temp }}/gate/release-candidate.json
          retention-days: 30
          if-no-files-found: error

  report_result:
    name: Report OCI Validation Result
    needs: [validate_pr, launch_ephemeral_runners, oci_validation]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Report result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ needs.validate_pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate_pr.result }}
          LAUNCH_RESULT: ${{ needs.launch_ephemeral_runners.result }}
          OCI_RESULT: ${{ needs.oci_validation.result }}
        shell: bash -euo pipefail {0}
        run: |
          if [ "$VALIDATE_RESULT" = "success" ] && [ "$LAUNCH_RESULT" = "success" ] && [ "$OCI_RESULT" = "success" ]; then
            state=success
            description="Full OCI validation passed"
          else
            state=failure
            description="Full OCI validation failed"
          fi

          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "${description} for ${HEAD_SHA}. Run: ${RUN_URL}"
          fi

          if [ -n "$HEAD_SHA" ]; then
            gh api -X POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
              -f state="$state" \
              -f context="Full OCI Validation" \
              -f target_url="$RUN_URL" \
              -f description="$description" || echo "Warning: failed to update commit status"
          fi
