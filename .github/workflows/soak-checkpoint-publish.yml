name: Soak Checkpoint Publish

# Publishes a mid-run soak checkpoint to the dashboard.
#
# Dispatched by the soak job between segments rather than deploying from inside
# it: a Pages deploy needs the `github-pages` environment and the `soak-pages`
# concurrency group at job level, and holding those from a 22h soak would block
# every other Pages deploy for a day. This job holds them for a minute.
#
# It updates only the `latest-*` files for its series. It does not append to
# history — a history entry means one completed run, and a partial one would
# double-count the night once the run finishes and publishes for real.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Soak run that produced the checkpoint artifact
        required: true
        type: string
      artifact:
        description: Name of the checkpoint artifact on that run
        required: true
        type: string
      kind:
        description: Which series this checkpoint belongs to
        required: true
        type: choice
        options:
          - daily
          - weekend

permissions:
  contents: read

jobs:
  publish:
    name: Publish Soak Checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Shared with perf_report and the dashboard bootstrap. All three do a
    # read-modify-write against Pages as the only durable store, so they must
    # never overlap; a job does not begin fetching until it holds the slot.
    concurrency:
      group: soak-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout dashboard source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          persist-credentials: false

      - name: Download checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT: ${{ inputs.artifact }}
        shell: bash -euo pipefail {0}
        run: |
          # Dispatch inputs are caller-supplied. They are only ever used as
          # quoted environment values, never interpolated into this script, but
          # constrain their shape anyway: run_id addresses a run and artifact
          # names one, so anything outside those alphabets is not a mistake to
          # be tolerated. `kind` is a choice input, so GitHub constrains it.
          case "$RUN_ID" in
            ""|*[!0-9]*) echo "::error::run_id must be digits only"; exit 1 ;;
          esac
          case "$ARTIFACT" in
            soak-checkpoint-[!/]*) ;;
            *) echo "::error::artifact must be a soak-checkpoint-* name"; exit 1 ;;
          esac

          mkdir -p checkpoint
          # The soak run is still in progress. Artifacts are readable as soon as
          # they finish uploading, but the dispatch can outrun that, so retry a
          # few times before giving up.
          for attempt in 1 2 3 4 5; do
            if gh run download "$RUN_ID" --name "$ARTIFACT" --dir checkpoint; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::artifact ${ARTIFACT} not readable on run ${RUN_ID} after 5 attempts"
              exit 1
            fi
            echo "attempt ${attempt}: artifact not ready, retrying"
            sleep 15
          done
          test -s checkpoint/weekly-summary.json || {
            echo "::error::checkpoint artifact has no weekly-summary.json"; exit 1; }
          # Refuse anything that is not actually a checkpoint. A completed
          # summary published here would overwrite the tab with a run that then
          # never gets its history entry, since this job does not append.
          status="$(jq -r '.run.status // "complete"' checkpoint/weekly-summary.json)"
          if [ "$status" != "in_progress" ]; then
            echo "::error::artifact reports status '${status}', expected in_progress; refusing to publish it as a checkpoint"
            exit 1
          fi

      - name: Assemble dashboard site
        shell: bash -euo pipefail {0}
        env:
          DASHBOARD_URL: https://f1r3fly-io.github.io/f1r3node-rust/
          SERIES_SUFFIX: ${{ inputs.kind == 'daily' && '-daily' || '' }}
        run: |
          mkdir -p site/data
          cp -r ci-control/.github/dashboard/. site/
          # A Pages deploy replaces the whole site, so every published file is
          # carried forward and only this series' latest-* files are replaced.
          # Same fail-closed rule as the other publishers: only a 404 may yield
          # an absent file, anything else aborts rather than publishing a site
          # with a series missing.
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for f in history.json latest-summary.json latest-verdict.json latest-report.md \
                   history-daily.json latest-summary-daily.json latest-verdict-daily.json \
                   latest-report-daily.md; do
            code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -w '%{http_code}' \
              -o "site/data/${f}" "${DASHBOARD_URL}data/${f}?cb=${cb}")" || code=000
            case "$code" in
              200) ;;
              404) rm -f "site/data/${f}" ;;
              *)
                echo "::error::could not read published ${f} (HTTP ${code}); aborting so no published series is lost"
                exit 1
                ;;
            esac
          done
          for f in history.json history-daily.json; do
            [ -e "site/data/${f}" ] || continue
            jq -e 'type == "array"' "site/data/${f}" >/dev/null 2>&1 || {
              echo "::error::published ${f} is not a JSON array; refusing to replace it"; exit 1; }
          done
          for f in latest-summary.json latest-verdict.json \
                   latest-summary-daily.json latest-verdict-daily.json; do
            [ -e "site/data/${f}" ] || continue
            jq -e 'type == "object"' "site/data/${f}" >/dev/null 2>&1 || {
              echo "::error::published ${f} is not a JSON object; refusing to republish it"; exit 1; }
          done

          # History is left exactly as fetched. A checkpoint is not a run.
          cp checkpoint/weekly-summary.json "site/data/latest-summary${SERIES_SUFFIX}.json"
          cp checkpoint/verdict.json "site/data/latest-verdict${SERIES_SUFFIX}.json"
          cp checkpoint/perf-report.md "site/data/latest-report${SERIES_SUFFIX}.md"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
