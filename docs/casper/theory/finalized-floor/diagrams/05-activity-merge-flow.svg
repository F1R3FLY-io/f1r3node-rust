512</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="147.4798" x="564.1863" y="241.134">is DEMOTED to a metric &#8212; NOT</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="156.5099" x="564.1863" y="254.754">node-deterministic (branch width</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="145.9298" x="564.1863" y="268.374">differs across views), so it must</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.6398" x="564.1863" y="281.994">NEVER gate admission (only &#916; does).</text><polygon fill="#FFF8E1" points="386.0964,289.924,546.1863,289.924,558.1863,301.924,546.1863,313.924,386.0964,313.924,374.0964,301.924,386.0964,289.924" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.0899" x="386.0964" y="305.804">&#916; &gt; MAX_FLOOR_DISTANCE (256) ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="75.271" x="298.8254" y="298.994">yes &#9472;&#9472; backstop</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="77.6209" x="558.1863" y="298.994">no &#9472;&#9472; within cap</text><polygon fill="#FFF8E1" points="264.2777,323.924,362.4176,323.924,374.4176,335.924,362.4176,347.924,264.2777,347.924,252.2777,335.924,264.2777,323.924" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.1399" x="264.2777" y="339.804">propose or validate ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="38.9599" x="213.3177" y="332.994">propose</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="36.86" x="374.4176" y="332.994">validate</text><rect fill="#FFCDD2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="148.6199" x="147.6552" y="357.924"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="99.2699" x="157.6552" y="378.614">PARK the round (Err);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.6199" x="157.6552" y="392.234">retry once finality advances</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="52.8999" x="157.6552" y="405.854">&amp; &#916; shrinks</text><rect fill="#FFCDD2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="176.9099" x="316.2751" y="357.924"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="156.9099" x="326.2751" y="378.614">block is deterministically INVALID</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.9299" x="326.2751" y="392.234">(both sides compute the same &#916;)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="97.8758" x="326.2751" y="405.854">&#10233; REJECT &#8212; no fork</text><rect fill="#C8E6C9" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="178.7899" x="529.5401" y="323.924"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="150.0009" x="539.5401" y="344.614">floor-bounded ancestor scan &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="110.7899" x="539.5401" y="358.234">collect band writes with</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="102.8188" x=