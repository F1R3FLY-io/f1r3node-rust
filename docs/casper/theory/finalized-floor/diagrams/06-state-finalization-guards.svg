<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="728px" preserveAspectRatio="none" style="width:754px;height:728px;background:#FFFFFF;" version="1.1" viewBox="0 0 754 728" width="754px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="32"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="722.6145" x="15" y="38.5181">Finalization downward-closure (L-ANC) and the warm-path guards</text></g><g class="entity" data-qualified-name="Pivot" data-source-line="41" id="ent0001"><rect fill="#C8E6C9" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="146.0399" x="244.9173" y="201.0641"/><line style="stroke:#444444;stroke-width:1;" x1="244.9173" x2="390.9572" y1="238.3041" y2="238.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.4799" x="254.9173" y="216.7541">Pivot F(parent)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="126.0399" x="254.9173" y="230.3741">(finalized over just(parent))</text></g><g class="entity" data-qualified-name="Upwalk" data-source-line="42" id="ent0002"><rect fill="#BBDEFB" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="134.9999" x="76.4373" y="367.0641"/><line style="stroke:#444444;stroke-width:1;" x1="76.4373" x2="211.4372" y1="404.3041" y2="404.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="38.07" x="86.4373" y="382.7541">Up-walk</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="114.9999" x="86.4373" y="396.3741">(advance toward parent)</text></g><g class="entity" data-qualified-name="Frontier" data-source-line="43" id="ent0003"><rect fill="#A5D6A7" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="145.0999" x="240.3873" y="506.0641"/><line style="stroke:#444444;stroke-width:1;" x1="240.3873" x2="385.4872" y1="529.6841" y2="529.6841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="125.0999" x="250.3873" y="521.7541">Highest finalized = frontier</text></g><g class="entity" data-qualified-name="Cold" data-source-line="44" id="ent0004"><rect fill="#FFE0B2" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="139.2599" x="413.3073" y="367.0641"/><line style="stroke:#444444;stroke-width:1;" x1="413.3073" x2="552.5672" y1="404.3041" y2="404.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="119.2599" x="423.3073" y="382.7541">Cold down-walk (fallback)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="104.7599" x="423.3073" y="396.3741">top-down from parent</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="46" id="ent0005"><ellipse cx="194.9373" cy="101.0141" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="58" id="ent0013"><ellipse cx="312.9373" cy="628.0641" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="312.9373" cy="628.0641" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="61" id="ent0016"><path d="M240.4173,61.9641 L240.4173,140.064 A0,0 0 0 0 240.4173,140.064 L399.3873,140.064 L342.4073,200.7841 L407.3873,140.064 L643.4667,140.064 A0,0 0 0 0 643.4667,140.064 L643.4667,71.9641 L633.4667,61.9641 L240.4173,61.9641 A0,0 0 0 0 240.4173,61.9641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M633.4667,61.9641 L633.4667,71.9641 L643.4667,71.9641 L633.4667,61.9641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="351.0298" x="246.4173" y="77.6541">L-ANC (the determinism linchpin). Under a CONSTANT committee, finalized</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="382.0494" x="246.4173" y="91.2741">blocks form a DOWNWARD-CLOSED PREFIX of the spine &#8212; the same quorum that</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="332.2198" x="246.4173" y="104.8941">finalizes a block finalizes every ancestor (GuardBridge.chain_adj_AdjDC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="323.7297" x="246.4173" y="118.5141">derives this AdjDC premise; Floor.frontier_cache_transparent uses it).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="221.9957" x="246.4173" y="132.134">&#10233; warm == cold, so the cache never forks (S1).</text></g><!--link *start* to Pivot--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="46" id="lnk6"><path d="M200.0773,109.9541 C205.3773,117.9141 214.1073,130.3541 222.9373,140.0641 C243.0273,162.1741 264.5112,181.3972 283.9612,197.6572" fill="none" id="*start*-to-Pivot" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="287.7973,200.8641,283.4579,192.0228,283.9612,197.6572,278.3268,198.1605,287.7973,200.8641" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Pivot to Upwalk--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="48" id="lnk7"><path d="M244.4573,235.5941 C214.2873,242.8641 181.6473,256.2941 160.9373,281.0641 C140.9773,304.9341 139.0747,337.2945 140.6547,361.7345" fill="none" id="Pivot-to-Upwalk" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="140.9773,366.7241,144.3883,357.4848,140.6547,361.7345,136.405,358.0009,140.9773,366.7241" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="78.0109" x="189.4209" y="292.7541">guards HOLD &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="131.4299" x="162.7114" y="306.3741">committee constant (L-ANC)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="132.9781" x="161.9373" y="319.9941">&#8743; pivot still ft_witnessed &#8805; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.8199" x="194.0164" y="333.6141">over J (L-SNAP)</text></g><!--link Upwalk to Upwalk--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="50" id="lnk8"><path d="M211.4673,379.0741 C231.1673,379.5241 246.4373,383.8541 246.4373,392.0641 C246.4373,400.2741 236.166,404.4899 216.466,404.9399" fill="none" id="Upwalk-to-Upwalk" style="stroke:#1565C0;stroke-width:1;"/><polygon fill="#1565C0" points="211.4673,405.0541,220.5563,408.8475,216.466,404.9399,220.3736,400.8496,211.4673,405.0541" style="stroke:#1565C0;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="104.9688" x="268.5308" y="389.2541">ft_witnessed(next) &#8805; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="137.1559" x="252.4373" y="402.8741">&#10233; advance  (amortized O(1))</text></g><!--link Upwalk to Frontier--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="51" id="lnk9"><path d="M174.1473,417.5541 C204.9173,442.4941 248.433,477.7757 279.103,502.6357" fill="none" id="Upwalk-to-Frontier" style="stroke:#E65100;stroke-width:1;"/><polygon fill="#E65100" points="282.9873,505.7841,278.5144,497.0095,279.103,502.6357,273.4769,503.2243,282.9873,505.7841" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="102.3099" x="262.6752" y="458.7541">ft_witnessed(next) &lt; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="138.5058" x="244.5773" y="472.3741">&#10233; STOP at first non-finalized</text></g><!--link Pivot to Cold--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="53" id="lnk10"><path d="M309.3873,251.4441 C302.6073,275.5741 296.9273,312.3641 314.9373,337.0641 C318.1073,341.4141 363.6078,355.8185 408.3478,369.2285" fill="none" id="Pivot-to-Cold" style="stroke:#C62828;stroke-width:1;"/><polygon fill="#C62828" points="413.1373,370.6641,405.6647,364.2485,408.3478,369.2285,403.3678,371.9117,413.1373,370.6641" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="161.0999" x="325.4023" y="292.7541">committee-constancy guard TRIPS</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="180.0298" x="315.9373" y="306.3741">committee changed in band (bonding)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="108.1859" x="351.8593" y="319.9941">&#10233; L-ANC premise fails</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.5199" x="324.6923" y="333.6141">/ floor_incremental_guard_fallback</text></g><!--link Pivot to Cold--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="54" id="lnk11"><path d="M390.9973,239.4441 C435.8973,248.7041 487.3473,262.8941 500.9373,281.0641 C519.4773,305.8641 509.9384,338.111 498.5884,362.201" fill="none" id="Pivot-to-Cold-1" style="stroke:#C62828;stroke-width:1;"/><polygon fill="#C62828" points="496.4573,366.7241,503.9117,360.2873,498.5884,362.201,496.6747,356.8776,496.4573,366.7241" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.1199" x="545.8573" y="292.7541">L-SNAP guard TRIPS</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="152.4787" x="516.6779" y="306.3741">pivot no longer ft_witnessed &#8805; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.0599" x="532.3873" y="319.9941">over the larger snapshot J</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.5199" x="511.6573" y="333.6141">/ floor_incremental_guard_fallback</text></g><!--link Cold to Frontier--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="56" id="lnk12"><path d="M458.2773,417.3041 C440.4273,434.4041 415.4073,457.4841 391.9373,476.0641 C378.9073,486.3741 368.157,494.0848 354.827,503.0448" fill="none" id="Cold-to-Frontier" style="stroke:#546E7A;stroke-width:1;"/><polygon fill="#546E7A" points="350.6773,505.8341,360.3782,504.1331,354.827,503.0448,355.9153,497.4936,350.6773,505.8341" style="stroke:#546E7A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="116.7299" x="444.8373" y="458.7541">top-down walk yields the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.3499" x="426.5273" y="472.3741">IDENTICAL frontier (transparent)</text></g><!--link Frontier to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0013" data-link-type="dependency" data-source-line="58" id="lnk14"><path d="M312.9373,556.5241 C312.9373,576.1041 312.9373,597.5541 312.9373,611.8641" fill="none" id="Frontier-to-*end*" style="stroke:#E65100;stroke-width:1;"/><polygon fill="#E65100" points="312.9373,616.8641,316.9373,607.8641,312.9373,611.8641,308.9373,607.8641,312.9373,616.8641" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="68"><rect fill="none" height="64.4799" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="381.0396" x="185.7875" y="652.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="336.5234" x="190.7875" y="667.7541">L-SNAP : just(B) &#8839; just(P) &#10233; Finalized(C, just(B)) &#8805; Finalized(C, just(P)) &#8212;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="262.9998" x="190.7875" y="681.3741">the pivot stays finalized over the child's larger snapshot.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="362.6697" x="190.7875" y="694.9941">Both guard trips are safe: the Cold fallback recomputes the SAME frontier the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="371.0396" x="190.7875" y="708.6141">warm path would have (Rocq Floor.frontier_cache_transparent), so no fork (S1).</text></g><?plantuml-src ZLRTJYCt5BwVfpWb5pjJ4Gfq2PG2KZ99kgne4X7GLjgi8ZFZ95vcx5dR0sMhIbprxxBYlbTLNw5zYJv4dgJ7zima8MYfnGMCZpz__ivtpk4pFQCfXImXZ7kUkcOy8vAae3JH57xm05eakfvAaVCu58cGHqSPkn7wv0HmrSA3JYFywgceMv9Sko2ejLhjJhVrL1I98fevi5fphzrexZyLDI59SeKVCQxMxNQsMxicIiYOIXi1jPTsUJyklI2XKyhZhk2wH_256wdWGcKaeXjF1WtPHmexssjxZyWO0cQjnotJQTYr51