<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="728px" preserveAspectRatio="none" style="width:754px;height:728px;background:#FFFFFF;" version="1.1" viewBox="0 0 754 728" width="754px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="32"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="722.6145" x="15" y="38.5181">Finalization downward-closure (L-ANC) and the warm-path guards</text></g><g class="entity" data-qualified-name="Pivot" data-source-line="41" id="ent0001"><rect fill="#C8E6C9" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="146.0399" x="244.3523" y="201.0641"/><line style="stroke:#444444;stroke-width:1;" x1="244.3523" x2="390.3922" y1="238.3041" y2="238.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.4799" x="254.3523" y="216.7541">Pivot F(parent)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="126.0399" x="254.3523" y="230.3741">(finalized over just(parent))</text></g><g class="entity" data-qualified-name="Upwalk" data-source-line="42" id="ent0002"><rect fill="#BBDEFB" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="134.9999" x="76.8723" y="367.0641"/><line style="stroke:#444444;stroke-width:1;" x1="76.8723" x2="211.8722" y1="404.3041" y2="404.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="38.07" x="86.8723" y="382.7541">Up-walk</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="114.9999" x="86.8723" y="396.3741">(advance toward parent)</text></g><g class="entity" data-qualified-name="Frontier" data-source-line="43" id="ent0003"><rect fill="#A5D6A7" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="145.0999" x="240.8223" y="506.0641"/><line style="stroke:#444444;stroke-width:1;" x1="240.8223" x2="385.9222" y1="529.6841" y2="529.6841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="125.0999" x="250.8223" y="521.7541">Highest finalized = frontier</text></g><g class="entity" data-qualified-name="Cold" data-source-line="44" id="ent0004"><rect fill="#FFE0B2" height="50" rx="12.5" ry="12.5" style="stroke:#444444;stroke-width:1;" width="139.2599" x="413.7423" y="367.0641"/><line style="stroke:#444444;stroke-width:1;" x1="413.7423" x2="553.0022" y1="404.3041" y2="404.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="119.2599" x="423.7423" y="382.7541">Cold down-walk (fallback)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="104.7599" x="423.7423" y="396.3741">top-down from parent</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="46" id="ent0005"><ellipse cx="194.3723" cy="101.0141" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="58" id="ent0013"><ellipse cx="313.3723" cy="628.0641" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="313.3723" cy="628.0641" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="61" id="ent0016"><path d="M239.8523,61.9641 L239.8523,140.064 A0,0 0 0 0 239.8523,140.064 L398.8223,140.064 L341.8423,200.7841 L406.8223,140.064 L642.9017,140.064 A0,0 0 0 0 642.9017,140.064 L642.9017,71.9641 L632.9017,61.9641 L239.8523,61.9641 A0,0 0 0 0 239.8523,61.9641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M632.9017,61.9641 L632.9017,71.9641 L642.9017,71.9641 L632.9017,61.9641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="351.0298" x="245.8523" y="77.6541">L-ANC (the determinism linchpin). Under a CONSTANT committee, finalized</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="382.0494" x="245.8523" y="91.2741">blocks form a DOWNWARD-CLOSED PREFIX of the spine &#8212; the same quorum that</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="332.2198" x="245.8523" y="104.8941">finalizes a block finalizes every ancestor (GuardBridge.chain_adj_AdjDC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="323.7297" x="245.8523" y="118.5141">derives this AdjDC premise; Floor.frontier_cache_transparent uses it).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="221.9957" x="245.8523" y="132.134">&#10233; warm == cold, so the cache never forks (S1).</text></g><!--link *start* to Pivot--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="46" id="lnk6"><path d="M199.5123,109.9541 C204.8123,117.9141 213.5423,130.3541 222.3723,140.0641 C242.4623,162.1741 263.9462,181.3972 283.3962,197.6572" fill="none" id="*start*-to-Pivot" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="287.2323,200.8641,282.8929,192.0228,283.3962,197.6572,277.7618,198.1605,287.2323,200.8641" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Pivot to Upwalk--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="48" id="lnk7"><path d="M243.9423,235.8041 C214.0823,243.1241 181.8423,256.5341 161.3723,281.0641 C141.4423,304.9541 139.5316,337.3144 141.1016,361.7444" fill="none" id="Pivot-to-Upwalk" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="141.4223,366.7341,144.8369,357.4961,141.1016,361.7444,136.8533,358.0092,141.4223,366.7341" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="78.0109" x="189.0818" y="292.7541">guards HOLD &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="131.4299" x="162.3723" y="306.3741">committee constant (L-ANC)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="130.3192" x="162.9276" y="319.9941">&#8743; pivot still ft_witnessed &gt; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.8199" x="193.6773" y="333.6141">over J (L-SNAP)</text></g><!--link Upwalk to Upwalk--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="50" id="lnk8"><path d="M211.9023,379.0741 C231.6023,379.5241 246.8723,383.8541 246.8723,392.0641 C246.8723,400.2741 236.601,404.4899 216.901,404.9399" fill="none" id="Upwalk-to-Upwalk" style="stroke:#1565C0;stroke-width:1;"/><polygon fill="#1565C0" points="211.9023,405.0541,220.9913,408.8475,216.901,404.9399,220.8086,400.8496,211.9023,405.0541" style="stroke:#1565C0;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="102.3099" x="270.2953" y="389.2541">ft_witnessed(next) &gt; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="137.1559" x="252.8723" y="402.8741">&#10233; advance  (amortized O(1))</text></g><!--link Upwalk to Frontier--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="51" id="lnk9"><path d="M174.5823,417.5541 C205.3523,442.4941 248.868,477.7757 279.538,502.6357" fill="none" id="Upwalk-to-Frontier" style="stroke:#E65100;stroke-width:1;"/><polygon fill="#E65100" points="283.4223,505.7841,278.9494,497.0095,279.538,502.6357,273.9119,503.2243,283.4223,505.7841" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="104.9688" x="261.7808" y="458.7541">ft_witnessed(next) &#8804; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="138.5058" x="245.0123" y="472.3741">&#10233; STOP at first non-finalized</text></g><!--link Pivot to Cold--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="53" id="lnk10"><path d="M308.8223,251.4541 C302.0223,275.5841 296.3423,312.3741 314.3723,337.0641 C317.5723,341.4441 363.72,355.958 408.85,369.388" fill="none" id="Pivot-to-Cold" style="stroke:#C62828;stroke-width:1;"/><polygon fill="#C62828" points="413.6423,370.8141,406.157,364.4132,408.85,369.388,403.8753,372.0809,413.6423,370.8141" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="161.0999" x="324.8373" y="292.7541">committee-constancy guard TRIPS</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="180.0298" x="315.3723" y="306.3741">committee changed in band (bonding)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="108.1859" x="351.2943" y="319.9941">&#10233; L-ANC premise fails</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.5199" x="324.1273" y="333.6141">/ floor_incremental_guard_fallback</text></g><!--link Pivot to Cold--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="54" id="lnk11"><path d="M390.4323,239.4441 C435.3323,248.7041 486.7823,262.8941 500.3723,281.0641 C518.8823,305.8241 509.6962,338.0591 498.6462,362.1591" fill="none" id="Pivot-to-Cold-1" style="stroke:#C62828;stroke-width:1;"/><polygon fill="#C62828" points="496.5623,366.7041,503.9494,360.1902,498.6462,362.1591,496.6773,356.8559,496.5623,366.7041" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.1199" x="545.4223" y="292.7541">L-SNAP guard TRIPS</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="149.8198" x="517.5723" y="306.3741">pivot no longer ft_witnessed &gt; &#952;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.0599" x="531.9523" y="319.9941">over the larger snapshot J</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.5199" x="511.2223" y="333.6141">/ floor_incremental_guard_fallback</text></g><!--link Cold to Frontier--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="56" id="lnk12"><path d="M458.7123,417.3041 C440.8623,434.4041 415.8423,457.4841 392.3723,476.0641 C379.3423,486.3741 368.592,494.0848 355.262,503.0448" fill="none" id="Cold-to-Frontier" style="stroke:#546E7A;stroke-width:1;"/><polygon fill="#546E7A" points="351.1123,505.8341,360.8132,504.1331,355.262,503.0448,356.3503,497.4936,351.1123,505.8341" style="stroke:#546E7A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="116.7299" x="445.2723" y="458.7541">top-down walk yields the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.3499" x="426.9623" y="472.3741">IDENTICAL frontier (transparent)</text></g><!--link Frontier to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0013" data-link-type="dependency" data-source-line="58" id="lnk14"><path d="M313.3723,556.5241 C313.3723,576.1041 313.3723,597.5541 313.3723,611.8641" fill="none" id="Frontier-to-*end*" style="stroke:#E65100;stroke-width:1;"/><polygon fill="#E65100" points="313.3723,616.8641,317.3723,607.8641,313.3723,611.8641,309.3723,607.8641,313.3723,616.8641" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="68"><rect fill="none" height="64.4799" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="381.0396" x="185.7875" y="652.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="336.5234" x="190.7875" y="667.7541">L-SNAP : just(B) &#8839; just(P) &#10233; Finalized(C, just(B)) &#8805; Finalized(C, just(P)) &#8212;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="262.9998" x="190.7875" y="681.3741">the pivot stays finalized over the child's larger snapshot.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="362.6697" x="190.7875" y="694.9941">Both guard trips are safe: the Cold fallback recomputes the SAME frontier the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="371.0396" x="190.7875" y="708.6141">warm path would have (Rocq Floor.frontier_cache_transparent), so no fork (S1).</text></g><?plantuml-src ZLRTJYCt5BwVfpWb5pjJ4Gfq2PGkICbaiikA9X41RQNDAZ8pJk9bnfwrFL2sgiHL_ouhxdlJgg_GlaGV8a_IOyyuFv2MMbp0-FZpv-zyvnm-qLEQKSXJmhZdgIl6So991aeJJU5R3w15ugk950LFGf4A-U95pgw5FZu6NBNm86g4NwoBkY7fLHa4jLQh7NLQww987DEy1AirzzgDvlwwg359qqlyY76rJYVQRksQA24JAcq4r9xRvNstz8AKJYXFEeBhBi4NRcI22vMJc6wi3HgmZnHsjX_jFI1Z29ZrE6wPJiEkfPY4ZacHwYVOB4