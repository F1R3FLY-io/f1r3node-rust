="'monospace'" font-size="10" lengthAdjust="spacing" textLength="208.8999" x="251.6293" y="121.6541">per-deploy DIFF  calculate_num_channel_diff</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="168.4298" x="251.6293" y="135.2741">&#916;d&#7522; = end&#7522; &#8722; prev&#7522;   via wrapping_sub</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="177.9298" x="251.6293" y="148.8941">(rholang/&#8230;/rholang_merging_logic.rs)</text><line style="stroke:#444444;stroke-width:1.5;" x1="155.8099" x2="506.1146" y1="183.6341" y2="183.6341"/><rect fill="#FFEBEE" height="365.4398" style="stroke:#000000;stroke-width:1;" width="232.7808" x="39.4195" y="207.994"/><path d="M262.2003,207.994 L262.2003,214.614 L252.2003,224.614 L39.4195,224.614" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="212.7808" x="42.4195" y="219.684">BUGGY &#9472;&#9472; wrapping_add launder asymmetry</text><rect fill="#FFEBEE" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="174.6298" x="68.495" y="241.614"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="142.8299" x="78.495" y="262.304">COMBINE folds diffs &#931; &#916;d&#7522; with</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="154.6298" x="78.495" y="275.924">wrapping_add  (SILENT overflow)</text><rect fill="#FFCDD2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="189.2498" x="61.185" y="316.354"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="169.2498" x="71.185" y="337.044">sum WRAPS to a non-negative value</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.7099" x="71.185" y="350.664">e.g. i64::MAX + i64::MAX + 2</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="62.1689" x="71.185" y="364.284">&#8801; 0 (mod 2&#8310;&#8308;)</text><rect fill="#FFCDD2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="187.7898" x="61.915" y="412.214"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="161.5988" x="71.915" y="432.904">apply-time  checked_add &#8805; 0  gate</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="124.4799" x="71.915" y="446.5239">PASSES the wrapped value</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="167.7898" x="71.915" y="460.1439">(overflow already hidden upstream)</text><rect fill="#EF9A9A" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="190.4999" x="60.56" y="508.0739"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.4999" x="70.56" y="528.7639">laundered WRONG value committed</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="138.1199" x="70.56" y="542.3839">to consensus state (safety S7)</text><rect fill="#E8F5E9" height="377.6798" style="stroke:#000000;stroke-width:1;" width="372.5387" x="300.2003" y="201.874"/><path d="M530.9712,201.874 L530.9712,208.494 L520.9712,218.494 L300.2003,218.494" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="220.7709" x="303.2003" y="213.564">FIXED &#9472;&#9472; fail-loudly checked (defense-in-depth)</text><rect fill="#C8E6C9" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="211.2699" x="400.4797" y="235.494"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="191.2699" x="410.4797" y="256.184">(a) COMBINE  combine_mergeable_value</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="142.2899" x="410.4797" y="269.804">(rspace++/&#8230;/merging_logic.rs)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="188.1658" x="410.4797" y="283.424">uses checked_add &#10233; None on overflow</text><polygon fill="#FFF8E1" points="436.4353,323.854,575.794,323.854,587.794,335.854,575.794,347.854,436.4353,347.854,424.4353,335.854,436.4353,323.854" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="139.3588" x="436.4353" y="339.734">combine overflowed? &#8594; None</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="15.53" x="408.9053" y="332.924">yes</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.23" x="587.794" y="332.924">no</text><rect fill="#A5D6A7" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="188.4698" x="320.2003" y="357.854"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="100.6099" x="330.2003" y="378.544">(b) cal_merged_result</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="156.0699" x="330.2003" y="392.164">(casper/&#8230;/conflict_set_merger.rs)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="168.4698" x="330.2003" y="405.784">DROPS the branch (REJECT decision)</text><rect fill="#C8E6C9" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="109.8899" x="542.8491" y="357.854"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="89.8899" x="552.8491" y="378.544">folded diff in range</text><rect fill="#A5D6A7" height="101.7199" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="197.9298" x="407.1497" y="459.714"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.4199" x="417.1497" y="480.404">(c) TERMINAL APPLY</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.4399" x="417.1497" y="494.0239">calculate_number_channel_merge</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="177.9298" x="417.1497" y="507.6439">(rholang/&#8230;/rholang_merging_logic.rs)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.8748" x="417.1497" y="521.2639">checked_add + &#8805; 0 &#10233; Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="141.1099" x="417.1497" y="534.8839">(defense-in-depth backstop &#8212;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.1399" x="417.1497" y="548.5039">the ACTUAL consensus-state write)</text><line style="stroke:#444444;stroke-width:1;" x1="356.0793" x2="356.0793" y1="80.9641" y2="100.9641"/><polygon fill="#444444" points="352.0793,90.9641,356.0793,100.9641,360.0793,90.9641,356.0793,94.9641" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="155.8099" x2="155.8099" y1="288.854" y2="316.354"/><polygon fill="#444444" points="151.8099,306.354,155.8099,316.354,159.8099,306.354,155.8099,310.354" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="155.8099" x2="155.8099" y1="377.214" y2="412.214"/><polygon fill="#444444" points="151.8099,402.214,155.8099,412.214,159.8099,402.214,155.8099,406.214" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="155.8099" x2="155.8099" y1="473.0739" y2="508.0739"/><polygon fill="#444444" points="151.8099,498.0739,155.8099,508.0739,159.8099,498.0739,155.8099,502.0739" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="424.4353" x2="414.4353" y1="335.854" y2="335.854"/><line style="stroke:#444444;stroke-width:1;" x1="414.4353" x2="414.4353" y1="335.854" y2="357.854"/><polygon fill="#444444" points="410.4353,347.854,414.4353,357.854,418.4353,347.854,414.4353,351.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="587.794" x2="597.794" y1="335.854" y2="335.854"/><line style="stroke:#444444;stroke-width:1;" x1="597.794" x2="597.794" y1="335.854" y2="357.854"/><polygon fill="#444444" points="593.794,347.854,597.794,357.854,601.794,347.854,597.794,351.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="597.794" x2="597.794" y1="391.474" y2="424.714"/><line style="stroke:#444444;stroke-width:1;" x1="597.794" x2="506.1146" y1="424.714" y2="424.714"/><line style="stroke:#444444;stroke-width:1;" x1="506.1146" x2="506.1146" y1="424.714" y2="459.714"/><polygon fill="#444444" points="502.1146,449.714,506.1146,459.714,510.1146,449.714,506.1146,453.714" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="506.1146" x2="506.1146" y1="296.354" y2="323.854"/><polygon fill="#444444" points="502.1146,313.854,506.1146,323.854,510.1146,313.854,506.1146,317.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#C62828;stroke-width:1;" x1="155.8099" x2="155.8099" y1="185.1341" y2="241.614"/><polygon fill="#C62828" points="151.8099,231.614,155.8099,241.614,159.8099,231.614,155.8099,235.614" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.78" x="159.8099" y="208.814">BEFORE the fix</text><line style="stroke:#2E7D32;stroke-width:1;" x1="506.1146" x2="506.1146" y1="185.1341" y2="235.494"/><polygon fill="#2E7D32" points="502.1146,225.494,506.1146,235.494,510.1146,225.494,506.1146,229.494" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="60.86" x="510.1146" y="205.754">AFTER the fix</text><line style="stroke:#444444;stroke-width:1;" x1="356.0793" x2="356.0793" y1="161.8241" y2="183.6341"/><polygon fill="#444444" points="352.0793,173.6341,356.0793,183.6341,360.0793,173.6341,356.0793,177.6341" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="79"><rect fill="none" height="173.4398" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="428.9895" x="142.5845" y="593.5539"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="372.8296" x="147.5845" y="609.2439">(d) The DIFF stays wrapping_sub on purpose: it is the exact group inverse of the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="396.0497" x="147.5845" y="622.8639">wrapping add that language-level execution used (reduce.rs GInt `+`, intended 64-bit</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="376.9597" x="147.5845" y="636.4838">semantics), so it faithfully RECOVERS the deploy's true intended delta even when</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="418.9895" x="147.5845" y="650.1038">execution overflowed. Overflow is caught DOWNSTREAM (combine + apply), NEVER at the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="376.8293" x="147.5845" y="663.7238">diff &#8212; erroring there would crash live block processing on a deploy that must be</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="123.8099" x="147.5845" y="677.3438">gracefully merge-rejected.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="361.2305" x="147.5845" y="690.9638">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="410.4896" x="147.5845" y="704.5838">Rocq  IntegerAdd.checked_combine_sound (fix is launder-free) &#183; supply_cap_no_launder</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="289.6598" x="147.5845" y="718.2038">(defense-in-depth bound) &#183; launder_exhibit (the defect is real).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="357.4396" x="147.5845" y="731.8238">Z3    integeradd_launder_bitvec.py &#8212; BitVec-64 witness vs exact machine i64</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="415.4395" x="147.5845" y="745.4437">(bvadd == wrapping_add): the launder EXISTS on wrap; checked-combine is launder-free.</text><text fill="#000000" font-fa