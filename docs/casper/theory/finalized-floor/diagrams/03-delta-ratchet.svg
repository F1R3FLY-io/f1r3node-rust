<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="842px" preserveAspectRatio="none" style="width:857px;height:842px;background:#FFFFFF;" version="1.1" viewBox="0 0 857 842" width="857px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="37"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="825.7529" x="15" y="38.5181">The &#916;-ratchet &#9472;&#9472; buggy positive feedback vs fixed O(1) service-rate regimes</text></g><ellipse cx="420.449" cy="70.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1.5;" x1="202.0782" x2="590.0908" y1="100.9641" y2="100.9641"/><rect fill="#FFEBEE" height="591.4849" style="stroke:#000000;stroke-width:1;" width="294.0457" x="94.4033" y="119.2041"/><path d="M285.0341,119.2041 L285.0341,125.8241 L275.0341,135.8241 L94.4033,135.8241" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="180.6309" x="97.4033" y="130.8941">BUGGY &#9472;&#9472; &#920;(&#916;&#178;&#183;V) uncached floor walk</text><rect fill="#FFEBEE" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="195.3499" x="104.4033" y="201.4891"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="83.0435" x="114.4033" y="222.1791">propose cost &#8733; &#916;&#178;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="175.3499" x="114.4033" y="235.7991">(uncached ft_witnessed at every step,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="146.0399" x="114.4033" y="249.4191">&#920;(&#916;&#183;V) per parent, &#920;(&#916;&#178;&#183;V) total)</text><rect fill="#FFEBEE" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="147.9299" x="128.1133" y="297.349"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="73.43" x="138.1133" y="318.039">finalization lags</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.9299" x="138.1133" y="331.659">(finalize throughput falls as</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="110.5734" x="138.1133" y="345.279">propose cost &#8733; &#916;&#178; rises)</text><rect fill="#FFEBEE" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="177.3698" x="113.3933" y="393.209"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.3698" x="123.3933" y="413.899">&#916; = num(maxParent) &#8722; num(floor)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="36.1" x="123.3933" y="427.519">GROWS</text><polygon fill="#FFF8E1" points="202.0782,152.8241,214.0782,164.8241,202.0782,176.8241,190.0782,164.8241,202.0782,152.8241" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#FFF8E1" points="151.1432,486.639,253.0132,486.639,265.0132,498.639,253.0132,510.639,151.1432,510.639,139.1432,498.639,151.1432,486.639" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="37.1289" x="206.0782" y="521.329">&#916; &#8805; 256</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="101.8699" x="151.1432" y="502.519">&#916; still below cap 256 ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="81.85" x="265.0132" y="482.089">positive feedback</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.4358" x="265.0132" y="495.709">slope &gt; 1 &#10233; &#916; runs away</text><rect fill="#FFCDD2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="120.9299" x="141.6132" y="545.639"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="100.9299" x="151.6132" y="566.329">&#916; crosses the cap 256</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="64.05" x="151.6132" y="579.949">(the cliff fires)</text><rect fill="#EF9A9A" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="182.1398" x="111.0083" y="624.209"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="151.2509" x="121.0083" y="644.899">SILENT single-parent fallback &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.1398" x="121.0083" y="658.519">return highest parent's post_state,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="125.4899" x="121.0083" y="672.139">co-parent writes DROPPED</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.0399" x="121.0083" y="685.759">(safety S5 / &#172;T-K1 / &#172;T-NDA)</text><rect fill="#E8F5E9" height="395.1999" style="stroke:#000000;stroke-width:1;" width="360.9007" x="398.449" y="209.6791"/><path d="M592.5298,209.6791 L592.5298,216.2991 L582.5298,226.2991 L398.449,226.2991" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="184.0809" x="401.449" y="221.3691">FIXED &#9472;&#9472; persisted pivot + O(1) up-walk</text><rect fill="#E8F5E9" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="190.4999" x="494.8409" y="243.2991"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.5599" x="504.8409" y="263.9891">persisted frontier pivot F(X)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.8009" x="504.8409" y="277.6091">+ incremental up-walk &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="124.3199" x="504.8409" y="291.229">amortized O(1) oracle calls</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.4999" x="504.8409" y="304.849">(advances telescope to spine length)</text><rect fill="#E8F5E9" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="141.7999" x="519.1908" y="352.779"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="90.3" x="529.1908" y="373.469">ZERO lag feedback;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.7999" x="529.1908" y="387.089">service &gt; arrivals drains &#916;,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.1099" x="529.1908" y="400.709">service = arrivals holds &#916;,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.6599" x="529.1908" y="414.329">service &lt; arrivals grows &#916;</text><polygon fill="#FFF8E1" points="559.8058,460.449,620.3758,460.449,632.3758,472.449,620.3758,484.449,559.8058,484.449,547.8058,472.449,559.8058,460.449" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="60.57" x="559.8058" y="476.329">&#916; &gt; cap 256 ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="15.53" x="532.2758" y="469.519">yes</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.23" x="632.3758" y="469.519">no</text><rect fill="#C8E6C9" height="88.0999" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="173.1158" x="415.594" y="494.449"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="138.2758" x="425.594" y="515.139">over-cap &#10233; deterministic Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="126.8998" x="425.594" y="528.759">(propose PARKS the round;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="140.6399" x="425.594" y="542.379">validate REJECTS &#8212; both sides</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.1158" x="425.594" y="555.9989">compute the same &#916; &#10233; no fork)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="123.9699" x="425.594" y="569.6189">NEVER a lossy substitution</text><rect fill="#C8E6C9" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="138.6399" x="608.7098" y="494.449"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="91.6899" x="618.7098" y="515.139">merge proceeds on</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.0199" x="618.7098" y="528.759">floor.post_state base</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.6399" x="618.7098" y="542.379">(all band writes folded in)</text><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="262.349" y2="297.349"/><polygon fill="#444444" points="198.0782,287.349,202.0782,297.349,206.0782,287.349,202.0782,291.349" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="358.209" y2="393.209"/><polygon fill="#444444" points="198.0782,383.209,202.0782,393.209,206.0782,383.209,202.0782,387.209" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="176.8241" y2="201.4891"/><polygon fill="#444444" points="198.0782,191.4891,202.0782,201.4891,206.0782,191.4891,202.0782,195.4891" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="265.0132" x2="311.7531" y1="498.639" y2="498.639"/><polygon fill="#444444" points="307.7531,330.969,311.7531,320.969,315.7531,330.969,311.7531,326.969" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="311.7531" x2="311.7531" y1="164.8241" y2="498.639"/><line style="stroke:#444444;stroke-width:1;" x1="311.7531" x2="214.0782" y1="164.8241" y2="164.8241"/><polygon fill="#444444" points="224.0782,160.8241,214.0782,164.8241,224.0782,168.8241,220.0782,164.8241" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="440.449" y2="486.639"/><polygon fill="#444444" points="198.0782,476.639,202.0782,486.639,206.0782,476.639,202.0782,480.639" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="510.639" y2="545.639"/><polygon fill="#444444" points="198.0782,535.639,202.0782,545.639,206.0782,535.639,202.0782,539.639" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="202.0782" x2="202.0782" y1="592.879" y2="624.209"/><polygon fill="#444444" points="198.0782,614.209,202.0782,624.209,206.0782,614.209,202.0782,618.209" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="590.0908" x2="590.0908" y1="317.779" y2="352.779"/><polygon fill="#444444" points="586.0908,342.779,590.0908,352.779,594.0908,342.779,590.0908,346.779" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="547.8058" x2="502.1519" y1="472.449" y2="472.449"/><line style="stroke:#444444;stroke-width:1;" x1="502.1519" x2="502.1519" y1="472.449" y2="494.449"/><polygon fill="#444444" points="498.1519,484.449,502.1519,494.449,506.1519,484.449,502.1519,488.449" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="632.3758" x2="678.0297" y1="472.449" y2="472.449"/><line style="stroke:#444444;stroke-width:1;" x1="678.0297" x2="678.0297" y1="472.449" y2="494.449"/><polygon fill="#444444" points="674.0297,484.449,678.0297,494.449,682.0297,484.449,678.0297,488.449" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="590.0908" x2="590.0908" y1="427.259" y2="460.449"/><polygon fill="#444444" points="586.0908,450.449,590.0908,460.449,594.0908,450.449,590.0908,454.449" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#C62828;stroke-width:1;" x1="202.0782" x2="202.0782" y1="102.4641" y2="152.8241"/><polygon fill="#C62828" points="198.0782,142.8241,202.0782,152.8241,206.0782,142.8241,202.0782,146.8241" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.78" x="206.0782" y="123.0841">BEFORE the fix</text><line style="stroke:#2E7D32;stroke-width:1;" x1="590.0908" x2="590.0908" y1="102.4641" y2="243.2991"/><polygon fill="#2E7D32" points="586.0908,233.2991,590.0908,243.2991,594.0908,233.2991,590.0908,237.2991" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="60.86" x="594.0908" y="179.9891">AFTER the fix</text><line style="stroke:#444444;stroke-width:1;" x1="420.449" x2="420.449" y1="80.9641" y2="100.9641"/><polygon fill="#444444" points="416.449,90.9641,420.449,100.9641,424.449,90.9641,420.449,94.9641" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="72"><rect fill="none" height="105.3396" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="516.63" x="169.5615" y="724.689"/><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="490.0541" x="174.5615" y="744.6549">Wolfram  formal/wolfram/finalized_floor/delta_ratchet.wl &#8212; over the reals,</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="506.63" x="174.5615" y="763.7228">parameter-free: the buggy &#920;(&#916;&#178;) advance has positive lag feedback. The fixed</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="494.3101" x="174.5615" y="782.7907">O(1) advance has ZERO lag feedback, but bounded lag additionally requires</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="490.9081" x="174.5615" y="801.8586">service &gt;= arrivals. The ratchet collapses; overload remains observable and</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="269.429" x="174.5615" y="820.9266">over-cap becomes safe rather than lossy.</text></g><?plantuml-src VLPDJrj75DtxLzp2ehQ2