<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="594px" preserveAspectRatio="none" style="width:857px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 857 594" width="857px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="30"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="553.4779" x="151.086" y="38.5181">LMD-GHOST two-lane ranking (parallel-preserving)</text></g><g class="entity" data-qualified-name="Seed" data-source-line="42" id="ent0001"><rect fill="#BBDEFB" height="50" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="79.12" x="273.54" y="142.9641"/><line style="stroke:#333333;stroke-width:1;" x1="273.54" x2="352.66" y1="166.5841" y2="166.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="59.12" x="283.54" y="158.6541">certified LCA</text></g><g class="entity" data-qualified-name="Greedy" data-source-line="43" id="ent0002"><rect fill="#A5D6A7" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="182.1998" x="12" y="267.9641"/><line style="stroke:#333333;stroke-width:1;" x1="12" x2="194.1998" y1="318.8241" y2="318.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="55.42" x="22" y="283.6541">greedy lane</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.1998" x="22" y="297.2741">choose score-DESC/hash-ASC child</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="71.6199" x="22" y="310.8941">until a terminal</text></g><g class="entity" data-qualified-name="Expand" data-source-line="44" id="ent0003"><rect fill="#FFE0B2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="182.9799" x="432.61" y="267.9641"/><line style="stroke:#333333;stroke-width:1;" x1="432.61" x2="615.5899" y1="318.8241" y2="318.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="58.3699" x="442.61" y="283.6541">frontier lane</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.2898" x="442.61" y="297.2741">choose ANY scored nonterminal;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.9799" x="442.61" y="310.8941">replace by all children; deduplicate</text></g><g class="entity" data-qualified-name="Fix" data-source-line="45" id="ent0004"><rect fill="#A5D6A7" height="50" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="174.2498" x="225.97" y="403.8241"/><line style="stroke:#333333;stroke-width:1;" x1="225.97" x2="400.2198" y1="441.0641" y2="441.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="42.83" x="235.97" y="419.5141">compose</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="154.2498" x="235.97" y="433.1341">[ghost] ++ sort(terminals - ghost)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="47" id="ent0005"><ellipse cx="313.1" cy="71.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="54" id="ent0013"><ellipse cx="191.1" cy="554.2541" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="191.1" cy="554.2541" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="57" id="ent0016"><path d="M237.56,528.8241 L237.56,579.6841 A0,0 0 0 0 237.56,579.6841 L634.6396,579.6841 A0,0 0 0 0 634.6396,579.6841 L634.6396,538.8241 L624.6396,528.8241 L415.43,528.8241 L337.4,454.2141 L407.43,528.8241 L237.56,528.8241 A0,0 0 0 0 237.56,528.8241" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M624.6396,528.8241 L624.6396,538.8241 L634.6396,538.8241 L624.6396,528.8241" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="362.3297" x="243.56" y="544.5141">Rocq proves greedy termination, exact frontier membership, confluence, and</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="354.1396" x="243.56" y="558.1341">head-first composition. TLA&#8314; explores every asynchronous expansion order.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="376.0796" x="243.56" y="571.7541">A malformed non-advancing child or missing head membership is a typed error.</text></g><!--link *start* to Seed--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="47" id="lnk6"><path d="M313.1,82.3241 C313.1,96.2541 313.1,117.9141 313.1,137.6141" fill="none" id="*start*-to-Seed" style="stroke:#00838F;stroke-width:1;"/><polygon fill="#00838F" points="313.1,142.6141,317.1,133.6141,313.1,137.6141,309.1,133.6141,313.1,142.6141" style="stroke:#00838F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Seed to Greedy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="48" id="lnk7"><path d="M273.11,193.4241 C238.6,214.5341 192.9061,242.4763 156.0661,264.9963" fill="none" id="Seed-to-Greedy" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="151.8,267.6041,161.5652,266.3229,156.0661,264.9963,157.3927,259.4972,151.8,267.6041" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="71.84" x="221.67" y="234.6541">start head = lca</text></g><!--link Seed to Expand--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="49" id="lnk8"><path d="M352.79,193.1241 C387.41,214.1941 433.4991,242.2443 470.6591,264.8643" fill="none" id="Seed-to-Expand" style="stroke:#00838F;stroke-width:1;"/><polygon fill="#00838F" points="474.93,267.4641,469.3221,259.3677,470.6591,264.8643,465.1624,266.2012,474.93,267.4641" style="stroke:#00838F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="67.27" x="425.93" y="234.6541">frontier = {lca}</text></g><!--link Greedy to Greedy--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="50" id="lnk9"><path d="M194.63,286.0141 C214.65,287.2041 229.2,291.3341 229.2,298.3941 C229.2,305.4641 219.6412,309.2874 199.6212,310.4774" fill="none" id="Greedy-to-Greedy" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="194.63,310.7741,203.8515,314.233,199.6212,310.4774,203.3768,306.2471,194.63,310.7741" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="113.8458" x="265.222" y="295.5841">scored children exist &#10233;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="173.8898" x="235.2" y="309.2041">choose unique best; height advances</text></g><!--link Expand to Expand--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" data-link-type="dependency" data-source-line="51" id="lnk10"><path d="M615.91,286.0141 C636,287.2041 650.59,291.3341 650.59,298.3941 C650.59,305.4641 640.9913,309.2885 620.9013,310.4785" fill="none" id="Expand-to-Expand" style="stroke:#1565C0;stroke-width:1;"/><polygon fill="#15