<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="733px" preserveAspectRatio="none" style="width:609px;height:733px;background:#FFFFFF;" version="1.1" viewBox="0 0 609 733" width="609px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="37"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="577.1719" x="15" y="38.5181">Tie-break totality &#8212; why fork-choice cannot fork (S1)</text></g><!--cluster TOTAL order ? the code (SAFE)--><g class="cluster" data-qualified-name="TOTAL order . the code .SAFE." data-source-line="46" id="ent0001"><path d="M66.086,61.9641 L220.3358,61.9641 A3.75,3.75 0 0 1 222.8358,64.4641 L229.8358,81.5841 L277.086,81.5841 A2.5,2.5 0 0 1 279.586,84.0841 L279.586,506.0441 A2.5,2.5 0 0 1 277.086,508.5441 L66.086,508.5441 A2.5,2.5 0 0 1 63.586,506.0441 L63.586,64.4641 A2.5,2.5 0 0 1 66.086,61.9641" fill="#EEFAF1" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="63.586" x2="229.8358" y1="81.5841" y2="81.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="153.2498" x="67.586" y="74.6541">TOTAL order &#8212; the code (SAFE)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="33.3699" x="158.901" y="94.2741">&#171;Good&#187;</text></g><!--cluster score-ONLY ? hypothetical bug (FORKS)--><g class="cluster" data-qualified-name="score-ONLY . hypothetical bug .FORKS." data-source-line="56" id="ent0009"><path d="M306.086,184.8241 L506.5258,184.8241 A3.75,3.75 0 0 1 509.0258,187.3241 L516.0258,204.4441 L539.086,204.4441 A2.5,2.5 0 0 1 541.586,206.9441 L541.586,626.9041 A2.5,2.5 0 0 1 539.086,629.4041 L306.086,629.4041 A2.5,2.5 0 0 1 303.586,626.9041 L303.586,187.3241 A2.5,2.5 0 0 1 306.086,184.8241" fill="#FDECEA" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="303.586" x2="516.0258" y1="204.4441" y2="204.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="199.4398" x="307.586" y="197.5141">score-ONLY &#8212; hypothetical bug (FORKS)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="27.01" x="413.081" y="217.1341">&#171;Bad&#187;</text></g><!--entity G1--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G1" data-source-line="47" id="ent0002"><rect fill="#C8E6C9" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="180.7598" x="82.206" y="107.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.7598" x="92.206" y="128.6541">sort by score DESC, then hash ASC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.7499" x="92.206" y="142.2741">(on DISTINCT block hashes)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="75.3699" x="92.206" y="155.8941">list_ops.rs:55-64</text></g><!--entity G2--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G2" data-source-line="48" id="ent0003"><rect fill="#C8E6C9" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="167.2298" x="87.976" y="230.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="105.7199" x="97.976" y="251.5141">the argmax is UNIQUE</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="147.2298" x="97.976" y="265.1341">(no two hashes compare equal)</text></g><!--entity G3--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G3" data-source-line="49" id="ent0004"><rect fill="#C8E6C9" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="183.7598" x="79.706" y="338.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.7598" x="89.706" y="358.7541">HashSet / HashMap iteration order</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.7598" x="89.706" y="372.3741">is WASHED OUT by the sort</text></g><!--entity G4--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G4" data-source-line="50" id="ent0005"><rect fill="#A5D6A7" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="151.5499" x="103.816" y="445.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="131.5499" x="113.816" y="465.9941">every honest node picks the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="120.5847" x="113.816" y="479.6141">SAME tip  &#10233;  NO FORK &#10003;</text></g><!--entity B1--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B1" data-source-line="57" id="ent0010"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="197.6399" x="321.766" y="230.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="89.3499" x="331.766" y="251.5141">sort by score ONLY</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="177.6399" x="331.766" y="265.1341">(equal-score tips are INCOMPARABLE)</text></g><!--entity B2--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B2" data-source-line="58" id="ent0011"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="174.0598" x="333.556" y="338.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.2499" x="343.556" y="358.7541">&gt; 1 maximal element</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="154.0598" x="343.556" y="372.3741">(the argmax is a SET, not a point)</text></g><!--entity B3--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B3" data-source-line="59" id="ent0012"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="183.4398" x="329.866" y="445.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.4398" x="339.866" y="465.9941">the pick LEAKS HashSet / HashMap</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.0099" x="339.866" y="479.6141">iteration order (view-dependent)</text></g><!--entity B4--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B4" data-source-line="60" id="ent0013"><rect fill="#EF9A9A" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="205.3047" x="319.936" y="552.5441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="185.3047" x="329.936" y="573.2341">nodes pick DIFFERENT tips  &#10233;  FORK &#10007;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="133.4899" x="329.936" y="586.8541">MC_ForkChoice_nontotal.cfg</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="120.4199" x="329.936" y="600.4741">violates Inv_Deterministic</text></g><!--link G1 to G2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="51" id="lnk6"><path d="M172.326,169.0641 C172.156,188.2041 171.9912,207.7343 171.8312,225.4043" fill="none" id="G1-to-G2" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="171.786,230.4041,175.8673,221.4407,171.8312,225.4043,167.8676,221.3683,171.786,230.4041" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G2 to G3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="52" id="lnk7"><path d="M171.586,278.5441 C171.586,296.0841 171.586,315.1141 171.586,332.6441" fill="none" id="G2-to-G3" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="171.586,337.6441,175.586,328.6441,171.586,332.6441,167.586,328.6441,171.586,337.6441" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G3 to G4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="53" id="lnk8"><path d="M173.346,385.7841 C174.676,403.3241 176.1277,422.3684 177.4577,439.8984" fill="none" id="G3-to-G4" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="177.836,444.8841,181.1436,435.6073,177.4577,439.8984,173.1666,436.2125,177.836,444.8841" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B1 to B2--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" data-source-line="61" id="lnk14"><path d="M420.586,278.5441 C420.586,296.0841 420.586,315.1141 420.586,332.6441" fill="none" id="B1-to-B2" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="420.586,337.6441,424.586,328.6441,420.586,332.6441,416.586,328.6441,420.586,337.6441" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B2 to B3--><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" data-source-line="62" id="lnk15"><path d="M420.806,385.7841 C420.976,403.3241 421.1475,422.3543 421.3175,439.8843" fill="none" id="B2-to-B3" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="421.366,444.8841,425.2785,435.8457,421.3175,439.8843,417.2789,435.9233,421.366,444.8841" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B3 to B4--><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" data-source-line="63" id="lnk16"><path d="M421.786,492.8741 C421.946,510.0241 422.113,528.6343 422.273,547.2443" fill="none" id="B3-to-B4" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="422.316,552.2441,426.2384,543.21,422.273,547.2443,418.2387,543.2788,422.316,552.2441" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G1 to B1--><!--link G4 to B4--><g class="legend" data-source-line="70"><rect fill="none" height="78.0999" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="374.7397" x="116.2161" y="643.4041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="342.7695" x="121.2161" y="659.0941">The distinction is TOTALITY of the order. score-desc / hash-asc on distinct</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="350.8395" x="121.2161" y="672.7141">hashes is a total order (antisymmetric + total), so argmax is a unique point.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="364.7397" x="121.2161" y="686.3341">Rocq TieBreak.sort_total_order + output_indep_of_input_perm (permuting the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="357.9597" x="121.2161" y="699.9541">input list does not change the output). Z3 tiebreak_total_order.py proves the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="330.1996" x="121.2161" y="713.574">order total over bit-vectors; the _nontotal TLA&#8314; config exhibits the fork.</text></g><?plan