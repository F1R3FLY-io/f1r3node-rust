font-size="10" lengthAdjust="spacing" textLength="147.998" x="336.9861" y="237.4541">(deterministic: structural top)</text><path d="M552.8162,268.9922 L552.8162,287.4531 L532.8162,291.4531 L552.8162,295.4531 L552.8162,313.9141 A0,0 0 0 0 552.8162,313.9141 L746.1111,313.9141 A0,0 0 0 0 746.1111,313.9141 L746.1111,278.9922 L736.1111,268.9922 L552.8162,268.9922 A0,0 0 0 0 552.8162,268.9922" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><path d="M736.1111,268.9922 L736.1111,278.9922 L746.1111,278.9922 L736.1111,268.9922" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="172.2949" x="558.8162" y="283.2744">B1: weight_from_validator_by_dag</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="169.3701" x="558.8162" y="294.915">returns a typed KvStoreError on a</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="135.5127" x="558.8162" y="306.5557">MISSING parent (no panic).</text><rect fill="#C8E6C9" height="43.2813" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="183.3936" x="349.4226" y="269.8125"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.3936" x="359.4226" y="289.0947">build_scores_map &#8212; BFS to LCA,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="158.3984" x="359.4226" y="300.7354">exact BigInt score addition (B3)</text><rect fill="#FFE0B2" height="54.9219" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="230.6006" x="325.8191" y="333.9141"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="210.6006" x="335.8191" y="353.1963">rank_forkchoices &#8212; heaviest scored-child,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="137.3828" x="335.8191" y="364.8369">sort (score desc, hash asc),</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="103.667" x="335.8191" y="376.4775">recurse to still_same</text><polygon fill="#FFF8E1" points="362.0081,408.8359,520.2307,408.8359,532.2307,420.8359,520.2307,432.8359,362.0081,432.8359,350.0081,420.8359,362.0081,408.8359" style="stroke:#E65100;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="158.2227" x="362.0081" y="424.2979">tips empty? (genesis-only DAG)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="48.9014" x="301.1067" y="418.4775">yes &#9472;&#9472; B4</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.4561" x="532.2307" y="418.4775">no</text><rect fill="#FFCDD2" height="43.2813" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="191.9824" x="244.0168" y="442.8359"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="46.4063" x="254.0168" y="462.1182">typed Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="171.9824" x="254.0168" y="473.7588">(filter_deep_parents empty guard)</text><rect fill="#D7CCC8" height="43.2813" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="121.6943" x="481.3835" y="442.8359"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="96.4697" x="491.3835" y="462.1182">filter_deep_parents</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="101.6943" x="491.3835" y="473.7588">(max_parent_depth)</text><rect fill="#D7CCC8" height="54.9219" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="147.7393" x="468.3611" y="506.1172"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="122.8906" x="478.3611" y="525.3994">cap parents &#8212; unlimited</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="119.248" x="478.3611" y="537.04">(i32::MAX or &#8722;1) &#10233; all,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.7393" x="478.3611" y="548.6807">else take n (B2 cast-safe)</text><rect fill="#A5D6A7" height="31.6406" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="136.9189" x="473.7712" y="581.0391"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="116.9189" x="483.7712" y="600.3213">ForkChoice { tips, lca }</text><ellipse cx="542.2307" cy="643.6797" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="542.2307" cy="643.6797" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="71.6094" y2="91.6094"/><polygon fill="#444444" points="437.1194,81.6094,441.1194,91.6094,445.1194,81.6094,441.1194,85.6094" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="123.25" y2="143.25"/><polygon fill="#444444" points="437.1194,133.25,441.1194,143.25,445.1194,133.25,441.1194,137.25" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="186.5313" y2="206.5313"/><polygon fill="#444444" points="437.1194,196.5313,441.1194,206.5313,445.1194,196.5313,441.1194,200.5313" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="249.8125" y2="269.8125"/><polygon fill="#444444" points="437.1194,259.8125,441.1194,269.8125,445.1194,259.8125,441.1194,263.8125" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="313.0938" y2="333.9141"/><polygon fill="#444444" points="437.1194,323.9141,441.1194,333.9141,445.1194,323.9141,441.1194,327.9141" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="542.2307" x2="542.2307" y1="486.1172" y2="506.1172"/><polygon fill="#444444" points="538.2307,496.1172,542.2307,506.1172,546.2307,496.1172,542.2307,500.1172" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="542.2307" x2="542.2307" y1="561.0391" y2="581.0391"/><polygon fill="#444444" points="538.2307,571.0391,542.2307,581.0391,546.2307,571.0391,542.2307,575.0391" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="542.2307" x2="542.2307" y1="612.6797" y2="632.6797"/><polygon fill="#444444" points="538.2307,622.6797,542.2307,632.6797,546.2307,622.6797,542.2307,626.6797" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="350.0081" x2="340.0081" y1="420.8359" y2="420.8359"/><line style="stroke:#444444;stroke-width:1;" x1="340.0081" x2="340.0081" y1="420.8359" y2="442.8359"/><polygon fill="#444444" points="336.0081,432.8359,340.0081,442.8359,344.0081,432.8359,340.0081,436.8359" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="532.2307" x2="542.2307" y1="420.8359" y2="420.8359"/><line style="stroke:#444444;stroke-width:1;" x1="542.2307" x2="542.2307" y1="420.8359" y2="442.8359"/><polygon fill="#444444" points="538.2307,432.8359,542.2307,442.8359,546.2307,432.8359,542.2307,436.8359" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="441.1194" x2="441.1194" y1="388.8359" y2="408.8359"/><polygon fill="#444444" points="437.1194,398.8359,441.1194,408.8359,445.1194,398.8359,441.1194,402.8359" style="stroke:#444444;stroke-width:1;"/><g class="legend" data-source-line="50"><rect fill="none" height="68.2031" rx="7.5" ry="7.5" style="s