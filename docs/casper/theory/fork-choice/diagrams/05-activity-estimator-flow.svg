<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="800px" preserveAspectRatio="none" style="width:863px;height:800px;background:#FFFFFF;" version="1.1" viewBox="0 0 863 800" width="863px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="38"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="831.6929" x="15" y="38.5181">Fork-choice evaluation flow &#9472;&#9472; Estimator::tips + the hardened seams (B1-B4)</text></g><ellipse cx="377.719" cy="70.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#BBDEFB" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="162.5399" x="296.449" y="100.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="142.5399" x="306.449" y="121.6541">collect latest_message_hashes</text><rect fill="#D1C4E9" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="153.1399" x="301.149" y="154.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="133.1399" x="311.149" y="175.2741">filter invalid latest messages</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.1588" x="311.149" y="188.8941">(T-10, slashed &#8594; 0 weight)</text><rect fill="#BBDEFB" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="207.4999" x="273.969" y="221.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="187.4999" x="283.969" y="242.5141">calculate_lca &#8212; depth-filter &gt; top &#8722; 1000</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="136.9499" x="283.969" y="256.134">(deterministic: structural top)</text><path d="M483.5689,287.254 L483.5689,308.684 L463.5689,312.684 L483.5689,316.684 L483.5689,338.114 A0,0 0 0 0 483.5689,338.114 L665.3788,338.114 A0,0 0 0 0 665.3788,338.114 L665.3788,297.254 L655.3788,287.254 L483.5689,287.254 A0,0 0 0 0 483.5689,287.254" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><path d="M655.3788,287.254 L655.3788,297.254 L665.3788,297.254 L655.3788,287.254" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.8099" x="489.5689" y="302.944">B1: weight_from_validator_by_dag</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.9498" x="489.5689" y="316.564">returns a typed KvStoreError on a</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.0599" x="489.5689" y="330.184">MISSING parent (no panic).</text><rect fill="#C8E6C9" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="171.6998" x="291.8691" y="289.064"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="151.6998" x="301.8691" y="309.754">build_scores_map &#8212; BFS to LCA,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="109.7299" x="301.8691" y="323.374">checked_add score (B3)</text><rect fill="#FFE0B2" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="216.1798" x="269.6291" y="358.114"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="196.1798" x="279.6291" y="378.804">rank_forkchoices &#8212; heaviest scored-child;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="125.0899" x="279.6291" y="392.424">sort (score desc, hash asc);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="96.1399" x="279.6291" y="406.044">recurse to still_same</text><polygon fill="#FFF8E1" points="305.2241,438.974,450.2139,438.974,462.2139,450.974,450.2139,462.974,305.2241,462.974,293.2241,450.974,305.2241,438.974" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="144.9899" x="305.2241" y="454.854">tips empty? (genesis-only DAG)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="44.991" x="248.2331" y="448.044">yes &#9472;&#9472; B4</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.23" x="462.2139" y="448.044">no</text><rect fill="#FFCDD2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="179.8199" x="193.3141" y="472.974"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="43.0699" x="203.3141" y="493.664">typed Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="159.8199" x="203.3141" y="507.2839">(filter_deep_parents empty guard)</text><rect fill="#D7CCC8" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="114.1799" x="415.124" y="472.974"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="90.55" x="425.124" y="493.664">filter_deep_parents</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.1799" x="425.124" y="507.2839">(max_parent_depth)</text><rect fill="#D7CCC8" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="135.3199" x="404.554" y="540.2139"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="115.3199" x="414.554" y="560.9039">cap parents &#8212; unlimited</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="106.5059" x="414.554" y="574.5239">(i32::MAX or &#8722;1) &#10233; all,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="115.1599" x="414.554" y="588.1439">else take n (B2 cast-safe)</text><rect fill="#A5D6A7" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="123.0799" x="410.674" y="621.0739"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="103.0799" x="420.674" y="641.7639">ForkChoice { tips, lca }</text><ellipse cx="472.2139" cy="685.6939" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="472.2139" cy="685.6939" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="80.9641" y2="100.9641"/><polygon fill="#444444" points="373.719,90.9641,377.719,100.9641,381.719,90.9641,377.719,94.9641" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="134.5841" y2="154.5841"/><polygon fill="#444444" points="373.719,144.5841,377.719,154.5841,381.719,144.5841,377.719,148.5841" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="201.8241" y2="221.8241"/><polygon fill="#444444" points="373.719,211.8241,377.719,221.8241,381.719,211.8241,377.719,215.8241" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="269.064" y2="289.064"/><polygon fill="#444444" points="373.719,279.064,377.719,289.064,381.719,279.064,377.719,283.064" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="336.304" y2="358.114"/><polygon fill="#444444" points="373.719,348.114,377.719,358.114,381.719,348.114,377.719,352.114" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="472.2139" x2="472.2139" y1="520.2139" y2="540.2139"/><polygon fill="#444444" points="468.2139,530.2139,472.2139,540.2139,476.2139,530.2139,472.2139,534.2139" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="472.2139" x2="472.2139" y1="601.0739" y2="621.0739"/><polygon fill="#444444" points="468.2139,611.0739,472.2139,621.0739,476.2139,611.0739,472.2139,615.0739" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="472.2139" x2="472.2139" y1="654.6939" y2="674.6939"/><polygon fill="#444444" points="468.2139,664.6939,472.2139,674.6939,476.2139,664.6939,472.2139,668.6939" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="293.2241" x2="283.2241" y1="450.974" y2="450.974"/><line style="stroke:#444444;stroke-width:1;" x1="283.2241" x2="283.2241" y1="450.974" y2="472.974"/><polygon fill="#444444" points="279.2241,462.974,283.2241,472.974,287.2241,462.974,283.2241,466.974" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="462.2139" x2="472.2139" y1="450.974" y2="450.974"/><line style="stroke:#444444;stroke-width:1;" x1="472.2139" x2="472.2139" y1="450.974" y2="472.974"/><polygon fill="#444444" points="468.2139,462.974,472.2139,472.974,476.2139,462.974,472.2139,466.974" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="377.719" x2="377.719" y1="418.974" y2="438.974"/><polygon fill="#444444" points="373.719,428.974,377.719,438.974,381.719,428.974,377.719,432.974" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="72"><rect fill="none" height="78.0999" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="377.0297" x="242.3316" y="710.6939"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="355.7695" x="247.3316" y="726.3839">Every step is a PURE function of (DAG, latest_messages), so all honest nodes</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="367.0297" x="247.3316" y="740.0039">compute a node-identical ForkChoice (Rocq fork_choice_determinism_correct).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="365.7197" x="247.3316" y="753.6239">The empty-tips case is a typed Err, NOT a panic (Bound.empty_tips_typed_err);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="337.1997" x="247.3316" y="767.2438">the parent cap is cast-safe (B2); score accumulation is checked_add (B3);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="332.8996" x="247.3316" y="780.8638">and a missing parent surfaces a typed KvStoreError, never a panic (B1).</text></g><?plantuml-src XLLDRzj64BtpLqoZGqLKIYNRSLmvTQ7F86ZZ5h4Bz620M2s7qaBaBhExbAq60N8gUWvox-_et_4lwSmk4oksWH8-sEJRjpDltXj_uzTO8TIbK3f9t4RfMbXHWP1URPNVmRi4O2BaPcLDe_EfAOs5zkaimiC0OtEqNtqCWCFm461ihRb-y1qwH-4Xm4o9okZy_arynSbyk0UuTrDdVlniE1Wax_TgBt65EbyOxSy5zVQ4pXbN2ubF7WLTg3yHXeC7tnwhXTjzWDihgNCSdZrCZeLeIly_rUoXFfUJUELBX8MncxvS6oKHS2lAHdXbD1IbkORRJn_e1-REgqfuOqSZhse7tm4D5TQ2ojAOWqDHEUXEXlt9KPeatyAvoH5ag3Ts05tN58MwWHSlEckyEJk3mjWg7H4MO5as6AJkTYQJsNmnIU57i2Xo-9weVLE3yrW7Q2csn8QMeBFXz6Z-0qDTATnQwHKKglJyxR8_7AG1NodjM-hfoVnu6l7IM8P_OJLMw1K6r68n7qmEGW52RoBfJMs89Y2zqD3opPvFfzCJHYvvWew