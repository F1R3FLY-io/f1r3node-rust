th="380.4427" x="16.64" y="674.7379"/><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="360.4427" x="26.64" y="699.7039">step_observer: Option&lt;Arc&lt;dyn StepCommObserver&gt;&gt;</text><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.7411" x="26.64" y="718.7718">step_gate(): Option&lt;Arc&lt;StepGate&gt;&gt;</text></g><!--entity DI--><g class="entity" data-qualified-name="DI" data-source-line="17" id="ent0004"><rect fill="#A9DFBF" height="77.2038" rx="2.5" ry="2.5" style="stroke:#2C3E50;stroke-width:0.5;" width="182.2594" x="300.73" y="221.2779"/><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.2594" x="310.73" y="246.2439">extra_system_processes:</text><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.3114" x="310.73" y="265.3118">&amp;mut Vec&lt;Definition&gt;</text><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.7395" x="310.73" y="284.3797">(existing DI seam)</text></g><!--entity Mtl--><g class="entity" data-qualified-name="Mtl" data-source-line="19" id="ent0005"><rect fill="#D2B4DE" height="77.2038" rx="2.5" ry="2.5" style="stroke:#2C3E50;stroke-width:0.5;" width="169.7014" x="93.01" y="47.0679"/><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.7014" x="103.01" y="72.0339">MeTTaIL StepObserver</text><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.3754" x="103.01" y="91.1018">+ held-fold Definitions</text><text fill="#1B2631" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1875" x="103.01" y="110.1697">(injected as DATA)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="30" id="ent0013"><path d="M6,793.8679 L6,856.986 A0,0 0 0 0 6,856.986 L407.7183,856.986 A0