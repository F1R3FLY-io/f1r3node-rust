<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="500px" preserveAspectRatio="none" style="width:667px;height:500px;background:#FFFFFF;" version="1.1" viewBox="0 0 667 500" width="667px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="438.8142" x="110.676" y="24.9659">One-step unfold &#8212; bang_encoding_unfolds (&#167;6.6, Theorem 9.19)</text></g><!--entity B--><g class="entity" data-qualified-name="B" data-source-line="19" id="ent0001"><rect fill="#C8E6C9" height="107.1675" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="265.6445" x="46.18" y="47.0679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="45.9898" x="56.18" y="72.0339">before</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="124.3195" x="56.18" y="91.1018">bang_encoding x P</text><text fill="#000000" font-family="'sans-serif'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="183.0423" x="56.18" y="114.4456">x&#10216;&#8739; D(x) &#8739; P &#8739;&#10217;  &#8739;  D(x)</text><text fill="#000000" font-family="'sans-serif'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="245.6445" x="56.18" y="138.9615">(send on x)  &#8739;  (receive on x)</text></g><!--entity A--><g class="entity" data-qualified-name="A" data-source-line="21" id="ent0002"><rect fill="#E8F5E9" height="101.7196" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="343.9956" x="7" y="269.2379"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="34.4959" x="17" y="294.2039">after</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="154.3494" x="17" y="313.2718">bang_encoding x P  &#8739;  P</text><text fill="#000000" font-family="'sans-serif'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="221.9402" x="17" y="336.6156">x&#10216;&#8739; D(x) &#8739; P &#8739;&#10217;  &#8739;  D(x)  &#8739;  P</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="313.0757" x="27.92" y="356.8555">&#9492;&#9472;&#9472;&#9472;&#9472; regenerated encoding &#9472;&#9472;&#9472;&#9472;&#9496;   &#9492; new P &#9496;</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="26" id="ent0005"><path d="M385.83,279.6879 L385.83,316.0979 L351.32,320.0979 L385.83,324.0979 L385.83,360.512 A0,0 0 0 0 385.83,360.512 L652.1662,360.512 A0,0 0 0 0 652.1662,360.512 L652.1662,289.6879 L642.1662,279.6879 L385.83,279.6879 A0,0 0 0 0 385.83,279.6879" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M642.1662,279.6879 L642.1662,289.6879 L652.1662,289.6879 L642.1662,279.6879" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="238.9142" x="391.83" y="298.5849">The encoding re-emerges intact, so the</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="236.2232" x="391.83" y="316.2909">body P can be unfolded again &#8212; this is</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="245.3362" x="391.83" y="333.997">how `!P` is realised with pure-rho COMM</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="203.6452" x="391.83" y="351.703">only (Meredith-Radestock [1, &#167;3]).</text></g><!--link B to A--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="23" id="lnk3"><path d="M179,154.5679 C179,189.3879 179,229.6879 179,263.9379" fill="none" id="B-to-A" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="179,268.9379,183,259.9379,179,263.9379,175,259.9379,179,268.9379" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="85.3191" x="288.7581" y="199.1349">rs_comm on x</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="129.4931" x="266.6711" y="216.8409">D(x) receives D(x) &#8739; P,</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="302.8353" x="180" y="234.547">re-posts (regenerates) + dereferences (releases P)</text></g><g class="legend" data-source-line="32"><rect fill="#DDDDDD" height="90.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="279.821" x="190.1726" y="390.9575"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="44.2538" x="198.8126" y="412.9234">colour</text><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.6278" x="250.3464" y="412.9234">meaning</text><rect fill="#C8E6C9" height="19.0679" style="stroke:none;stroke-width:1;" width="51.5338" x="195.1726" y="417.0254"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="3.64" x="195.1726" y="431.9914">&#160;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="173.0393" x="250.3464" y="431.9914">pre-COMM encoding state</text><rect fill="#E8F5E9" height="19.0679" style="stroke:none;stroke-width:1;" width="51.5338" x="195.1726" y="436.0933"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="3.64" x="195.1726" y="451.0593">&#160;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="195.1313" x="250.3464" y="451.0593">post-COMM state (P released)</text><rect fill="#2E7D32" height="19.0679" style="stroke:none;stroke-width:1;" width="51.5338" x="195.1726" y="455.1613"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="3.64" x="195.1726" y="470.1272">&#160;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="211.0072" x="250.3464" y="470.1272">the single billable rs_comm step</text><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="464.9936" y1="397.9575" y2="397.9575"/><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="464.9936" y1="417.0254" y2="417.0254"/><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="464.9936" y1="436.0933" y2="436.0933"/><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="464.9936" y1="455.1613" y2="455.1613"/><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="464.9936" y1="474.2292" y2="474.2292"/><line style="stroke:#000000;stroke-width:1;" x1="195.1726" x2="195.1726" y1="397.9575" y2="474.2292"/><line style="stroke:#000000;stroke-width:1;" x1="246.7064" x2="246.7064" y1="397.9575" y2="474.2292"/><line style="stroke:#000000;stroke-width:1;" x1="464.9936" x2="464.9936" y1="397.9575" y2="474.2292"/></g><?plantuml-src ZLFDRjim3BxxATXi1oTB0XG52dHO2omTTiiQ3BirHQfOj2rKfWn9ML8i0thS0-JGMmyxT7kDFagUP9ISDDdFOOPjqE97ykD7-a1HfcSIeHOQlSU-cbKwSJUAQc551H9pCTF-lI7_GLG8BIV8zHnQbRVsOAuKqimL5P0BxN3FOp7pWWgDy2K161WhqPuRRIoyE8fNyZNnohF_Wh3dFDOmezne2Ukx5KmvT8AK6Scv9ut3GVhqUDm_xiAd4et52axwXoVj9DcLQdKwKypPr-cCwRSSi83Hc4u15kk77-jlt-5TkcX3C4RXlNxu2V4hdaTWwf0a60B6DQwK2w7wZCrX2uI30RpCnAGsHlz1G-GUxJzPR9BzFvjT0B2vMgrNTyytormWeHKU9JnNsKUiL_TD613EG_hLVMJ-DZ8dut5IM4HAaW7qBiDPPb4gVzKxOynhi6wIcQgAFOyfyjd8uFPOTyTaiLSRvrsGQSl9jU4LhvB5d1_AC3er2iVMY2SNoeDLHUd1v7zJWZ3fNLjS0Ikq1GShyYBpNN06V8aCd1fvozrbWc2Ac