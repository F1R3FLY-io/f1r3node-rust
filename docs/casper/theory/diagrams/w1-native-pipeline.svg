<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="789px" preserveAspectRatio="none" style="width:759px;height:789px;background:#FFFFFF;" version="1.1" viewBox="0 0 759 789" width="759px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="22"><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="494.8701" x="128.7693" y="24.9659">W1 native pipeline &#8212; recognize (don't lower-to-gate), meter per-COMM</text></g><!--entity A1--><g class="entity" data-qualified-name="A1" data-source-line="24" id="ent0001"><rect fill="#F8C3B8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="117.1876" x="172.31" y="47.0679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="65.5758" x="182.31" y="72.0339">{% P %}[s]</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="97.1876" x="182.31" y="91.1018">&#8212; signed term</text></g><!--entity A2--><g class="entity" data-qualified-name="A2" data-source-line="25" id="ent0002"><rect fill="#F8C3B8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="112.6376" x="324.59" y="47.0679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="29.1759" x="334.59" y="72.0339">s :: S</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="92.6376" x="334.59" y="91.1018">&#8212; token stack</text></g><!--entity A3--><g class="entity" data-qualified-name="A3" data-source-line="26" id="ent0003"><rect fill="#F8C3B8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="168.7074" x="472.55" y="47.0679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="148.7074" x="482.55" y="72.0339">for(... {% y &lt;- x %}[s] ...)</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="89.7116" x="482.55" y="91.1018">&#8212; signed join</text></g><!--entity REC--><g class="entity" data-qualified-name="REC" data-source-line="28" id="ent0004"><rect fill="#D4C4E8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="362.1867" x="199.81" y="166.2079"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="72.9257" x="209.81" y="191.1739">Recognizer</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="342.1867" x="209.81" y="210.2418">recognize_signed_term / _token_stack / _signed_join</text></g><!--entity SIG--><g class="entity" data-qualified-name="SIG" data-source-line="29" id="ent0005"><rect fill="#B2DFDB" height="77.2038" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="366.9887" x="197.41" y="285.3379"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="183.7493" x="207.41" y="310.3039">Resolve + validate signature</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="273.5155" x="207.41" y="329.3718">signature_to_native_sig &#8658; accounting::Sig</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="346.9887" x="207.41" y="348.4397">(lollipop / uniform-sign / strip_signed_binds rewrites)</text></g><!--entity NORM--><g class="entity" data-qualified-name="NORM" data-source-line="30" id="ent0006"><rect fill="#FFECB3" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="352.2467" x="12.78" y="459.5379"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="132.1035" x="22.78" y="484.5039">ORDINARY lowering</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="332.2467" x="22.78" y="503.5718">normalize_ann_proc(P) &#8212; emits NO fuel-gate node</text></g><!--entity PAR--><g class="entity" data-qualified-name="PAR" data-source-line="31" id="ent0007"><rect fill="#BBDEFB" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="233.8742" x="71.97" y="578.6779"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="101.8916" x="81.97" y="603.6439">Normalized Par</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="213.8742" x="81.97" y="622.7118">&#8801; byte-identical to unsigned P &#10003;</text></g><!--entity METER--><g class="entity" data-qualified-name="METER" data-source-line="32" id="ent0008"><rect fill="#C8E6C9" height="77.2038" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="363.8107" x="7" y="697.8179"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="211.7492" x="17" y="722.7839">Reducer &#8212; per-COMM metering</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="190.7912" x="17" y="741.8518">one token per send / receive,</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="343.8107" x="17" y="760.9197">attributed to s's lane (s&#8320; collapse: one envelope lane)</text></g><!--entity DROP--><g class="entity" data-qualified-name="DROP" data-source-line="34" id="ent0009"><rect fill="#EF9A9A" height="58.1358" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="345.0087" x="400.4" y="459.5379"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="234.445" x="410.4" y="484.5039">&#10007; Part-B gate   for(t &lt;- &#931;&#10214;s&#10215;){ *t &#8739; P }</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="325.0087" x="410.4" y="503.5718">DROPPED &#8212; would double-meter vs Rule 1 (&#167;838)</text></g><!--link A1 to REC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="36" id="lnk10"><path d="M267.22,105.4879 C290.63,123.7679 317.019,144.3808 340.469,162.6908" fill="none" id="A1-to-REC" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="344.41,165.7679,339.778,157.0763,340.469,162.6908,334.8546,163.3818,344.41,165.7679" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link A2 to REC--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="37" id="lnk11"><path d="M380.91,105.4879 C380.91,123.7679 380.91,142.4579 380.91,160.7679" fill="none" id="A2-to-REC" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="380.91,165.7679,384.91,156.7679,380.91,160.7679,376.91,156.7679,380.91,165.7679" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link A3 to REC--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="38" id="lnk12"><path d="M514.3,105.4879 C486.83,123.7679 455.4023,144.6876 427.8923,162.9976" fill="none" id="A3-to-REC" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="423.73,165.7679,433.4385,164.1111,427.8923,162.9976,429.0059,157.4514,423.73,165.7679" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link REC to SIG--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="39" id="lnk13"><path d="M380.91,224.6979 C380.91,242.4979 380.91,260.6379 380.91,279.9979" fill="none" id="REC-to-SIG" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="380.91,284