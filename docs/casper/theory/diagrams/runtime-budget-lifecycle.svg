<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="915px" preserveAspectRatio="none" style="width:963px;height:915px;background:#FFFFFF;" version="1.1" viewBox="0 0 963 915" width="963px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="21"><text fill="#000000" font-family="'sans-serif'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="931.9671" x="15" y="38.5181">RuntimeBudget / TokenBudget lifecycle &#8212; invariant: consumed + remaining == initial</text></g><g class="entity" data-qualified-name="Funded" data-source-line="23" id="ent0001"><rect fill="#C8E6C9" height="77.2038" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="189.5253" x="393.6865" y="160.9641"/><line style="stroke:#333333;stroke-width:1;" x1="393.6865" x2="583.2118" y1="228.1679" y2="228.1679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="49.6858" x="403.6865" y="180.93">Funded</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="92.0916" x="403.6865" y="199.998">consumed = 0</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="169.5253" x="403.6865" y="219.0659">remaining = initial_tokens</text></g><g class="entity" data-qualified-name="Reserving" data-source-line="24" id="ent0002"><rect fill="#FFECB3" height="58.1358" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="156.8354" x="146.0265" y="335.1641"/><line style="stroke:#333333;stroke-width:1;" x1="146.0265" x2="302.8619" y1="383.2999" y2="383.2999"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="64.9737" x="156.0265" y="355.13">Reserving</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="136.8354" x="156.0265" y="374.198">reserve_canonical(w)</text></g><g class="entity" data-qualified-name="OOP" data-source-line="25" id="ent0003"><rect fill="#EF9A9A" height="77.2038" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="276.563" x="63.1665" y="490.3041"/><line style="stroke:#333333;stroke-width:1;" x1="63.1665" x2="339.7294" y1="557.5079" y2="557.5079"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="69.5937" x="73.1665" y="510.27">OutOfPhlo</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="199.5132" x="73.1665" y="529.338">canonical OOP boundary fixed</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="256.563" x="73.1665" y="548.4059">(first boundary; schedule-independent)</text></g><g class="entity" data-qualified-name="Final" data-source-line="26" id="ent0004"><rect fill="#BBDEFB" height="77.2038" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="244.4471" x="465.2265" y="646.5041"/><line style="stroke:#333333;stroke-width:1;" x1="465.2265" x2="709.6736" y1="713.7079" y2="713.7079"/><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="57.6938" x="475.2265" y="666.47">Finalized</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="224.4471" x="475.2265" y="685.538">total_cost = min(consumed, initial)</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="173.5853" x="475.2265" y="704.6059">(diagnostic digest derived)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="28" id="ent0005"><ellipse cx="488.4465" cy="71.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" data-source-line="38" id="ent0015"><path d="M359.6965,784.7041 L359.6965,900.9402 A0,0 0 0 0 359.6965,900.9402 L815.1959,900.9402 A0,0 0 0 0 815.1959,900.9402 L815.1959,794.7041 L805.1959,784.7041 L591.4465,784.7041 L587.4465,724.2041 L583.4465,784.7041 L359.6965,784.7041 A0,0 0 0 0 359.6965,784.7041" fill="#E8F5E9" style="stroke:#000000;stroke-width:1;"/><path d="M805.1959,784.7041 L805.1959,794.7041 L815.1959,794.7041 L805.1959,784.7041" fill="#E8F5E9" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="339.1833" x="365.6965" y="803.6011">Invariant (`RuntimeBudgetRefinement.v`): in every state</text><text fill="#000000" font-family="'sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="256.9843" x="365.6965" y="821.3071">consumed + remaining == initial_tokens</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="3.484" x="622.6807" y="821.3071">.</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="434.4994" x="365.6965" y="839.0131">Consensus reads only `total_cost = consumed` (clamped); the cost-trace</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="362.8953" x="365.6965" y="856.7192">digest / event-count / `last_oop` are diagnostic (TM-CA-151).</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="413.8293" x="365.6965" y="874.4252">Reconciliation is a pure function of (initial, attempt multiset), so play</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="381.7972" x="365.6965" y="892.1312">and replay reach the same boundary regardless of scheduling.</text></g><!--link *start* to Funded--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="28" id="lnk6"><path d="M488.4465,82.4041 C488.4465,98.7741 488.4465,128.2