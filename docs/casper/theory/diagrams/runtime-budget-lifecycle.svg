able event,</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="95.7321" x="426.2905" y="300.7671">consumed += w</text></g><!--link Reserving to OOP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk9"><path d="M220.4465,393.5641 C216.6665,420.2341 211.6972,455.4235 207.5272,484.8835" fill="none" id="Reserving-to-OOP" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="206.8265,489.8341,212.0483,481.4835,207.5272,484.8835,204.1273,480.3623,206.8265,489.8341" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="135.0427" x="264.3452" y="438.2011">would exceed initial &#8594;</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="230.3602" x="216.6865" y="455.9071">fix the FIRST canonical OOP boundary</text></g><!--link OOP to OOP--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" data-link-type="dependency" data-source-line="32" id="lnk10"><path d="M340.1265,515.6141 C360.7665,517.6841 374.7265,522.1141 374.7265,528.9041 C374.7265,535.6941 365.7415,539.6152 345.1015,541.6852" fill="none" id="OOP-to-OOP" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="340.1265,542.1841,349.4807,545.266,345.1015,541.6852,348.6824,537.306,340.1265,542.1841" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="165.2822" x="380.7265" y="525.3011">later over-budget attempts</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="159.4451" x="383.645" y="543.0071">(first boundary preserved)</text></g><!--link Funded to Final--><g class="link" data-entity-1="ent000