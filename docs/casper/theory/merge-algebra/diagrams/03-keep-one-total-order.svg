<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="936px" preserveAspectRatio="none" style="width:714px;height:936px;background:#FFFFFF;" version="1.1" viewBox="0 0 714 936" width="714px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="45"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="682.7284" x="15" y="38.5181">Keep-one total order &#8212; why the merge cannot fork (Finding B)</text></g><!--cluster 4-key comparator ? v0.4.16 (FORKS on ties)--><g class="cluster" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties." data-source-line="54" id="ent0001"><path d="M67.8642,61.9641 L284.424,61.9641 A3.75,3.75 0 0 1 286.924,64.4641 L293.924,81.5841 L320.8642,81.5841 A2.5,2.5 0 0 1 323.3642,84.0841 L323.3642,681.3841 A2.5,2.5 0 0 1 320.8642,683.8841 L67.8642,683.8841 A2.5,2.5 0 0 1 65.3642,681.3841 L65.3642,64.4641 A2.5,2.5 0 0 1 67.8642,61.9641" fill="#FDECEA" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="65.3642" x2="293.924" y1="81.5841" y2="81.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="215.5598" x="69.3642" y="74.6541">4-key comparator &#8212; v0.4.16 (FORKS on ties)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="27.01" x="184.8592" y="94.2741">&#171;Bad&#187;</text></g><!--cluster 5-key comparator ? the fix c0b7609e (SAFE)--><g class="cluster" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE." data-source-line="66" id="ent0011"><path d="M349.8642,198.4441 L568.054,198.4441 A3.75,3.75 0 0 1 570.554,200.9441 L577.554,218.0641 L642.8642,218.0641 A2.5,2.5 0 0 1 645.3642,220.5641 L645.3642,788.6241 A2.5,2.5 0 0 1 642.8642,791.1241 L349.8642,791.1241 A2.5,2.5 0 0 1 347.3642,788.6241 L347.3642,200.9441 A2.5,2.5 0 0 1 349.8642,198.4441" fill="#EEFAF1" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="347.3642" x2="577.554" y1="218.0641" y2="218.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="217.1898" x="351.3642" y="211.1341">5-key comparator &#8212; the fix c0b7609e (SAFE)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="33.3699" x="483.6792" y="230.7541">&#171;Good&#187;</text></g><!--entity B1--><g class="entity" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties..B1" data-source-line="55" id="ent0002"><rect fill="#FFCDD2" height="74.4799" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="130.8899" x="157.9242" y="107.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="63.2399" x="167.9242" y="128.6541">1. &#931;cost DESC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="110.8899" x="167.9242" y="142.2741">2. max single cost DESC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="97.3499" x="167.9242" y="155.8941">3. min deploy_id ASC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="107.2999" x="167.9242" y="169.5141">4. post_state_hash ASC</text></g><!--entity B2--><g class="entity" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties..B2" data-source-line="56" id="ent0003"><rect fill="#FFCDD2" height="74.4799" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="200.4099" x="105.1642" y="244.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="101.9099" x="115.1642" y="265.1341">key 4 is NOT injective:</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="174.5199" x="115.1642" y="278.7541">post_state_hash need not distinguish</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="180.4099" x="115.1642" y="292.3741">distinct chains; different-parent chains</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="121.8999" x="115.1642" y="305.9941">can share a min deploy_id</text></g><!--entity B3--><g class="entity" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties..B3" data-source-line="57" id="ent0004"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="210.5498" x="94.0942" y="385.7341"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="190.5498" x="104.0942" y="406.4241">cmp a b = Equal for two DISTINCT chains</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="83.1589" x="104.0942" y="420.0441">(Equal-class &#8836; Eq)</text></g><!--entity B4--><g class="entity" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties..B4" data-source-line="58" id="ent0005"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="212.3498" x="91.1942" y="499.7841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="192.3498" x="101.1942" y="520.4741">min_by / sort winner LEAKS the reseeded</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="142.1199" x="101.1942" y="534.0941">HashSet order (branch.0.iter())</text></g><!--entity B5--><g class="entity" data-qualified-name="4-key comparator . v0.4.16 .FORKS on ties..B5" data-source-line="59" id="ent0006"><rect fill="#EF9A9A" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="226.9647" x="80.8842" y="607.0241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="206.9647" x="90.8842" y="627.7141">nodes reject DIFFERENT deploys &#10233; FORK &#10007;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.2099" x="90.8842" y="641.3341">(divergent pre-state / rejected-set;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.4799" x="90.8842" y="654.9541">validation recompute mismatches)</text></g><!--entity G1--><g class="entity" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE..G1" data-source-line="67" id="ent0012"><rect fill="#C8E6C9" height="74.4799" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="214.4398" x="369.1442" y="244.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="158.3599" x="379.1442" y="265.1341">keys 1-4 (byte-identical to v0.4.16)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="142.1999" x="379.1442" y="278.7541">5. deploys_with_cost.cmp  ASC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="186.6398" x="386.9442" y="292.3741">= HashableSet&lt;DeployIdWithCost&gt;: Ord</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="123.4199" x="386.9442" y="305.9941">(the injective Eq/Hash key)</text></g><!--entity G2--><g class="entity" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE..G2" data-source-line="68" id="ent0013"><rect fill="#C8E6C9" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="240.7957" x="364.9642" y="378.9241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="198.6898" x="374.9642" y="399.6141">keys 1-4 are FUNCTIONS of the deploy set,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="187.7498" x="374.9642" y="413.2341">key 5 IS the set (shortlex, HashSet-order</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="220.7957" x="374.9642" y="426.8541">independent) &#10233; no cryptographic assumption</text></g><!--entity G3--><g class="entity" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE..G3" data-source-line="69" id="ent0014"><rect fill="#C8E6C9" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="250.0116" x="367.3542" y="499.7841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="230.0116" x="377.3542" y="520.4741">cmp a b = Equal  &#10234;  the sets are equal  &#10234;  a = b</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="215.3688" x="377.3542" y="534.0941">(Equal-class &#8838; Eq) &#8212; keep_one_equal_impl_eq</text></g><!--entity G4--><g class="entity" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE..G4" data-source-line="70" id="ent0015"><rect fill="#C8E6C9" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="241.8497" x="373.4442" y="607.0241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="150.6998" x="383.4442" y="627.7141">min_by / sort winner is UNIQUE;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="221.8497" x="383.4442" y="641.3341">HashSet order is WASHED OUT by the total sort</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="141.6999" x="383.4442" y="654.9541">(output_indep_of_input_perm)</text></g><!--entity G5--><g class="entity" data-qualified-name="5-key comparator . the fix c0b7609e .SAFE..G5" data-source-line="71" id="ent0016"><rect fill="#A5D6A7" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="266.1346" x="363.2942" y="727.8841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="246.1346" x="373.2942" y="748.5741">every node rejects the SAME deploys &#10233; NO FORK &#10003;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="169.7698" x="373.2942" y="762.1941">(recompute matches on every node)</text></g><!--link B1 to B2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="60" id="lnk7"><path d="M218.4942,182.5941 C215.9342,201.7341 213.4696,220.1686 210.8996,239.3086" fill="none" id="B1-to-B2" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="210.2342,244.2641,215.3963,235.8765,210.8996,239.3086,207.4675,234.8118,210.2342,244.2641" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B2 to B3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="61" id="lnk8"><path d="M203.6142,319.3741 C202.5942,340.6741 201.5827,361.8598 200.7027,380.2898" fill="none" id="B2-to-B3" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="200.4642,385.2841,204.8889,376.4851,200.7027,380.2898,196.898,376.1036,200.4642,385.2841" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B3 to B4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="62" id="lnk9"><path d="M198.9542,433.3041 C198.6142,452.6341 198.2021,475.1649 197.8621,494.4949" fill="none" id="B3-to-B4" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="197.7742,499.4941,201.9319,490.5658,197.8621,494.4949,193.9331,490.4251,197.7742,499.4941" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B4 to B5--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="63" id="lnk10"><path d="M196.7542,547.3541 C196.2942,564.5041 195.7858,583.1158 195.2958,601.7258" fill="none" id="B4-to-B5" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="195.1642,606.7241,199.3997,597.8325,195.2958,601.7258,191.4025,597.6219,195.1642,606.7241" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G1 to G2--><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" data-source-line="72" id="lnk17"><path d="M478.9942,319.3741 C480.3442,338.2041 481.607,355.8769 482.877,373.6069" fill="none" id="G1-to-G2" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="483.2342,378.5941,486.581,369.3313,482.877,373.6069,478.6014,369.9029,483.2342,378.5941" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G2 to G3--><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" data-link-type="dependency" data-source-line="73" id="lnk18"><path d="M487.2242,440.0841 C488.3842,458.6341 489.5298,477.154 490.6098,494.294" fill="none" id="G2-to-G3" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="490.9242,499.2841,494.3503,490.0504,490.6098,494.294,486.3661,490.5535,490.9242,499.2841" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G3 to G4--><g class="link" data-entity-1="ent0014" data-entity-2="ent0015" data-link-type="dependency" data-source-line="74" id="lnk19"><path d="M492.7742,547.3541 C493.0842,564.5041 493.4155,583.1149 493.7455,601.7249" fill="none" id="G3-to-G4" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="493.8342,606.7241,497.674,597.6546,493.7455,601.7249,489.6753,597.7964,493.8342,606.7241" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G4 to G5--><g class="link" data-entity-1="ent0015" data-entity-2="ent0016" data-link-type="dependency" data-source-line="75" id="lnk20"><path d="M494.8942,668.1841 C495.2242,686.7341 495.5538,705.2449 495.8638,722.3849" fill="none" id="G4-to-G5" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="495.9542,727.3841,499.7908,718.3132,495.8638,722.3849,491.7921,718.4579,495.9542,727.3841" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B1 to G1--><!--link B5 to G5--><g class="legend" data-source-line="82"><rect fill="none" height="118.9599" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="401.7796" x="155.4744" y="805.1241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="363.4796" x="160.4744" y="820.8141">The distinction is INJECTIVITY of the terminal key. Appending the Eq/Hash key</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="376.4196" x="160.4744" y="834.4341">(deploys_with_cost.cmp, a deterministic shortlex order) makes the Equal-class of</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="375.1996" x="160.4744" y="848.0541">cmp EXACTLY the identity, so no two distinct chains tie &#8212; a STRICT TOTAL order.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="376.0197" x="160.4744" y="861.6741">Rocq KeepOneOrder is UNCONDITIONAL (no NoDup premise, unlike fork-choice</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="352.0696" x="160.4744" y="875.294">TieBreak.v). The fix is APPEND-ONLY: keys 1-4 are unchanged, so key 5 only</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="371.1756" x="160.4744" y="888.914">resolves ties that were already HashSet-nondeterministic on v0.4.16 &#10233; rolling-</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="391.7796" x="160.4744" y="902.534">upgrade-safe. Z3 keep_one_total_order.py proves totality + argmax uniqueness and</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="226.0198" x="160.4744" y="916.154">the "without key 5, distinct chains tie" sat probe.</text></g><?plantuml-src XLPTSo9557tdLrp9mq8Ps8IFx2RxKKLWoE96M0DnNSMYXfa6MeRksPacMToooWVB1r-roXUhVF1Nw8_mH-mlyTnkI20PbOS4-jwvVURqEVVsHsOc5eBYo9SgbqldKiL-uYyeq8jOAw5CtwmYGOa8ZA-caTXAkLcZzpcYjbQcwwDKVg6LJcC_4FdrSbz-A-Zm8FVTriE8p_sfU_GKtwU9NggmgIETF7rwfdNu_3djULwxqJxCoZZrEO7ssYslwJKuGoUXI6oKzchsixDV9AP2XPaWiv8saE_6xW010FkvdxSDvyX-jd92CV6NaVaVD5jP6pWv8mtuVYb4NCBfaD76ZyZkHH--_uMkPol2WT929E0sy9NIXYOwcLEXBLKerPHEYxdS0-hg474Bpm4-mIBHD152KM6l-TWxQXxJGzfhr5j7ZKT5UcRhzbzqNhtoMbGlpSLglMyXzITY7sYDI1PIoTJ8e6Yh9IB4tm8uQhPQ5QxcjOyRnurDjL34aLuXgRPTpaYHqeVV_xIukP0NJlyBQyLxrAfMk2O3GT54Nlb6QaN1Z4MzZQHvL7bSUSovbfHxkRcDBFCE4hi0Ps6qe_Vge5mh7nw1pDx5opxXCGPRpDD6aApcMrla3ylqzn-1JWsrl7vpg2fbMlZlA9Ksl1Me8Y3Lcf2H3Ad1gxKonSWPfSOtOZJpqnclvybFwVIGrhJkxiYWQoHJwlO69DKtYCWhSJ9KTmif0KfO7I4Vc9ekPJeRAlSZC8wEz0cYaub8q0PAu07_re6XWhOedM6D_5te3bub6rwmY94_1l_UsoMKYrCWSwsfrUaFEjtcuAPymSPBGUId4CDFFo2_w2fNioi3msYyWiPIdHYwbaf1I-TU0yV4Kaj4YXSMuL2zmDltXTceRPpuAfYL3yeIyYqKrvlKiZTHS4sA1QOLcDjjxyBh3jRlxaJBog0Fl_sALmZ1F6m8qk94b2ptmEUU5c4f5UR9K5tvaGoT1B4HvBP4raAc2zy4CwijnbFVM8SxtI6LlbehUN-ie_3hqdCGpf5ALgJAaMfMfCQHMbQaZjvvwuLwbXUOrObyHy71-D7HmR6WGh_HzgmNrktx_JrffdHOge7pbH4b6O8P6K04Hc-CLHogUdb3v-XQcjc8JL9csJXBmCNFY8_G7qS2n_YqPPCxuMiaDv7x_8HwIMWJ2mpnnWDGq4D-a833iNe63xb6zoz0MTtjIyYoq-l2xPEjfaKulVsXObxgr74QmnAQuGpwYyIxVLeBhMI5DbHelo96yy9R5wrIbAOWMSL6JnC_dia0aDBb8cOfE7YLR7XtFOHYVz46G6f1Yws0ZyJnFKFzo8QovpZ7B1bXbepiGoEvY2DyTGYgsGWolOQUSzdjV7RfFRdhCKHUD_elC3PwbmCQkmdb9XSN03QzDD3zo58qqXDyuPynvidwf6hPG0GCjY9svTfMgPjIZK-z7LDsUnjV_epTjdpcJCQD_BRKUilwPlPXopDhEJTeRanonfOxgsH5s79