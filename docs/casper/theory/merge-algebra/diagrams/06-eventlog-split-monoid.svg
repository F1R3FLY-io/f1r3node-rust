 x="108.0924" y="332.8841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="100.8299" x="118.0924" y="353.5741">user_event_log_index</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="140.7137" x="118.0924" y="371.47">fold&#7522; (&#8746;) user bucket</text></g><!--entity SI--><g class="entity" data-qualified-name="SPLIT path . DeployChainIndex..new.SI" data-source-line="63" id="ent0006"><rect fill="#BBDEFB" height="52.6879" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="180.1036" x="303.4024" y="332.8841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="113.3699" x="313.4024" y="353.5741">system_event_log_index</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.1036" x="313.4024" y="371.47">fold&#7522; (&#8746;) system bucket</text></g><!--entity SPLITIDX--><g class="entity" data-qualified-name="SPLIT path . DeployChainIndex..new.SPLITIDX" data-source-line="64" id="ent0007"><rect fill="#C8E6C9" height="66.3079" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="231.8752" x="251.5124" y="460.5741"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="48.15" x="261.5124" y="481.2641">split index</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="211.8752" x="261.5124" y="499.16">combine(user_idx, system_idx)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="106.8092" x="266.7124" y="513.952">(field-wise set union &#8746;)</text></g><!--entity MONOIDX--><g class="entity" data-qualified-name="MONOLITHIC path.MONOIDX" data-source-line="72" id="ent0013"><rect fill="#90CAF9" height="52.6879" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="161.0217" x="539.9424" y="217.2041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="78.3999" x="549.9424" y="237.8941">monolithic index</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="141.0217" x="549.9424" y="255.79">fold&#7522; (&#8746;) ALL deploys</text></g><!--entity ALL--><g class="entity" data-qualified-name="ALL" data-source-line="57" id="ent0001"><rect fill="#FFFFFF" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="143.6199" x="321.6424" y="62.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.5399" x="331.6424" y="83.6541">all deploys  [d&#8321; &#8230; d&#8345;]</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="123.6199" x="331.6424" y="97.2741">(one block's body.deploys)</text></g><!--entity EQ--><g class="entity" data-qualified-name="EQ" data-source-line="75" id="ent0014"><rect fill="#A5D6A7" height="101.7199" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="248.7793" x="352.0624" y="603.8841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="120.9299" x="362.0624" y="624.5741">combine_split p l  =  foldi l</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="228.7793" x="362.0624" y="638.1941">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="101.1307" x="362.0624" y="651.8141">&#8704; conflicts, p, l, other:</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.2499" x="364.6624" y="665.4341">conflicts(split) = conflicts(monolithic)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="202.2647" x="362.0624" y="679.054">&#10233; the split hides NO user&#8596;system conflict</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="109.3099" x="362.0624" y="692.674">(event_log_split_sound)</text></g><!--link UB to UI--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="65" id="lnk8"><path d="M193.2424,267.5541 C192.2424,286.3641 191.1059,307.971 190.0759,327.491" fill="none" id="UB-to-UI" style="stroke:#E65100;stroke-width:2;"/><polygon fill="#E65100" points="189.8124,332.4841,194.2811,323.7074,190.0759,327.491,186.2922,323.2858,189.8124,332.4841" style="stroke:#E65100;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link SB to SI--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="66" id="lnk9"><path d="M393.4524,267.5541 C393.4524,286.3641 393.4524,307.9641 393.4524,327.4841" fill="none" id="SB-to-SI" style="stroke:#E65100;stroke-width:2;"/><polygon fill="#E65100" points="393.4524,332.4841,397.4524,323.4841,393.4524,327.4841,389.4524,323.4841,393.4524,332.4841" style="stroke:#E65100;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UI to SPLITIDX--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="67" id="lnk10"><path d="M222.9624,385.7841 C251.6124,406.9841 288.5137,434.2993 319.5037,457.2393" fill="none" id="UI-to-SPLITIDX" style="stroke:#1565C0;stroke-width:1;"/><polygon fill="#1565C0" points="323.5224,460.2141,318.6685,451.6444,319.5037,457.2393,313.9088,458.0744,323.5224,460.2141" style="stroke:#1565C0;stroke-width:1;stroke-linejoin:miter;stroke-mi