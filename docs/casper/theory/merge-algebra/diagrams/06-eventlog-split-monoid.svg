426.9424,110.4441 C468.5124,138.8141 535.063,184.2549 578.523,213.9249" fill="none" id="ALL-to-MONOIDX" style="stroke:#E65100;stroke-width:2;"/><polygon fill="#E65100" points="582.6524,216.7441,577.4747,208.3661,578.523,213.9249,572.9641,214.9732,582.6524,216.7441" style="stroke:#E65100;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="31.59" x="487.6224" y="151.8941">fold all</text></g><!--link SPLITIDX to EQ--><g class="link" data-entity-1="ent0007" data-entity-2="ent0014" data-link-type="dependency" data-source-line="80" id="lnk18"><path d="M389.7724,527.2941 C404.8424,549.2841 422.2057,574.6098 439.3057,599.5598" fill="none" id="SPLITIDX-to-EQ" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="442.1324,603.6841,440.3438,593.999,439.3057,599.5598,433.745,598.5217,442.1324,603.6841" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="5.72" x="419.6824" y="570.5741">=</text></g><!--link MONOIDX to EQ--><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" data-link-type="dependency" data-source-line="81" id="lnk19"><path d="M611.4424,270.1441 C588.0424,336.6341 526.682,511.0076 495.742,598.9376" fill="none" id="MONOIDX-to-EQ" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="494.0824,603.6541,500.8429,596.492,495.742,598.9376,493.2965,593.8367,494.0824,603.6541" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="5.72" x="561.0424" y="427.2641">=</text></g><g class="legend" data-source-line="83"><rect fill="none" height="118.9599" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="394.4796" x="208.7126" y="718.604"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="384.4796" x="213.7126" y="734.294">EventLogIndex::combine is field-wise SET UNION (.union()) on the conflict-relevant</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="382.8397" x="213.7126" y="747.914">produce/consume sets &#8212; a commutative, associative, IDEMPOTENT monoid (join-</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="335.7498" x="213.7126" y="761.534">semilattice) with the empty index as identity. A partition into (filter p) ++</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="362.5696" x="213.7126" y="775.154">(filter &#172;p) is a permutation of the whole list, and foldi is permutation-invariant</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="357.8396" x="213.7126" y="788.774">(foldi_perm), so combine(fold user, fold system) = fold all (combine_split_eq).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="361.2396" x="213.7126" y="802.394">Conflict detection reads only the combined index, so its verdict is identical on</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="342.7596" x="213.7126" y="816.0139">both paths (conflicts_split_complete). Splitting the log by user/system is a</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="242.5598" x="213.7126" y="829.6339">book-keeping convenience, never a soundness gap.</text></g><?plantuml-src lLRDRXit4BxlKqpbGtPXIP6Tsac4n81-LgW0MtOX1oWG1y9gbvPOKUHcISbH0mDk3qKUm9UU2lJGGv5h3xtcJQedwP3SFyjoZLugw20jvnj-C_FDp7wbfcHE86O1vOuZPvJ7GHBC8HJpM732rL2j6864X2hW4qPA9lap-EW0z0HNWm1TLUQ22na78QcaZuVq1m9x3UUw1CRpMJ2nq3R-dYHYmQEEO29vzMeOCwgEZc37ztkjtjusanEy12tGv5bllzVL9YA9I6AEOUThyxbp8oCJmgE