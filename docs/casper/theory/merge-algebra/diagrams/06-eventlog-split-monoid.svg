<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="849px" preserveAspectRatio="none" style="width:813px;height:849px;background:#FFFFFF;" version="1.1" viewBox="0 0 813 849" width="813px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="43"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="781.9048" x="15" y="38.5181">Event-log split soundness (P2): combine(fold user, fold system) = fold all</text></g><!--cluster SPLIT path ? DeployChainIndex::new--><g class="cluster" data-qualified-name="SPLIT path . DeployChainIndex..new" data-source-line="59" id="ent0002"><path d="M94.9524,173.9241 L281.9323,173.9241 A3.75,3.75 0 0 1 284.4323,176.4241 L291.4323,193.5441 L496.9524,193.5441 A2.5,2.5 0 0 1 499.4524,196.0441 L499.4524,540.3841 A2.5,2.5 0 0 1 496.9524,542.8841 L94.9524,542.8841 A2.5,2.5 0 0 1 92.4524,540.3841 L92.4524,176.4241 A2.5,2.5 0 0 1 94.9524,173.9241" fill="#EEFAF1" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="92.4524" x2="291.4323" y1="193.5441" y2="193.5441"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="185.9798" x="96.4524" y="186.6141">SPLIT path &#8212; DeployChainIndex::new</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="28.86" x="285.5224" y="206.2341">&#171;Split&#187;</text></g><!--cluster MONOLITHIC path--><g class="cluster" data-qualified-name="MONOLITHIC path" data-source-line="71" id="ent0012"><path d="M525.9524,171.2041 L619.2923,171.2041 A3.75,3.75 0 0 1 621.7923,173.7041 L628.7923,190.8241 L714.9524,190.8241 A2.5,2.5 0 0 1 717.4524,193.3241 L717.4524,283.3841 A2.5,2.5 0 0 1 714.9524,285.8841 L525.9524,285.8841 A2.5,2.5 0 0 1 523.4524,283.3841 L523.4524,173.70