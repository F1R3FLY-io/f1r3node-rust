[package]
name = "erd-catalog"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "erd-catalog"

[workspace]

[[bin]]
name = "erd-catalog"
path = "generate.rs"

[[bin]]
name = "erd-store-stats"
path = "store_stats.rs"

[[bin]]
name = "erd-leaf-stats"
path = "leaf_stats.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-types = "0.14"
regex = "1"
heed = "=0.22.1"
bincode = "=1.3.3"
blake2 = "0.10"
hex = "0.4"
serde_stacker = "0.1"

[build-dependencies]
prost-build = "0.14"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
tempfile = "3"
