# The consensus-change register — MACHINE INDEX
#
# ⚠ THIS FILE IS READ BY A GATE. `casper/tests/consensus_change_register_gate.rs`
#   parses it with a strict, dependency-free parser that REFUSES every line it does
#   not recognise, so an unrecognised key is a test failure and never a silent skip.
#
# Every field is a PROJECTION of `consensus-change-register.md`, never an independent
# claim: the gate re-derives each one from the prose and fails naming the
# disagreement. The derivation recipe is Appendix C of that document.
#
# GRAMMAR — the whole of it. The parser accepts nothing else:
#   * `#` at the start of a line opens a comment;
#   * a blank line is ignored;
#   * `[[table]]` opens a row of the array-of-tables `table`;
#   * `key = "string"`, `key = 123`, `key = ["a", "b"]` assign to the open row, or
#     to the file header if no row is open;
#   * inline tables, nesting, dotted keys and multi-line values are REFUSED.

schema_version = 1

# The anchor. Moves only by an explicit, reviewed edit — which is what makes 'the
# range' a decision rather than an accident (§7.2).
register_base = "7293d57c"

# The upper bound of the EXACT-PARTITION window. §4.1 claims 57 entry SHAs + 21
# exemptions = 78 over `register_base..partition_head`, and that claim is checkable
# only against a pinned bound. Commits after it are the LIVING FRONTIER (§7.7.3).
partition_head = "dc383ed1"

# §6.4's budget, asserted EXACTLY so `UNVERIFIED` can neither creep up nor be
# quietly retired after its evidence returns. ★ A budget that can only rise is a
# ratchet, not a measurement.
unverified_budget = 1

# The fuse on the living frontier, in COMMIT-DATE days between an unregistered
# consensus-path commit and HEAD. Deterministic on any checkout — both dates are in
# the objects — so the gate is a ratchet with a fuse rather than a tripwire that
# fires on whoever commits next. Every witnessed drift was caught inside one day
# (CBR-027 "under one day"; CBR-L09 46 minutes), so two days is longer than every
# drift observed and cannot be argued too tight.
frontier_grace_days = 2

