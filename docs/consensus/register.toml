surface = "N"
commits = ["3a32cf07"]
status = "LANDED"
direction = "CORRECTIVE"
grade = "WITNESSED"
# The entry SET is unchanged and so is every entry in it. U(m) and the entry set
# determine each other (encode_trie_path is injective on its domain; a trie indexes
# children by byte, so its order is byte-lexicographic by construction), and the value
# sequence beside it is the projection this surface was already emitting. Same reading
# CBR-041 uses for the prost half of the same mandate.
axis_value = "NO"
# MEASURED, not argued. Bincode reaches a verdict only through the RSpace store's
# channel HASHES, which select a bucket rather than an order; spatial matching is
# structural; ScoredTerm::sort_vec reads Ord, which reads the trie KEYS and did not
# move. models/tests/golden/sorter_canonical_forms.txt came back UNMOVED — its last
# change is still 1b576c90 — and that is the direct control, because that same golden
# moved on 2 of 120 entries when CBR-041 touched this relation.
axis_verdict = "NO"
# ★ THE AXIS. An EPathMap serializes on the serde/bincode wire as FORM ②:
# u64-LE |U(m)| ‖ U(m) ‖ u64-LE n ‖ n × Par — the trie's own byte array VERBATIM and
# CONTIGUOUS, ahead of its values. All five bincode goldens moved (+340/+62/+38/+39/+19 B)
# and all five JSON goldens moved; the three cold-store leaf pins moved +46 B each.
axis_bytes_bincode = "MOVES"
# MEASURED BY SHA-256, not by length: all five prost goldens came back BYTE-FOR-BYTE
# UNMOVED and all five prost encoded_len pins are unchanged (335/30/40/36/19). That
# unmoved set is the anti-vacuity control — this touches the serde surface only. The
# tag-8 arm was re-pointed at the shared PathFrames splitter at identical dispositions,
# which is a refactor of where the framing is stated, not a byte change.
axis_bytes_prost = "NO"
# Event hashes are Blake2b256 over bincode preimages and the cold-store leaf bytes enter
# the history trie, so a moved encoding is a moved post-state hash. PRODUCE_INDEX_RS1/RS2
# moved; INDEX_CHANNEL_HASH and CONSUME_DISCOVERY_HASH did NOT — the channel is a GString,
