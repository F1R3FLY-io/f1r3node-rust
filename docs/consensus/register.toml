# the RSpace store's channel HASHES, which select a bucket rather than an order; spatial
# matching is structural; ScoredTerm::sort_vec reads Ord, which reads the trie KEYS —
# `path_stream()`, which this change does not touch. models/tests/golden/
# sorter_canonical_forms.txt came back UNMOVED and its last change is still 1b576c90, the
# same direct control CBR-042 used: that golden moved on 2 of 120 entries when CBR-041
# touched this relation, so it is sensitive to exactly the thing being claimed unmoved.
axis_verdict = "NO"
# ★ THE AXIS. The serde/bincode surface emits `U` of the entries IT WRITES
# (EntryTrie::bincode_trie) rather than of the entries the map stores. EXACTLY 2 of 10 serde
# goldens moved — locally_free.bincode.bin (356 -> 352 B) and locally_free.json
# (2155 -> 2117 B) — and they are the only fixture carrying `locally_free`. The other eight
# (e6a_index, ezipper, nested, remainder_connective x bincode/json) came back UNMOVED by
# SHA-256, which confines the blast radius to lf-bearing maps. The -4 B is DERIVED: the
# removed field is the entry Par's locally_free, prost tag 9 wiretype 2, on the wire as
# `4a 02 00 01`, inside the escape-arm key payload; |U(m)| falls 31 -> 27.
axis_bytes_bincode = "MOVES"
# MEASURED BY SHA-256, not by length: all five prost goldens byte-for-byte UNMOVED and all
# five prost encoded_len pins unchanged (335/30/40/36/19). Structural, not incidental —
# EPathMap::encode_raw still reads path_stream(), the STORED key stream, because prost
# retains locally_free and therefore writes the entries as stored. The two streams are
# separate accessors on purpose; neither surface can pick up the other's by reflex.
axis_bytes_prost = "NO"
# Event hashes are Blake2b256 over bincode preimages, so a moved encoding is a moved
# post-state hash for any datum carrying an lf-bearing EPathMap. MEASURED DIRECTLY: the
# produce hash of a map with one lf-tagged entry moves e48b249c... -> 7259192343..., landing
