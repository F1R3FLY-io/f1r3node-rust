# ⚠ The four PINNED hashes did NOT move (PRODUCE_INDEX_RS1/RS2, INDEX_CHANNEL_HASH,
# CONSUME_DISCOVERY_HASH) — the e6a fixture carries no ENTRY-level locally_free, so it could
# not exercise the path. That is stated rather than read as evidence of neutrality: it is
# why the end-to-end leg in epathmap_canonical_fixtures.rs was widened to tag an ENTRY.
axis_post_state_hash = "MOVES"
# The READER is not modified. `from_path_stream_and_values` is unchanged, decode_trie_path is
# still never called on this surface, and a stream whose keys disagree with its values is
# still RE-FILED rather than rejected — so no byte string that decoded before stops decoding,
# and the accepted language is neither narrowed nor widened. Re-measured green at depths
# 4/34/64/4096 with the escape arm's refusal at 34 and 64 re-measured in the same file.
axis_acceptance = "NO"
# Metering reads prost Message::encoded_len (rholang accounting/costs.rs:67,98,99,298). Protobuf
# is on the unmoved axis above and all five encoded_len pins are unchanged. No cost in the
# tree is computed from a bincode length.
axis_metering = "NO"

