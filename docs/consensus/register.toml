axis_post_state_hash = "MOVES"
# ★ NO CEILING IS INTRODUCED, and that is the whole design. A U(m)-ONLY encoding would
# make decode_trie_path the reader, whose escape arm re-decodes a ¬eval_stable entry
# through prost's recursion-limited decoder; rholang/tests/pathmap_escape_depth_reachability.rs
# measures that ceiling at 32 while ordinary Rholang compiles such an entry at 40. FORM ②
# never calls decode_trie_path: frames are split by pure byte slicing and the entries come
# from the value sequence through the existing depth-UNLIMITED machinery. Measured green at
# depths 4/34/64/4096 (models/tests/epathmap_bincode_is_the_path_stream.rs), with the
# refusal at 34 and 64 re-measured in the same file so the ladder is known to span a real
# cliff. A stream whose keys disagree with its values is RE-FILED, never rejected —
# adopt_trie's policy and tag-8's — and the two dispositions are provably the same trie,
# so no term that round-tripped before stops.
axis_acceptance = "NO"
# Metering reads prost Message::encoded_len (rholang accounting/costs.rs:67,98,99,298),
