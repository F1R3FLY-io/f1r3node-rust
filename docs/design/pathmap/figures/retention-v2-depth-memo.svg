<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:747px;height:506px;background:#FAFAFA;" width="747px" height="506px" viewBox="0 0 747 506" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="747" height="506" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="18"><text x="178.301" y="22.995" fill="#000" font-size="14" textLength="384.132" font-weight="700" font-family="'DejaVu Sans'">Why the count memo is keyed by (digest, width)</text><text x="84.56" y="39.292" fill="#000" font-size="14" textLength="571.614" font-weight="700" font-family="'DejaVu Sans'">one leaf object reached at two widths: it fits at one and not at the other</text></g><g class="entity" data-qualified-name="root" id="ent0001" data-source-line="20"><rect x="282" y="60.594" width="186.016" height="60.891" fill="#BBDEFB" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="328.985" y="75.589" fill="#000" font-size="14" textLength="92.046" font-family="'DejaVu Sans'">root (node 1)</text><line x1="283" y1="80.891" x2="467.016" y2="80.891" style="stroke:#455A64;stroke-width:0.5;"/><text x="288" y="97.886" fill="#000" font-size="14" textLength="174.016" font-family="'DejaVu Sans'">inner node, empty prefix</text><text x="288" y="114.183" fill="#000" font-size="14" textLength="140.841" font-family="'DejaVu Sans'">reached at width 48</text></g><g class="entity" data-qualified-name="inner" id="ent0002" data-source-line="24"><rect x="7" y="237.574" width="186.016" height="60.891" fill="#BBDEFB" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="75.86" y="252.569" fill="#000" font-size="14" textLength="48.296" font-family="'DejaVu Sans'">node 3</text><line x1="8" y1="257.871" x2="192.016" y2="257.871" style="stroke:#455A64;stroke-width:0.5;"/><text x="13" y="274.866" fill="#000" font-size="14" textLength="174.016" font-family="'DejaVu Sans'">inner node, empty prefix</text><text x="13" y="291.163" fill="#000" font-size="14" textLength="140.841" font-family="'DejaVu Sans'">reached at width 47</text></g><g class="entity" data-qualified-name="shared" id="ent0003" data-source-line="28"><rect x="340.41" y="414.544" width="191.19" height="77.188" fill="#C8E6C9" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="411.857" y="429.539" fill="#000" font-size="14" textLength="48.296" font-family="'DejaVu Sans'">node 2</text><line x1="341.41" y1="434.841" x2="530.6" y2="434.841" style="stroke:#455A64;stroke-width:0.5;"/><text x="346.41" y="451.836" fill="#000" font-size="14" textLength="133.861" font-family="'DejaVu Sans'">leaf, 47-byte prefix</text><text x="346.41" y="468.133" fill="#000" font-size="14" textLength="179.19" font-family="'DejaVu Sans'">at width 47: fits, counts 1</text><text x="346.41" y="484.429" fill="#000" font-size="14" textLength="168.034" font-family="'DejaVu Sans'">at width 46: does not fit</text></g><g class="entity" data-qualified-name="last" id="ent0004" data-source-line="33"><rect x="8.2" y="422.694" width="183.609" height="60.891" fill="#C8E6C9" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="75.857" y="437.689" fill="#000" font-size="14" textLength="48.296" font-family="'DejaVu Sans'">node 4</text><line x1="9.2" y1="442.991" x2="190.809" y2="442.991" style="stroke:#455A64;stroke-width:0.5;"/><text x="14.2" y="459.986" fill="#000" font-size="14" textLength="133.861" font-family="'DejaVu Sans'">leaf, 46-byte prefix</text><text x="14.2" y="476.283" fill="#000" font-size="14" textLength="171.609" font-family="'DejaVu Sans'">reached at width 46: fits</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="44"><path d="M227.75,198.484 L227.75,264.014 L193.23,268.014 L227.75,272.014 L227.75,337.546 A0,0 0 0 0 227.75,337.546 L580.256,337.546 A0,0 0 0 0 580.256,337.546 L580.256,208.484 L570.256,198.484 L227.75,198.484 A0,0 0 0 0 227.75,198.484" style="stroke:#455A64;stroke-width:0.5;" fill="#FFF3E0"/><path d="M570.256,198.484 L570.256,208.484 L580.256,208.484 L570.256,198.484" style="stroke:#455A64;stroke-width:0.5;" fill="#FFF3E0"/><text x="233.75" y="215.551" fill="#000" font-size="13" textLength="133.199" font-weight="700" font-family="'DejaVu Sans'">Digest-only memo</text><text x="371.082" y="215.551" fill="#000" font-size="13" textLength="184.057" font-family="'DejaVu Sans'">(the mutant of theorem 19):</text><text x="233.75" y="230.683" fill="#000" font-size="13" textLength="308.369" font-family="'DejaVu Sans'">node 2 was counted 1 at width 47, so its digest</text><text x="233.75" y="245.816" fill="#000" font-size="13" textLength="325.774" font-family="'DejaVu Sans'">hits the memo at width 46 and the shape is never</text><text x="233.75" y="260.949" fill="#000" font-size="13" textLength="312.647" font-family="'DejaVu Sans'">checked again. Total 1 + (1 + 1) = 3: accepted.</text><line x1="228.75" y1="264.015" x2="579.256" y2="264.015" style="stroke:#455A64;stroke-width:1;"/><text x="233.75" y="280.082" fill="#000" font-size="13" textLength="157.79" font-weight="700" font-family="'DejaVu Sans'">(digest, width) memo</text><text x="395.672" y="280.082" fill="#000" font-size="13" textLength="167.127" font-family="'DejaVu Sans'">(the reader, theorem 18):</text><text x="233.75" y="295.215" fill="#000" font-size="13" textLength="331.506" font-family="'DejaVu Sans'">(node 2, 46) is a new key, so the shape check runs</text><text x="233.75" y="310.348" fill="#000" font-size="13" textLength="328.917" font-family="'DejaVu Sans'">and refuses EndpointDepth with remaining 46 and</text><text x="233.75" y="325.48" fill="#000" font-size="13" textLength="206.496" font-family="'DejaVu Sans'">prefix 47. Node 4 is never read.</text></g><!--link root to shared--><g class="link" data-entity-1="ent0001" data-entit