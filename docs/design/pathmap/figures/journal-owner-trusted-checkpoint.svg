<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1888px;height:768px;background:#FAFAFA;" width="1888px" height="768px" viewBox="0 0 1888 768" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1888" height="768" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="22"><text x="720.471" y="22.995" fill="#000" font-size="14" textLength="440.925" font-weight="700" font-family="'DejaVu Sans'">The journal owner's checkpoint over trusted successors</text><text x="602.506" y="39.292" fill="#000" font-size="14" textLength="676.854" font-weight="700" font-family="'DejaVu Sans'">the owner keeps only a DurableAuthorityCoreV1, and only recovery runs a cold check</text></g><rect x="640.68" y="179.294" width="54.092" height="40" fill="#C8E6C9" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="645.68" y="204.14" fill="#000" font-size="14" textLength="44.092" font-family="'DejaVu Sans'">Ready</text><rect x="656.29" y="337.494" width="74.859" height="40" fill="#BBDEFB" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="661.29" y="362.34" fill="#000" font-size="14" textLength="64.859" font-family="'DejaVu Sans'">Captured</text><rect x="624.33" y="518.394" width="138.789" height="40" fill="#FFE0B2" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="629.33" y="543.24" fill="#000" font-size="14" textLength="128.789" font-family="'DejaVu Sans'">RecoveryRequired</text><rect x="892.72" y="704.294" width="96.017" height="40" fill="#E1BEE7" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="897.72" y="729.14" fill="#000" font-size="14" textLength="86.017" font-family="'DejaVu Sans'">AwaitingAck</text><rect x="328.67" y="179.294" width="88.101" height="40" fill="#FFCDD2" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="333.67" y="204.14" fill="#000" font-size="14" textLength="78.101" font-family="'DejaVu Sans'">Invalidated</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="30"><ellipse cx="667.72" cy="69.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="45"><path d="M1015.9,487.994 L1015.9,534.394 L763.57,538.394 L1015.9,542.394 L1015.9,588.791 A0,0 0 0 0 1015.9,588.791 L1331.552,588.791 A0,0 0 0 0 1331.552,588.791 L1331.552,497.994 L1321.552,487.994 L1015.9,487.994 A0,0 0 0 0 1015.9,487.994" style="stroke:#455A64;stroke-width:0.5;" fill="#ECEFF1"/><path d="M1321.552,487.994 L1321.552,497.994 L1331.552,497.994 L1321.552,487.994" style="stroke:#455A64;stroke-width:0.5;" fill="#ECEFF1"/><text x="1021.9" y="505.061" fill="#000" font-size="13" textLength="106.412" font-weight="700" font-family="'DejaVu Sans'">Exact terminal</text><text x="1021.9" y="520.193" fill="#000" font-size="13" textLength="278.668" font-family="'DejaVu Sans'">The trusted publication retains its terminal</text><text x="1021.9" y="535.326" fill="#000" font-size="13" textLength="294.652" font-family="'DejaVu Sans'">before the swap. A successor at another slot,</text><text x="1021.9" y="550.459" fill="#000" font-size="13" textLength="244.004" font-family="'DejaVu Sans'">or a recovered slot that is neither the</text><text x="1021.9" y="565.592" fill="#000" font-size="13" textLength="266.665" font-family="'DejaVu Sans'">predecessor nor that terminal, is refused</text><text x="1021.9" y="580.725" fill="#000" font-size="13" textLength="240.437" font-family="'DejaVu Sans'">UnexpectedTerminal and stays here.</text></g><g class="entity" data-qualified-name="GMN28" id="ent0029" data-source-line="54"><path d="M6,171.594 L6,226.992 A0,0 0 0 0 6,226.992 L293.449,226.992 A0,0 0 0 0 293.449,226.992 L293.449,203.294 L328.38,199.294 L293.449,195.294 L293.449,181.594 L283.449,171.594 L6,171.594 A0,0 0 0 0 6,171.594" style="stroke:#455A64;stroke-width:0.5;" fill="#ECEFF1"/><path d="M283.449,171.594 L283.449,181.594 L293.449,181.594 L283.449,171.594" style="stroke:#455A64;stroke-width:0.5;" fill="#ECEFF1"/><text x="12" y="188.661" fill="#000" font-size="13" textLength="137.268" font-weight="700" font-family="'DejaVu Sans'">Refusal, not repair</text><text x="12" y="203.793" fill="#000" font-size="13" textLength="266.449" font-family="'DejaVu Sans'">A checkpoint here is refused by the base</text><text x="12" y="218.926" fill="#000" font-size="13" textLength="249.653" font-family="'DejaVu Sans'">validation before it captures anything.</text></g><!--link *start* to Ready--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="30" data-link-type="dependency"><path d="M667.72,79.784 C667.72,100.484 667.72,146.154 667.72,174.074" style="stroke:#181818;stroke-width:1.4;" fill="none" id="*start*-to-Ready"/><polygon points="667.72,179.074,671.72,170.074,667.72,174.074,663.72,170.074,667.72,179.074" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="668.72" y="122.661" fill="#000" font-size="13" textLength="288.996" font-family="'DejaVu Sans'">from_view: the hot journal names the view's</text><text x="681.555" y="137.793" fill="#000" font-size="13" textLength="263.326" font-family="'DejaVu Sans'">authority; keep only the core (into_core)</text></g><!--link Ready to Captured--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="31" data-link-type="dependency"><path d="M695.22,201.894 C785.17,207.404 1066.4,226.924 1092.72,256.994 C1106.48,272.714 1106.5,288.294 1092.72,303.994 C1069.06,330.984 831.271,348.166 736.411,354.016" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Ready-to-Captured"/><polygon points="731.42,354.324,740.649,357.762,736.411,354.016,740.157,349.777,731.42,354.324" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1104.05" y="277.561" fill="#000" font-size="13" textLength="332.173" font-family="'DejaVu Sans'">checkpoint: take the operation gate's write permit,</text><text x="1118.818" y="292.693" fill="#000" font-size="13" textLength="302.637" font-family="'DejaVu Sans'">validate the base, capture the pending journal</text></g><!--reverse link Ready to Captured--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="32" data-link-type="dependency"><path d="M635.316,204.162 C552.146,214.192 312.83,244.044 301.72,256.994 C288.13,272.854 287.64,288.564 301.72,303.994 C351.07,358.054 558.21,318.404 629.72,333.994 C638.36,335.874 647.42,338.584 655.93,341.484" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Ready-backto-Captured"/><polygon points="640.28,203.564,630.866,200.67,635.316,204.162,631.824,208.613,640.28,203.564" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.72" y="277.561" fill="#2E7D32" font-size="13" textLength="321.547" font-family="'DejaVu Sans'">empty batch: validate the base, drop the capture</text><text x="308.887" y="292.693" fill="#2E7D32" font-size="13" textLength="309.213" font-weight="700" font-family="'DejaVu Sans'">no limit consulted, no hook, no cold check</text></g><!--reverse link Ready to Captured--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="33" data-link-type="dependency"><path d="M661.463,224.32 C656.663,245.46 652.48,275.384 660.72,303.994 C664.18,315.994 671.28,327.904 678.01,337.334" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Ready-backto-Captured-1"/><polygon points="662.57,219.444,656.676,227.335,661.463,224.32,664.478,229.106,662.57,219.444" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="686.723" y="270.061" fill="#C62828" font-size="13" textLength="372.715" font-family="'DejaVu Sans'">refused before publication begins (mutation, transaction,</text><text x="661.72" y="285.193" fill="#C62828" font-size="13" textLength="422.722" font-family="'DejaVu Sans'">trusted bind or preparation): drop the capture; nothing is written</text><text x="789.229" y="300.326" fill="#C62828" font-size="13" textLength="167.705" font-weight="700" font-family="'DejaVu Sans'">no hook, no cold check</text></g><!--link Captured to Recovery--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk13" data-source-line="34" data-link-type="dependency"><path d="M693.72,377.984 C693.72,412.394 693.72,478.534 693.72,512.934" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Captured-to-Recovery"/><polygon points="693.72,517.934,697.72,508.934,693.72,512.934,689.72,508.934,693.72,517.934" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="694.72" y="431.561" fill="#000" font-size="13" textLength="197.304" font-family="'DejaVu Sans'">prepared under the wal limits;</text><text x="719.193" y="446.693" fill="#000" font-size="13" textLength="148.357" font-family="'DejaVu Sans'">the journal revalidated</text></g><!--link Recovery to Awaiting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-source-line="35" data-link-type="dependency"><path d="M763.58,550.784 C808.3,561.404 864.69,581.484 901.72,618.794 C925.05,642.294 933.814,676.089 937.594,699.219" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Recovery-to-Awaiting"/><polygon points="938.4,704.154,940.896,694.626,937.594,699.219,933.001,695.917,938.4,704.154" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="929.7" y="631.861" fill="#1565C0" font-size="13" textLength="352.079" font-family="'DejaVu Sans'">publish_trusted_incremental_v1 returns the successor</text><text x="1011.534" y="646.993" fill="#1565C0" font-size="13" textLength="188.411" font-family="'DejaVu Sans'">core at the retained terminal</text><text x="962.168" y="662.126" fill="#1565C0" font-size="13" textLength="287.143" font-weight="700" font-family="'DejaVu Sans'">trusted policy; 13 hooks; no cold check</text></g><!--link Recovery to Awaiting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk18" data-source-line="38" data-link-type="dependency"><path d="M685.54,558.484 C675.38,585.504 662.17,635.054 686.72,665.794 C711.98,697.404 821.124,712.439 887.494,718.909" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Recovery-to-Awaiting-1"/><polygon points="892.47,719.394,883.901,714.539,887.494,718.909,883.124,722.502,892.47,719.394" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="687.72" y="631.861" fill="#EF6C00" font-size="13" textLength="205.366" font-family="'DejaVu Sans'">reconcile: cold recovery selects</text><text x="721.083" y="646.993" fill="#EF6C00" font-size="13" textLength="138.639" font-family="'DejaVu Sans'">the retained terminal</text><text x="736.111" y="662.126" fill="#EF6C00" font-size="13" textLength="108.583" font-weight="700" font-family="'DejaVu Sans'">one cold check</text></g><!--link Recovery to Recovery--><g class="link" data-entity-1="ent0003" data-entity-2="ent0003" id="lnk15" data-source-line="36" data-link-type="dependency"><path d="M763.49,519.014 C783.08,519.864 798.12,526.324 798.12,538.394 C798.12,550.474 788.075,556.717 768.485,557.567" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Recovery-to-Recovery"/><polygon points="763.49,557.784,772.655,561.39,768.485,557.567,772.308,553.397,763.49,557.784" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="827.191" y="527.961" fill="#000" font-size="13" textLength="141.978" font-family="'DejaVu Sans'">the publication failed:</text><text x="804.12" y="543.093" fill="#000" font-size="13" textLength="188.119" font-family="'DejaVu Sans'">keep the capture, the permit</text><text x="814.565" y="558.226" fill="#000" font-size="13" textLength="167.229" font-family="'DejaVu Sans'">and the retained terminal</text></g><!--reverse link Ready to Recovery--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk17" data-source-line="37" data-link-type="dependency"><path d="M635.325,204.101 C549.685,214.231 297.09,244.994 283.72,256.994 C242.19,294.294 231.7,335.274 263.72,380.994 C345.75,498.114 525.01,527.854 624.22,535.194" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Ready-backto-Recovery"/><polygon points="640.29,203.514,630.882,200.599,635.325,204.101,631.822,208.543,640.29,203.514" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="291.644" y="347.061" fill="#EF6C00" font-size="13" textLength="319.179" font-family="'DejaVu Sans'">reconcile: cold recovery selects the predecessor;</text><text x="347.522" y="362.193" fill="#EF6C00" font-size="13" textLength="207.422" font-family="'DejaVu Sans'">adopt its core, drop the capture</text><text x="264.72" y="377.326" fill="#EF6C00" font-size="13" textLength="373.026" font-weight="700" font-family="'DejaVu Sans'">recovery, wal and admission limits; one cold check</text></g><!--reverse link Ready to Awaiting--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk20" data-source-line="39" data-link-type="dependency"><path d="M700.09,200.127 C831.97,199.677 1392.69,201.034 1444.72,256.994 C1576.92,399.194 1456.85,565.304 1290.72,665.794 C1240.8,695.994 1073.01,712.994 989.2,719.784" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Ready-backto-Awaiting"/><polygon points="695.09,200.144,704.104,204.113,700.09,200.127,704.076,196.113,695.09,200.144" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1500.43" y="424.061" fill="#6A1B9A" font-size="13" textLength="372.436" font-family="'DejaVu Sans'">acknowledge_successor: pin the successor, acknowledge</text><text x="1535.256" y="439.193" fill="#6A1B9A" font-size="13" textLength="302.783" font-family="'DejaVu Sans'">the journal, adopt the core, release the permit</text><text x="1532.041" y="454.326" fill="#6A1B9A" font-size="13" textLength="309.213" font-weight="700" font-family="'DejaVu Sans'">no limit consulted, no hook, no cold check</text></g><!--link Awaiting to Awaiting--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk21" data-source-line="40" data-link-type="dependency"><path d="M988.91,708.994 C1007.88,708.224 1023.73,713.324 1023.73,724.294 C1023.73,735.264 1012.876,740.567 993.906,739.797" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Awaiting-to-Awaiting"/><polygon points="988.91,739.594,997.74,743.955,993.906,739.797,998.065,735.962,988.91,739.594" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1035.738" y="713.861" fill="#000" font-size="13" textLength="212.177" font-family="'DejaVu Sans'">the pin or the acknowledgement</text><text x="1029.73" y="728.993" fill="#000" font-size="13" textLength="224.193" font-family="'DejaVu Sans'">failed; a retry acknowledges once,</text><text x="1038.867" y="744.126" fill="#000" font-size="13" textLength="205.918" font-family="'DejaVu Sans'">with no hook and no cold check</text></g><!--reverse link Invalidated to Ready--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk23" data-source-line="41" data-link-type="dependency"><path d="M422.21,199.294 C484.18,199.294 589.6,199.294 640.57,199.294" style="stroke:#181818;stroke-width:1.4;" fill="none" id="Invalidated-backto-Ready"/><polygon points="417.21,199.294,426.21,203.294,422.21,199.294,426.21,195.294,417.21,199.294" fill="#181818" style="stroke:#181818;stroke-width:1.4;stroke-linej