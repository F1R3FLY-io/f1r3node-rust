531.768" style="stroke:#455A64;stroke-width:0.5;"/><text x="633.27" y="548.763" fill="#000" font-size="14" textLength="123.607" font-family="'DejaVu Sans'">staged, content 7</text></g><g class="entity" data-qualified-name="fresh" id="ent0006" data-source-line="38"><rect x="639.57" y="717.871" width="110.998" height="44.594" fill="#BBDEFB" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="673.276" y="732.866" fill="#000" font-size="14" textLength="43.586" font-family="'DejaVu Sans'">blob 7</text><line x1="640.57" y1="738.168" x2="749.568" y2="738.168" style="stroke:#455A64;stroke-width:0.5;"/><text x="645.57" y="755.163" fill="#000" font-size="14" textLength="98.998" font-family="'DejaVu Sans'">staged source</text></g><g class="entity" data-qualified-name="inherited" id="ent0007" data-source-line="41"><rect x="17.34" y="717.871" width="163.464" height="44.594" fill="#CFD8DC" style="stroke:#455A64;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="77.279" y="732.866" fill="#000" font-size="14" textLength="43.586" font-family="'DejaVu Sans'">blob 6</text><line x1="18.34" y1="738.168" x2="179.804" y2="738.168" style="stroke:#455A64;stroke-width:0.5;"/><text x="23.34" y="755.163" fill="#000" font-size="14" textLength="151.464" font-family="'DejaVu Sans'">base only, not staged</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="54"><path d="M226,456.671 L226,529.771 L191.41,533.771 L226,537.771 L226,610.866 A0,0 0 0 0 226,610.866 L592.141,610.866 A0,0 0 0 0 592.141,610.866 L592.141,466.671 L582.141,456.671 L226,456.671 A0,0 0 0 0 226,456.671" style="stroke:#455A64;stroke-width:0.5;" fill="#FFF3E0"/><path d="M582.141,456.671 L582.141,466.671 L592.141,466.671 L582.141,456.671" style="stroke:#455A64;stroke-width:0.5;" fill="#FFF3E0"/><text x="232" y="473.738" fill="#000" font-size="13" textLength="87.648" font-weight="700" font-family="'DejaVu Sans'">Staged-first</text><text x="323.781" y="473.738" fill="#000" font-size="13" textLength="214.094" font-family="'DejaVu Sans'">(the old walk): at [1] the leaf 3 is</text><text x="232" y="488.87" fill="#000" font-size="13" textLength="343.764" font-family="'DejaVu Sans'">staged, so the walk descends into it and reaches the</text><text x="232" y="504.003" fill="#000" font-size="13" textLength="345.141" font-family="'DejaVu Sans'">content 6 at [1], which is neither staged nor certified</text><text x="232" y="519.136" fill="#000" font-size="13" textLength="39.057" font-family="'DejaVu Sans'">there:</text><text x="275.189" y="519.136" fill="#C62828" font-size="13" textLength="124.363" font-weight="700" font-family="'DejaVu Sans'">MissingObject(6)</text><text x="399.553" y="519.136" fill="#000" font-size="13" textLength="99.69" font-family="'DejaVu Sans'">, for every fuel.</text><line x1="227" y1="522.202" x2="591.141" y2="522.202" style="stroke:#455A64;stroke-width:1;"/><text x="232" y="538.269" fill="#000" font-size="13" textLength="112.931" font-weight="700" font-family="'DejaVu Sans'">Certificate-first</text><text x="349.063" y="538.269" fill="#000" font-size="13" textLength="204.909" font-family="'DejaVu Sans'">(the correction): at [1] the walk</text><text x="232" y="553.402" fill="#2E7D32" font-size="13" textLength="187.275" font-family="'DejaVu Sans'">stops at the exact certificate</text><text x="419.275" y="553.402" fill="#000" font-size="13" textLength="139.064" font-family="'DejaVu Sans'">; at [2, 3] it descends</text><text x="232" y="568.534" fill="#000" font-size="13" textLength="339.403" font-family="'DejaVu Sans'">into the leaf 3 and stops at the content's certificate.</text><text x="232" y="583.667" fill="#000" font-size="13" textLength="328.904" font-family="'DejaVu Sans'">It accepts with 8 visits and reaches 1, 2, 4, 5, 7, 3:</text><text x="232" y="598.8" fill="#000" font-size="13" textLength="112.309" font-family="'DejaVu Sans'">the delta is valid.</text></g><!--link manifest to root--><g class="link" data-entity-1="ent0001" data-