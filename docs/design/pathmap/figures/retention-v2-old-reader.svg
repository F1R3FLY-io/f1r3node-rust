<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1230px;height:820px;background:#FAFAFA;" width="1230px" height="820px" viewBox="0 0 1230 820" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1230" height="820" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="20"><text x="390.481" y="32.995" fill="#000" font-size="14" textLength="447.159" font-weight="700" font-family="'DejaVu Sans'">Opening a catalog under the shared retention V2 format</text><text x="238.395" y="49.292" fill="#000" font-size="14" textLength="751.331" font-weight="700" font-family="'DejaVu Sans'">selection reads only the envelope, the appointed object decides, and a refusal never falls back</text></g><ellipse cx="607.561" cy="78.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="464.081" y="108.594" width="286.959" height="61.906" fill="#E0E0E0" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="474.081" y="129.732" fill="#000" font-size="12" textLength="148.102" font-family="'DejaVu Sans'">Parse both catalog slots:</text><text x="474.081" y="143.701" fill="#000" font-size="12" textLength="266.959" font-family="'DejaVu Sans'">CRC, domain, version, reserved bytes, flags,</text><text x="474.081" y="157.67" fill="#000" font-size="12" textLength="198.727" font-family="'DejaVu Sans'">commit length and the slot fields</text><rect x="526.914" y="238.902" width="161.293" height="33.969" fill="#FFCDD2" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="536.914" y="260.041" fill="#000" font-size="12" textLength="141.293" font-family="'DejaVu Sans'">Refuse: NoValidCatalog</text><ellipse cx="607.561" cy="312.387" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="607.561" cy="312.387" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="561.71,190.5,653.411,190.5,665.411,202.5,653.411,214.5,561.71,214.5,549.71,202.5,561.71,190.5" fill="#FFE0B2" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="611.561" y="224.71" fill="#000" font-size="11" textLength="13.702" font-family="'DejaVu Sans'">no</text><text x="561.71" y="206.308" fill="#000" font-size="11" textLength="91.701" font-family="'DejaVu Sans'">Is any slot valid?</text><text x="665.411" y="199.906" fill="#000" font-size="11" textLength="19.008" font-family="'DejaVu Sans'">yes</text><path d="M775.171,355.387 L775.171,394.219 L755.171,398.219 L775.171,402.219 L775.171,441.051 A0,0 0 0 0 775.171,441.051 L1180.667,441.051 A0,0 0 0 0 1180.667,441.051 L1180.667,365.387 L1170.667,355.387 L775.171,355.387 A0,0 0 0 0 775.171,355.387" style="stroke:#455A64;stroke-width:0.5;" fill="#FFEBEE"/><path d="M1170.667,355.387 L1170.667,365.387 L1180.667,365.387 L1170.667,355.387" style="stroke:#455A64;stroke-width:0.5;" fill="#FFEBEE"/><text x="781.171" y="372.454" fill="#000" font-size="13" textLength="175.576" font-weight="700" font-family="'DejaVu Sans'">CatalogEnvelopeMutant</text><text x="956.747" y="372.454" fill="#000" font-size="13" textLength="198.104" font-family="'DejaVu Sans'">: a V2 publication changes the</text><text x="781.171" y="387.586" fill="#000" font-size="13" textLength="367.523" font-family="'DejaVu Sans'">envelope; the V1-only reader cannot parse the new slot,</text><text x="781.171" y="402.719" fill="#000" font-size="13" textLength="331.183" font-family="'DejaVu Sans'">selects the older one and adopts its stale V1 state.</text><text x="781.171" y="417.852" fill="#000" font-size="13" textLength="203.512" font-weight="700" font-family="'DejaVu Sans'">SelectionDivergenceMutant</text><text x="984.683" y="417.852" fill="#000" font-size="13" textLength="150.376" font-family="'DejaVu Sans'">: selection consults the</text><text x="781.171" y="432.985" fill="#000" font-size="13" textLength="384.497" font-family="'DejaVu Sans'">appointed format, so the two readers select different slots.</text><rect x="459.95" y="367.266" width="295.221" height="61.906" fill="#E0E0E0" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="469.95" y="388.404" fill="#000" font-size="12" textLength="169.301" font-family="'DejaVu Sans'">Select the newest valid slot.</text><text x="469.95" y="402.373" fill="#000" font-size="12" textLength="260.18" font-family="'DejaVu Sans'">V2 changes no envelope byte, so a V1-only</text><text x="469.95" y="416.342" fill="#000" font-size="12" textLength="275.221" font-family="'DejaVu Sans'">reader and a dual reader select the same slot</text><rect x="450.265" y="461.051" width="314.592" height="33.969" fill="#BBDEFB" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="460.265" y="482.189" fill="#000" font-size="12" textLength="294.592" font-family="'DejaVu Sans'">Read the object the retention reference appoints</text><polygon points="517.267,515.02,697.854,515.02,709.854,527.02,697.854,539.02,517.267,539.02,505.267,527.02,517.267,515.02" fill="#FFE0B2" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="517.267" y="530.828" fill="#000" font-size="11" textLength="180.587" font-family="'DejaVu Sans'">Domain of the appointed object?</text><rect x="16" y="574.629" width="241.033" height="47.938" fill="#FFE0B2" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="595.768" fill="#000" font-size="12" textLength="221.033" font-family="'DejaVu Sans'">Parse the V1 manifest and adopt the</text><text x="26" y="609.736" fill="#000" font-size="12" textLength="175.365" font-family="'DejaVu Sans'">selected state (every reader)</text><polygon points="475.295,574.629,633.93,574.629,645.93,586.629,633.93,598.629,475.295,598.629,463.295,586.629,475.295,574.629" fill="#FFE0B2" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="475.295" y="590.437" fill="#000" font-size="11" textLength="158.635" font-family="'DejaVu Sans'">Does the reader support V2?</text><text x="399.744" y="584.035" fill="#000" font-size="11" textLength="63.551" font-family="'DejaVu Sans'">dual reader</text><text x="645.93" y="584.035" fill="#000" font-size="11" textLength="81.56" font-family="'DejaVu Sans'">V1-only reader</text><rect x="267.033" y="608.629" width="293.34" height="47.938" fill="#C8E6C9" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="277.033" y="629.768" fill="#000" font-size="12" textLength="253.84" font-family="'DejaVu Sans'">Parse the anchor, unfold the radix history,</text><text x="277.033" y="643.736" fill="#000" font-size="12" textLength="273.34" font-family="'DejaVu Sans'">check the count and adopt the selected state</text><path d="M830.672,608.629 L830.672,647.461 L810.672,651.461 L830.672,655.461 L830.672,694.293 A0,0 0 0 0 830.672,694.293 L1209.121,694.293 A0,0 0 0 0 1209.121,694.293 L1209.121,618.629 L1199.121,608.629 L830.672,608.629 A0,0 0 0 0 830.672,608.629" style="stroke:#455A64;stroke-width:0.5;" fill="#FFEBEE"/><path d="M1199.121,608.629 L1199.121,618.629 L1209.121,618.629 L1199.121,608.629" style="stroke:#455A64;stroke-width:0.5;" fill="#FFEBEE"/><text x="836.672" y="625.696" fill="#000" font-size="13" textLength="353.006" font-family="'DejaVu Sans'">Terminal: the reader never falls back to the older slot.</text><text x="836.672" y="640.829" fill="#000" font-size="13" textLength="229.042" font-weight="700" font-family="'DejaVu Sans'">FallbackOnUnsupportedMutant</text><text x="1065.714" y="640.829" fill="#000" font-size="13" textLength="128.407" font-family="'DejaVu Sans'">: it adopts the older</text><text x="836.672" y="655.961" fill="#000" font-size="13" textLength="162.627" font-family="'DejaVu Sans'">slot's stale state instead.</text><text x="836.672" y="671.094" fill="#000" font-size="13" textLength="191.56" font-weight="700" font-family="'DejaVu Sans'">AdoptUnsupportedMutant</text><text x="1028.231" y="671.094" fill="#000" font-size="13" textLength="149.475" font-family="'DejaVu Sans'">: it adopts the V2 state</text><text x="836.672" y="686.227" fill="#000" font-size="13" textLength="188.5" font-family="'DejaVu Sans'">without checking the format.</text><rect x="580.373" y="627.492" width="230.299" height="47.938" fill="#FFCDD2" style="stroke:#455A64;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="590.373" y="648.631" fill="#000" font-size="12" textLength="210.299" font-family="'DejaVu Sans'">Refuse: UnknownObjectDomain, or</text><text x="590.373" y="662.6" fill="#000" font-size="12" textLength="199.313" font-family="'DejaVu Sans'">InvalidDomain(RSpaceDAG.Retn)</text><polygon points="554.613,700.293,566.613,712.293,554.613,724.293,542.613,712.293,554.613,700.293" fill="#FFE0B2" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="607.561,734.293,607.561,734.293,619.561,746.293,607.561,758.293,607.561,758.293,595.561,746.293,607.561,734.293" fill="#FFE0B2" style="stroke:#EF6C00;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="607.561" cy="789.293" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="607.561" cy="789.293" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="607.561" y1="88.594" x2="607.561" y2="108.594" style="stroke:#181818;stroke-width:1.4;"/><polygon points="603.561,98.594,607.561,108.594,611.561,98.594,607.561,102.594" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="607.561" y1="272.871" x2="607.561" y2="301.387" style="stroke:#181818;stroke-width:1.4;"/><polygon points="603.561,291.387,607.561,301.387,611.561,291.387,607.561,295.387" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1=