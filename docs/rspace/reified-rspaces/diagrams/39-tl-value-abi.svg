<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:843px;height:627px;background:#FFFFFF;" width="843px" height="627px" viewBox="0 0 843 627" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="29"><text x="288.859" y="24.966" fill="#000" font-size="14" textLength="258.677" font-weight="700" font-family="'sans-serif'">The tensor value ABI (forms V0 to V3)</text></g><!--entity R3--><g class="entity" data-qualified-name="R3" id="ent0001" data-source-line="31"><rect x="81.64" y="448.238" width="324.19" height="69.032" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="91.64" y="471.066" fill="#000" font-size="12" textLength="57.888" font-weight="700" font-family="'sans-serif'">V3. Keyed</text><text x="91.64" y="487.41" fill="#000" font-size="12" textLength="304.19" font-family="'sans-serif'">an EMap from an atom or a tuple of atoms to V0 or V1</text><text x="91.64" y="503.754" fill="#000" font-size="12" textLength="99.757" font-family="'sans-serif'">{"Alice": [0.1, 0.9]}</text></g><!--entity T3--><g class="entity" data-qualified-name="T3" id="ent0002" data-source-line="36"><rect x="541.47" y="448.238" width="287.926" height="69.032" fill="#B2DFDB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="551.47" y="471.066" fill="#000" font-size="12" textLength="108.481" font-weight="700" font-family="'sans-serif'">Mixed dimensions</text><text x="663.071" y="471.066" fill="#000" font-size="12" textLength="71.365" font-family="'sans-serif'">Sym × Pos(2)</text><text x="551.47" y="487.41" fill="#000" font-size="12" textLength="223.802" font-family="'sans-serif'">E["Alice", 0] is the double nearest to 0.1,</text><text x="551.47" y="503.754" fill="#000" font-size="12" textLength="267.926" font-family="'sans-serif'">as an exact dyadic number (floats enter exactly)</text></g><!--entity R2--><g class="entity" data-qualified-name="R2" id="ent0003" data-source-line="42"><rect x="124.84" y="349.238" width="237.79" height="69.032" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="134.84" y="372.066" fill="#000" font-size="12" textLength="71.052" font-weight="700" font-family="'sans-serif'">V2. Relation</text><text x="134.84" y="388.41" fill="#000" font-size="12" textLength="217.79" font-family="'sans-serif'">an ESet or an EList of ETuples of atoms</text><text x="134.84" y="404.754" fill="#000" font-size="12" textLength="208.382" font-family="'sans-serif'">Set(("Alice", "Bob"), ("Bob", "Charlie"))</text></g><!--entity T2--><g class="entity" data-qualified-name="T2" id="ent0004" data-source-line="47"><rect x="554.64" y="349.238" width="261.574" height="69.032" fill="#B2DFDB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="564.64" y="372.066" fill="#000" font-size="12" textLength="102.313" font-weight="700" font-family="'sans-serif'">A Boolean tensor</text><text x="670.073" y="372.066" fill="#000" font-size="12" textLength="89.161" font-family="'sans-serif'">over Sym × Sym</text><text x="564.64" y="388.41" fill="#000" font-size="12" textLength="241.574" font-family="'sans-serif'">R("Alice", "Bob") = 1, R("Bob", "Charlie") = 1,</text><text x="564.64" y="404.754" fill="#000" font-size="12" textLength="99.829" font-family="'sans-serif'">every other pair 0</text></g><!--entity R1--><g class="entity" data-qualified-name="R1" id="ent0005" data-source-line="53"><rect x="160.64" y="250.238" width="166.185" height="69.032" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="170.64" y="273.066" fill="#000" font-size="12" textLength="58.092" font-weight="700" font-family="'sans-serif'">V1. Dense</text><text x="170.64" y="289.41" fill="#000" font-size="12" textLength="146.185" font-family="'sans-serif'">a rectangular nested EList</text><text x="170.64" y="305.754" fill="#000" font-size="12" textLength="70.152" font-family="'sans-serif'">[[1, 2], [3, 4]]</text></g><!--entity T1--><g class="entity" data-qualified-name="T1" id="ent0006" data-source-line="58"><rect x="567.33" y="258.408" width="236.206" height="52.688" fill="#B2DFDB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="577.33" y="281.236" fill="#000" font-size="12" textLength="131.317" font-weight="700" font-family="'sans-serif'">Positional dimensions</text><text x="711.767" y="281.236" fill="#000" font-size="12" textLength="81.769" font-family="'sans-serif'">Pos(2) × Pos(2)</text><text x="577.33" y="297.58" fill="#000" font-size="12" textLength="115.537" font-family="'sans-serif'">T[0, 1] = 2, T[1, 0] = 3</text></g><!--entity R0--><g class="entity" data-qualified-name="R0" id="ent0007" data-source-line="63"><rect x="131.46" y="151.238" width="224.541" height="69.032" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="141.46" y="174.066" fill="#000" font-size="12" textLength="70.525" font-weight="700" font-family="'sans-serif'">V0. Number</text><text x="141.46" y="190.41" fill="#000" font-size="12" textLength="204.541" font-family="'sans-serif'">a number of any kind of decision 54,</text><text x="141.46" y="206.754" fill="#000" font-size="12" textLength="133.933" font-family="'sans-serif'">for example the GInt 42</text></g><!--entity T0--><g class="entity" data-qualified-name="T0" id="ent0008" data-source-line="68"><rect x="622.11" y="159.408" width="126.645" height="52.688" fill="#B2DFDB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="632.11" y="182.236" fill="#000" font-size="12" textLength="106.645" font-weight="700" font-family="'sans-serif'">A tensor of rank 0</text><text x="632.11" y="198.58" fill="#000" font-size="12" textLength="68.592" font-family="'sans-serif'">the value 42</text></g><g class="entity" data-qualified-name="RULES" id="ent0013" data-source-line="79"><path d="M6,46.068 L6,121.444 L481.467,121.444 L481.467,56.068 L471.467,46.068 L6,46.068" style="stroke:#444;stroke-width:0.5;" fill="#FFF8E1"/><path d="M471.467,46.068 L471.467,56.068 L481.467,56.068 L471.467,46.068" style="stroke:#444;stroke-width:1;" fill="#FFF8E1"/><text x="12" y="63.896" fill="#000" font-size="12" textLength="257.33" font-weight="700" font-family="'sans-serif'">Two rules keep the encoding unambiguous</text><text x="12" y="80.24" fill="#000" font-size="12" textLength="398.355" font-family="'sans-serif'">A tuple is never a dense element: dense elements are numbers or lists.</text><text x="12" y="96.584" fill="#000" font-size="12" textLength="454.467" font-family="'sans-serif'">A name in tensors must be a TL identifier and must not shadow a reserved name</text><text x="12" y="112.928" fill="#000" font-size="12" textLength="96.205" font-family="'sans-serif'">(ReservedName).</text></g><!--link R0 to T0--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk9" data-source-line="73" data-link-type="dependency"><path d="M356.26,185.748 C440.34,185.748 547.62,185.748 616.65,185.748" style="stroke:#1565C0;stroke-width:1.3;" fill="none" id="R0-to-T0" codeLine="73"/><polygon points="621.65,185.748,612.65,181.748,616.65,185.748,612.65,189.748,621.65,185.748" fill="#1565C0" style="stroke:#1565C0;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R1 to T1--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk10" data-source-line="74" data-link-type="dependency"><path d="M327.18,284.748 C394.82,284.748 486.41,284.748 562.11,284.748" style="stroke:#1565C0;stroke-width:1.3;" fill="none" id="R1-to-T1" codeLine="74"/><polygon points="567.11,284.748,558.11,280.748,562.11,284.748,558.11,288.748,567.11,284.748" fill="#1565C0" style="stroke:#1565C0;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R2 to T2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-source-line="75" data-link-type="dependency"><path d="M362.85,383.748 C421.99,383.748 488.74,383.748 549.44,383.748" style="stroke:#1565C0;stroke-width:1.3;" fill="none" id="R2-to-T2" codeLine="75"/><polygon points="554.44,383.748,545.44,379.748,549.44,383.748,545.44,387.748,554.44,383.748" fill="#1565C0" style="stroke:#1565C0;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R3 to T3--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="76" data-link-type="dependency"><path d="M406.28,482.748 C450.49,482.748 493.11,482.748 536.22,482.748" style="stroke:#1565C0;stroke-width:1.3;" fill="none" id="R3-to-T3" codeLine="76"/><polygon points="541.22,482.748,532.22,478.748,536.22,482.748,532.22,486.748,541.22,482.748" fill="#1565C0" style="stroke:#1565C0;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="85"><rect x="235.476" y="537.27" width="365.445" height="71.204" fill="#ECEFF1" style="stroke:#444;stroke-width:1;" rx="7.5" ry="7.5"/><text x="240.476" y="557.236" fill="#000" font-size="14" textLength="103.166" font-weight="700" font-family="'sans-serif'">Concept colors</text><rect x="240.476" y="563.338" width="10.92" height="19.068" fill="#BBDEFB" style="stroke:none;"/><text x="240.476" y="578.304" fill="#000" font-size="14" textLength="10.92" font-family="'sans-serif'">   </text><text x="255.036" y="578.304" fill="#000" font-size="14" textLength="337.245" font-family="'sans-serif'">a Rholang value, as it travels in a param or a datum</text><rect x="240.476" y="582.406" width="10.92" height="19.068" fill="#B2DFDB" style="stroke:none;"/><text x="240.476" y="597.372" fill="#000" font-size="14" font-family="'sans-serif'"> </text><text x="255.036" y="597.372" fill="#000" font-size="14" textLength="249.563" font-family="'sans-serif'">the tensor that the TL engine decodes</text><line x1="240.476" y1="563.338" x2="595.92" y2="563.338" style