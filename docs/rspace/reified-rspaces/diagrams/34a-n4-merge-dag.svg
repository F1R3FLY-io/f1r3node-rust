<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:625px;height:991px;background:#FFFFFF;" width="625px" height="991px" viewBox="0 0 625 991" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="30"><text x="136.442" y="24.966" fill="#000" font-size="14" textLength="345.687" font-weight="700" font-family="'sans-serif'">The blocks of the N4 merge with an empty sibling</text></g><!--entity T--><g class="entity" data-qualified-name="T" id="ent0001" data-source-line="32"><rect x="42.69" y="47.068" width="200.433" height="85.376" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="52.69" y="69.896" fill="#000" font-size="12" font-weight="700" font-family="'sans-serif'">T</text><text x="59.614" y="69.896" fill="#000" font-size="12" textLength="45.144" font-family="'sans-serif'">: node 0</text><text x="52.69" y="86.24" fill="#000" font-size="12" textLength="180.433" font-family="'sans-serif'">payer 0 touches its queue space</text><text x="52.69" y="102.584" fill="#000" font-size="12" textLength="144.133" font-family="'sans-serif'">delivers the config, a take</text><text x="52.69" y="118.928" fill="#000" font-size="12" textLength="99.265" font-family="'sans-serif'">and a fired waiter</text></g><!--entity M--><g class="entity" data-qualified-name="M" id="ent0002" data-source-line="33"><rect x="60.8" y="229.958" width="164.205" height="69.032" fill="#E8EAF6" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="70.8" y="252.786" fill="#000" font-size="12" font-weight="700" font-family="'sans-serif'">M</text><text x="82.116" y="252.786" fill="#000" font-size="12" textLength="132.889" font-family="'sans-serif'">: merge block of node 2</text><text x="70.8" y="269.13" fill="#000" font-size="12" textLength="75.157" font-family="'sans-serif'">parents [E, B]</text><text x="70.8" y="285.474" fill="#000" font-size="12" textLength="104.749" font-family="'sans-serif'">no rejected deploy</text></g><!--entity E--><g class="entity" data-qualified-name="E" id="ent0003" data-source-line="34"><rect x="19.85" y="479.198" width="106.113" height="52.688" fill="#ECEFF1" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="29.85" y="502.026" fill="#000" font-size="12" font-weight="700" font-family="'sans-serif'">E</text><text x="36.57" y="502.026" fill="#000" font-size="12" textLength="45.144" font-family="'sans-serif'">: node 1</text><text x="29.85" y="518.37" fill="#000" font-size="12" textLength="86.113" font-family="'sans-serif'">an empty block</text></g><!--entity B--><g class="entity" data-qualified-name="B" id="ent0004" data-source-line="35"><rect x="145.18" y="396.508" width="171.453" height="52.688" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="155.18" y="419.336" fill="#000" font-size="12" font-weight="700" font-family="'sans-serif'">B</text><text x="163.16" y="419.336" fill="#000" font-size="12" textLength="45.144" font-family="'sans-serif'">: node 0</text><text x="155.18" y="435.68" fill="#000" font-size="12" textLength="151.453" font-family="'sans-serif'">payer 1 creates a set space</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0005" data-source-line="36"><rect x="139.73" y="573.228" width="190.353" height="69.032" fill="#BBDEFB" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="149.73" y="596.056" fill="#000" font-size="12" font-weight="700" font-family="'sans-serif'">A</text><text x="158.034" y="596.056" fill="#000" font-size="12" textLength="45.144" font-family="'sans-serif'">: node 0</text><text x="149.73" y="612.4" fill="#000" font-size="12" textLength="170.353" font-family="'sans-serif'">payer 0 creates a queue space</text><text x="149.73" y="628.744" fill="#000" font-size="12" textLength="143.161" font-family="'sans-serif'">with records and a waiter</text></g><!--entity G--><g class="entity" data-qualified-name="G" id="ent0006" data-source-line="37"><rect x="7" y="731.608" width="175.809" height="69.032" fill="#E8EAF6" style="stroke:#444;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="754.436" fill="#000" font-size="12" textLength="45.348" font-weight="700" font-family="'sans-serif'">genesis</text><text x="17" y="770.78" fill="#000" font-size="12" textLength="155.809" font-family="'sans-serif'">offered v6, three validators,</text><text x="17" y="787.124" fill="#000" font-size="12" textLength="106.189" font-family="'sans-serif'">two labeled payers</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="47"><path d="M259.87,210.448 L259.87,260.478 L225.06,264.478 L259.87,268.478 L259.87,318.513 A0,0 0 0 0 259.87,318.513 L517.932,318.513 A0,0 0 0 0 517.932,318.513 L517.932,220.448 L507.932,210.448 L259.87,210.448 A0,0 0 0 0 259.87,210.448" style="stroke:#444;stroke-width:0.5;" fill="#FFF8E1"/><path d="M507.932,210.448 L507.932,220.448 L517.932,220.448 L507.932,210.448" style="stroke:#444;stroke-width:0.5;" fill="#FFF8E1"/><text x="265.87" y="228.276" fill="#000" font-size="12" textLength="237.062" font-family="'sans-serif'">The chains of the main parent never enter</text><text x="265.87" y="244.62" fill="#000" font-size="12" textLength="223.454" font-family="'sans-serif'">a merge. With E as the main parent, the</text><text x="265.87" y="260.964" fill="#000" font-size="12" textLength="224.498" font-family="'sans-serif'">merge applies the deploys of A and B to</text><text x="265.87" y="277.308" fill="#000" font-size="12" textLength="219.77" font-family="'sans-serif'">the post-state of E, so the merge of the</text><text x="265.87" y="293.652" fill="#000" font-size="12" textLength="227.702" font-family="'sans-serif'">space branch is not vacuous. Every node</text><text x="265.87" y="309.997" fill="#000" font-size="12" textLength="133.909" font-family="'sans-serif'">validates M, and then T.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="56"><path d="M365.23,561.888 L365.23,603.748 L330.27,607.748 L365.23,611.748 L365.23,653.608 A0,0 0 0 0 365.23,653.608 L610.572,653.608 A0,0 0 0 0 610.572,653.608 L610.572,571.888 L600.572,561.888 L365.23,561.888 A0,0 0 0 0 365.23,561.888" style="stroke:#444;stroke-width:0.5;" fill="#FFF8E1"/><path d="M600.572,561.888 L600.572,571.888 L610.572,571.888 L600.572,561.888" style="stroke:#444;stroke-width:0.5;" fill="#FFF8E1"/><text x="371.23" y="579.716" fill="#000" font-size="12" textLength="198.841" font-family="'sans-serif'">Leader rule: node 0 proposes every</text><text x="371.23" y="596.06" fill="#000" font-size="12" textLength="206.173" font-family="'sans-serif'">space block. Each space block has its</text><text x="371.23" y="612.404" fill="#000" font-size="12" textLength="224.342" font-family="'sans-serif'">own payer, because a merge rejects the</text><text x="371.23" y="628.748" fill="#000" font-size="12" textLength="191.473" font-family="'sans-serif'">second of two sequential offers of</text><text x="371.23" y="645.092" fill="#000" font-size="12" textLength="140.713" font-family="'sans-serif'">one payer in one branch.</text></g><!--link T to M--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="39" data-link-type="dependency"><path d="M142.9,132.568 C142.9,162.318 142.9,196.788 142.9,224.578" style="stroke:#444;stroke-width:1;" fill="none" id="T-to-M"/><polygon points="142.9,229.578,146.9,220.578,142.9,224.578,138.9,220.578,142.9,229.578" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="143.9" y="176.276" fill="#000" font-size="12" textLength="37.584" font-family="'sans-serif'">parent</text></g><!--link M to E--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="40" dat