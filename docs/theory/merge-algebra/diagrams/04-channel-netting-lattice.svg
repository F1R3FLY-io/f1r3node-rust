yle="stroke:#000000;stroke-width:1;" width="177.8699" x="27.07" y="362.2241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.8699" x="37.07" y="382.9141">(a&#183;b)&#183;c = cancel(max(1,0),max(0,1))</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="56.7761" x="37.07" y="400.81">&#8709; = (0,0)</text></g><!--entity MR--><g class="entity" data-qualified-name="SHIPPED max-union combine . NON-associative ..MR" data-source-line="67" id="ent0006"><rect fill="#EF9A9A" height="52.6879" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="177.8699" x="122.07" y="509.9941"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.8699" x="132.07" y="530.6841">a&#183;(b&#183;c) = cancel(max(1,0),max(0,0))</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="63.9097" x="132.07" y="548.58">{x} = (1,0)</text></g><!--entity SAB--><g class="entity" data-qualified-name="SUM-union FIX . commutative monoid ..SAB" data-source-line="74" id="ent0011"><rect fill="#C8E6C9" height="52.6879" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="96.6589" x="459.67" y="230.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="76.6589" x="469.67" y="251.1341">a&#8853;b = (1+1, 0+0)</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="29.4979" x="469.67" y="269.03">(2,0)</text></g><!--entity SBC--><g class="entity" data-qualified-name="SUM-union FIX . commutative monoid ..SBC" data-source-line="75" id="ent0012"><rect fill="#C8E6C9" height="52.6879" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="95.8489" x="591.08" y="230.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacin