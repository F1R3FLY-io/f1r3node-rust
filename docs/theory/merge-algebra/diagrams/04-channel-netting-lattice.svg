><path d="M370.85,137.7641 C359.35,196.5741 337.9899,305.8171 327.9999,356.8871" fill="none" id="IN-to-MBC" style="stroke:#EF6C00;stroke-width:2;"/><polygon fill="#EF6C00" points="327.04,361.7941,332.6934,353.7294,327.9999,356.8871,324.8422,352.1936,327.04,361.7941" style="stroke:#EF6C00;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link IN to SAB--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="83" id="lnk18"><path d="M408.81,137.8441 C432.68,166.2341 461.953,201.0265 483.133,226.2265" fill="none" id="IN-to-SAB" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="486.35,230.0541,483.6214,220.5908,483.133,226.2265,477.4972,225.738,486.35,230.0541" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link IN to SBC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0012" data-link-type="dependency" data-source-line="84" id="lnk19"><path d="M443.5,117.1041 C483.72,129.0141 534.85,148.1741 574,176.4441 C594.07,190.9441 608.6818,208.954 620.4318,226.174" fill="none" id="IN-to-SBC" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="623.25,230.3041,621.4814,220.6153,620.4318,226.174,614.8732,225.1244,623.25,230.3041" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="86"><rect fill="none" height="118.9599" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="426.2196" x="144.8902" y="592.6841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="416.2196" x="149.8902" y="608.3741">Max-union combine is COMMUTATIVE (combine_max_comm) but NON-ASSOCIATIVE: the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="359.5505" x="149.8902" y="621.9941">(a&#183;b)&#183;c and a&#183;(b&#183;c) endpoints DIFFER (&#8709; vs {x}), so commutativity alone cannot</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="366.2896" x="149.8902" y="635.6141">rescue a multi-branch fold &#8212; associativity is required for order-independence.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="369.3096" x="149.8902" y="649.2341">Finding A is DISCLOSED (exhibited as combine_not_assoc_exhibit), NOT fixed: a</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="414.6884" x="149.8902" y="662.854">max&#8594;sum union change would alter merge SEMANTICS. It is benign here ONLY because</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="372.8296" x="149.8902" y="676.474">the Finding-B total order pins ONE canonical fold order. The sum-union monoid</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="348.6996" x="149.8902" y="690.094">(shown for contrast) makes both associations CONVERGE to (2,1) and folds</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="358.7598" x="149.8902" y="703.714">permutation-invariantly (netting_fold_perm; Z3 channel_netting_monoid.py).</text></g><?plantuml-src bLRDRjj64BxpAQRoeIGi6PAJEhQR690eAX5WIu6f56tZG5YHQsaHQbSXbxRKm40lBTeU-uDU2hHl4VIQHz6JT6P9IfGijoWF0hKxFz_CDp_yH4_ubCCiOa9QLl9Mo1cBsHG2DPqfoQNszIBY4FD0CpcEU4baTGRlBO2Eahh7q5HbggHAPYpWbVpO5zzmQDIjkv8othzbuqorXU_ZMAKoT5MaugTFdoiLdft1dkTrcft6BeaM8m7OwxGzrskIX8f37fjRs7jidWr_4Hzp6Uu4kKkeWBnzjmK40PZdlbmPpf5vIZ8XlsPffFy3JKcgW6DfeJ7VxeH9oIEGN6iXnx3yzbT07a4gMKFYfgavJTwbBEPWTuGCwN_JiQnFeQT2ZkmIi0pgAHu2aXdYBzWOaDjk7pgmUfx1bCrhgHHA0aiI5GYcwJtHV0PsCX6p6UgYsv6GtDaqvdLEcYVD3MFjxXVUvNElDm3qFLD2wWJivG_VmKq2x-TtZWc60bdvkk76w3ZcN99HzzWxSaysZ2Rfz464b9XhCNSsZJG_QnyrdsmOSVkzRMXW7rOR6QGI722wH6WCtaw4vbdUwDamI9wJ2QDi8ASf1iggCAf2W9fUEFvN6joZm-F3OmUjsEpZXv7pyKC06y6P0ZCw