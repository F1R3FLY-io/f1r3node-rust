<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="716px" preserveAspectRatio="none" style="width:903px;height:716px;background:#FFFFFF;" version="1.1" viewBox="0 0 903 716" width="903px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="43"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="871.8387" x="15" y="38.5181">Conflict-detector removal soundness (GAP-3): removed &#8838; retained &#8746; number-ch</text></g><!--cluster RETAINED detector ? races_for_same_io_event (Check #1)\n  produces_consumed ? (non-mergeable): both branches destroyed\n  the SAME base Produce in COMM on a non-number channel--><g class="cluster" data-qualified-name="RETAINED detector . races_for_same_io_event .Check .1..n  produces_consumed . .non-mergeable.. both branches destroyed.n  the SAME base Produce in COMM on a non-number channel" data-source-line="54" id="ent0001"><path d="M101.9194,61.9641 L436.3192,61.9641 A3.75,3.75 0 0 1 438.8192,64.4641 L445.8192,108.8241 L445.9194,108.8241 A2.5,2.5 0 0 1 448.4194,111.3241 L448.4194,391.7841 A2.5,2.5 0 0 1 445.9194,394.2841 L101.9194,394.2841 A2.5,2.5 0 0 1 99.4194,391.7841 L99.4194,64.4641 A2.5,2.5 0 0 1 101.9194,61.9641" fill="#F3E5F5" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="99.4194" x2="445.8192" y1="108.8241" y2="108.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="286.9197" x="126.6594" y="74.6541">RETAINED detector &#8212; races_for_same_io_event (Check #1)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="328.1999" x="108.6194" y="88.2741">produces_consumed &#8745; (non-mergeable): both branches destroyed</text><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="294.8298" x="125.3044" y="101.8941">the SAME base Produce in COMM on a non-number channel</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="48.4099" x="253.7144" y="121.5141">&#171;Retained&#187;</text></g><!--cluster Number / foldable channels (IntegerAdd, BitmaskOr)--><g class="cluster" data-qualified-name="Number . foldable channels .IntegerAdd. BitmaskOr." data-source-line="60" id="ent0005"><path d="M474.9194,248.2641 L739.4791,248.2641 A3.75,3.75 0 0 1 741.9791,250.7641 L748.9791,267.8841 L797.9194,267.8841 A2.5,2.5 0 0 1 800.4194,270.3841 L800.4194,401.3141 A2.5,2.5 0 0 1 797.9194,403.8141 L474.9194,403.8141 A2.5,2.5 0 0 1 472.4194,401.3141 L472.4194,250.7641 A2.5,2.5 0 0 1 474.9194,248.2641" fill="#EEFAF1" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="472.4194" x2="748.9791" y1="267.8841" y2="267.8841"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="263.5598" x="476.4194" y="260.9541">Number / foldable channels (IntegerAdd, BitmaskOr)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="45.9099" x="617.4644" y="280.5741">&#171;Number&#187;</text></g><!--entity RET--><g class="entity" data-qualified-name="RETAINED detector . races_for_same_io_event .Check .1..n  produces_consumed . .non-mergeable.. both branches destroyed.n  the SAME base Produce in COMM on a non-number channel.RET" data-source-line="55" id="ent0002"><rect fill="#E1BEE7" height="66.3079" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="280.6667" x="152.0894" y="134.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.46" x="162.0894" y="155.6541">retained_conflict(a,b)</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="260.6667" x="162.0894" y="173.55">&#8707; ch. consumes a ch &#8743; consumes b ch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="96.6793" x="185.4893" y="188.342">&#8743; &#172; is_number_ch ch</text></g><!--entity SUB--><g class="entity" data-qualified-name="RETAINED detector . races_for_same_io_event .Check .1..n  produces_consumed . .non-mergeable.. both branches destroyed.n  the SAME base Produce in COMM on a non-number channel.SUB" data-source-line="56" id="ent0003"><rect fill="#FFE082" height="74.4799" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="248.1092" x="180.3694" y="303.8041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="228.1092" x="190.3694" y="324.4941">removed single-value-cell check &#8745; NON-number:</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="201.9198" x="195.5694" y="338.1141">svc_update = consume-then-produce on ch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="211.6857" x="195.5694" y="351.7341">&#10233; base datum consumed in BOTH branches</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="214.6936" x="195.5694" y="365.3541">&#10233; a produces_consumed race  &#8838;  retained &#10003;</text></g><!--entity NUM--><g class="entity" data-qualified-name="Number . foldable channels .IntegerAdd. BitmaskOr..NUM" data-source-line="61" id="ent0006"><rect fill="#C8E6C9" height="93.5479" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="295.4226" x="488.7094" y="294.2641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="111.4899" x="498.7094" y="314.9541">is_number_channel(a,b)</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="275.4226" x="498.7094" y="332.85">&#8707; ch. svc_update a ch &#8743; svc_update b ch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="88.3593" x="522.1093" y="347.642">&#8743; is_number_ch ch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="166.7399" x="498.7094" y="361.262">intrinsically mergeable (they FOLD):</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="187.9498" x="498.7094" y="374.882">neither detector flags them &#8212; CORRECT</text></g><!--entity CONC--><g class="entity" data-qualified-name="CONC" data-source-line="64" id="ent0007"><rect fill="#A5D6A7" height="107.1679" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="295.4226" x="324.7094" y="478.8141"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="87.4999" x="334.7094" y="499.5041">removed_fires(a,b)</text><text fill="#000000" font-family="'monospace'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="275.4226" x="334.7094" y="517.4">&#8707; ch. svc_update a ch &#8743; svc_update b ch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="228.7793" x="334.7094" y="532.192">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="161.3687" x="334.7094" y="545.812">SOUND to drop:  removed_fires  &#8838;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="186.7892" x="342.5093" y="559.432">retained_conflict  &#8746;  is_number_channel</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="199.3798" x="334.7094" y="573.052">(nothing lost &#8212; removed_subset_retained)</text></g><!--link RET to SUB--><!--link SUB to CONC--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" data-source-line="66" id="lnk8"><path d="M336.8094,378.5541 C361.9794,406.9241 393.9309,442.9341 422.1909,474.7841" fill="none" id="SUB-to-CONC" style="stroke:#6A1B9A;stroke-width:2;"/><polygon fill="#6A1B9A" points="425.5094,478.5241,422.5282,469.1373,422.1909,474.7841,416.5441,474.4468,425.5094,478.5241" style="stroke:#6A1B9A;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="59.2599" x="409.1844" y="431.5041">non-number</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="78.6699" x="399.4794" y="445.1241">case (subsumed)</text></g><!--link NUM to CONC--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="67" id="lnk9"><path d="M596.7194,387.8841 C573.0194,415.2441 546.1026,446.3244 521.4126,474.8344" fill="none" id="NUM-to-CONC" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="518.1394,478.6141,527.0549,474.4293,521.4126,474.8344,521.0075,469.1921,518.1394,478.6141" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="37.63" x="578.9844" y="431.5041">number</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="65.12" x="565.2394" y="445.1241">case (exempt)</text></g><g class="legend" data-source-line="69"><rect fill="none" height="105.3399" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="405.5085" x="248.1651" y="598.982"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="379.439" x="253.1651" y="614.6719">The removed predicate fires only inside RETAINED &#8746; NUMBER. On a non-number</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="389.2296" x="253.1651" y="628.2919">single-value cell, updating consumes the base datum in both branches &#8212; the exact</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="395.5085" x="253.1651" y="641.9119">produces_consumed race Check #1 keeps (the gold subset &#8838; the lavender universe).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="373.9396" x="253.1651" y="655.5319">On a number channel both branches are in produces_mergeable, so the "minus</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="392.3298" x="253.1651" y="669.1519">both-mergeable" filter correctly leaves it unflagged. Rocq removed_subset_retained</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="388.7496" x="253.1651" y="682.7719">needs NO hidden hypothesis (the consume conjunct is definitional, via andb_prop);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="359.3196" x="253.1651" y="696.3919">is_number_ch is an abstract parameter, so the result holds for ANY classifier.</text></g><?plantuml-src lLPDRnit4BtlhvXAXqY0vSHnuoHk4a2Irss0MWhySIZgGg1sHnBhNN93SesuHO401OgYr-POeCUYHVz0h_qf_YMT8LUhbIMZG0zT6B347GuVtxnveu_S0dE48XDIHP6zageGHkIGwBpG2fKxSpSPWi742JNFi15Ihy6t4S2nLcuaA5KhrqhRGYJOgfRFv3S8Uu-YxngRwVsLc8Uj0_eyDxfKwL1dshnuSOgEu63wwXMqZ_VZ9yTFjaMDodoAXc80sd5yt3_UuoXjKZG-0jeV-sVjt0pdgDAjOBS5BQ7VVNS73C7qpsPS4yw1VnenASv4cRb_GTE8MiA9d7J4-r2hMIOJrqlHKJ7e38EvlXOPM8Qcq5h