oke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="637.743" x2="637.743" y1="327.994" y2="362.994"/><polygon fill="#444444" points="633.743,352.994,637.743,362.994,641.743,352.994,637.743,356.994" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="595.458" x2="549.8041" y1="470.854" y2="470.854"/><line style="stroke:#444444;stroke-width:1;" x1="549.8041" x2="549.8041" y1="470.854" y2="492.854"/><polygon fill="#444444" points="545.8041,482.854,549.8041,492.854,553.8041,482.854,549.8041,486.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="680.028" x2="725.6819" y1="470.854" y2="470.854"/><line style="stroke:#444444;stroke-width:1;" x1="725.6819" x2="725.6819" y1="470.854" y2="492.854"/><polygon fill="#444444" points="721.6819,482.854,725.6819,492.854,729.6819,482.854,725.6819,486.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="637.743" x2="637.743" y1="423.854" y2="458.854"/><polygon fill="#444444" points="633.743,448.854,637.743,458.854,641.743,448.854,637.743,452.854" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#C62828;stroke-width:1;" x1="249.7304" x2="249.7304" y1="102.4641" y2="152.8241"/><polygon fill="#C62828" points="245.7304,142.8241,249.7304,152.8241,253.7304,142.8241,249.7304,146.8241" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="68.78" x="253.7304" y="123.0841">BEFORE the fix</text><line style="stroke:#2E7D32;stroke-width:1;" x1="637.743" x2="637.743" y1="102.4641" y2="253.5141"/><polygon fill="#2E7D32" points="633.743,243.5141,637.743,253.5141,641.743,243.5141,637.743,247.5141" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="60.86" x="641.743" y="183.3941">AFTER the fix</text><line style="stroke:#444444;stroke-width:1;" x1="468.1012" x2="468.1012" y1="80.9641" y2="100.9641"/><polygon fill="#444444" points="464.1012,90.9641,468.1012,100.9641,472.1012,90.9641,468.1012,94.9641" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="71"><rect fill="none" height="86.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="513.2141" x="218.9217" y="727.4339"/><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="490.0541" x="223.9217" y="747.3998">Wolfram  formal/wolfram/finalized_floor/delta_ratchet.wl &#8212; over the reals,</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="503.2141" x="223.9217" y="766.4677">parameter-free: the buggy &#920;(&#916;&#178;) advance is structurally UNSTABLE (feedback</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="453.0662" x="223.9217" y="785.5356">slope &gt; 1 at every equilibrium) while the fixed O(1) advance has ZERO</text><text fill="#000000" font-family="'monospace'" font-size="14" lengthAdjust="spacing" textLength="432.4723" x="223.9217" y="804.6036">feedback (&#916; stable). The ratchet collapses; over-cap becomes safe.</text></g><?plantuml-src VLNBRkCs5DthAswJnLYOEAzfqZmcBfnO3gOpI08xysZh8g2bAva8HMf8oavI333BTbjaqKtHLNTTTLDqcm_8H-HBUab9USoa5G945idBSyyvzzulx0HpX48mBeF0d79PCCroOB7bKsxFuSS0O9V5fvbMfKpsb50QwcU-xn-tGUa4zOD5l-6PVsX3Lsir-smTvh_q3steSPOhcNnwaxjY8rgvj-6Jc-QZzRMLvUNWmpti2QQi5BQlf3rWbDmS7LIcO37EFRvho2yGLfQ3m78h48ud2DUNRSriF44BDvSVwG_6PPQTm_MlhUlBgx-k_duJGYeKePWnSGejNKesO-SXJ0sa_0mJE6ojX50MxMfzx7B290o29t2W4eJOfo