<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="825px" preserveAspectRatio="none" style="width:953px;height:825px;background:#FFFFFF;" version="1.1" viewBox="0 0 953 825" width="953px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="36"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="921.0574" x="15" y="38.5181">The &#916;-ratchet &#9472;&#9472; buggy &#920;(&#916;&#178;&#183;V) floor walk (runaway) vs fixed O(1) up-walk (bounded)</text></g><ellipse cx="468.1012" cy="70.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1.5;" x1="249.7304" x2="637.743" y1="100.9641" y2="100.9641"/><rect fill="#FFEBEE" height="594.2298" style="stroke:#000000;stroke-width:1;" width="294.0457" x="142.0555" y="119.2041"/><path d="M332.6864,119.2041 L332.6864,125.8241 L322.6864,135.8241 L142.0555,135.8241" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="180.6309" x="145.0555" y="130.8941">BUGGY &#9472;&#9472; &#920;(&#916;&#178;&#183;V) uncached floor walk</text><rect fill="#FFEBEE" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="195.3499" x="152.0555" y="204.8941"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="83.0435" x="162.0555" y="225.5841">propose cost &#8733; &#916;&#178;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="175.3499" x="162.0555" y="239.2041">(uncached ft_witnessed at every step,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="146.0399" x="162.0555" y="252.824">&#920;(&#916;&#183;V) per parent, &#920;(&#916;&#178;&#183;V) total)</text><rect fill="#FFEBEE" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="147.9299" x="175.7655" y="300.754"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="73.43" x="185.7655" y="321.444">finalization lags</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.9299" x="185.7655" y="335.064">(finalize throughput falls as</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="110.5734" x="185.7655" y="348.684">propose cost &#8733; &#916;&#178; rises)</text><rect fill="#FFEBEE" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="177.3698" x="161.0455" y="396.614"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.3698" x="171.0455" y="417.304">&#916; = num(maxParent) &#8722; num(floor)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="36.1" x="171.0455" y="430.924">GROWS</text><polygon fill="#FFF8E1" points="249.7304,152.8241,261.7304,164.8241,249.7304,176.8241,237.7304,164.8241,249.7304,152.8241" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#FFF8E1" points="198.7955,491.854,300.6654,491.854,312.6654,503.854,300.6654,515.854,198.7955,515.854,186.7955,503.854,198.7955,491.854" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="37.1289" x="253.7304" y="526.544">&#916; &#8805; 256</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="101.8699" x="198.7955" y="507.734">&#916; still below cap 256 ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="81.85" x="312.6654" y="487.304">positive feedback</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.4358" x="312.6654" y="500.924">slope &gt; 1 &#10233; &#916; runs away</text><rect fill="#FFCDD2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="120.9299" x="189.2655" y="550.854"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="100.9299" x="199.2655" y="571.544">&#916; crosses the cap 256</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="64.05" x="199.2655" y="585.164">(the cliff fires)</text><rect fill="#EF9A9A" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="182.1398" x="158.6605" y="626.9539"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="151.2509" x="168.6605" y="647.6439">SILENT single-parent fallback &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="162.1398" x="168.6605" y="661.2639">return highest parent's post_state,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="125.4899" x="168.6605" y="674.8839">co-parent writes DROPPED</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.0399" x="168.6605" y="688.5039">(safety S5 / &#172;T-K1 / &#172;T-NDA)</text><rect fill="#E8F5E9" height="387.0598" style="stroke:#000000;stroke-width:1;" width="360.9007" x="446.1012" y="219.8941"/><path d="M640.1821,219.8941 L640.1821,226.5141 L630.1821,236.5141 L446.1012,236.5141" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="184.0809" x="449.1012" y="231.5841">FIXED &#9472;&#9472; persisted pivot + O(1) up-walk</text><rect fill="#E8F5E9" height="74.4799" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="190.4999" x="542.4931" y="253.5141"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.5599" x="552.4931" y="274.2041">persisted frontier pivot F(X)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.8009" x="552.4931" y="287.824">+ incremental up-walk &#9472;&#9472;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="124.3199" x="552.4931" y="301.444">amortized O(1) oracle calls</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.4999" x="552.4931" y="315.064">(advances telescope to spine length)</text><rect fill="#E8F5E9" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="129.7999" x="572.8431" y="362.994"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="51.4899" x="582.8431" y="383.684">&#916; bounded</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="106.7999" x="582.8431" y="397.304">(flat &#8212; ZERO feedback,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="109.7999" x="582.8431" y="410.924">no runaway back-edge)</text><polygon fill="#FFF8E1" points="607.458,458.854,668.028,458.854,680.028,470.854,668.028,482.854,607.458,482.854,595.458,470.854,607.458,458.854" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="60.57" x="607.458" y="474.734">&#916; &gt; cap 256 ?</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="15.53" x="579.9281" y="467.924">yes</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.23" x="680.028" y="467.924">no</text><rect fill="#C8E6C9" height="88.0999" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="173.1158" x="463.2462" y="492.854"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="138.2758" x="473.2462" y="513.544">over-cap &#10233; deterministic Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="126.8998" x="473.2462" y="527.164">(propose PARKS the round;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="140.6399" x="473.2462" y="540.7839">validate REJECTS &#8212; both sides</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.1158" x="473.2462" y="554.4039">compute the same &#916; &#10233; no fork)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="123.9699" x="473.2462" y="568.0239">NEVER a lossy substitution</text><rect fill="#C8E6C9" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="138.6399" x="656.362" y="492.854"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="91.6899" x="666.362" y="513.544">merge proceeds on</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.0199" x="666.362" y="527.164">floor.post_state base</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="118.6399" x="666.362" y="540.7839">(all band writes folded in)</text><line style="stroke:#444444;stroke-width:1;" x1="249.7304" x2="249.7304" y1="265.754" y2="300.754"/><polygon fill="#444444" points="245.7304,290.754,249.7304,300.754,253.7304,290.754,249.7304,294.754" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;strok