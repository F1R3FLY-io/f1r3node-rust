<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="747px" preserveAspectRatio="none" style="width:609px;height:747px;background:#FFFFFF;" version="1.1" viewBox="0 0 609 747" width="609px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="37"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="577.1719" x="15" y="38.5181">Tie-break totality &#8212; why fork-choice cannot fork (S1)</text></g><!--cluster TOTAL order ? the code (SAFE)--><g class="cluster" data-qualified-name="TOTAL order . the code .SAFE." data-source-line="46" id="ent0001"><path d="M68.086,61.9641 L222.3358,61.9641 A3.75,3.75 0 0 1 224.8358,64.4641 L231.8358,81.5841 L283.086,81.5841 A2.5,2.5 0 0 1 285.586,84.0841 L285.586,506.0441 A2.5,2.5 0 0 1 283.086,508.5441 L68.086,508.5441 A2.5,2.5 0 0 1 65.586,506.0441 L65.586,64.4641 A2.5,2.5 0 0 1 68.086,61.9641" fill="#EEFAF1" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="65.586" x2="231.8358" y1="81.5841" y2="81.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="153.2498" x="69.586" y="74.6541">TOTAL order &#8212; the code (SAFE)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="33.3699" x="162.901" y="94.2741">&#171;Good&#187;</text></g><!--cluster score-ONLY ? hypothetical bug (FORKS)--><g class="cluster" data-qualified-name="score-ONLY . hypothetical bug .FORKS." data-source-line="56" id="ent0009"><path d="M312.086,184.8241 L512.5258,184.8241 A3.75,3.75 0 0 1 515.0258,187.3241 L522.0258,204.4441 L537.086,204.4441 A2.5,2.5 0 0 1 539.586,206.9441 L539.586,626.9041 A2.5,2.5 0 0 1 537.086,629.4041 L312.086,629.4041 A2.5,2.5 0 0 1 309.586,626.9041 L309.586,187.3241 A2.5,2.5 0 0 1 312.086,184.8241" fill="#FDECEA" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="309.586" x2="522.0258" y1="204.4441" y2="204.4441"/><text fill="#000000" font-family="'monospace'" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="199.4398" x="313.586" y="197.5141">score-ONLY &#8212; hypothetical bug (FORKS)</text><text fill="#000000" font-family="'monospace'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="27.01" x="415.081" y="217.1341">&#171;Bad&#187;</text></g><!--entity G1--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G1" data-source-line="47" id="ent0002"><rect fill="#C8E6C9" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="180.7598" x="88.206" y="107.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.7598" x="98.206" y="128.6541">sort by score DESC, then hash ASC</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="128.7499" x="98.206" y="142.2741">(on DISTINCT block hashes)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="75.3699" x="98.206" y="155.8941">list_ops.rs:55-64</text></g><!--entity G2--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G2" data-source-line="48" id="ent0003"><rect fill="#C8E6C9" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="167.2298" x="92.976" y="230.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="105.7199" x="102.976" y="251.5141">the argmax is UNIQUE</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="147.2298" x="102.976" y="265.1341">(no two hashes compare equal)</text></g><!--entity G3--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G3" data-source-line="49" id="ent0004"><rect fill="#C8E6C9" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="183.7598" x="83.706" y="338.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.7598" x="93.706" y="358.7541">HashSet / HashMap iteration order</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.7598" x="93.706" y="372.3741">is WASHED OUT by the sort</text></g><!--entity G4--><g class="entity" data-qualified-name="TOTAL order . the code .SAFE..G4" data-source-line="50" id="ent0005"><rect fill="#A5D6A7" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="187.7298" x="81.726" y="445.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="167.7298" x="91.726" y="465.9941">every honest node makes the SAME</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="167.5488" x="91.726" y="479.6141">greedy child choice and tail order &#10003;</text></g><!--entity B1--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B1" data-source-line="57" id="ent0010"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="197.6399" x="325.766" y="230.8241"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="89.3499" x="335.766" y="251.5141">sort by score ONLY</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="177.6399" x="335.766" y="265.1341">(equal-score tips are INCOMPARABLE)</text></g><!--entity B2--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B2" data-source-line="58" id="ent0011"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="174.0598" x="336.556" y="338.0641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="98.2499" x="346.556" y="358.7541">&gt; 1 maximal element</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="154.0598" x="346.556" y="372.3741">(the argmax is a SET, not a point)</text></g><!--entity B3--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B3" data-source-line="59" id="ent0012"><rect fill="#FFCDD2" height="47.24" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="183.4398" x="331.866" y="445.3041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="163.4398" x="341.866" y="465.9941">the pick LEAKS HashSet / HashMap</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="153.0099" x="341.866" y="479.6141">iteration order (view-dependent)</text></g><!--entity B4--><g class="entity" data-qualified-name="score-ONLY . hypothetical bug .FORKS..B4" data-source-line="60" id="ent0013"><rect fill="#EF9A9A" height="60.86" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="195.4588" x="325.856" y="552.5441"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="175.4588" x="335.856" y="573.2341">nodes can pick DIFFERENT children &#10007;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="133.4899" x="335.856" y="586.8541">MC_ForkChoice_nontotal.cfg</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="120.4199" x="335.856" y="600.4741">violates Inv_Deterministic</text></g><!--link G1 to G2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="51" id="lnk6"><path d="M178.066,169.0641 C177.726,188.2041 177.3837,207.7349 177.0737,225.4049" fill="none" id="G1-to-G2" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="176.986,230.4041,181.1432,221.4757,177.0737,225.4049,173.1445,221.3353,176.986,230.4041" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G2 to G3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="52" id="lnk7"><path d="M176.366,278.5441 C176.196,296.0841 176.0245,315.1143 175.8545,332.6443" fill="none" id="G2-to-G3" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="175.806,337.6441,179.8931,328.6833,175.8545,332.6443,171.8934,328.6057,175.806,337.6441" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G3 to G4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="53" id="lnk8"><path d="M175.586,385.7841 C175.586,403.3241 175.586,422.3541 175.586,439.8841" fill="none" id="G3-to-G4" style="stroke:#2E7D32;stroke-width:2;"/><polygon fill="#2E7D32" points="175.586,444.8841,179.586,435.8841,175.586,439.8841,171.586,435.8841,175.586,444.8841" style="stroke:#2E7D32;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B1 to B2--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" data-source-line="61" id="lnk14"><path d="M424.366,278.5441 C424.196,296.0841 424.0245,315.1143 423.8545,332.6443" fill="none" id="B1-to-B2" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="423.806,337.6441,427.8931,328.6833,423.8545,332.6443,419.8934,328.6057,423.806,337.6441" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B2 to B3--><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" data-source-line="62" id="lnk15"><path d="M423.586,385.7841 C423.586,403.3241 423.586,422.3541 423.586,439.8841" fill="none" id="B2-to-B3" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="423.586,444.8841,427.586,435.8841,423.586,439.8841,419.586,435.8841,423.586,444.8841" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B3 to B4--><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" data-source-line="63" id="lnk16"><path d="M423.586,492.8741 C423.586,510.0241 423.586,528.6341 423.586,547.2441" fill="none" id="B3-to-B4" style="stroke:#C62828;stroke-width:2;"/><polygon fill="#C62828" points="423.586,552.2441,427.586,543.2441,423.586,547.2441,419.586,543.2441,423.586,552.2441" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link G1 to B1--><!--link G4 to B4--><g class="legend" data-source-line="70"><rect fill="none" height="91.7199" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="392.4796" x="107.3462" y="643.4041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="342.7695" x="112.3462" y="659.0941">The distinction is TOTALITY of the order. score-desc / hash-asc on distinct</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="344.5797" x="112.3462" y="672.7141">hashes is a total order, so each sibling argmax and the terminal-tail order</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="382.4796" x="112.3462" y="686.3341">are unique. The greedy head remains a per-level choice, not a global leaf argmax.</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="364.7397" x="112.3462" y="699.9541">Rocq TieBreak.sort_total_order + output_indep_of_input_perm (permuting the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="357.9597" x="112.3462" y="713.574">input list does not change the output). Z3 tiebreak_total_order.py proves the</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="330.1996" x="112.3462" y="727.194">order total over bit-vectors; the _nontotal TLA&#8314; config exhibits the fork.</text></g><?plantuml-src XLNXRk964FxlfvYI7mTgJ0iakUHwZMJ0ND0b98qTLTUcGekzs2liNSTUIEZffFOPMgb_xadwE7cIpgnD0XVhoWymEpFVV3lppVWR7VEKGvOm8IshM0YPiPob4AWqKv9BxUbrmY7dWMOoIlYMozCPVBG0Hahg2KEeHggaAZ8My4Prx8dVENI-jpvj1QDzmQ8oj8_FKQwMCXoeHELltxvJAZmzXJtN7JcZJfr7dv43x8s6xi1ro4Fb8S-D5VOEp6SdNy8ZBiDQadLE6yfVshuWWWJCvwNVDfqZyzdo2VcSBHFzFsosl3PqB2qqrjiNt9xbd2r0AyqIeTVm-CVVS1-lOQxoXHt4IWGS0YQbqkO8cbwdPLclOA92D1XU9TCtU0WGvPnBQEuDZjsZmGby1tlEuV38UTs27m4L0jxP-EhA7PRvm5mEcWMRyvO9ptc8tqsinc0ux5AuEpfnJfnDUBpE5Fvg4M1q4QYSsqecQvWj8sWIlu9mt33w6hUk-thOwn8a9SRov6B5j50IWfZKkqraSDGzxXwJhxdz2rzhex-6V-axvzMDg8X4Dw0YDJrdvBOQy2H7akgpvXk5oZNCrkLrOEXwWtqAbX2p8WR76zpA9kORZZr_F1duC4jKi316NhHkPI8AFLLPqSwBDuU7zj510rW1xpfGzM0t6R5YUPIo1n05t4p6FzsuY2yLw7jLWPgPPSY5torPqYhnklLuPnZXSOsTegSBbe7GF2yhP6fnAp7FpuvtXas_lF7feiI1Bbq2z-g1-OhdQuXnTHGQ9DKnPGlaPaJaN21fQcUunZw898HAgKo6e9dOAElnyrzbaeED3Z49biR-jHB1_ambuM_sATwFBDqwIuyilJeBROPd0PHol9oSVp3ztv6gqUVeylgzPuHGRfslwe1mi36c1NPvf4LM0FK5PN1vSULSE_rpjsnFlmFLpEnYda87w_OWKkJ04rpGKYFehWWOUAw_3pJX338bfAumk_MO59q9bE2vwxptu8K2iEEx4e3cIl1xE-GPZY9_Wk_LmrEl2revPPBXU3Hohzs9NpOwnxbu_FpFhRmOJ4SuaGFJzwd4tKORfHtCerkv4YfX6b76SZKTScIJ2fGXjgBCVB1PAxJlZHhACN_gR9yuzRjr5b93lrTdCMfu1GlECwDI6gY4eNwX42XVwYp-MaP-iGYn4YQiOw4wTquEBAjSMp1JMgiKC_g85z8DP63gYcqp-sRiVm0rD-bCgTlLKiGI1jWHccURuIE6RC8HhHfpq_kjHRoFKmcS1J4IdIL2HXkHcAcY6vb2eXwVHmpHI95BAUwMl6ruLdCPSnPYNrFSafGduxcTu50drQXk11SbQeO44ixcLResObwhu8xUJdrwERLfCgQ6wBGKrBUWbZfRwgb0GMLJDSS7-ej9KcZIzr8JVoIDOCO6j2SXL7XlIepRM-BGci8Pg5ORVkdXY77pFjpErixMaELgLIuVn2ivL8N3DGKpeUqLAbZbnGy6yacFu9yxZt_-YnjLpaK4_24Mw5nkCNgXj2riSzbiwpy0?></g></svg>