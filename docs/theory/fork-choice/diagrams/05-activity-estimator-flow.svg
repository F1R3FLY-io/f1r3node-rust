="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="382.5847" x2="392.5847" y1="490.974" y2="490.974"/><line style="stroke:#444444;stroke-width:1;" x1="392.5847" x2="392.5847" y1="490.974" y2="512.974"/><polygon fill="#444444" points="388.5847,502.974,392.5847,512.974,396.5847,502.974,392.5847,506.974" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="298.0897" x2="298.0897" y1="458.974" y2="478.974"/><polygon fill="#444444" points="294.0897,468.974,298.0897,478.974,302.0897,468.974,298.0897,472.974" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="73"><rect fill="none" height="78.0999" rx="7.5" ry="7.5" style="stroke:#666666;stroke-width:1;" width="377.0297" x="162.7023" y="750.6939"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="355.0795" x="167.7023" y="766.3839">Every step is a PURE function of (DAG, certified context), so all honest nodes</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="367.0297" x="167.7023" y="780.0039">compute a node-identical ForkChoice (Rocq fork_choice_determinism_correct).</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="365.7197" x="167.7023" y="793.6239">The empty-tips case is a typed Err, NOT a panic (Bound.empty_tips_typed_err);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="337.1997" x="167.7023" y="807.2438">the parent cap is cast-safe (B2); score accumulation is checked_add (B3);</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="332.8996" x="167.7023" y="820.8638">and a missing parent surfaces a typed KvStoreError, never a panic (B1).</text></g>