<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="840px" preserveAspectRatio="none" style="width:704px;height:840px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 840" width="704px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="38"><text fill="#000000" font-family="'monospace'" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="672.4344" x="15" y="38.5181">Fork-choice evaluation flow &#9472;&#9472; certified two-lane LMD-GHOST</text></g><ellipse cx="298.0897" cy="70.9641" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#D1C4E9" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="190.0399" x="203.0698" y="100.9641"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="170.0399" x="213.0698" y="121.6541">read complete certified eligible slots</text><rect fill="#BBDEFB" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="211.5999" x="192.2898" y="154.5841"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="191.5999" x="202.2898" y="175.2741">calculate_lca over every eligible message</text><path d="M403.9396,206.3941 L403.9396,227.8241 L383.9396,231.8241 L403.9396,235.8241 L403.9396,257.254 A0,0 0 0 0 403.9396,257.254 L585.7495,257.254 A0,0 0 0 0 585.7495,257.254 L585.7495,216.3941 L575.7495,206.3941 L403.9396,206.3941 A0,0 0 0 0 403.9396,206.3941" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><path d="M575.7495,206.3941 L575.7495,216.3941 L585.7495,216.3941 L575.7495,206.3941" fill="#FFECB3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="160.8099" x="409.9396" y="222.0841">B1: weight_from_validator_by_dag</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="157.9498" x="409.9396" y="235.7041">returns a typed KvStoreError on a</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="127.0599" x="409.9396" y="249.324">MISSING parent (no panic).</text><rect fill="#C8E6C9" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="171.6998" x="212.2398" y="208.2041"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="151.6998" x="222.2398" y="228.8941">build_scores_map &#8212; BFS to LCA,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="109.7299" x="222.2398" y="242.5141">checked_add score (B3)</text><rect fill="#FFE0B2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="257.7298" x="169.2248" y="277.254"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="237.7298" x="179.2248" y="297.944">greedy_ghost_head &#8212; choose the maximum-score</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="202.5699" x="179.2248" y="311.564">child at each level; validate height progress</text><rect fill="#FFE0B2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="256.9398" x="169.6198" y="344.494"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="228.0998" x="179.6198" y="365.184">terminal_frontier &#8212; expand every scored branch</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="236.9398" x="179.6198" y="378.804">under arbitrary order; deduplicate shared children</text><rect fill="#FFE0B2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="243.7698" x="176.2048" y="411.734"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="220.5698" x="186.2048" y="432.424">rank_forkchoices &#8212; require head membership;</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="223.7698" x="186.2048" y="446.044">head ++ score/hash-sorted remaining terminals</text><polygon fill="#FFF8E1" points="225.5948,478.974,370.5847,478.974,382.5847,490.974,370.5847,502.974,225.5948,502.974,213.5948,490.974,225.5948,478.974" style="stroke:#E65100;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="144.9899" x="225.5948" y="494.854">tips empty? (genesis-only DAG)</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="44.991" x="168.6038" y="488.044">yes &#9472;&#9472; B4</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="12.23" x="382.5847" y="488.044">no</text><rect fill="#FFCDD2" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="179.8199" x="113.6848" y="512.974"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="43.0699" x="123.6848" y="533.664">typed Err</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="159.8199" x="123.6848" y="547.2839">(filter_deep_parents empty guard)</text><rect fill="#D7CCC8" height="47.24" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="114.1799" x="335.4947" y="512.974"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="90.55" x="345.4947" y="533.664">filter_deep_parents</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="94.1799" x="345.4947" y="547.2839">(max_parent_depth)</text><rect fill="#D7CCC8" height="60.86" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="135.3199" x="324.9247" y="580.2139"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="115.3199" x="334.9247" y="600.9039">cap parents &#8212; unlimited</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="106.5059" x="334.9247" y="614.5239">(i32::MAX or &#8722;1) &#10233; all,</text><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="115.1599" x="334.9247" y="628.1439">else take n (B2 cast-safe)</text><rect fill="#A5D6A7" height="33.62" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:1;" width="123.0799" x="331.0447" y="661.0739"/><text fill="#000000" font-family="'monospace'" font-size="10" lengthAdjust="spacing" textLength="103.0799" x="341.0447" y="681.7639">ForkChoice { tips, lca }</text><ellipse cx="392.5847" cy="725.6939" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="392.5847" cy="725.6939" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="298.0897" x2="298.0897" y1="80.9641" y2="100.9641"/><polygon fill="#444444" points="294.0897,90.9641,298.0897,100.9641,302.0897,90.9641,298.0897,94.9641" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="298.0897" x2="298.0897" y1="134.5841" y2="154.5841"/><polygon fill="#444444" points="294.0897,144.5841,298.0897,154.5841,302.0897,144.5841,298.0897,148.5841" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;stroke-width:1;" x1="298.0897" x2="298.0897" y1="188.2041" y2="208.2041"/><polygon fill="#444444" points="294.0897,198.2041,298.0897,208.2041,302.0897,198.2041,298.0897,202.2041" style="stroke:#444444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#444444;s