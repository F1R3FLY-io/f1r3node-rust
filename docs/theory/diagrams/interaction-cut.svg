<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="644px" preserveAspectRatio="none" style="width:606px;height:644px;background:#FFFFFF;" version="1.1" viewBox="0 0 606 644" width="606px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="18"><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="462.2222" x="68.796" y="24.9659">Gated interaction-cut &#8212; a cost-accounted COMM (Rule 1, atomic s)</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" data-source-line="20" id="ent0001"><rect fill="#C8E6C9" height="96.2717" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="173.0879" x="189.22" y="47.0679"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="89.9216" x="199.22" y="72.0339">signed redex</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="153.0879" x="199.22" y="91.1018">{ for(y &#8592; x){T}  &#8739;  x!(U) }&#8347;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="7" x="199.22" y="110.1697">&#8741;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="81.9977" x="199.22" y="129.2376">token stack</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="25.4239" x="292.1376" y="129.2376">s : S</text></g><!--entity After--><g class="entity" data-qualified-name="After" data-source-line="21" id="ent0002"><rect fill="#E8F5E9" height="96.2717" rx="2.5" ry="2.5" style="stroke:#333333;stroke-width:0.5;" width="325.2828" x="113.12" y="258.3379"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="90.0336" x="123.12" y="283.3039">continuation</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="60.8717" x="224.0736" y="283.3039">T{@U / y}</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="305.2828" x="123.12" y="302.3718">(keeps its OWN seal &#8212; GAP-2: no SAnd re-seal)</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="7" x="123.12" y="321.4397">&#8741;</text><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="22.8199" x="123.12" y="340.5076">tail</text><text fill="#000000" font-family="'sans-serif'" font-size="14" lengthAdjust="spacing" textLength="7.686" x="156.8599" y="340.5076">S</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="26" id="ent0005"><path d="M6,415.6079 L6,514.138 A0,0 0 0 0 6,514.138 L545.5184,514.138 A0,0 0 0 0 545.5184,514.138 L545.5184,425.6079 L535.5184,415.6079 L279.76,415.6079 L275.76,354.8179 L271.76,415.6079 L6,415.6079 A0,0 0 0 0 6,415.6079" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M535.5184,415.6079 L535.5184,425.6079 L545.5184,425.6079 L535.5184,415.6079" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="473.836" x="12" y="434.5049">Interaction-cut: the receiver for(y&#8592;x){T} and the sender x!(U) annihilate on the</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="513.2273" x="12" y="452.2109">shared channel x, contracting to T{@U/y} (Milner's pseudo-application &#8212; the quoted</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="427.0374" x="12" y="469.917">payload @U substitutes the bound name), gated by exactly one token.</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="353.2623" x="12" y="487.623">Subject reduction + no-leak: WrappingSubjectReduction.v.</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="518.5184" x="12" y="505.329">The five rules' pure-rho simulations: rule1..5_reachable (CATranslationFaithfulness.v).</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="23" id="lnk3"><path d="M275.76,143.6879 C275.76,177.9379 275.76,218.9679 275.76,253.1779" fill="none" id="Before-to-After" style="stroke:#2E7D32;stroke-width:1;"/><polygon fill="#2E7D32" points="275.76,258.1779,279.76,249.1779,275.76,253.1779,271.76,249.1779,275.76,258.1779" style="stroke:#2E7D32;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="314.0543" x="276.76" y="188.2349">the gate s consumes exactly ONE authorizing token</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="289.8353" x="288.8695" y="205.9409">(no-leak: the redex fires only when a co-present</text><text fill="#000000" font-family="'sans-serif'" font-size="13" lengthAdjust="spacing" textLength="260.0782" x="303.748" y="223.647">token authorizes it)  &#183;  grade of the step = s</text></g><g class="legend" data-source-line="33"><rect fill="#DDDDDD" height="90.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="427.2123" x="86.301" y="535.138"/><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="44.2538" x="94.941" y="557.1039">colour</text><text fill="#000000" font-family="'sans-serif'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.6278" x="146.4747" y="557.1039">meaning</text><rect fill="#C8E6C9" hei