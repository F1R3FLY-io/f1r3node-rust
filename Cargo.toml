[workspace]
resolver = "2"
members = [
	"casper",
	"rspace++",
	"rholang",
	"rho-pure-eval",
	"shared",
	"node",
	"models",
	"crypto",
	"block-storage",
	"rspace++/libs/rspace_rhotypes",
	"comm",
	"graphz",
	"formal/loom/cost_accounting",
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
	"env-filter",
	"fmt",
	"json",
] }
tracing-log = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
eyre = "0.6"
thiserror = "2.0"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
rand = "0.9"
bincode = "1.3.3"
serde = "1.0"
serde_json = { version = "1.0", features = ["raw_value"] }
itertools = "0.14"
futures = "0.3"
hex = "0.4"
dashmap = "6.1"
imbl = "7"
regex = "1.12"
async-trait = "0.1"
# All workspace crates must use the same `metrics` version. Different majors
# get separate global recorders, so calls from a crate on a different version
# than the prometheus exporter silently route to a noop recorder.
metrics = "0.23"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[profile.dev]
debug = true

# Local integration override pinned to the clean rholang-rs-mettail worktree at
# 02cef80d32214ecdac3ee7d3b91c3786a34174d5. This keeps all three parser crates
# on one committed AST while the cost-accounting worktree is actively refactored.
# Replace these paths with one published revision before distributing the branch;
# the parser revision is part of normalized-Par byte identity.
[patch."https://github.com/F1R3FLY-io/rholang-rs"]
rholang-parser = { path = "../mettail-module-dev/rholang-rs-mettail/rholang-parser" }
rholang-tree-sitter = { path = "../mettail-module-dev/rholang-rs-mettail/rholang-tree-sitter" }
rholang-tree-sitter-proc-macro = { path = "../mettail-module-dev/rholang-rs-mettail/rholang-tree-sitter-proc-macro" }
