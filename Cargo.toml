[workspace]
resolver = "2"
members = [
	"casper",
	"rspace++",
	"rholang",
	"rho-pure-eval",
	"shared",
	"node",
	"models",
	"crypto",
	"block-storage",
	"rspace++/libs/rspace_rhotypes",
	"comm",
	"graphz",
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
	"env-filter",
	"fmt",
	"json",
] }
tracing-log = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
eyre = "0.6"
thiserror = "2.0"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
rand = "0.9"
bincode = "1.3.3"
serde = "1.0"
serde_json = "1.0"
itertools = "0.14"
futures = "0.3"
hex = "0.4"
dashmap = "6.1"
imbl = "7"
regex = "1.12"
async-trait = "0.1"
# All workspace crates must use the same `metrics` version. Different majors
# get separate global recorders, so calls from a crate on a different version
# than the prometheus exporter silently route to a noop recorder.
metrics = "0.23"
stacker = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[profile.dev]
debug = true

# ─────────────────────────────────────────────────────────────────────────────
# DEV-ONLY dependency flip — cost-accounting transpiler (REVERT BEFORE PUSH).
#
# Repoints the `rholang-parser` git dependency (rholang/Cargo.toml:46,
# rev = c163755) and its two transitive crates at the local rholang-rs worktree
# `../rholang-rs-cost-accounting-transpiler/`, which carries the new
# cost-accounted surface syntax (Proc::SignedTerm / Proc::Purse / Signature /
# TokenStack) that this transpiler lowers to stable Rholang.
#
# `[patch]` matches by the dependency's *source URL*, so all three crates pulled
# from that git source are overridden in lock-step. The three Cargo.lock entries
# flip git+… → path+…; keep that churn out of git with
#     git update-index --skip-worktree Cargo.lock
# (reverse with --no-skip-worktree). Pre-push checklist:
# docs/cost-accounting/transpiler.md.  Tracked: pgmcp cat-dep-flip-revert.
# ─────────────────────────────────────────────────────────────────────────────
[patch."https://github.com/F1R3FLY-io/rholang-rs"]
rholang-parser = { path = "../rholang-rs-cost-accounting-transpiler/rholang-parser" }
rholang-tree-sitter = { path = "../rholang-rs-cost-accounting-transpiler/rholang-tree-sitter" }
rholang-tree-sitter-proc-macro = { path = "../rholang-rs-cost-accounting-transpiler/rholang-tree-sitter-proc-macro" }
