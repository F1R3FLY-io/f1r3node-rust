[package]
name = "models"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
schnorr_secp256k1_experimental = ["crypto/schnorr_secp256k1_experimental"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crypto = { path = "../crypto" }
# EPathMap fix P1 (pathmap_crate_type_mapper intern store): the SAME blake2
# version the workspace already resolves via crypto (crypto/Cargo.toml) — no
# new external crate in the lockfile. Depended on directly so the streamed
# store-key digest finalizes into a stack [u8; 32] (crypto's Blake2b256
# wrappers return Vec<u8>, which would put an allocation on the zero-alloc
# intern lookup path).
blake2 = "0.10.6"
rspace_plus_plus = { path = "../rspace++" }
shared = { path = "../shared" }
pathmap = "0.2.2"
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.2", features = ["v4"] }
itertools = { workspace = true }
proptest-derive = "0.5.1"
proptest = "1.4.0"
rand = "0.9.0"
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }
utoipa = "5"
tracing = { workspace = true }

[dev-dependencies]
# EPathMap fix P0 parity harness (tests/epathmap_canonical_fixtures.rs):
# golden SERDE encodings pin the event-hash canonical encoding, which is
# bincode 1.3.3 (workspace pin) end-to-end through stable_hash_provider.
bincode = { workspace = true }

[[test]]
name = "models_tests"
path = "tests/mod.rs"
harness = true

[lib]
name = "models"
path = "src/lib.rs"
doctest = false

[build-dependencies]
tonic-prost-build = { workspace = true }
