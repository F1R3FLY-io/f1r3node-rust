[package]
name = "models"
version = "0.1.0"
edition = "2021"
publish = false

# ★ EVERY INTEGRATION TEST TARGET IS DECLARED BELOW, AND NONE IS COMPILED TWICE.
#
# `tests/mod.rs` `mod`-includes seven files, and Cargo's auto-discovery ALSO
# made each of those seven a target of its own. Six of them (the seventh is
# feature-gated off by default) were therefore compiled twice and RUN twice:
# measured at 31 binaries / 406 test cases, of which 54 cases were the same test
# functions executed a second time inside `models_tests`.
#
# `autotests = false` is what stops the second compilation — but on its own it
# would have DELETED 24 targets, because only 7 of the 31 test files are reached
# through `tests/mod.rs`. A build-hygiene change that silently stops a gate from
# running is worse than the waste it removes, so every remaining file is
# declared explicitly below.
#
# ⚠ The cost of `autotests = false` is that a NEW file in `tests/` runs nowhere
# until it is registered. That failure is silent, so it is made loud:
# `tests/test_target_registry_gate.rs` fails when any `tests/*.rs` is neither
# declared here nor `mod`-included from `tests/mod.rs`.
autotests = false

[features]
default = []
schnorr_secp256k1_experimental = ["crypto/schnorr_secp256k1_experimental"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crypto = { path = "../crypto" }
# EPathMap fix P1 (pathmap_crate_type_mapper intern store): the SAME blake2
# version the workspace already resolves via crypto (crypto/Cargo.toml) — no
# new external crate in the lockfile. Depended on directly so the streamed
# store-key digest finalizes into a stack [u8; 32] (crypto's Blake2b256
# wrappers return Vec<u8>, which would put an allocation on the zero-alloc
# intern lookup path).
blake2 = "0.10.6"
rspace_plus_plus = { path = "../rspace++" }
shared = { path = "../shared" }
pathmap = "0.2.2"
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.2", features = ["v4"] }
itertools = { workspace = true }
proptest-derive = "0.5.1"
proptest = "1.4.0"
rand = "0.9.0"
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }
utoipa = "5"
tracing = { workspace = true }
# EPathMap fix P4.3 (spliced event hashing, src/rust/spliced_event_bytes.rs):
# the hand-rolled emitter reproduces and composes with bincode 1.3.3
# (workspace pin) — the event-hash canonical encoding end-to-end through
# stable_hash_provider. Promoted from dev-dependencies (the P0 parity
# harness already pinned the same encoding in tests).
bincode = { workspace = true }

# ── The aggregate target: the seven files `tests/mod.rs` includes ──────────
#
# ⚠ Its NAME is load-bearing: `tests/sorter_canonical_golden.rs` prints
# `SORTER_GOLDEN_BLESS=1 cargo test -p models --test models_tests -- sorter_canonical`
# in a failure message, so renaming it falsifies an instruction a maintainer is
# told to run.
[[test]]
name = "models_tests"
path = "tests/mod.rs"
harness = true

# ── The standalone targets ─────────────────────────────────────────────────
#
# One per file in `tests/` that `tests/mod.rs` does NOT include. Kept in
# alphabetical order, and kept COMPLETE by `test_target_registry_gate`.
[[test]]
name = "clone_equivalence_corpus"
path = "tests/clone_equivalence_corpus.rs"

[[test]]
name = "cold_store_records"
path = "tests/cold_store_records.rs"

[[test]]
name = "drive_configuration_gate"
path = "tests/drive_configuration_gate.rs"

[[test]]
name = "epathmap_canonical_fixtures"
path = "tests/epathmap_canonical_fixtures.rs"

[[test]]
name = "epathmap_canonicalization"
path = "tests/epathmap_canonicalization.rs"

[[test]]
name = "epathmap_identity_is_the_path_stream"
path = "tests/epathmap_identity_is_the_path_stream.rs"

[[test]]
name = "epathmap_intern_store"
path = "tests/epathmap_intern_store.rs"

[[test]]
name = "epathmap_spliced_event_bytes"
path = "tests/epathmap_spliced_event_bytes.rs"

[[test]]
name = "epathmap_wire_serialized_paths"
path = "tests/epathmap_wire_serialized_paths.rs"

[[test]]
name = "epathmap_wrapper_cell"
path = "tests/epathmap_wrapper_cell.rs"

[[test]]
name = "intern_store_guard_discipline"
path = "tests/intern_store_guard_discipline.rs"

[[test]]
name = "json_encoder_test"
path = "tests/json_encoder_test.rs"

[[test]]
name = "mixed_algorithm_cosigned_test"
path = "tests/mixed_algorithm_cosigned_test.rs"

[[test]]
name = "par_codec_differential"
path = "tests/par_codec_differential.rs"

[[test]]
name = "par_codec_malformed"
path = "tests/par_codec_malformed.rs"

[[test]]
name = "par_codec_wire_shapes"
path = "tests/par_codec_wire_shapes.rs"

[[test]]
name = "par_prost_depth_ceiling"
path = "tests/par_prost_depth_ceiling.rs"

[[test]]
name = "pathmap_integration_tests"
path = "tests/pathmap_integration_tests.rs"

[[test]]
name = "pathmap_native_query_walk"
path = "tests/pathmap_native_query_walk.rs"

[[test]]
name = "prost_encode_differential"
path = "tests/prost_encode_differential.rs"

[[test]]
name = "schema_meta_conformance"
path = "tests/schema_meta_conformance.rs"

[[test]]
name = "serializer_par_byte_goldens"
path = "tests/serializer_par_byte_goldens.rs"

[[test]]
name = "variant_exhaustiveness_gate"
path = "tests/variant_exhaustiveness_gate.rs"

[[test]]
name = "wire_encode_differential"
path = "tests/wire_encode_differential.rs"

[[test]]
name = "wire_encode_space"
path = "tests/wire_encode_space.rs"

[[test]]
name = "wire_schema_conformance"
path = "tests/wire_schema_conformance.rs"

# The registry gate itself, which is what makes the list above self-checking.
[[test]]
name = "test_target_registry_gate"
path = "tests/test_target_registry_gate.rs"

[lib]
name = "models"
path = "src/lib.rs"
doctest = false

# ⚠ A Rust benchmark must be declared here before it can be run at all.
# `harness = false` because the statistic this benchmark owes is a Welch
# t-test over a PRODUCTION-WEIGHTED workload, which the default harness does
# not produce; the weighting is the experiment, not a detail of it.
[[bench]]
name = "wire_encode_bench"
path = "benches/wire_encode_bench.rs"
harness = false

# The heap-profile subject. One arm per run (`MASSIF_ARM`), so `massif`'s
# snapshots describe ONE mechanism instead of superimposing three.
[[bench]]
name = "wire_encode_massif"
path = "benches/wire_encode_massif.rs"
harness = false

[build-dependencies]
tonic-prost-build = { workspace = true }
# The wire-schema generator (models/build/wire_schema.rs) reads the protobuf
# FileDescriptorSet that the prost pass dumps. `prost`/`prost-types` decode it;
# `heck` applies the SAME identifier transforms prost-build itself applies, so
# the generated `impl WireOneof` arms cannot drift from prost's variant names.
# All three are already in the lockfile as transitive build dependencies of
# tonic-prost-build — this adds no new crate.
prost = { workspace = true }
prost-types = "0.14"
heck = "0.5"
