[package]
name = "models"
version = "0.1.0"
edition = "2021"
publish = false

# ★ EVERY INTEGRATION TEST TARGET IS DECLARED BELOW, AND NONE IS COMPILED TWICE.
#
# `tests/mod.rs` `mod`-includes seven files, and Cargo's auto-discovery ALSO
# made each of those seven a target of its own. Six of them (the seventh is
# feature-gated off by default) were therefore compiled twice and RUN twice:
# measured at 31 binaries / 406 test cases, of which 54 cases were the same test
# functions executed a second time inside `models_tests`.
#
# `autotests = false` is what stops the second compilation — but on its own it
# would have DELETED 24 targets, because only 7 of the 31 test files are reached
# through `tests/mod.rs`. A build-hygiene change that silently stops a gate from
# running is worse than the waste it removes, so every remaining file is
# declared explicitly below.
#
# ⚠ The cost of `autotests = false` is that a NEW file in `tests/` runs nowhere
# until it is registered. That failure is silent, so it is made loud:
# `tests/test_target_registry_gate.rs` fails when any `tests/*.rs` is neither
# declared here nor `mod`-included from `tests/mod.rs`.
autotests = false

[features]
default = []
schnorr_secp256k1_experimental = ["crypto/schnorr_secp256k1_experimental"]
# Phase 7 measurement only. The implementation lives under `tests/support` and
# production call sites compile to nothing unless this feature is selected.
phase7-depth-histograms = []
# Measurement-only access to the uncached RMP2 digest control. Production
# callers use the memoized encoder; experiments enable this feature explicitly
# so control and treatment share one transcript implementation.
rmp2-digest-experiment = []
# Measurement-only access to direct, memoized, and cache-hit-or-direct ParBag
# protobuf egress policies. Ordinary builds expose only the selected production
# policy and carry no experiment branches or public controls.
protobuf-projection-experiment = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
verified-score-store = { path = "../formal/verified_score_store" }
crypto = { path = "../crypto" }
rspace_plus_plus = { path = "../rspace++" }
shared = { path = "../shared" }
pathmap = { version = "=0.3.4", features = ["arena_compact"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1.2", features = ["v4"] }
itertools = { workspace = true }
proptest-derive = "0.5.1"
proptest = "1.4.0"
rand = "0.9.0"
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }
utoipa = "5"
tracing = { workspace = true }
typed-arena = "2.0.2"
# Generated event-hash encoding and serde use the workspace's bincode format.
bincode = { workspace = true }

# ── The aggregate target: the seven files `tests/mod.rs` includes ──────────
#
# ⚠ Its NAME is load-bearing: `tests/sorter_canonical_golden.rs` prints
# `SORTER_GOLDEN_BLESS=1 cargo test -p models --test models_tests -- sorter_canonical`
# in a failure message, so renaming it falsifies an instruction a maintainer is
# told to run.
[[test]]
name = "models_tests"
path = "tests/mod.rs"
harness = true

# ── The standalone targets ─────────────────────────────────────────────────
#
# One per file in `tests/` that `tests/mod.rs` does NOT include. Kept in
# alphabetical order, and kept COMPLETE by `test_target_registry_gate`.
# The `locally_free` bitset's ONE spelling of ∅. Its §3 reads `models/src` as
# TEXT to enumerate the bitset construction sites, so it is a target of its own
# rather than a `mod` of `models_tests`: a scan that runs inside an aggregate is
# a scan whose failure names the aggregate.
[[test]]
name = "bit_vector_canonicity"
path = "tests/bit_vector_canonicity.rs"

[[test]]
name = "channel_image_v2"
path = "tests/channel_image_v2.rs"

[[test]]
name = "cold_store_records"
path = "tests/cold_store_records.rs"

[[test]]
