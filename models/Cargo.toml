# ★ The trie-key ESCAPE arm's protobuf encode, on a 256 KiB thread. `encode_trie_path`
# is REQUIRED total (R3F-2) and promises no panics, and its escape payload is an
# arbitrary `Par` — so the derived Θ(depth) `encode_to_vec` could abort the process
# inside a function documented total.
[[test]]
name = "trie_escape_arm_stack"
path = "tests/trie_escape_arm_stack.rs"

[[test]]
name = "variant_exhaustiveness_gate"
path = "tests/variant_exhaustiveness_gate.rs"

[[test]]
name = "bincode_encoder_differential"
path = "tests/bincode_encoder_differential.rs"

[[test]]
name = "bincode_encoder_space"
path = "tests/bincode_encoder_space.rs"

[[test]]
# The prost encoder's space gate. `protobuf_encoder.rs`'s §3 header claimed this file already
# pinned its four space quantities; it did not exist, and `op_size`/`frame_size` had zero
# references workspace-wide. Phase 4 names it as the gate blocking its start.
name = "protobuf_encoder_space"
path = "tests/protobuf_encoder_space.rs"

[[test]]
name = "bincode_schema_conformance"
path = "tests/bincode_schema_conformance.rs"

# The registry gate itself, which is what makes the list above self-checking.
[[test]]
name = "test_target_registry_gate"
path = "tests/test_target_registry_gate.rs"

[[test]]
name = "store_items_cursor_protocol"
path = "tests/store_items_cursor_protocol.rs"

[lib]
name = "models"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "bincode_encoder_bench"
path = "benches/bincode_encoder_bench.rs"
harness = false

# ★ The two trie-key write-path conversions. `harness = false` because the
# statistic is a PAIRED t-test over a depth ladder (both conversions are
# depth-sensitive), and because `TRIE_KEY_ARM=<arm>` must
# make the process run ONE arm so `cachegrind` has a subject.
[[bench]]
name = "trie_key_bench"
path = "benches/trie_key_bench.rs"
harness = false

[[bench]]
name = "epathmap_pathmap_native"
path = "benches/epathmap_pathmap_native.rs"
harness = false

[[bench]]
name = "par_bag_exact_membership"
path = "benches/par_bag_exact_membership.rs"
harness = false

# Preregistered RMP2 digest-cache experiment. Both the uncached control and the
# public benchmark wrappers are compiled only for this target; ordinary models
# builds retain the crate-private production route and no experiment branch.
[[bench]]
name = "rmp2_par_bag_digest_cache"
path = "benches/rmp2_par_bag_digest_cache.rs"
harness = false
required-features = ["rmp2-digest-experiment"]

# Preregistered cold/warm protobuf projection policy experiment. Each arm uses
# the same RPB3 zipper encoder; only projection retention differs.
[[bench]]
name = "parbag_protobuf_projection"
path = "benches/parbag_protobuf_projection.rs"
harness = false
required-features = ["protobuf-projection-experiment"]

# The heap-profile subject. One arm per run (`MASSIF_ARM`), so `massif`'s
# snapshots describe ONE mechanism instead of superimposing three.
[[bench]]
name = "bincode_encoder_massif"
path = "benches/bincode_encoder_massif.rs"
harness = false

[dev-dependencies]
blake2 = "0.10.6"
proc-macro2 = "1"
tokio = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
# The schema-codegen pass (models/codegen/schema.rs) reads the protobuf
# FileDescriptorSet that the prost pass dumps. `prost`/`prost-types` decode it;
# `heck` applies the SAME identifier transforms prost-build itself applies, so
# the generated `impl BincodeOneof` arms cannot drift from prost's variant names.
# All three are already in the lockfile as transitive build dependencies of
# tonic-prost-build — this adds no new crate.
prost = { workspace = true }
prost-types = "0.14"
heck = "0.5"

[[test]]
name = "canonical_form_is_a_function_of_the_term"
path = "tests/canonical_form_is_a_function_of_the_term.rs"
