# The PathMap native-algebra corpus. Blessed on PathMap 0.2.2 and re-blessed on
# 0.3.4, where each difference is a consensus-change register entry (CBR-077 to
# CBR-079), so a release's behavioural differences show up case by case.
[[test]]
name = "pathmap_native_algebra_corpus"
path = "tests/pathmap_native_algebra_corpus.rs"

# ★ THE GROUP BOMB. Wire type 3 (`StartGroup`) is ATTACKER-CHOSEN: proto3 emits
# no groups, so nothing this node writes can carry one, but skipping an UNKNOWN
# field is a walk over bytes a peer sent and prost's `skip_field` self-recurses
# once per nesting level. This target pins the generated `protobuf_decoder`'s
# iterative skipper against prost's on every arm of that walk, and carries the
# one observation that cannot be recovered afterwards: prost's recursive body,
# with its artificial depth budget removed and nothing else changed, is KILLED
# BY A SIGNAL on a 1 MiB nest. Child processes throughout — never
# `#[should_panic]` (`models/src/rust/rholang/drive.rs:196-199`).
[[test]]
name = "protobuf_decoder_differential"
path = "tests/protobuf_decoder_differential.rs"

[[test]]
name = "protobuf_decoder_group_bomb"
path = "tests/protobuf_decoder_group_bomb.rs"

[[test]]
name = "protobuf_encoder_differential"
path = "tests/protobuf_encoder_differential.rs"

[[test]]
name = "protobuf_cursor"
path = "tests/protobuf_cursor.rs"

[[test]]
name = "protobuf_region_differential"
path = "tests/protobuf_region_differential.rs"

[[test]]
name = "substitution_region_ranges"
path = "tests/substitution_region_ranges.rs"

[[test]]
