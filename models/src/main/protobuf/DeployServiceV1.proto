/**
 * The main API is `DeployService`.
 */
syntax = "proto3";

package casper.v1;

import "CasperMessage.proto";
import "ServiceError.proto";
import "DeployServiceCommon.proto";

// If you are building for other languages "scalapb.proto"
// can be manually obtained here:
// https://raw.githubusercontent.com/scalapb/ScalaPB/master/protobuf/scalapb/scalapb.proto
// make a scalapb directory in this file's location and place it inside

import "scalapb/scalapb.proto";
import "RhoTypes.proto";

import "google/protobuf/empty.proto";

option (scalapb.options) = {
  package_name: "coop.rchain.casper.protocol.deploy.v1"
  flat_package: true
  single_file: true
  preserve_unknown_fields: false
};

// Use `doDeploy` to queue deployments of Rholang code and then
// `ProposeServiceV2.propose` to make a new block with the results of running them
// all.
//
// To get results back, use `getDataAtName`.
service DeployService {
  // Queue deployment of Rholang code (or fail to parse).
  rpc doDeploy(DeployDataProto) returns (DeployResponse) {}
  // Get details about a particular block.
  rpc getBlock(BlockQuery) returns (BlockResponse) {}
  // Get dag
  rpc visualizeDag(VisualizeDagQuery) returns (stream VisualizeBlocksResponse) {}
  rpc machineVerifiableDag(MachineVerifyQuery) returns (MachineVerifyResponse) {}
  // Returns on success LightBlockInfo
  rpc showMainChain(BlocksQuery) returns (stream BlockInfoResponse) {}
  // Get a summary of blocks on the blockchain.
  rpc getBlocks(BlocksQuery) returns (stream BlockInfoResponse) {}
  // Find data sent to a name.
  rpc getDataAtName(DataAtNameByBlockQuery) returns (RhoDataResponse) {}
  // Find processes receiving on a name.
  rpc listenForContinuationAtName(ContinuationAtNameQuery) returns (ContinuationAtNameResponse) {}
  // Find block containing a deploy. The response's blockInfo.isFinalized is
  // block-level; for deploy effect-finality use finalizationState or
  // deployFinalizationStatus.
  rpc findDeploy(FindDeployQuery) returns (FindDeployResponse) {}
  // Preview new top-level unforgeable names (for example, to compute signatures over them).
  rpc previewPrivateNames(PrivateNamePreviewQuery) returns (PrivateNamePreviewResponse) {}
  // Get details about a particular block.
  rpc lastFinalizedBlock(LastFinalizedBlockQuery) returns (LastFinalizedBlockResponse) {}
  // Check if a given block is finalized.
  rpc isFinalized(IsFinalizedQuery) returns (IsFinalizedResponse) {}
  // Query the canonical-state finalization status of a deploy by its signature.
  // Prefer this over isFinalized for deploy tracking — isFinalized can return
  // true for a block whose deploy effects were dropped by merge rejection.
  // For a sig this node has never observed, callers holding the saved signed
  // deploy can set `deploy` on the query (#1103): after signature verification,
  // the never-observed sig is reconciled against the floor of the adopted last
  // finalized block, and a deploy proven unable to execute answers Expired
  // with that basis named in the response.
  rpc deployFinalizationStatus(DeployFinalizationStatusQuery) returns (DeployFinalizationStatusResponse) {}
  // Check if a given validator is bonded.
  // Returns on success BondStatusResponse
  rpc bondStatus(BondStatusQuery) returns (BondStatusResponse) {}
  // Executes deploy as user deploy with immediate rollback and return result
  rpc exploratoryDeploy(ExploratoryDeployQuery) returns (ExploratoryDeployResponse) {}
  // get blocks by block height
  rpc getBlocksByHeights(BlocksQueryByHeight) returns (stream BlockInfoResponse){}
  // temporary api for testing
  rpc getEventByHash(ReportQuery) returns (EventInfoResponse){}
  // Get node status
  rpc status(google.protobuf.Empty) returns (StatusResponse){}
  // Bulk list of pending deploys (deploy_storage + rejected-recovery buffer),
  // optionally filtered by deployer public key. Empty response on read-only
  // nodes (Casper not initialised).
  rpc getPendingDeploys(PendingDeploysQuery) returns (PendingDeploysResponse){}
}

// Issue #1157: an rspace-state reader's structured "pruned below height N"
// answer, mirroring `BlockPrunedInfo` for block bodies. The TARGET is a
// block whose POST-STATE (or pre-state, for exploratory reads that use the
// pre-state view) the reader was asked to walk; the walk could not proceed
// because the retention sweep has deleted the trie subtree.
//
// Clients that see `pruned` on a response know retry on this node will not
// succeed — the state is gone, not transiently unavailable. Consult an
// archive node with a deeper retention window.
message PrunedStateInfo {
  // Hash of the block whose state the reader was asked for. Known from the
  // DAG metadata index, which is not swept.
  bytes target_block_hash   = 1;
  // Height of that block when it was retained.
  int64 target_block_height = 2;
  // The responder's current rspace-history retention floor. The target's
  // height is STRICTLY LESS than this value (the GC retains blocks at the
  // floor itself: `compute_gc_retention_roots` walks `height ≥ floor`).
  // Derived from `CasperShardConf::state_retention_floor(LFB_height)` —
  // the same formula the sweeper uses.
  int64 retention_floor     = 3;
}

message EventInfoResponse{
  oneof message{
    servicemodelapi.ServiceError error = 1;
    BlockEventInfo result = 2;
    // Issue #1157: the block whose events were requested is within the DAG
    // but its state is below the retention window, so replay cannot
    // produce an event log.
    PrunedStateInfo pruned = 3;
  }
}

message ExploratoryDeployResponse{
  oneof message{
    servicemodelapi.ServiceError error = 1;
    DataWithBlockInfo result = 2;
    // Issue #1157: the target block's state has been swept past the
    // retention floor, so the deploy cannot be executed against it.
    PrunedStateInfo pruned = 4;
  }
  uint64 cost = 3;
}

// doDeploy
message DeployResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    string result      = 2;
  }
}

// getBlock
message BlockResponse {
  oneof message {
    servicemodelapi.ServiceError error  = 1;
    BlockInfo blockInfo = 2;
  }
}

// visualizeDag
message VisualizeBlocksResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    string content     = 2;
  }
}

// machineVerifiableDag
message MachineVerifyResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    string content     = 2;
  }
}

// showMainChain, getBlocks, getBlocksByHeights
message BlockInfoResponse {
  oneof message {
    servicemodelapi.ServiceError error        = 1;
    LightBlockInfo blockInfo  = 2;
    // Carries one hash per interleaved missing sibling from
    // getBlocksByHeights (#1087). Mirrors the single-hash
    // BlockPrunedError / BlockUnavailableError split from PR #1052 /
    // #1087 and BlockPrunedResponseProto on the peer-to-peer wire.
    // Unused by showMainChain and getBlocks; wire-additive for
    // existing clients.
    //
    // `pruned`: block_height <= prune_floor. Retention sweep has
    // advanced past this height — gap is permanent on this node.
    //
    // `unavailable`: block_height > prune_floor. DAG names the hash
    // but the body is not currently in the store and the sweep has
    // not reached this height — retry may succeed.
    BlockPrunedInfo pruned          = 3;
    BlockUnavailableInfo unavailable = 4;
  }
}

message BlockPrunedInfo {
  // Raw block hash whose body was missing when the response was walked.
  bytes hash         = 1;
  // Height recorded in the DAG metadata index, which the retention
  // pass does not sweep.
  int64 block_height = 2;
  // Responder's effective-anchor floor at the moment this response was
  // assembled. For `BlockPrunedInfo`, block_height <= prune_floor.
  int64 prune_floor  = 3;
}

message BlockUnavailableInfo {
  // Raw block hash whose body was missing when the response was walked.
  bytes hash         = 1;
  // Height recorded in the DAG metadata index.
  int64 block_height = 2;
  // Responder's effective-anchor floor. For `BlockUnavailableInfo`,
  // block_height > prune_floor — the sweep has not reached this height
  // yet, so retry may succeed.
  int64 prune_floor  = 3;
}

// listenForDataAtPar
message RhoDataResponse {
  oneof message {
    servicemodelapi.ServiceError error     = 1;
    RhoDataPayload payload = 2;
    // Issue #1157: the block whose state the data read targeted has been
    // swept past the retention floor.
    PrunedStateInfo pruned = 3;
  }
}

message RhoDataPayload {
  repeated rhoapi.Par par     = 1;
  LightBlockInfo block = 2 [(scalapb.field).no_box = true];
}

// listenForContinuationAtName
message ContinuationAtNameResponse {
  oneof message {
    servicemodelapi.ServiceError error                 = 1;
    ContinuationAtNamePayload payload  = 2;
  }
}

message ContinuationAtNamePayload {
  repeated ContinuationsWithBlockInfo blockResults = 1;
  int32 length = 2;
}

// findDeploy
message FindDeployResponse {
  oneof message {
    servicemodelapi.ServiceError error        = 1;
    LightBlockInfo blockInfo  = 2;
  }
  DeployFinalizationStateProto finalizationState = 3;
  uint32 rejectionCount = 4;
}

// previewPrivateNames
message PrivateNamePreviewResponse {
  oneof message {
    servicemodelapi.ServiceError error                 = 1;
    PrivateNamePreviewPayload payload  = 2;
  }
}

message PrivateNamePreviewPayload {
  repeated bytes ids  = 1; // a la GPrivate
}

// lastFinalizedBlock
message LastFinalizedBlockResponse {
  oneof message {
    servicemodelapi.ServiceError error   = 1;
    BlockInfo blockInfo  = 2;
  }
}

// isFinalized
message IsFinalizedResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    bool isFinalized   = 2;
  }
}

// deployFinalizationStatus
message DeployFinalizationStatusResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    DeployFinalizationStatusInfo status = 2;
  }
}

message BondStatusResponse {
  oneof message {
    servicemodelapi.ServiceError error = 1;
    bool isBonded   = 2;
  }
}

message StatusResponse {
  oneof message {
    servicemodelapi.ServiceError error  = 1;
    Status status = 2;
  }
}

// getPendingDeploys
message PendingDeploysResponse {
  oneof message {
    servicemodelapi.ServiceError error        = 1;
    PendingDeploysResponsePayload payload     = 2;
  }
}
